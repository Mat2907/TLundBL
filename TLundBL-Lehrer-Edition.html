 "text": "Fall: 12-Jähriger, Faigenbaum-Dosierung?", "loesung": "2–3×/Woche, 1–3 Sätze, 10–15 WH, 1–3 min Pause, professionelle Betreuung (Faigenbaum, App-Quiz).", "hilfe": "App: quiz kraft '12-Jähriger Faigenbaum'."}, {"titel": "Fall: 75-jährige Patientin, Sturzprophylaxe – ACSM-Dosierung?", "text": "Fall: 75-jährige Patientin, Sturzprophylaxe – ACSM-Dosierung?", "loesung": "2–3×/Woche, 1–3 Sätze, 50–85 % 1RM, 6–15 WH, 1–3 min Pause, Ganzkörper (App-Quiz ACSM 2009 + Folie 109).", "hilfe": "App: quiz 'ACSM 2009 Senioren'."}, {"titel": "Fall: isometrisches Maximalkrafttraining mit großen Muskelgruppen – Risiko?", "text": "Fall: isometrisches Maximalkrafttraining mit großen Muskelgruppen – Risiko?", "loesung": "Ab 20 % Fmax Durchblutung behindert, ab 50 % völlig unterbrochen + Pressatmung → kardiovaskulär kritisch; in der Therapie submaximal (App-Quiz).", "hilfe": "App: quiz 'völliger Verschluss der Gefäße' + 'isometrisch kritisch'."}, {"titel": "Lies Diagramm Folie 102: Was misst die Rumpfkraftmessung (Dysbalancen)?", "text": "Lies Diagramm Folie 102: Was misst die Rumpfkraftmessung (Dysbalancen)?", "loesung": "Verhältnis Bauch-/Rückenmuskulatur (App-diagram Folie 102).", "hilfe": "App: diagram 'Muskuläre Dysbalancen: Rumpfkraftmessung'."}, {"titel": "Prüfungsnahe Aufgabe (8 P)", "text": "Beschreibe das Fünf-Stufen-Modell zum Muskeltraining nach Froböse mit Zielen und Intensitäten der Stufen.", "loesung": "- Stufe 1 Aktivierung/Innervationsschulung: Bahnung des afferenten Sets, Wahrnehmung, < 30 % Fmax, 2–3 Wochen, 4–8 TE\n- Stufe 2 Lokales Muskelausdauertraining: Ökonomisierung, Ermüdungswiderstand; 30–40 %, 20–40 WH, 1–6 Serien, 2–4 Wochen\n- Stufe 3 Muskelaufbautraining: Hypertrophie; 40–70 %, 8–15 WH, 2–6 Serien; Voraussetzung gut belastbare Strukturen\n- Stufe 4 Neuromuskuläre Kraftqualitäten: Frequenzierung/Rekrutierung (FT-Fasern); IK- und Reaktivkrafttraining 75–100 %, 1–6 WH, 3–6 Serien; voll belastbare Strukturen\n- Stufe 5 Vielfältige, situations(un)abhängige Kraftqualitäten: Funktionelles Training, > 30 %, Widerstands- und Geschwindigkeitsvariationen", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lösen die App-Quiz-Fälle mit aufgeklappten Diagrammen; stärkere diskutieren, warum isometrisches Maximalkrafttraining bei Hypertonie/Herzpatienten kontraindiziert ist und welche Alternative (dynamisch, submaximal) sicherer ist.", "app_uebung": "App: diagrams Folien 102/109/21, quiz (Faigenbaum, ACSM, Pressatmung, Gefäßverschluss), exam (6 P Gefahren + 6 P Kinder/Senioren)."}, "sicherung": {"titel": "Sicherheits-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne zwei Gefahren beim Krafttraining mit je einer Vermeidungsmaßnahme und die richtige Atmung bei dynamischer Belastung.", "aufgaben": [{"frage": "Zwei Gefahren?", "loesung": "z. B. Pressatmung → dynamisch ausatmen bei Anstrengung; Überlastung → progressive Steigerung nach Stufenmodell."}, {"frage": "Richtige Atmung?", "loesung": "Ausatmen in der konzentrischen (schweren) Phase, nie Luft anhalten."}, {"frage": "Kinder vs. Senioren?", "loesung": "Kinder (Faigenbaum): 2–3×/Wo, 1–3 Sätze à 10–15 WH, Betreuung, keine 1RM-Tests; Senioren (ACSM 2009): 2–3×/Wo, 50–85 % 1RM, 6–15 WH."}, {"frage": "Worin unterscheiden sich isotonische und auxotonische Kontraktion laut Tabelle?  [App-Quiz: Kraft und Krafttraining]", "loesung": "Isotonisch: Muskelspannung gleichbleibend; auxotonisch: Muskelspannung variabel – Beide sind dynamisch und überwindend mit abnehmender Muskellänge; nur die Muskelspannung unterscheidet sich (gleichbleibend vs. variabel)."}]}, "hausaufgabe": "App-Quiz zu Faigenbaum/ACSM/Pressatmung wiederholen; Diagramme Folien 102/109 analysieren; exam-Aufgaben 'Gefahren' (6 P) und 'Kinder vs. Senioren' (6 P) schriftlich üben; Normtabelle Folie 21 als Orientierung einordnen.", "hinweise": ["Fehler: Pressatmung wird bagatellisiert – venöser Rückfluss bricht ein, Blutdruckspitzen (App-Quiz Durchblutung ab 20 % eingeschränkt, ab 50 % völlig unterbrochen).", "Kinder nicht mit Erwachsenen-Dosierung trainieren – sensible Phasen (TL Std. 8) und Faigenbaum beachten.", "Autoren prüfungsrelevant: Faigenbaum (Kinder), ACSM 2009 (Senioren) – App-Quiz/Exam."], "quellen": ["Examenstrainer.html · DATA kraft: diagrams Folien 21/102/109, quiz (Faigenbaum/ACSM/Gefahren/Atmung), exam (6 P + 6 P)"]}, "au-22": {"nr": 22, "id": "au-22", "thema": "ausdauer", "titel": "Ausdauer und Ermüdung: Definitionen, Strukturierung, lokale vs. allgemeine Ausdauer", "dauer": 60, "ziele": ["Die Auszubildenden definieren Ausdauer nach Weineck (1997) und Ermüdung nach Lehmann (prüfungsrelevant).", "Sie nennen die vier Kriterien der Ausdauer-Strukturierung und ordnen Ausdauerformen zu (6 P).", "Sie unterscheiden lokale und allgemeine Ausdauer sowie die Einteilung nach Zeitdauer."], "vorwissen": "Trainingslehre (Methoden, Belastungskomponenten), Herz-Kreislauf-Physiologie grob.", "material": ["App, Beamer", "Tabelle 'Strukturierung der Ausdauer' (Folie 4)", "Stoppuhr für Pulsmessung"], "physio": "Ausdauertraining ist die Basis fast jeder kardiologischen, pneumologischen und metabolischen Rehabilitation: Es verbessert die Sauerstoffversorgung, senkt den Ruhepuls und erhöht die Alltagsbelastbarkeit (z. B. Gehen, Treppensteigen) – das zentrale Therapieziel vieler Patienten.", "app": {"einsatz": ["Tabelle 'Strukturierung der Ausdauer' (Folie 4)", "Quiz ausdauer (38 Fragen): Definition Weineck, Ermüdung Lehmann, Anteil Muskelmasse 'allgemeine Ausdauer', Kurz-/Mittel-/Langzeitausdauer", "Karteikarten: 'Ausdauer (Weineck 1997)', 'Ermüdung (Lehmann)', 'Lokale vs. allgemeine Ausdauer', 'Einteilung nach Zeitdauer', 'Grundlagenausdauer vs. spezielle Ausdauer'", "Reihenfolge: 'Ausdauerformen nach zunehmender Belastungsdauer'", "Prüfungsaufgabe: vier Strukturierungskriterien + zugehörige Formen (6 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Puls-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum ist der Patient nach 3 Treppenetagen schon außer Atem?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Ausdauer strukturiert"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Ausdauerformen zuordnen · Partnerarbeit mit Tabelle Folie 4 und App"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Strukturierungs-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Puls-Raten", "art": "Schätzen", "min": 5, "anleitung": "Ruhepuls schätzen, dann messen und vergleichen; danach: Welche Pulsbereiche kennst du fürs Training?", "aufgaben": [{"frage": "Typischer Ruhepuls Erwachsene?", "antwort": "ca. 60–80/min."}, {"frage": "Was senkt Ausdauertraining?", "antwort": "Ruhepuls und Blutdruck (Herzanpassung)."}, {"frage": "Allgemeine Ausdauer – ab welchem Muskelanteil?", "antwort": "ca. ab 1/6–1/7 der Muskelmasse (App-Quiz)."}]}, {"titel": "Ausdauer-Quiz-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Definitionen und Einteilung; schnelle Antworten im Plenum.", "aufgaben": [{"frage": "Ausdauer-Definition (Weineck 1997)?", "antwort": "Fähigkeit, eine Leistung über längere Zeit aufrechtzuerhalten + Ermüdungswiderstand + schnelle Erholung."}, {"frage": "Ermüdung (Lehmann)?", "antwort": "Vorübergehende Leistungsminderung durch Belastung, reversibel durch Erholung."}, {"frage": "Kurzzeitausdauer?", "antwort": "ca. 25 s – 2 min (anaerob)."}, {"frage": "Mittelzeitausdauer (bei höchstmöglicher Intensität)?", "antwort": "2–8 min (App-Quiz)."}, {"frage": "Langzeitausdauer?", "antwort": "LZA I: 8–30 min, LZA II: 30–90 min, LZA III: > 90 min (aerob) (App-Quiz)."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Wie wirkt sich Ausdauertraining auf das Immunsystem aus?", "antwort": "Moderates Training wirkt positiv, sehr intensives negativ (Open-Window-Effekt) – Regelmäßiges, moderates Training hat positive Effekte; sehr intensives Training hat negative Effekte, z. B. den Open-Window-Effekt."}, {"frage": "In welcher Stufe des therapeutischen Stufenmodells (Froböse) wird erstmals die Wiederholungsmethode eingesetzt?", "antwort": "Stufe 4 (Ausdauer) – Erst Stufe 4 nennt neben Dauermethode und Fahrtspielen die extensive und intensive Intervallmethode sowie die Wiederholungsmethode."}, {"frage": "Warum brauchen Anpassungen des Knorpels besonders lange?", "antwort": "Wegen des langsamen Stoffwechsels im Knorpelgewebe – Aufgrund des langsamen Stoffwechsels brauchen Knorpelanpassungen längere Zeit; zudem nimmt die Adaptationsfähigkeit mit dem Alter ab."}]}], "einstieg": {"titel": "Warum ist der Patient nach 3 Treppenetagen schon außer Atem?", "min": 10, "situation": "Fall: 60-jähriger Patient, nach 3 Etagen Treppensteigen stark atemlos, erholt sich langsam. Was ist eingeschränkt – und welches Therapieziel leitest du ab?", "impulse": [{"frage": "Vermutung?", "erwartung": "Geringe aerobe Ausdauer/VO2max – Herz-Kreislauf nicht trainiert."}, {"frage": "Therapieziel?", "erwartung": "Grundlagenausdauer aufbauen (GA I), Alltagsbelastbarkeit steigern."}, {"frage": "App-Bezug?", "erwartung": "App-Quiz: 'Welche Belastungsdauer kennzeichnet die Mittelzeitausdauer?' – Einordnung des Falls."}, {"frage": "Vorsicht?", "erwartung": "Kardiovaskuläre Abklärung vor Trainingsbeginn (Belastungsdiagnostik, PWC – Stunde 30)."}], "ueberleitung": "Ausdauer ist trainierbar – in jedem Alter. Heute klären wir zuerst: Was ist Ausdauer überhaupt, und wie strukturieren wir sie?"}, "praesentation": {"titel": "Ausdauer strukturiert", "min": 15, "merksatz": "Ausdauer (Weineck 1997) = psycho-physische Ermüdungswiderstandsfähigkeit + schnelle Erholung. Ermüdung (Lehmann) = reversible Leistungsminderung. Strukturierung (Folie 4): nach Muskelmasse (lokal <1/6, allgemein >1/6), nach Zeitdauer (Kurz 45 s–2 min, Mittel 2–8 min, LZA I 8–30 min, LZA II 30–90 min, LZA III > 90 min), nach Energiebereitstellung (aerob/anaerob), nach Sportart (allgemein/speziell). Grundlagenausdauer (GA) = Basis für alle Sportarten und die Therapie.", "schritte": [{"ueberschrift": "Definitionen Ausdauer und Ermüdung", "text": "Karteikarten in der App aufdecken; Definitionen an die Tafel schreiben.", "vortrag": "Weineck definiert Ausdauer als die Fähigkeit, eine gegebene Leistung möglichst lange aufrechtzuerhalten, verbunden mit schnellem Erholen. Ermüdung nach Lehmann ist die vorübergehende, reversible Minderung der Leistungsfähigkeit – sie ist normal und trainierbar: Je trainierter, desto später tritt sie auf und desto schneller bildet sie sich zurück."}, {"ueberschrift": "Vier Strukturierungskriterien", "text": "Tabelle Folie 4 projizieren; Kriterien mit Beispielen füllen (lokal: Armarbeit; allgemein: Laufen; Kurz/Mittel/Lang; aerob/anaerob; allgemein/speziell).", "vortrag": "Wir strukturieren Ausdauer nach vier Kriterien: Muskelmasse (lokal vs. allgemein – allgemein ab etwa einem Sechstel der Muskulatur), Zeitdauer (Kurz-, Mittel-, Langzeitausdauer), Energiebereitstellung (aerob/anaerob) und Sportartspezifität (allgemein vs. speziell). Diese Einteilung ist prüfungsrelevant – das App-Examen verlangt alle vier Kriterien mit Beispielen (6 Punkte)."}, {"ueberschrift": "Grundlagenausdauer in der Therapie", "text": "GA I/GA II als Therapiebausteine nennen; Patientenbeispiel Treppensteigen.", "vortrag": "Die Grundlagenausdauer ist die Basis für alles Weitere – auch in der Therapie: Wer 3 Etagen Treppensteigen ohne Atemnot schafft, hat sein Alltagsziel erreicht. Deshalb bauen wir in der Reha gezielt GA I auf (extensive Dauermethode, nächste Stunden)."}]}, "arbeitsphase": {"titel": "Ausdauerformen zuordnen", "min": 25, "sozialform": "Partnerarbeit mit Tabelle Folie 4 und App", "aufgaben": [{"titel": "Ordne zu: 100-m-Sprint, 5-km-Lauf, Arm-Curl 20 WH, Rudern 2000 m, Gehen 30 min.", "text": "Ordne zu: 100-m-Sprint, 5-km-Lauf, Arm-Curl 20 WH, Rudern 2000 m, Gehen 30 min.", "loesung": "100 m = Kurzzeit anaerob; 2000 m Rudern = Mittelzeit; 5 km/30 min Gehen = Langzeit aerob; Arm-Curl lokal anaerob; App: sequence 'Ausdauerformen nach zunehmender Belastungsdauer'.", "hilfe": "App: table Folie 4 + sequence."}, {"titel": "Fall: Patient nach Herzinfarkt – welche Ausdauerform ist Therapieziel?", "text": "Fall: Patient nach Herzinfarkt – welche Ausdauerform ist Therapieziel?", "loesung": "Allgemeine aerobe Langzeitausdauer (GA I) – z. B. Walking, Fahrradergometer extensiv (App-Quiz 'Gesundheits-Minimalprogramm').", "hilfe": "App: quiz ausdauer 'Gesundheits-Minimalprogramm'."}, {"titel": "Prüfungsaufgabe (6 P): Nenne die vier Kriterien der Ausdauer-Strukturierung mit je einer zugehörigen Form.", "text": "Prüfungsaufgabe (6 P): Nenne die vier Kriterien der Ausdauer-Strukturierung mit je einer zugehörigen Form.", "loesung": "z. B. Muskelmasse → lokal/allgemein; Zeit → Kurz/Mittel/Lang; Energie → aerob/anaerob; Sportart → allgemein/speziell (App-exam).", "hilfe": "App: exam ausdauer (6 P)."}, {"titel": "Prüfungsnahe Aufgabe (8 P)", "text": "Nenne je zwei Anpassungserscheinungen des Ausdauertrainings an Herz, Blut, peripherer Muskulatur und Psyche.", "loesung": "- Herz: Myokard 250 g → 500 g; Schlagvolumen in Ruhe 70 → 105 ml; HMV 20 → 40 l/min; geringerer Ruhepuls\n- Blut: Blutmenge 5 l → 6–7 l; geringere Viskosität; bessere O2- und Pufferkapazität\n- Peripherie: Kapillarvermehrung; Mitochondrienvermehrung; Glykogen 200–300 g → 400–600 g; ST-Faser-Anteil bis ca. 90 %\n- Psyche: Sympathikustonus sinkt; höhere Stressresistenz; Endorphine → Schmerzschwelle steigt", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit der ausgedruckten Tabelle Folie 4; stärkere begründen zusätzlich, warum in der kardiovaskulären Reha nur allgemeine aerobe Langzeitausdauer trainiert wird (Belastbarkeit, Sicherheit).", "app_uebung": "App: table Folie 4, quiz, cards 'Ausdauer'/'Ermüdung'/'Lokal vs. allgemein', sequence, exam (6 P)."}, "sicherung": {"titel": "Strukturierungs-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Definiere Ausdauer (Weineck) und nenne die vier Strukturierungskriterien mit je einem Beispiel.", "aufgaben": [{"frage": "Definition?", "loesung": "Ermüdungswiderstandsfähigkeit + schnelle Erholung bei längerer Belastung (Weineck 1997)."}, {"frage": "Vier Kriterien?", "loesung": "Muskelmasse, Zeitdauer, Energiebereitstellung, Sportartspezifität – mit Beispielen (Folie 4)."}, {"frage": "Ein 40-jähriger Patient (Ruhepuls 60) soll auf dem Fahrradergometer mit 60 % Intensität trainieren. Welche Trainingsherzfrequenz ergibt die Karvonen-Formel?  [App-Quiz: Ausdauer]", "loesung": "132 Schläge/min – Radfahren: THF = RHF + ((220 − LA) − RHF) × X = 60 + (180 − 60) × 0,6 = 60 + 72 = 132."}]}, "hausaufgabe": "Tabelle 'Strukturierung der Ausdauer' (Folie 4) lernen; Karteikarten 'Ausdauer'/'Ermüdung'/'Lokal vs. allgemein'/'Zeitdauer'; App-sequence 'Ausdauerformen nach Belastungsdauer' ordnen; exam-Aufgabe (6 P) üben.", "hinweise": ["Fehler: Ermüdung mit 'dauerhafter Schädigung' verwechselt – Ermüdung ist reversibel (Lehmann).", "Lokal vs. allgemein: Grenze ca. 1/6 der Muskelmasse (App-Quiz).", "Weineck 1997 und Lehmann sind prüfungsrelevante Autoren (App-exam/quiz)."], "quellen": ["Examenstrainer.html · DATA ausdauer: table Folie 4, cards, quiz, sequences, exam (6 P)", "Weineck 1997; Lehmann (App-Quellen)"]}, "au-23": {"nr": 23, "id": "au-23", "thema": "ausdauer", "titel": "Energiebereitstellung: die vier Wege der ATP-Resynthese", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben die vier Wege der ATP-Resynthese und vergleichen sie nach Kapazität und Flussrate (prüfungsrelevant, 6 P).", "Sie ordnen Energiebereitstellungswege aerob/anaerob zu.", "Sie erklären die Lohmann-Reaktion (Kreatinphosphat)."], "vorwissen": "Stunde 22 (Ausdauer-Grundlagen), Biochemie-Grundlagen (ATP).", "material": ["App, Beamer", "Diagramme: 'Energiebereitstellung im zeitlichen Verlauf' (Folie 5) + Labels/Hotspot 'Art der Energiebereitstellung'", "'Anteil der Energiesysteme bei maximaler Belastung (de Marées 2002)' (Folie 6)"], "physio": "Welcher Energiebereitstellungsweg wann dominiert, bestimmt die Belastungswahl in der Therapie: Kurze, harte Reha-Übungen (z. B. Aufsteh-Training) laufen anaerob-laktazid, lange Walking-Einheiten aerob. Die Kenntnis der vier Wege erlaubt eine gezielte Steuerung von Intensität und Pause (lohnende Pause).", "app": {"einsatz": ["Diagramme + Labels/Hotspots: 'Energiebereitstellung im zeitlichen Verlauf' (Folie 5), 'Anteil der Energiesysteme' (de Marées 2002, Folie 6)", "Zuordnen: 'Ist der Energiebereitstellungsweg aerob oder anaerob?'", "Reihenfolge: 'Energiebereitstellung mit zunehmender Belastungsdauer (Maximum der Flussrate)'", "Quiz: 'Über welches System wird ATP aus Kreatinphosphat resynthetisiert?' (Lohmann-Reaktion), 'Kapazität vs. Leistungsfähigkeit (Heck & Schulz)', 'Wie unterscheiden sich Kreatinphosphat und Fett als Energielieferanten?'", "Prüfungsaufgabe: vier ATP-Resynthesewege nach Kapazität/Flussrate (6 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "System-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum ist der Patient nach kurzer Belastung schon 'platt'?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vier Wege, ein Ziel: ATP"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Energiebereitstellung zuordnen · Partnerarbeit mit App-Diagrammen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Vier-Wege-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "System-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu den vier ATP-Wegen; Antworten laut rufen.", "aufgaben": [{"frage": "Vier Wege der ATP-Resynthese?", "antwort": "1) ATP-Spaltung (phosphagen), 2) Kreatinphosphat (Lohmann), 3) anaerobe Glykolyse (laktazid), 4) aerobe Oxidation (Glykolyse/Lipolyse)."}, {"frage": "Lohmann-Reaktion?", "antwort": "Kreatinphosphat + ADP → Kreatin + ATP (schnell, anaerob, begrenzte Kapazität)."}, {"frage": "Kapazität vs. Flussrate?", "antwort": "Fett: riesige Kapazität, geringe Flussrate; Kreatinphosphat: geringe Kapazität, höchste Flussrate (Heck & Schulz)."}, {"frage": "Unterschied Kreatinphosphat/Fett?", "antwort": "KP: sofort, Sekunden, anaerob; Fett: langsam, nahezu unerschöpflich, aerob."}]}, {"titel": "Dauer-Rätsel", "art": "Rätsel", "min": 5, "anleitung": "Welche Energiequelle dominiert bei 10 s Sprint, 2 min, 30 min? – Reihenfolge-Übung in der App.", "aufgaben": [{"frage": "10 s Sprint?", "antwort": "Phosphagen/Kreatinphosphat (anaerob-alaktazid)."}, {"frage": "2 min?", "antwort": "Anaerobe Glykolyse (laktazid) zunehmend."}, {"frage": "30 min?", "antwort": "Aerobe Oxidation (Glukose/Fett)."}, {"frage": "App?", "antwort": "Sequence 'Energiebereitstellung mit zunehmender Belastungsdauer'."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Ein 40-jähriger Patient (Ruhepuls 60) soll auf dem Fahrradergometer mit 60 % Intensität trainieren. Welche Trainingsherzfrequenz ergibt die Karvonen-Formel?", "antwort": "132 Schläge/min – Radfahren: THF = RHF + ((220 − LA) − RHF) × X = 60 + (180 − 60) × 0,6 = 60 + 72 = 132."}, {"frage": "Wie hoch ist nach der Faustformel der Sollwert der maximalen Belastbarkeit für einen 50-jährigen Mann mit 70 kg?", "antwort": "168 Watt – Männer über 30: 3 × Gewicht × (130 − Alter) / 100 = 3 × 70 × 80 / 100 = 168 Watt."}, {"frage": "Eine Schülerin läuft im Cooper-Test in 12 Minuten 2.500 m. Wie ist das Ergebnis nach Zintl (1997) einzuordnen?", "antwort": "Gut – 2.400–2.800 m entsprechen der Leistungsgruppe „gut“ (O2-Verbrauch 42,1–52 ml/kg/min)."}]}], "einstieg": {"titel": "Warum ist der Patient nach kurzer Belastung schon 'platt'?", "min": 10, "situation": "Fall: Nach 2 Minuten Treppensteigen ist der Patient völlig erschöpft und atmet schwer – welcher Stoffwechselweg war überfordert, was fehlt?", "impulse": [{"frage": "Welcher Weg?", "erwartung": "Anaerobe Glykolyse → Laktatbildung, wenn O2 nicht ausreicht (Sauerstoffdefizit, Stunde 28)."}, {"frage": "Was fehlt?", "erwartung": "Aerobe Kapazität (VO2max, Mitochondrien) – trainierbar."}, {"frage": "Therapieziel?", "erwartung": "Aerobe Grundlage aufbauen (GA I), dann anaerobe Toleranz steigt."}, {"frage": "App-Bezug?", "erwartung": "Diagramm Folie 5: Energiebereitstellung im zeitlichen Verlauf."}], "ueberleitung": "Jede Belastung wird über vier Energiesysteme versorgt – welches dominiert, hängt von Dauer und Intensität ab. Genau das schauen wir uns jetzt an."}, "praesentation": {"titel": "Vier Wege, ein Ziel: ATP", "min": 15, "merksatz": "ATP-Resynthese: 1) Phosphagen (ATP direkt, Sekunden), 2) Kreatinphosphat/Lohmann (schnell, bis ca. 10 s, anaerob-alaktazid), 3) anaerobe Glykolyse (Laktat, bis ca. 2 min, anaerob-laktazid), 4) aerobe Oxidation von Glukose und Fett (ab Minuten, aerob, praktisch unerschöpflich). Kapazität vs. Flussrate (Heck & Schulz): KP = höchste Flussrate, geringste Kapazität; Fett = umgekehrt. de Marées (2002, Folie 6): Anteil der Systeme bei maximaler Belastung je nach Dauer.", "schritte": [{"ueberschrift": "Die vier Wege im zeitlichen Verlauf", "text": "Diagramm Folie 5 projizieren; Hotspot 'Art der Energiebereitstellung' (Folie 5) in der App; die vier Kurven (Phosphagen, KP, Glykolyse, aerob) einzeichnen.", "vortrag": "Zu Beginn einer Belastung springen sofort ATP und Kreatinphosphat ein – anaerob, sehr schnell, aber nach Sekunden erschöpft (Lohmann-Reaktion). Bis etwa 2 Minuten übernimmt die anaerobe Glykolyse mit Laktatbildung. Danach dominiert die aerobe Oxidation von Glukose und Fett – langsamer, aber praktisch unerschöpflich. Das Diagramm Folie 5 zeigt genau diesen Verlauf."}, {"ueberschrift": "Kapazität vs. Flussrate", "text": "Vergleich an die Tafel (Heck & Schulz): KP = höchste Flussrate, kleinste Kapazität; Fett = umgekehrt.", "vortrag": "Die Systeme unterscheiden sich in zwei Dimensionen: Kapazität (wie viel Energie insgesamt) und Flussrate (wie schnell sie geliefert wird). Kreatinphosphat liefert explosionsartig, ist aber nach Sekunden leer; Fett liefert langsam, aber stundenlang. de Marées (Folie 6) zeigt, welcher Anteil bei welcher Belastungsdauer jeweils liefert."}, {"ueberschrift": "Konsequenz für die Therapie", "text": "Beispiele: Aufsteh-Training (kurz, anaerob) vs. Walking 30 min (aerob); Pausenlänge nach Laktat-Abbau (lohnende Pause, Stunde 30).", "vortrag": "In der Reha steuern wir die Belastung über die richtige Wahl von Dauer und Intensität: Kurze, wiederholte Belastungen (z. B. 10× Aufstehen) laufen anaerob – dafür brauchen wir Pausen (lohnende Pause). Lange, moderate Einheiten (Walking) laufen aerob und bauen die Grundlagenausdauer auf. Beides hat seinen Platz in der MTT."}]}, "arbeitsphase": {"titel": "Energiebereitstellung zuordnen", "min": 25, "sozialform": "Partnerarbeit mit App-Diagrammen", "aufgaben": [{"titel": "Ordne zu (App-sorts 'aerob oder anaerob?'): 10 s Sprint, 400 m, Marathon, Kraftsatz 5 WH, 30 min Walking.", "text": "Ordne zu (App-sorts 'aerob oder anaerob?'): 10 s Sprint, 400 m, Marathon, Kraftsatz 5 WH, 30 min Walking.", "loesung": "10 s/5 WH = anaerob-alaktazid (KP); 400 m = anaerob-laktazid; Marathon/30 min Walking = aerob.", "hilfe": "App: sorts 'Ist der Energiebereitstellungsweg aerob oder anaerob?'"}, {"titel": "Lies Diagramm Folie 6 (de Marées 2002): Welches System liefert bei 10 s, bei 2 min, bei 30 min den größten Anteil?", "text": "Lies Diagramm Folie 6 (de Marées 2002): Welches System liefert bei 10 s, bei 2 min, bei 30 min den größten Anteil?", "loesung": "10 s: Phosphagen/KP; 2 min: anaerobe Glykolyse; 30 min: aerobe Oxidation (App-diagram Folie 6).", "hilfe": "App: diagram 'Anteil der Energiesysteme bei maximaler Belastung' Folie 6."}, {"titel": "Fall: Patient macht 10× Aufstehen aus dem Stuhl mit 30 s Pause – welcher Stoffwechsel, welche Pause ist 'lohnend'?", "text": "Fall: Patient macht 10× Aufstehen aus dem Stuhl mit 30 s Pause – welcher Stoffwechsel, welche Pause ist 'lohnend'?", "loesung": "Anaerob-laktazid → Pause bis Laktat abgebaut (lohnende Pause, Folie 67, Stunde 30); App-Quiz 'lohnende Pause'.", "hilfe": "App: diagram Folie 67 (lohnende Pause)."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Vergleiche Dauer-, Intervall- und Wiederholungsmethode hinsichtlich Pausengestaltung, Intensität und Zielen.", "loesung": "- Dauermethode: keine Pause; extensiv 60–70 % (30 min–6 h), intensiv 70–80 % (20 min–3 h); Ziel u. a. Grundlagenausdauer, Fettstoffwechsel, Ökonomisierung\n- Intervallmethode: lohnende Pause (bis HF ca. 130–120); extensiv 60–80 %, intensiv 70–90 %; Ziele: Laktatverträglichkeit, Herzvolumenvergrößerung, höhere O2-Aufnahme, Regenerationsfähigkeit\n- Wiederholungsmethode: erholende (vollständige) Pause 4–15 (30) min; 90–100 %; Ziele: Ökonomisierung, Vergrößerung der Energiereserven, Steigerungsfähigkeit zur höchsten individuellen Leistung", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit den App-sorts; stärkere diskutieren, warum die aerobe Kapazität (Mitochondrien, Kapillaren) das langfristige Therapieziel ist und wie GA-Training sie steigert.", "app_uebung": "App: diagrams Folien 5/6 + labels/hotspots, sorts 'aerob/anaerob', sequence 'Energiebereitstellung mit Dauer', quiz, exam (6 P)."}, "sicherung": {"titel": "Vier-Wege-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die vier ATP-Resynthesewege und vergleiche zwei davon nach Kapazität und Flussrate.", "aufgaben": [{"frage": "Vier Wege?", "loesung": "Phosphagen, Kreatinphosphat (Lohmann), anaerobe Glykolyse, aerobe Oxidation."}, {"frage": "Kapazität vs. Flussrate?", "loesung": "z. B. KP: höchste Flussrate, geringste Kapazität; Fett: geringste Flussrate, höchste Kapazität (Heck & Schulz)."}, {"frage": "Ein 75 kg schwerer Mann erreicht im PWC-150-Test 225 Watt. Wie ist seine Leistung zu bewerten?  [App-Quiz: Ausdauer]", "loesung": "Gut – 225 W / 75 kg = 3,0 W/kg. Bei Männern entspricht PWC 150 mit 3,00–3,50 W/kg der Bewertung „gut“."}]}, "hausaufgabe": "Diagramme Folien 5/6 ins Heft; App-sorts 'aerob/anaerob' fehlerfrei; sequence 'Energiebereitstellung mit Dauer' ordnen; exam-Aufgabe 'vier ATP-Wege' (6 P) üben; Karteikarten 'Vier ATP-Resynthesewege'/'Lohmann-Reaktion'/'Kapazität vs. Leistungsfähigkeit' lernen.", "hinweise": ["Fehler: Laktat wird als 'Ursache der Ermüdung allein' gesehen – Ermüdung ist multifaktoriell (App: Ermüdung Lehmann, Std. 22).", "Phosphagen vs. Kreatinphosphat werden vermischt – KP = Lohmann-Reaktion (App-Quiz).", "de Marées 2002 und Heck & Schulz prüfungsrelevant (App-Quellen Folien 5/6)."], "quellen": ["Examenstrainer.html · DATA ausdauer: diagrams/labels/hotspots Folien 5/6, sorts 'aerob/anaerob', sequence, quiz, exam (6 P)", "de Marées 2002; Heck & Schulz; Lohmann (App-Quellen)"]}, "au-24": {"nr": 24, "id": "au-24", "thema": "ausdauer", "titel": "Energiespeicher des Körpers und Erholungs-Halbwertszeiten", "dauer": 60, "ziele": ["Die Auszubildenden nennen die Energiespeicher eines 75-kg-Mannes (Fett, Glykogen, Kreatinphosphat).", "Sie erklären das Konzept der Halbwertszeit der Erholung.", "Sie begründen, warum die längste Erholungszeit die Pausenplanung bestimmt."], "vorwissen": "Stunde 23 (vier ATP-Wege), Stunde 17 Kraft (Regeneration Weineck, Folie 59).", "material": ["App, Beamer", "Karteikarte 'Energiespeicher eines 75-kg-Mannes'", "Diagramm 'Regenerationszeit' (kraft Folie 59) als Vergleich"], "physio": "Die Energiespeicher erklären, warum ein Patient nach langer Krankheit schnell erschöpft ist (geringe Glykogen-/Fettspeicher-Nutzung) und warum Pausen zwischen den Sätzen individuell geplant werden müssen (Halbwertszeiten). In der MTT nutzen wir dieses Wissen für die Pausengestaltung (Dichte).", "app": {"einsatz": ["Karteikarten: 'Energiespeicher eines 75-kg-Mannes', 'Halbwertszeit der Erholung'", "Quiz: 'Wie groß ist der Energiespeicher Fett eines 75-kg-Mannes?' (ca. 100.000+ kcal), 'Kreatinphosphat vs. Fett als Energielieferanten'", "Reihenfolge: 'Regeneration nach Belastungsende (Weineck) – von kurz nach lang' (kraft, Folie 59) als Vergleich", "Diagramm 'Prinzip der lohnenden Pause' (Folie 67) – Vorschau Stunde 30"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Speicher-Schätzen (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum ist der Patient so schnell müde?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Speicher und Erholung im Zeitverlauf"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Pausen planen · Partnerarbeit mit Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Speicher-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Speicher-Schätzen", "art": "Schätzen", "min": 5, "anleitung": "Wie viele kcal hat der Fett Speicher eines 75-kg-Mannes ungefähr? Schätzen (10.000? 100.000?), dann App-Karteikarte.", "aufgaben": [{"frage": "Fett Speicher 75-kg-Mann?", "antwort": "ca. 50.000 kcal (210.000 kJ); Glykogen nur ca. 1.200 kcal; ATP+KP ca. 5 kcal (App-Quiz)."}, {"frage": "Glykogen?", "antwort": "ca. 1.200 kcal (Leber+Muskel) – begrenzt, für höhere Intensitäten."}, {"frage": "ATP + Kreatinphosphat?", "antwort": "ca. 5 kcal, Sekunden (Lohmann, Std. 23)."}]}, {"titel": "Halbwertszeit-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Halbwertszeit der Erholung und Energiespeichern.", "aufgaben": [{"frage": "Was bedeutet Halbwertszeit der Erholung?", "antwort": "Zeit, nach der die Hälfte der Erholung eingetreten ist – jedes System hat eigene Halbwertszeiten."}, {"frage": "Warum Pausen planen?", "antwort": "Längste Erholungszeit bestimmt die nötige Pause (Prinzip optimale Relation, TL)."}, {"frage": "Fett vs. Kohlenhydrate als Energie?", "antwort": "Fett: hohe Kapazität, niedrige Flussrate; KH: höhere Flussrate, begrenzte Kapazität."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Ein 75 kg schwerer Mann erreicht im PWC-150-Test 225 Watt. Wie ist seine Leistung zu bewerten?", "antwort": "Gut – 225 W / 75 kg = 3,0 W/kg. Bei Männern entspricht PWC 150 mit 3,00–3,50 W/kg der Bewertung „gut“."}, {"frage": "Eine untrainierte 45-jährige Frau hat eine VO2max von 28 ml/min/kg. Wie ist der Wert nach Löllgen einzuordnen?", "antwort": "Mittel – Für Frauen von 40–49 Jahren gilt 24–30 ml/min/kg als „mittel“."}, {"frage": "Für einen 50-Jährigen mit einer VO2max unter 40 ml/kg/min wird das Gesundheits-Minimalprogramm geplant. Welche Trainingsherzfrequenz ist vorgesehen?", "antwort": "Ca. 110 Schläge/min – Minimalprogramm: HF 160 minus Lebensalter = 160 − 50 = 110 (ca. 50 % VO2max). Die Formel 170 minus Lebensalter gilt für das Optimalprogramm."}]}], "einstieg": {"titel": "Warum ist der Patient so schnell müde?", "min": 10, "situation": "Fall: Patient nach 4 Wochen Bettlägerigkeit ist nach 5 Minuten Gehen erschöpft. Welche Speicher/Systeme sind betroffen?", "impulse": [{"frage": "Glykogen-/KP-Speicher?", "erwartung": "Reduziert/nicht adaptiert – schnelle Ermüdung."}, {"frage": "Mitochondrien/Kapillaren?", "erwartung": "Weniger (Atrophie) – aerobe Kapazität ↓."}, {"frage": "Erholung?", "erwartung": "Verlängert – Halbwertszeiten beachten bei Pausen."}, {"frage": "Therapieziel?", "erwartung": "GA I aufbauen, dann Speicher und Kapillaren wachsen (Wochen, Radlinger-analog)."}], "ueberleitung": "Die Größe der Energiespeicher und die Geschwindigkeit der Erholung bestimmen, wie lange und wie oft wir belasten können. Heute: Speicher und Halbwertszeiten."}, "praesentation": {"titel": "Speicher und Erholung im Zeitverlauf", "min": 15, "merksatz": "Energiespeicher (75 kg Mann): Fett ca. 50.000 kcal / 210.000 kJ (riesig, niedrige Flussrate), Glykogen ca. 1.200 kcal (Leber/Muskel, höhere Flussrate), ATP+Kreatinphosphat ca. 5 kcal (Sekunden) (App-Quiz). Halbwertszeit der Erholung: jedes System (ATP/KP, Glykogen, Laktatabbau, ZNS) erholt sich mit eigener Halbwertszeit – die längste bestimmt die Pausenplanung (lohnende Pause, Folie 67).", "schritte": [{"ueberschrift": "Die Energiespeicher im Vergleich", "text": "Drei Säulen an die Tafel (ATP/KP – Sekunden; Glykogen – Stunden; Fett – Tage/Wochen); App-Karteikarte 'Energiespeicher 75-kg-Mann'.", "vortrag": "Unser Körper hat drei Größenordnungen von Speichern: ATP und Kreatinphosphat reichen für Sekunden, Glykogen für etwa eine bis zwei Stunden, Fett für viele Stunden bis Tage – bei einem 75-kg-Mann ca. 50.000 kcal (210.000 kJ); Glykogen nur ca. 1.200 kcal, ATP+KP ca. 5 kcal. Je länger die Belastung, desto mehr rückt der Fettstoffwechsel in den Vordergrund (nächste Stunde)."}, {"ueberschrift": "Halbwertszeit der Erholung", "text": "Definition an die Tafel; Vergleich mit Regeneration (kraft Folie 59, Weineck): Systeme erholen sich unterschiedlich schnell.", "vortrag": "Nach einer Belastung erholt sich jedes System mit eigener Halbwertszeit: ATP/KP in Sekunden bis Minuten, Laktat in etwa einer Stunde, Glykogen in Stunden bis Tagen. Die längste Erholungszeit bestimmt, wann wir wieder belasten dürfen – sonst summiert sich die Ermüdung (Übertraining, TL Std. 2)."}, {"ueberschrift": "Konsequenz für die Therapie-Pausen", "text": "Beispiel: Intervalltraining Patient – Pause bis HF wieder sinkt (lohnende Pause, Folie 67, Stunde 30).", "vortrag": "In der MTT planen wir Pausen nach der Erholung des belasteten Systems: Nach kurzen anaeroben Reizen reichen Sekunden bis Minuten (KP-Resynthese), nach laktatbildenden Belastungen brauchen wir deutlich längere Pausen, bis das Laktat abgebaut ist – das ist die 'lohnende Pause' (Folie 67)."}]}, "arbeitsphase": {"titel": "Pausen planen", "min": 25, "sozialform": "Partnerarbeit mit Fallkarten", "aufgaben": [{"titel": "Fall: 10× Aufstehen mit 30 s Pause – reicht das? Begründung?", "text": "Fall: 10× Aufstehen mit 30 s Pause – reicht das? Begründung?", "loesung": "KP resynthetisiert sich in ~2–3 min zu großen Teilen; 30 s sind knapp – besser 60–90 s oder weniger WH (Halbwertszeit, lohnende Pause Folie 67).", "hilfe": "App: card 'Halbwertszeit der Erholung', diagram Folie 67."}, {"titel": "Fall: 30 min Walking nach Herzinfarkt – welche 'Erholung' ist relevant?", "text": "Fall: 30 min Walking nach Herzinfarkt – welche 'Erholung' ist relevant?", "loesung": "Aerobe Belastung: Erholung = Cool-down + nächste Einheit frühestens nach Superkompensationsfenster (TL Std. 2); Speicher: Fett/Glykogen aerob genutzt.", "hilfe": "App: quiz 'Gesundheits-Minimalprogramm' (Folie 78)."}, {"titel": "Nenne die drei Energiespeicher mit Größenordnung.", "text": "Nenne die drei Energiespeicher mit Größenordnung.", "loesung": "ATP/KP ca. 5 kcal (Sekunden); Glykogen ca. 1.200 kcal; Fett ca. 50.000 kcal / 210.000 kJ (App-Karteikarte).", "hilfe": "App: card 'Energiespeicher eines 75-kg-Mannes'."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Beschreibe die Durchführung und Auswertung des PWC-Tests auf dem Fahrradergometer.", "loesung": "- Vorab Gesundheitscheck (z. B. Alter > 35 und inaktiv, Raucher, Herz-Kreislauf-Erkrankung, RR > 160/90) → ggf. Arzt\n- Leistungsstarke: Start 50 W, +50 W alle 3 min; Leistungsschwächere: Start 25 W, +25 W alle 2 min\n- Abbruch, wenn der Zielpuls (130/150/170) überschritten und die Stufe zu Ende gefahren ist; erreichten Puls protokollieren\n- Auswertung: Leistung in Watt/kg Körpergewicht anhand der Normtabelle\n- Normwerte geschlechts-, aber nicht altersabhängig; keine Ausbelastung nötig", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen Speicher mit der Karteikarte; stärkere diskutieren, warum die Pausenplanung in der Intervalltherapie des Patienten die Belastbarkeit erhöht (weniger Laktatakkumulation, bessere Qualität der WH).", "app_uebung": "App: cards 'Energiespeicher'/'Halbwertszeit', diagram Folie 67 (lohnende Pause), quiz, sequence 'Regeneration' (kraft)."}, "sicherung": {"titel": "Speicher-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die drei Energiespeicher mit Größenordnung und erkläre in einem Satz, warum die Halbwertszeit der Erholung die Pausenplanung bestimmt.", "aufgaben": [{"frage": "Drei Speicher?", "loesung": "ATP/KP ca. 5 kcal (Sekunden), Glykogen ca. 1.200 kcal, Fett ca. 50.000 kcal (App-Quiz)."}, {"frage": "Halbwertszeit → Pause?", "loesung": "Die längste Erholungszeit (z. B. Laktatabbau) bestimmt die nötige Pause – sonst Ermüdungsakkumulation."}, {"frage": "Ein Läufer absolviert 90 Minuten langsamen Dauerlauf bei HF ca. 140 und Laktat ca. 2 mmol/l. Welchem Trainingsbereich entspricht das?  [App-Quiz: Ausdauer]", "loesung": "Grundlagenausdauer 1 (GA I) – GA I: HF ca. 140, Laktat 1,5–2,5 mmol/l, 50–70 % VO2max, 30 min–6 h (langsamer Dauerlauf)."}]}, "hausaufgabe": "Karteikarten 'Energiespeicher'/'Halbwertszeit' lernen; Diagramm 'lohnende Pause' (Folie 67) analysieren; App-Quiz zu Speichern wiederholen; Vorschau: Fettstoffwechsel (nächste Stunde).", "hinweise": ["Fehler: 'Fett verbrennt erst nach 30 min' (30-min-Schallmauer) ist vereinfacht – Fettoxidation läuft immer mit, Anteil steigt (App-Quiz, Std. 25).", "Halbwertszeit ≠ vollständige Erholung – nach einer Halbwertszeit ist die Hälfte wiederhergestellt.", "App-Quiz: Fett Speicher 75 kg = ca. 50.000 kcal / 210.000 kJ (typische Prüfungsfrage)."], "quellen": ["Examenstrainer.html · DATA ausdauer: cards 'Energiespeicher eines 75-kg-Mannes'/'Halbwertszeit der Erholung', diagram Folie 67, quiz"]}, "au-25": {"nr": 25, "id": "au-25", "thema": "ausdauer", "titel": "Fettstoffwechsel: Belastungsdauer und -intensität, die '30-Minuten-Schallmauer'", "dauer": 60, "ziele": ["Die Auszubildenden erläutern den Zusammenhang zwischen Fettstoffwechsel, Belastungsdauer und -intensität (prüfungsrelevant, 5 P).", "Sie bewerten die Aussage zur '30-min-Schallmauer' des Fettstoffwechsels kritisch.", "Sie lesen die Fettoxidationskurve in Abhängigkeit von der Intensität (Folie 10)."], "vorwissen": "Stunde 23 (vier ATP-Wege), Stunde 24 (Energiespeicher).", "material": ["App, Beamer", "Diagramme: 'Fettstoffwechsel und Belastungsdauer – Anteil ATP-Resynthese' (Folie 9), 'Fettoxidation in Abhängigkeit von der Intensität' (Folie 10)"], "physio": "Der Fettstoffwechsel ist das Ausdauertraining schlechthin: Bei niedrigen Intensitäten (GA I, Walking) deckt Fett den Großteil des Energiebedarfs – das schont Glykogen, trainiert die Fettverbrennung und ist gelenkschonend (ideal für adipöse Patienten und Gelenkpatienten). Die Intensitätssteuerung (Herzfrequenz, Borg) ist Kern der MTT-Dosierung.", "app": {"einsatz": ["Diagramme: 'Fettstoffwechsel und Belastungsdauer' (Folie 9, stacked bar), 'Fettoxidation in Abhängigkeit von der Intensität' (Folie 10)", "Quiz: 'Was gilt für die Fettoxidation in Abhängigkeit von der Belastungsintensität?', 'Welche Aussage zur 30-min-Schallmauer ist richtig?'", "Karteikarten: 'Fettstoffwechsel und Belastungsdauer', 'Fettstoffwechsel und Intensität'", "Prüfungsaufgabe: Zusammenhang Fettstoffwechsel/Dauer/Intensität (5 P)", "Fall: 90 Min langsamer Dauerlauf, HF 140, Laktat 2 mmol → welcher Bereich? (GA I, App-Quiz)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Kurven-Lesen (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der dicke Patient und das Gehen"}, {"phase": "Präsentation", "min": 15, "inhalt": "Fettstoffwechsel steuern"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Intensität wählen und begründen · Partnerarbeit mit Diagrammen und App-Fällen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Fett-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Kurven-Lesen", "art": "Schätzen", "min": 5, "anleitung": "Bei welcher Intensität (niedrig/mittel/hoch) ist die Fettoxidation maximal? Schätzen, dann Folie 10 in der App prüfen.", "aufgaben": [{"frage": "Maximum der Fettoxidation?", "antwort": "Bei ca. 62 % VO2max (ca. 0,52 g/min); ab > 65 % sinkt der Anteil, bei ca. 87 % VO2max null (Folie 10, App-Quiz)."}, {"frage": "Bei sehr hoher Intensität?", "antwort": "Fettoxidation sinkt stark (anaerob dominiert)."}, {"frage": "Bei sehr niedriger?", "antwort": "Auch geringer absoluter Anteil (overall Energieumsatz klein)."}]}, {"titel": "Schallmauer-Rätsel", "art": "Rätsel", "min": 5, "anleitung": "'Erst nach 30 Minuten verbrennt der Körper Fett' – wahr oder falsch? App-Quiz klären.", "aufgaben": [{"frage": "Richtig?", "antwort": "Falsch/vereinfacht: Fettoxidation läuft von Beginn an – schon nach 30 min stammen 25 % der ATP-Resynthese aus Fett, nach 120 min 62 %; maximale Fettverbrennung erst ab ca. 90–120 min (Folie 9, App-Quiz)."}, {"frage": "Was steigt mit der Dauer wirklich?", "antwort": "Der relative Fettanteil an der ATP-Resynthese (Folie 9, stacked bar)."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Ein Läufer absolviert 90 Minuten langsamen Dauerlauf bei HF ca. 140 und Laktat ca. 2 mmol/l. Welchem Trainingsbereich entspricht das?", "antwort": "Grundlagenausdauer 1 (GA I) – GA I: HF ca. 140, Laktat 1,5–2,5 mmol/l, 50–70 % VO2max, 30 min–6 h (langsamer Dauerlauf)."}, {"frage": "Eine 62-jährige Frau mit einer VO2max von 26 ml/kg/min beginnt mit dem Gesundheits-Minimalprogramm. Welche Herzfrequenz peilt sie beim Training an?", "antwort": " – Gesundheits-Minimalprogramm (Frauen mit VO2max unter 32 ml/kg/min): HF 160 minus Lebensalter = 160 − 62 = 98 Schläge/min."}, {"frage": "Ein 35-jähriger Mann mit einer VO2max von ca. 45 ml/kg/min trainiert nach dem Gesundheits-Optimalprogramm. Welche Trainingsherzfrequenz gilt für ihn?", "antwort": " – Gesundheits-Optimalprogramm: HF 170 minus Lebensalter = 170 − 35 = 135 Schläge/min (70–80 % VO2max)."}]}], "einstieg": {"titel": "Der dicke Patient und das Gehen", "min": 10, "situation": "Fall: Übergewichtiger Patient (BMI 32) mit Kniearthrose soll Ausdauer trainieren – welche Intensität wählst du und warum gerade Fettstoffwechsel?", "impulse": [{"frage": "Intensität?", "erwartung": "Niedrig (GA I, Walking) – Fettoxidation hoch (Folie 10), Gelenke geschont."}, {"frage": "Warum Fett?", "erwartung": "Glykogen wird geschont, Fettdepot genutzt, Laktat niedrig → länger durchhaltbar."}, {"frage": "Dosierung?", "erwartung": "HF-gesteuert oder Borg-Skala (Std. 26), 30–45 min."}, {"frage": "App-Bezug?", "erwartung": "App-Quiz '90 Min Dauerlauf HF 140, Laktat 2 → GA I'."}], "ueberleitung": "Fett ist unser größter Energiespeicher – bei richtiger Intensität verbrennen wir ihn gezielt. Heute: Wie Dauer und Intensität den Fettstoffwechsel steuern."}, "praesentation": {"titel": "Fettstoffwechsel steuern", "min": 15, "merksatz": "Mit zunehmender Dauer steigt der Fettanteil an der Energiebereitstellung (Folie 9); mit zunehmender Intensität gibt es ein Maximum der Fettoxidation bei ca. 62 % VO2max (0,52 g/min), danach fällt sie ab (bei ca. 87 % VO2max null) (Folie 10, App-Quiz). '30-min-Schallmauer': Fettoxidation läuft von Beginn an – der Mythos ist falsch. Praxis: GA I (niedrige Intensität, lange Dauer) trainiert den Fettstoffwechsel optimal.", "schritte": [{"ueberschrift": "Dauer und Fettanteil", "text": "Diagramm Folie 9 (stacked bar) projizieren; Balken für 10/30/60/120 min vergleichen – Fettanteil steigt, KH-Anteil sinkt.", "vortrag": "Je länger die Belastung, desto mehr deckt Fett den Energiebedarf – bei 30 Minuten schon ein erheblicher Anteil, bei 90 Minuten der Großteil. Glykogen wird dadurch geschont. Die '30-Minuten-Schallmauer' ist ein Mythos: Fett wird von der ersten Minute an verbrannt, nur der Anteil steigt."}, {"ueberschrift": "Intensität und Fettoxidation", "text": "Diagramm Folie 10 zeigen; Maximum bei niedriger/mittlerer Intensität markieren; Abfall bei hoher Intensität.", "vortrag": "Die Fettoxidation hat ihr Maximum bei ca. 62 Prozent der VO2max (ca. 0,52 g/min). Darüber sinkt sie ab (> 65 %), bei ca. 87 % VO2max ist sie null, weil anaerobe Prozesse dominieren (App-Quiz). Für die Therapie heißt das: Lang und locker (GA I) verbrennt am effektivsten Fett – und ist gelenkschonend."}, {"ueberschrift": "Anwendung in der MTT", "text": "Beispiele: Walking-Programm adipöser Patienten (Folie 10-Bereich), GA I vs. GA II (Folien 54/55, Stunde 30).", "vortrag": "In der MTT dosieren wir Ausdauer deshalb häufig im GA-I-Bereich: niedrige Intensität, lange Dauer – das trainiert den Fettstoffwechsel, schont Glykogen und Gelenke und ist kardiovaskulär sicher. Die genaue HF-Steuerung lernen wir bei der Belastungsdiagnostik (PWC, Karvonen, Stunde 30)."}]}, "arbeitsphase": {"titel": "Intensität wählen und begründen", "min": 25, "sozialform": "Partnerarbeit mit Diagrammen und App-Fällen", "aufgaben": [{"titel": "Fall: 90 Min langsamer Dauerlauf, HF ca. 140, Laktat ca. 2 mmol/l – welcher Trainingsbereich?", "text": "Fall: 90 Min langsamer Dauerlauf, HF ca. 140, Laktat ca. 2 mmol/l – welcher Trainingsbereich?", "loesung": "GA I (extensive Dauermethode, aerob, Fettstoffwechsel dominant) (App-Quiz).", "hilfe": "App: quiz ausdauer '90 Min Dauerlauf HF 140 Laktat 2'."}, {"titel": "Lies Folie 10: Bei welcher Intensität ist die Fettoxidation maximal – und was passiert bei höherer Intensität?", "text": "Lies Folie 10: Bei welcher Intensität ist die Fettoxidation maximal – und was passiert bei höherer Intensität?", "loesung": "Maximum bei ca. 62 % VO2max (0,52 g/min); ab > 65 % Abfall, bei ca. 87 % null (App-diagram Folie 10, App-Quiz).", "hilfe": "App: diagram 'Fettoxidation in Abhängigkeit von der Intensität'."}, {"titel": "Fall: adipöser Patient mit Kniearthrose – begründe GA-I-Walking (30–45 min) statt Laufen.", "text": "Fall: adipöser Patient mit Kniearthrose – begründe GA-I-Walking (30–45 min) statt Laufen.", "loesung": "Fettoxidation hoch (Folie 10), Laktat niedrig, Gelenkbelastung gering, lange Durchhaltbarkeit (Folie 9).", "hilfe": "App: Folien 9/10 + quiz 'Fettoxidation Intensität'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Nenne die vier Kriterien, nach denen Ausdauer strukturiert wird, und ordne jedem Kriterium die zugehörigen Ausdauerformen zu.", "loesung": "- Umfang der beanspruchten Muskulatur: lokale (< 1/6) vs. allgemeine Ausdauer (> 1/6 der Muskelmasse)\n- Art der Energiebereitstellung: anaerobe (ohne O2) vs. aerobe Ausdauer (ausreichendes O2-Angebot)\n- Zeitdauer bei höchstmöglicher Intensität: Kurzzeit (45 s–2 min), Mittelzeit (2–8 min), Langzeit I–III (8–30 / 30–90 / > 90 min)\n- Bedeutung für die Sportart: Grundlagenausdauer (Basisvermögen) vs. spezielle (sportartspezifische) Ausdauer", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lesen die Kurven direkt aus den App-Diagrammen ab; stärkere diskutieren, wie HF (Karvonen) oder Borg (Std. 26) die Intensität im GA-I-Bereich objektiv steuern.", "app_uebung": "App: diagrams Folien 9/10, quiz-Fälle (GA I), cards 'Fettstoffwechsel Dauer/Intensität', exam (5 P)."}, "sicherung": {"titel": "Fett-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Erkläre in zwei Sätzen den Zusammenhang Dauer–Intensität–Fettstoffwechsel und bewerte die '30-min-Schallmauer'.", "aufgaben": [{"frage": "Zusammenhang?", "loesung": "Mit der Dauer steigt der Fettanteil (Folie 9); mit der Intensität gibt es ein Maximum bei niedrig/mittel, dann Abfall (Folie 10)."}, {"frage": "Schallmauer?", "loesung": "Mythos – Fett verbrennt ab Minute 1, der Anteil steigt nur mit der Dauer."}, {"frage": "Ein Läufer nimmt bei Ausbelastung maximal 3600 ml Sauerstoff pro Minute auf und wiegt 80 kg. Wie hoch ist seine körpergewichtsbezogene VO2max?  [App-Quiz: Ausdauer]", "loesung": " – Die VO2max wird meist auf das Körpergewicht bezogen: 3600 ml/min : 80 kg = 45 ml/min/kg – laut Folie der Wert einer Normalperson."}]}, "hausaufgabe": "Diagramme Folien 9/10 ins Heft; App-Quiz 'Fettoxidation Intensität' + '30-min-Schallmauer' + Fall '90 min HF 140' lösen; exam-Aufgabe (5 P) üben; Karteikarten 'Fettstoffwechsel' lernen.", "hinweise": ["Fehler: 'Fett verbrennt erst nach 30 min' – falsch (App-Quiz Schallmauer); Anteil steigt mit Dauer.", "Fettoxidationsmaximum bei niedriger/mittlerer Intensität – nicht bei maximaler (Folie 10).", "Therapiebezug: GA I = niedrige Intensität, lange Dauer – ideal für adipöse/Gelenkpatienten."], "quellen": ["Examenstrainer.html · DATA ausdauer: diagrams Folien 9/10, cards 'Fettstoffwechsel…', quiz (Schallmauer, GA-I-Fall), exam (5 P)"]}, "au-26": {"nr": 26, "id": "au-26", "thema": "ausdauer", "titel": "VO2max: Definition, Richtwerte, Bestimmung und Belastungssteuerung (Borg, Karvonen)", "dauer": 60, "ziele": ["Die Auszubildenden definieren VO2max und nennen Richtwerte (Tabelle Folie 14).", "Sie beschreiben die Bestimmung der VO2max (direkt/indirekt, Cooper-Test) und die Borg-Skala.", "Sie begründen, warum VO2max meist auf das Körpergewicht bezogen wird."], "vorwissen": "Stunden 22–25 (Ausdauer, Energiesysteme, Fettstoffwechsel).", "material": ["App, Beamer", "Tabelle 'Maximale Sauerstoffaufnahme' (Folie 14, Richtwerte)", "Reihenfolge 'Bestimmung der VO2max'", "Borg-Skala als Ausdruck"], "physio": "Die VO2max ist der wichtigste Kennwert der kardiorespiratorischen Leistungsfähigkeit – in der Reha das Maß für die Belastbarkeit (z. B. nach Herzinfarkt) und die Zielgröße des Ausdauertrainings. Da sie vom Körpergewicht abhängt (ml/min/kg), ist die relative VO2max für Patienten aussagekräftiger. PWC-Test und UKK-Walking-Test (nächste Stunde) erlauben eine sichere, submaximale Bestimmung.", "app": {"einsatz": ["Tabelle 'Maximale Sauerstoffaufnahme' (Folie 14) + Richtwerte nach Löllgen", "Reihenfolge: 'Bestimmung der VO2max'", "Quiz: 'Wie hoch ist die VO2max international erfolgreicher Ausdauersportler?', 'Warum meist auf Körpergewicht bezogen?', 'Schülerin läuft im Cooper-Test 2500 m in 12 min – Einordnung nach Zintl (1997)?', 'untrainierte 45-jährige Frau VO2max 28 ml/min/kg – Einordnung nach Löllgen?', 'Läufer: max. 3600 ml/min bei 80 kg → relative VO2max?'", "Karteikarten: 'VO2max', 'VO2max-Richtwerte', 'Bestimmung der VO2max', 'Borg-Skala'", "PWC-Test/UKK/Karvonen → Stunde 30"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "ml-min-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Belastung steuern ohne Labor"}, {"phase": "Präsentation", "min": 15, "inhalt": "VO2max messen und Belastung steuern"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Rechnen und einordnen · Einzelarbeit, Partner-Kontrolle"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "VO2max-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "ml-min-Raten", "art": "Schätzen", "min": 5, "anleitung": "Schätzt die VO2max eines untrainierten Erwachsenen (ml/min/kg) – dann Tabelle Folie 14 prüfen.", "aufgaben": [{"frage": "Untrainiert Mann?", "antwort": "ca. 35–45 ml/min/kg; Frau ca. 28–35 (Tabelle Folie 14/Löllgen)."}, {"frage": "International erfolgreiche Ausdauersportler?", "antwort": "75 ml/min/kg (national 60, Normalperson 45, Sportstudent 49,1) (App-Quiz)."}, {"frage": "Warum /kg?", "antwort": "Vergleichbarkeit – große/schwere Menschen haben absolut höhere VO2max (App-Quiz)."}]}, {"titel": "Cooper-Test-Rechnung", "art": "Kopfrechnen", "min": 5, "anleitung": "12 min laufen = 2500 m – welche VO2max ungefähr? (Formel: VO2max ≈ (Distanz in m − 504,9)/44,73).", "aufgaben": [{"frage": "2500 m in 12 min – Einordnung nach Zintl (1997)?", "antwort": "2400–2800 m = Leistungsgruppe 'gut' (O2-Verbrauch 42,1–52 ml/kg/min) (App-Quiz)."}, {"frage": "Einordnung?", "antwort": "'gut' (42,1–52 ml/kg/min) – Zintl 1997 (App-Quiz)."}, {"frage": "Vorteil Cooper?", "antwort": "Einfach, ohne Labor – aber nur bei Gesunden/maximaler Anstrengung."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Ein Läufer nimmt bei Ausbelastung maximal 3600 ml Sauerstoff pro Minute auf und wiegt 80 kg. Wie hoch ist seine körpergewichtsbezogene VO2max?", "antwort": " – Die VO2max wird meist auf das Körpergewicht bezogen: 3600 ml/min : 80 kg = 45 ml/min/kg – laut Folie der Wert einer Normalperson."}, {"frage": "Wie wird Ausdauer nach Weineck (1997) definiert?", "antwort": "Als psycho-physische Ermüdungswiderstandsfähigkeit des Sportlers – Weineck definiert Ausdauer als psycho-physische Ermüdungswiderstandsfähigkeit. Die reversible Herabsetzung der Funktionsfähigkeit ist dagegen die Definition von Ermüdung (Lehmann)."}, {"frage": "Ab welchem Anteil der beanspruchten Muskelmasse spricht man von allgemeiner Ausdauer?", "antwort": "Mehr als 1/6 der Muskelmasse – Lokale Ausdauer betrifft weniger als 1/6, allgemeine Ausdauer mehr als 1/6 der gesamten Muskelmasse."}]}], "einstieg": {"titel": "Belastung steuern ohne Labor", "min": 10, "situation": "Fall: 40-jähriger Patient (Ruhepuls 60) soll auf dem Fahrradergometer mit 60 % trainieren – welche Trainings-Herzfrequenz? (Karvonen)", "impulse": [{"frage": "Berechnung (Karvonen)?", "erwartung": "HF = Ruhepuls + 60 % × (max. HF − Ruhepuls); max. HF ≈ 220 − 40 = 180 → 60 + 0,6×120 = 132/min (App-Quiz)."}, {"frage": "Alternativ Borg?", "erwartung": "Subjektive Skala 6–20; Ziel z. B. 12–14 ('leicht' bis 'etwas hart')."}, {"frage": "Sicherheit?", "erwartung": "Ergometrie/PWC vorher (Std. 30); Symptome beachten."}, {"frage": "App-Bezug?", "erwartung": "App-Quiz: '40-jähriger, Ruhepuls 60, 60 % Intensität → Trainings-HF (Karvonen)'."}], "ueberleitung": "Um Ausdauer gezielt zu dosieren, brauchen wir die individuelle Leistungsfähigkeit – die VO2max – und eine Möglichkeit, die Belastung im Alltag zu steuern (HF, Borg)."}, "praesentation": {"titel": "VO2max messen und Belastung steuern", "min": 15, "merksatz": "VO2max = maximale Sauerstoffaufnahme (ml/min oder ml/min/kg) – Goldstandard der Ausdauerleistungsfähigkeit. Richtwerte (Folie 14, Löllgen): untrainiert ca. 30–45, trainiert 50–70, international 75 ml/min/kg (national 60, Normalperson 45, Sportstudent 49,1). Bestimmung: direkt (Spiroergometrie), indirekt (Cooper-Test, PWC – Std. 30). /kg-Bezug wegen Vergleichbarkeit. Steuerung: Herzfrequenz (Karvonen: HF = Ruhe + %×(max−Ruhe)), Borg-Skala (6–20, subjektiv).", "schritte": [{"ueberschrift": "Definition und Richtwerte", "text": "Tabelle Folie 14 projizieren; Einordnung untrainiert/trainiert/Spitze an der Tafel.", "vortrag": "Die VO2max beschreibt, wie viel Sauerstoff der Körper maximal aufnehmen und verwerten kann – sie ist der wichtigste Kennwert der Ausdauer. Angegeben wird sie meist relativ: Milliliter pro Minute und Kilogramm Körpergewicht. Deshalb ist die relative VO2max für Vergleiche aussagekräftiger – schwere Menschen haben absolut höhere Werte. Richtwerte: Normalperson ca. 45, Sportstudent 49,1, nationaler Ausdauersportler 60, internationaler 75 ml/min/kg (Tabelle Folie 14, App-Quiz)."}, {"ueberschrift": "Bestimmung der VO2max", "text": "App-sequence 'Bestimmung der VO2max' ordnen; Cooper-Test-Formel an der Tafel; PWC/UKK → Stunde 30.", "vortrag": "Direkt messen wir die VO2max in der Spiroergometrie – im klinischen Alltag nutzen wir indirekte Verfahren: den Cooper-Test (12 Minuten laufen, Distanz → VO2max nach Zintl) oder den PWC-Test (submaximal, sicher für Patienten, nächste Stunde). Beispiel: 2500 Meter in 12 Minuten entsprechen etwa 44 ml/min/kg – ein guter Wert."}, {"ueberschrift": "Belastungssteuerung im Training", "text": "Karvonen-Formel an die Tafel (Beispiel 40-Jähriger, Ruhe 60, 60 % → 132/min); Borg-Skala (6–20) als Ausdruck zeigen.", "vortrag": "Im Training steuern wir die Intensität über die Herzfrequenz – mit der Karvonen-Formel individuell: Trainings-HF = Ruhepuls plus Prozent × (maximale HF minus Ruhepuls). Beispiel: 40-Jähriger, Ruhepuls 60, 60 Prozent → 60 + 0,6 × 120 = 132 Schläge pro Minute. Alternativ oder ergänzend nutzen wir die Borg-Skala (6–20) – der Patient schätzt seine Anstrengung selbst ein, z. B. 12–14 für GA I."}]}, "arbeitsphase": {"titel": "Rechnen und einordnen", "min": 25, "sozialform": "Einzelarbeit, Partner-Kontrolle", "aufgaben": [{"titel": "Läufer: max. 3600 ml/min bei 80 kg – relative VO2max?", "text": "Läufer: max. 3600 ml/min bei 80 kg – relative VO2max?", "loesung": "3600/80 = 45 ml/min/kg (App-Quiz).", "hilfe": "App: quiz ausdauer Rechenfall."}, {"titel": "Untrainierte 45-jährige Frau, VO2max 28 ml/min/kg – Einordnung nach Löllgen?", "text": "Untrainierte 45-jährige Frau, VO2max 28 ml/min/kg – Einordnung nach Löllgen?", "loesung": "unterdurchschnittlich/niedrig für Frauen (Tabelle Folie 14) → Gesundheits-Minimalprogramm (App-Quiz).", "hilfe": "App: table Folie 14 + quiz 'VO2max 28 Löllgen'."}, {"titel": "Karvonen: 40-jähriger Patient, Ruhepuls 60, 60 % Intensität – Trainings-HF?", "text": "Karvonen: 40-jähriger Patient, Ruhepuls 60, 60 % Intensität – Trainings-HF?", "loesung": "ca. 132/min (App-Quiz).", "hilfe": "App: quiz 'Karvonen 60 %'."}, {"titel": "Schülerin: Cooper-Test 2500 m in 12 min – Einordnung nach Zintl (1997)?", "text": "Schülerin: Cooper-Test 2500 m in 12 min – Einordnung nach Zintl (1997)?", "loesung": "ca. 44,6 ml/min/kg – gut (App-Quiz).", "hilfe": "App: quiz 'Cooper 2500 m Zintl'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Beschreibe die vier Wege der ATP-Resynthese und vergleiche sie hinsichtlich Kapazität und Flussrate.", "loesung": "- Anaerob-alaktazid (Lohmann-Reaktion): KP + ADP → Kreatin + ATP; Kapazität sehr klein, Flussrate sehr groß\n- Anaerob-laktazid (anaerobe Glykolyse): Glukose → Laktat + ATP; Kapazität klein, Flussrate hoch\n- Aerobe Glykolyse: Glukose + O2 → CO2 + H2O + ATP; Kapazität mittel, Flussrate mittel\n- Lipolyse/Fettoxidation: freie Fettsäuren + O2 → CO2 + H2O + ATP; Kapazität groß, Flussrate klein\n- Grundsatz: je größer die Kapazität, desto kleiner die Flussrate", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere rechnen mit Formel-Vorgabe; stärkere diskutieren, warum in der Reha submaximale Tests (PWC) sicherer sind als Maximalbelastungen und wie Borg die HF-Messung ergänzt (z. B. bei Betablockern!).", "app_uebung": "App: table Folie 14, sequence 'Bestimmung der VO2max', quiz (Cooper, Löllgen, Karvonen, 3600 ml/80 kg), cards 'VO2max'/'Borg-Skala'/'Karvonen'."}, "sicherung": {"titel": "VO2max-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Definiere VO2max, nenne einen Richtwert für Untrainierte und berechne die relative VO2max bei 3600 ml/min und 80 kg.", "aufgaben": [{"frage": "Definition?", "loesung": "Maximale Sauerstoffaufnahme/-verwertung (ml/min/kg) – Kennwert der Ausdauerleistungsfähigkeit."}, {"frage": "Richtwert untrainiert?", "loesung": "ca. 30–45 ml/min/kg (Tabelle Folie 14)."}, {"frage": "Rechnung?", "loesung": "3600/80 = 45 ml/min/kg."}, {"frage": "Welche Belastungsdauer (bei höchstmöglicher Intensität) kennzeichnet die Mittelzeitausdauer?  [App-Quiz: Ausdauer]", "loesung": "2 bis 8 Minuten – Kurzzeitausdauer: 45 s–2 min, Mittelzeitausdauer: 2–8 min, Langzeitausdauer I: 8–30 min, LZA II: 30–90 min, LZA III: über 90 min."}]}, "hausaufgabe": "Tabelle Folie 14 (Richtwerte) als Spickzettel; App-sequence 'Bestimmung der VO2max' ordnen; Rechenfälle (Cooper 2500 m, Karvonen 60 %, 3600 ml/80 kg) lösen; Karteikarten 'VO2max'/'Borg'/'Karvonen' lernen.", "hinweise": ["Fehler: absolute vs. relative VO2max verwechselt – /kg ist Standard (App-Quiz 'Warum auf Körpergewicht bezogen?').", "Bei Betablocker-Therapie ist die HF-Steuerung unzuverlässig → Borg-Skala bevorzugen (klinischer Praxisbezug).", "Autoren prüfungsrelevant: Löllgen (Richtwerte), Zintl 1997 (Cooper), Karvonen (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA ausdauer: table Folie 14, sequence 'Bestimmung VO2max', quiz (Cooper/Zintl/Löllgen/Karvonen), cards 'VO2max'/'Borg-Skala'/'Karvonen-Formel'", "Löllgen; Zintl 1997; Karvonen (App-Quellen)"]}, "au-27": {"nr": 27, "id": "au-27", "thema": "ausdauer", "titel": "Laktat und Schwellen: aerobe Schwelle, Übergangsbereich, anaerobe Schwelle", "dauer": 60, "ziele": ["Die Auszubildenden erläutern aerobe Schwelle, aerob-anaeroben Übergangsbereich und anaerobe Schwelle anhand der Laktatleistungskurve (prüfungsrelevant, 6 P).", "Sie nennen ungefähre Laktatwerte der aeroben Schwelle.", "Sie lesen die Laktatleistungskurve (Folien 19–21) und das Energiegewinnungsmodell A/B/C (Folie 26)."], "vorwissen": "Stunden 22–26 (Ausdauer, Energiesysteme, VO2max).", "material": ["App, Beamer", "Diagramme: 'Laktatkonzentration in Abhängigkeit von der VO2max (Weineck 2004)' (Folie 19), 'Laktatleistungskurve mit aerober und anaerober Schwelle' (Folie 20) + Hotspot/Labels (Folien 20–21)", "'Energiegewinnung in drei Belastungsbereichen (A/B/C)' (Folie 26)"], "physio": "Die Laktatschwellen steuern die Intensität in der kardiologischen Reha präzise: Training unterhalb der aeroben Schwelle (~2 mmol/l) ist sicher und baut GA auf, der Übergangsbereich trainiert die Laktattoleranz, oberhalb der anaeroben Schwelle (~4 mmol/l) akkumuliert Laktat schnell – dort nur kurze Reize. Die Laktatleistungskurve ist die Grundlage der HF-Zonen-Steuerung.", "app": {"einsatz": ["Diagramme + Hotspot/Labels: 'Laktatleistungskurve' (Folien 20–21), 'Laktat in Abhängigkeit von VO2max (Weineck 2004)' (Folie 19), 'Energiegewinnung A/B/C' (Folie 26)", "Quiz: 'Bei welchem Laktatwert liegt ungefähr die aerobe Schwelle?' (~2 mmol/l), 'Was kennzeichnet den aerob-anaeroben Übergangsbereich?', 'Was zeigt die Abbildung Laktat vs. VO2max (Weineck)?'", "Karteikarten: 'Aerobe Schwelle', 'Anaerobe Schwelle (ANS)', 'Laktatleistungskurve'", "Prüfungsaufgabe: Schwellen anhand der Laktatleistungskurve erläutern (6 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Schwellen-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum kippt der Patient bei höherem Tempo?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Die Laktatleistungskurve lesen"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Schwellen zuordnen · Partnerarbeit mit App-Diagrammen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Schwellen-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Schwellen-Raten", "art": "Schätzen", "min": 5, "anleitung": "Bei welchem Laktatwert liegt die aerobe Schwelle ungefähr? (1? 2? 4? 8 mmol/l) – dann App-Quiz.", "aufgaben": [{"frage": "Aerobe Schwelle?", "antwort": "ca. 2 mmol/l (App-Quiz)."}, {"frage": "Anaerobe Schwelle (ANS)?", "antwort": "ca. 4 mmol/l (App-Karteikarte)."}, {"frage": "Darüber?", "antwort": "Laktat akkumuliert schnell → Ermüdung (Übergangsbereich dazwischen)."}]}, {"titel": "Kurven-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Schwellen und Laktatverhalten.", "aufgaben": [{"frage": "Was zeigt Folie 19 (Laktat vs. VO2max, Weineck 2004)?", "antwort": "Laktat steigt mit der Intensität exponentiell an – bei Trainierten erst später (Rechtsverschiebung)."}, {"frage": "Übergangsbereich?", "antwort": "Zwischen aerober und anaerober Schwelle – Laktat steigt, wird aber noch abgebaut (Steady State möglich)."}, {"frage": "Energiegewinnung A/B/C (Folie 26)?", "antwort": "Bereich A: aerob; B: Übergangsbereich; C: anaerob-laktazid dominant."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Welche Belastungsdauer (bei höchstmöglicher Intensität) kennzeichnet die Mittelzeitausdauer?", "antwort": "2 bis 8 Minuten – Kurzzeitausdauer: 45 s–2 min, Mittelzeitausdauer: 2–8 min, Langzeitausdauer I: 8–30 min, LZA II: 30–90 min, LZA III: über 90 min."}, {"frage": "Über welches System wird ATP aus Kreatinphosphat resynthetisiert?", "antwort": "Lohmann-Reaktion – Kreatinphosphat + ADP ergibt Kreatin + ATP – das ist die Lohmann-Reaktion (anaerob-alaktazid)."}, {"frage": "Wie groß ist der Energiespeicher Fett eines 75 kg schweren Mannes?", "antwort": "Ca. 50.000 kcal – ATP+KP liefern nur ca. 5 kcal, Glykogen ca. 1.200 kcal, Fett dagegen ca. 50.000 kcal (210.000 kJ)."}]}], "einstieg": {"titel": "Warum kippt der Patient bei höherem Tempo?", "min": 10, "situation": "Fall: Patient geht im Flachen gemütlich (keine Atemnot) – beim leichten Anstieg wird er sofort schweratmig und müde. Was passiert stoffwechselmäßig?", "impulse": [{"frage": "Was passiert?", "erwartung": "Oberhalb der aeroben Schwelle steigt Laktat an (Übergangsbereich → anaerob)."}, {"frage": "Warum so schnell?", "erwartung": "Niedrige VO2max/anaerobe Schwelle – frühes Kippen (Folie 19: untrainiert früher Anstieg)."}, {"frage": "Therapiekonsequenz?", "erwartung": "GA I unterhalb der aeroben Schwelle trainieren; Schwelle verschiebt sich nach rechts (Trainingseffekt)."}, {"frage": "App-Bezug?", "erwartung": "App: diagrams Folien 19/20, quiz 'aerobe Schwelle Laktatwert'."}], "ueberleitung": "Laktat ist der Schlüsselwert zur Intensitätssteuerung – heute lernen wir die Schwellen anhand der Laktatleistungskurve zu lesen und für die Therapie zu nutzen."}, "praesentation": {"titel": "Die Laktatleistungskurve lesen", "min": 15, "merksatz": "Laktatleistungskurve (Folien 20–21): Laktat steigt mit der Belastung exponentiell. Aerobe Schwelle (~2 mmol/l): darunter steady state, Fett/Glukose aerob. Aerob-anaerober Übergangsbereich: Laktat steigt, wird aber noch steady abgebaut. Anaerobe Schwelle (~4 mmol/l): darüber Akkumulation, schnelle Ermüdung. Trainierte: Kurve nach rechts verschoben (Weineck 2004, Folie 19). Energiebereiche A/B/C (Folie 26) ordnen die Bereiche praktisch zu.", "schritte": [{"ueberschrift": "Die Laktatleistungskurve", "text": "Diagramm Folie 20 projizieren; aerobe Schwelle (~2 mmol/l) und anaerobe Schwelle (~4 mmol/l) markieren; Hotspot/Labels Folien 20–21 in der App.", "vortrag": "Die Laktatleistungskurve zeigt: Mit steigender Belastung bleibt das Laktat zunächst niedrig (aerobe Schwelle bei etwa 2 mmol), dann steigt es im Übergangsbereich an, bis zur anaeroben Schwelle bei etwa 4 mmol – darüber akkumuliert es rasant und die Ermüdung setzt schnell ein. Trainierte haben die Kurve nach rechts verschoben (Folie 19): Sie leisten bei gleichem Laktat mehr."}, {"ueberschrift": "Die drei Energiebereiche A/B/C", "text": "Diagramm Folie 26 zeigen; A = aerob (GA), B = Übergangsbereich, C = anaerob-laktazid.", "vortrag": "Praktisch teilen wir die Belastung in drei Bereiche ein: A unterhalb der aeroben Schwelle (rein aerob, Fettverbrennung), B im Übergangsbereich (Laktat steady), C oberhalb der anaeroben Schwelle (schnelle Ermüdung). In der Therapie arbeiten wir meist in A, dosiert auch in B – C nur bei kardiovaskulär Gesunden mit entsprechender Indikation."}, {"ueberschrift": "Anwendung: HF-Zonen und Training", "text": "Beispiele: GA I unterhalb aerober Schwelle; extensive Intervallmethode nahe ANS; intensive Intervall oberhalb ANS mit langen Pausen.", "vortrag": "Aus der Laktatleistungskurve leiten wir die Trainingsbereiche ab: Dauermethode GA I unterhalb der aeroben Schwelle, extensive Intervall im Übergangsbereich, intensive Methoden oberhalb der anaeroben Schwelle mit langen Pausen (lohnende Pause). Für Patienten bedeutet das: Wir steuern über HF-Zonen oder Borg und bleiben meist im sicheren Bereich A."}]}, "arbeitsphase": {"titel": "Schwellen zuordnen", "min": 25, "sozialform": "Partnerarbeit mit App-Diagrammen", "aufgaben": [{"titel": "Ordne zu: 1,5 mmol/l Dauerlast, 3 mmol/l steady, 6 mmol/l kurze Reize mit langen Pausen.", "text": "Ordne zu: 1,5 mmol/l Dauerlast, 3 mmol/l steady, 6 mmol/l kurze Reize mit langen Pausen.", "loesung": "1,5 → unterhalb aerober Schwelle (Bereich A); 3 → Übergangsbereich (B); 6 → oberhalb ANS (C, Akkumulation) (Folien 20/26).", "hilfe": "App: diagrams Folien 20/26, quiz 'aerobe Schwelle Laktatwert'."}, {"titel": "Lies Folie 19 (Weineck 2004): Was zeigt der Vergleich trainiert vs. untrainiert?", "text": "Lies Folie 19 (Weineck 2004): Was zeigt der Vergleich trainiert vs. untrainiert?", "loesung": "Rechtsverschiebung der Kurve bei Trainierten – gleiches Laktat bei höherer Leistung (App-Quiz 'Abbildung Laktat vs. VO2max').", "hilfe": "App: diagram Folie 19."}, {"titel": "Fall: Patient im GA-I-Training – welches Laktatziel (ca.)? Begründung für die Sicherheit?", "text": "Fall: Patient im GA-I-Training – welches Laktatziel (ca.)? Begründung für die Sicherheit?", "loesung": "unterhalb ~2 mmol/l (aerobe Schwelle) – steady state, keine Akkumulation, kardiovaskulär sicher (App-exam 6 P).", "hilfe": "App: exam ausdauer 'Schwellen an der Laktatleistungskurve' (6 P)."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Erläutere den Zusammenhang zwischen Fettstoffwechsel, Belastungsdauer und Belastungsintensität.", "loesung": "- Es gibt keine „30-min-Schallmauer“: Fett ist von Beginn an beteiligt (nach 30 min ca. 25 % der ATP-Resynthese)\n- Mit zunehmender Dauer steigt der Fettanteil (60 min 36 %, 90 min 45 %, 120 min 62 %), Muskelglykogen sinkt (50 % → 8 %)\n- Maximale Fettverbrennung ab ca. 90–120 min\n- Intensität: Fettumsatz steigt zunächst an (aktive Muskulatur > 1/6)\n- Ab über 65 % VO2max nimmt der Fettanteil wieder ab", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere markieren die Schwellen mit den App-Labels (Folien 20–21); stärkere diskutieren, warum die anaerobe Schwelle individuell verschieden ist (VO2max, Training) und wie ein Laktat-Stufentest sie bestimmt (Spiroergometrie).", "app_uebung": "App: diagrams Folien 19/20/26 + hotspot/labels Folien 20–21, quiz, cards 'Aerobe Schwelle'/'ANS', exam (6 P)."}, "sicherung": {"titel": "Schwellen-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die ungefähren Laktatwerte von aerober und anaerober Schwelle und erkläre den Übergangsbereich in einem Satz.", "aufgaben": [{"frage": "Werte?", "loesung": "Aerobe Schwelle ~2 mmol/l; anaerobe Schwelle ~4 mmol/l."}, {"frage": "Übergangsbereich?", "loesung": "Dazwischen: Laktat steigt, wird aber noch steady abgebaut (Bereich B, Folie 26)."}, {"frage": "Welche VO2max wird für international erfolgreiche Ausdauersportler angegeben?  [App-Quiz: Ausdauer]", "loesung": "75 ml/min/kg – Normalperson 45, Sportstudent 49,1, nationaler Ausdauersportler 60 und internationaler Ausdauersportler 75 ml/min/kg."}]}, "hausaufgabe": "Diagramme Folien 19/20/26 ins Heft; App-Hotspots 'Laktatleistungskurve' (Folien 20–21) durcharbeiten; exam-Aufgabe 'Schwellen an der Laktatleistungskurve' (6 P) üben; Karteikarten 'Aerobe Schwelle'/'ANS' lernen.", "hinweise": ["Fehler: aerobe und anaerobe Schwelle werden vertauscht (2 vs. 4 mmol/l) – App-Quiz checken.", "'Rechtsverschiebung' bei Trainierten (Folie 19, Weineck 2004) ist prüfungsrelevant.", "Therapiebezug: GA I bleibt unterhalb der aeroben Schwelle – kardiovaskulär sicher."], "quellen": ["Examenstrainer.html · DATA ausdauer: diagrams Folien 19/20/26 + hotspots/labels, quiz, cards, exam (6 P)", "Weineck 2004 (App-Quelle Folien 19–20)"]}, "au-28": {"nr": 28, "id": "au-28", "thema": "ausdauer", "titel": "Sauerstoffdefizit und Sauerstoffschuld im Belastungsverlauf", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben die Entstehung von Sauerstoffdefizit und Sauerstoffschuld (prüfungsrelevant, 4 P).", "Sie lesen das Diagramm Sauerstoffdefizit/Sauerstoffschuld (Folien 23–25).", "Sie erklären, warum zu Beginn jeder Belastung ein Sauerstoffdefizit entsteht."], "vorwissen": "Stunden 22–27 (Ausdauer, Energiesysteme, Schwellen).", "material": ["App, Beamer", "Diagramm + Labels/Hotspot 'Sauerstoffdefizit und Sauerstoffschuld' (Folien 23–25)", "Pulsoximeter-Demo (optional)"], "physio": "Sauerstoffdefizit und -schuld erklären, warum Patienten nach Belastungsende noch lange schwer atmen (EPOC): Der Körper zahlt den 'Vorschuss' zurück (Laktatabbau, Glykogenauffüllung, Temperatur). In der Atemtherapie und Kardioreha ist das Verständnis zentral für die Belastungsdosierung und die Erholungsphase (Cool-down).", "app": {"einsatz": ["Diagramme + Labels/Hotspot: 'Sauerstoffdefizit und Sauerstoffschuld' (Folien 23–25) – x-Achse: Ruhe, Arbeitsphase, Erholungsphase", "Quiz: 'Was bezeichnet man als Sauerstoffschuld?', 'Warum entsteht zu Beginn jeder Belastung ein Sauerstoffdefizit?'", "Karteikarten: 'Sauerstoffdefizit', 'Sauerstoffschuld'", "Prüfungsaufgabe: Entstehung von Defizit und Schuld im Verlauf einer konstanten Belastung (4 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Atem-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum atmet der Patient noch lange nach?"}, {"phase": "Präsentation", "min": 15, "inhalt": "O2-Aufnahme im Verlauf einer Belastung"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Kurve lesen und anwenden · Einzelarbeit mit App-Diagramm und Labels"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Defizit-Schuld-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Atem-Raten", "art": "Schätzen", "min": 5, "anleitung": "Wie lange bleibt die Atmung nach einer Belastung erhöht? Schätzen (1 min? 10 min? eine Stunde?), dann App-Diagramm Folie 25.", "aufgaben": [{"frage": "Wie lange erhöht?", "antwort": "Minuten bis Stunden – abhängig von Intensität (EPOC, Folie 25)."}, {"frage": "Was ist Sauerstoffdefizit?", "antwort": "Zu Beginn der Belastung: O2-Aufnahme steigt langsamer als der Bedarf (App-Quiz)."}, {"frage": "Was ist Sauerstoffschuld?", "antwort": "Nach Belastung: erhöhte O2-Aufnahme über Ruhebedarf (Rückzahlung, Folie 25)."}]}, {"titel": "Kurven-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Defizit und Schuld; Fragen zur Kurve (Folie 25) beantworten.", "aufgaben": [{"frage": "Achsen der Kurve Folie 25?", "antwort": "x: Zeit (Ruhe, Arbeitsphase, Erholungsphase); y: O2-Aufnahme l/min (0–0,75)."}, {"frage": "Ruhe-O2-Verbrauch ca.?", "antwort": "ca. 0,25–0,28 l/min (App-Diagrammbeschreibung)."}, {"frage": "Wo ist das Defizit?", "antwort": "Beginn der Arbeitsphase: Fläche zwischen Bedarf und Aufnahme (Folie 25)."}, {"frage": "Wo die Schuld?", "antwort": "Erholungsphase: Fläche über dem Ruhebedarf (Folie 25)."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Welche VO2max wird für international erfolgreiche Ausdauersportler angegeben?", "antwort": "75 ml/min/kg – Normalperson 45, Sportstudent 49,1, nationaler Ausdauersportler 60 und internationaler Ausdauersportler 75 ml/min/kg."}, {"frage": "Bei welchem Laktatwert liegt ungefähr die aerobe Schwelle?", "antwort": "Ca. 2 mmol/l – Die aerobe Schwelle liegt bei ca. 2 mmol/l, die anaerobe Schwelle bei ca. 4 mmol/l."}, {"frage": "Was bezeichnet man als Sauerstoffschuld?", "antwort": "Die nach Belastungsende über den Ruhebedarf hinaus aufgenommene O2-Menge – Die Sauerstoffschuld ist die O2-Menge, die nach der Belastung mehr als dem Ruhebedarf entsprechend aufgenommen wird. Das Defizit entsteht dagegen am Belastungsbeginn."}]}], "einstieg": {"titel": "Warum atmet der Patient noch lange nach?", "min": 10, "situation": "Fall: Nach 10 Minuten Ergometer (moderat) atmet der Patient noch 10 Minuten schwer. Was 'bezahlt' der Körper da zurück?", "impulse": [{"frage": "Sauerstoffschuld/EPOC?", "erwartung": "Ja – erhöhte O2-Aufnahme über Ruhebedarf (Folie 25, Erholungsphase)."}, {"frage": "Wofür?", "erwartung": "Laktatabbau, KP-/Glykogen-Resynthese, Temperaturabbau, Hormone."}, {"frage": "Therapiekonsequenz?", "erwartung": "Cool-down einplanen, Erholung = Teil der Einheit (TL Std. 7)."}, {"frage": "App-Bezug?", "erwartung": "App: labels/hotspots Folien 23–25 'Sauerstoffdefizit und Sauerstoffschuld'."}], "ueberleitung": "Zu Beginn jeder Belastung entsteht ein Sauerstoffdefizit, am Ende zahlt der Körper die Sauerstoffschuld zurück – das Diagramm dazu ist prüfungsrelevant. Heute lesen wir es genau."}, "praesentation": {"titel": "O2-Aufnahme im Verlauf einer Belastung", "min": 15, "merksatz": "Kurve (Folien 23–25): Ruhe (~0,25 l/min) → Belastungsbeginn: Bedarf steigt sprunghaft, Aufnahme nur langsam → Sauerstoffdefizit (anaerob gedeckt) → Steady State in der Arbeitsphase → nach Ende: Aufnahme bleibt über Ruhebedarf, fällt allmählich ab → Sauerstoffschuld (EPOC: Laktatabbau, Energiespeicher-Auffüllung, Temperatur).", "schritte": [{"ueberschrift": "Der Verlauf im Diagramm", "text": "Diagramm Folie 25 an die Tafel: Achsen (Zeit mit Ruhe/Arbeitsphase/Erholungsphase; O2 l/min 0–0,75); Ruhewert ~0,25; sprunghafter Bedarf vs. langsame Aufnahme → Defizit-Fläche; Steady State ~0,78; Abfall in der Erholung → Schuld-Fläche.", "vortrag": "Zu Beginn der Belastung steigt der Sauerstoffbedarf sprunghaft, die Aufnahme aber nur langsam – die Lücke dazwischen ist das Sauerstoffdefizit, anaerob gedeckt. In der Arbeitsphase stellt sich ein Steady State ein. Nach Belastungsende bleibt die Aufnahme über dem Ruhebedarf und fällt allmählich ab – diese Mehrfläche ist die Sauerstoffschuld (EPOC)."}, {"ueberschrift": "Warum entsteht das Defizit?", "text": "App-Quiz klären: Herz-Kreislauf und Atmung brauchen Zeit, um hochzufahren (App-Quiz 'Warum entsteht zu Beginn jeder Belastung ein Sauerstoffdefizit?').", "vortrag": "Herz-Kreislauf-System und Atmung brauchen einige Zeit, um die Sauerstoffzufuhr hochzufahren – in dieser Anlaufphase deckt der Körper den Mehrbedarf anaerob (Kreatinphosphat, Glykolyse). Deshalb entsteht zu Beginn jeder Belastung ein Defizit – auch beim Gesunden, beim Patienten ausgeprägter."}, {"ueberschrift": "Was leistet die Sauerstoffschuld?", "text": "Aufzählung an die Tafel: Laktatabbau, KP/Glykogen-Resynthese, Temperatur, Hormone; Konsequenz: Cool-down (TL Std. 7).", "vortrag": "Die erhöhte Nachatmung nach Belastung ist keine 'Schwäche', sondern die Rückzahlung: Laktat wird abgebaut, Kreatinphosphat und Glykogen resynthetisiert, die Körpertemperatur sinkt. In der Therapie planen wir deshalb ein Cool-down ein – es beschleunigt die Erholung und gehört zur Einheit."}]}, "arbeitsphase": {"titel": "Kurve lesen und anwenden", "min": 25, "sozialform": "Einzelarbeit mit App-Diagramm und Labels", "aufgaben": [{"titel": "Lies Folie 25: Markiere Ruhewert, Defizit-Fläche, Steady State, Schuld-Fläche (App-Labels).", "text": "Lies Folie 25: Markiere Ruhewert, Defizit-Fläche, Steady State, Schuld-Fläche (App-Labels).", "loesung": "Ruhe ~0,25 l/min; Defizit = Fläche Bedarf−Aufnahme zu Beginn; Steady State ~0,78 l/min; Schuld = Fläche über Ruhe in der Erholung (App-labels/hotspots Folien 23–25).", "hilfe": "App: labels 'Sauerstoffdefizit und Sauerstoffschuld' Folie 25 + hotspots."}, {"titel": "Fall: Patient nach Belastung 15 min schwere Nachatmung – normal? Maßnahme?", "text": "Fall: Patient nach Belastung 15 min schwere Nachatmung – normal? Maßnahme?", "loesung": "Ja, EPOC/Sauerstoffschuld; Maßnahme: Cool-down, Ausatmen, Erholung beobachten; bei Atemnot/Dauer → Arzt (App-Quiz + TL Std. 7).", "hilfe": "App: diagram Folie 25, quiz 'Sauerstoffschuld'."}, {"titel": "Prüfungsaufgabe (4 P): Beschreibe Entstehung von Defizit und Schuld im Verlauf einer konstanten Belastung.", "text": "Prüfungsaufgabe (4 P): Beschreibe Entstehung von Defizit und Schuld im Verlauf einer konstanten Belastung.", "loesung": "Musterlösung in der App (exam): Defizit zu Beginn (Aufnahme < Bedarf), Schuld nach Ende (Aufnahme > Ruhe, allmählicher Abfall) (App-exam).", "hilfe"
