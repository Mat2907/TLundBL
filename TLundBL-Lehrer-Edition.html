<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TL &amp; BL – Lehrer-Edition · 50 Unterrichtsstunden Physiotherapie</title>
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#152030; --muted:#5A6878; --line:#D6DCE4;
  --accent:#2A5BD7; --accent-soft:#E3EAFB; --ok:#1C8A4C; --ok-soft:#DDF2E5; --mark:#E5A800;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root{--bg:#0D131B;--surface:#161F2A;--surface-2:#1D2835;--ink:#E6ECF2;--muted:#97A6B5;--line:#283646;--accent:#6E95FF;--accent-soft:#1C2B47;--ok:#45C27E;--ok-soft:#163324;--mark:#F3C33A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.55}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 0}
header.top .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:0}
h1{font-size:1.25rem;margin:0}
.sub{color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tf{margin:0 0 10px}
.tf-kopf{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px}
.tf-kopf:hover{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tf-info{font-size:.75rem;color:var(--muted);padding:0 8px 4px 26px}
ol.stunden{list-style:none;margin:0;padding:0}
ol.stunden li button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;align-items:baseline}
ol.stunden li button:hover{background:var(--surface-2)}
ol.stunden li.an button{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.nr{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;width:2.2em}
.mini{font-size:.72rem;color:var(--muted);margin-left:auto;flex:none}
input.suche{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:10px;background:var(--bg)}
main.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
h2{font-size:1.5rem;margin:0 0 4px}
h3{font-size:1.1rem;margin:26px 0 8px;border-bottom:2px solid var(--line);padding-bottom:5px}
h4{margin:14px 0 6px}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;border-radius:6px;padding:2px 8px}
.chip{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;margin:2px 4px 2px 0}
.muted{color:var(--muted)}
.kasten{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;background:var(--surface-2);margin:8px 0}
.kasten.physio{border-left-color:var(--ok);background:var(--ok-soft)}
.kasten.merksatz{border-left-color:var(--mark)}
.kasten.warn{border-left-color:#C3372C}
.ablauf{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:10px 0 4px;font-size:.72rem;font-weight:600;color:#fff}
.ablauf div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;min-width:0}
.ablauf-sum{font-size:.8rem;color:var(--muted);margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--surface-2)}
.wu-optionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.wu{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.wu.an{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.wu .art{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.los{font-size:.85rem;color:var(--muted);max-height:0;overflow:hidden;transition:max-height .2s}
.los.auf{max-height:400px}
.los-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.78rem;color:var(--muted)}
.los-btn:hover{border-color:var(--accent);color:var(--accent)}
.impuls{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:8px 0}
.impuls .erw{color:var(--muted);font-size:.88rem}
.schritt{margin:10px 0}
.schritt h4{margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:800px){.grid2{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.uebersicht{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.ue-karte{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.ue-karte b{font-size:1.3rem}
@media print{
  aside,header.top,.toolbar,.los-btn{display:none!important}
  body{background:#fff}.layout{grid-template-columns:1fr}
  main.card{border:none}
  .los{max-height:none!important}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div>
    <h1 id="h-titel">TL &amp; BL – Lehrer-Edition</h1>
    <div class="sub" id="h-sub"></div>
  </div>
  <div class="toolbar">
    <button class="btn" id="b-uebersicht">Übersicht</button>
    <button class="btn" id="b-drucken" onclick="window.print()">Drucken</button>
  </div>
</div></header>
<div class="wrap">
  <div class="layout">
    <aside>
      <input class="suche" id="suche" placeholder="Stunde suchen …">
      <div id="sidebar"></div>
    </aside>
    <main class="card" id="main"></main>
  </div>
</div>
<script>

t, Haltung, Entwicklung)", "farbe": "#B07800", "info": "10 Stunden · 123 Inhaltsbausteine in der App (Quiz 40, Diagramme 10 u. a.)", "stunden": ["b2-41", "b2-42", "b2-43", "b2-44", "b2-45", "b2-46", "b2-47", "b2-48", "b2-49", "b2-50"]}], "stunden": {"tl-01": {"nr": 1, "id": "tl-01", "thema": "trainingslehre", "titel": "Vom Sport zur medizinischen Trainingstherapie (MTT) – Zielebenen und Prävention", "dauer": 60, "ziele": ["Die Auszubildenden definieren MTT und grenzen sie vom Leistungssport ab.", "Sie ordnen die drei Präventionsformen (primär, sekundär, tertiär) Patientenbeispielen zu.", "Sie erklären das aktivitäts- und teilhabeorientierte Therapieziel der Sporttherapie (DVGS)."], "vorwissen": "Grundlagen der Physiotherapie, Unterschied Trainer – Therapeut im Groben.", "material": ["App (Examenstrainer.html), Beamer", "Flipchart: drei Säulen Prävention", "Fallkarten (siehe Einstieg)"], "physio": "In der Physio-Praxis trainiert die Therapeutin nicht den 'Athleten', sondern den Patienten mit klarem Therapieziel – die MTT ist das zentrale Bindeglied zwischen medizinischer Behandlung und belastbarem Alltags-/Berufsleben (Teilhabe nach ICF).", "app": {"einsatz": ["Quiz trainingslehre (30 Fragen): MTT-Definition, Prävention, Therapieziel", "Karteikarten 1–8: MTT, Sporttherapie, Bewegungstherapie, Präventionsformen", "Zuordnen: 'Wo findet Sporttherapie statt?'", "Prüfungsaufgaben (exam): MTT definieren/abgrenzen (4 P), drei Präventionsformen (3 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Begriffs-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der Trainer oder die Therapeutin?"}, {"phase": "Präsentation", "min": 15, "inhalt": "MTT, Sporttherapie und die drei Zielebenen"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Fallarbeit: Wer macht was – und warum? · Partnerarbeit"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Exit-Ticket: MTT in drei Sätzen · Einzelarbeit, schriftlich"}], "warmups": [{"titel": "Begriffs-Blitz", "art": "Quiz", "min": 5, "anleitung": "Kurzfragen aus dem App-Quiz werden mündlich im Plenum gestellt; wer zuerst die richtige Antwort ruft, erklärt sie in einem Satz.", "aufgaben": [{"frage": "Wie grenzt sich MTT vom Leistungssport ab?", "antwort": "MTT zielt auf Organ-/Stoffwechselfunktionen und Lebensqualität, Sport primär auf sportliche Leistung (App-Quiz)."}, {"frage": "Nenne die drei Präventionsformen.", "antwort": "Primär-, Sekundär-, Tertiärprävention."}, {"frage": "An wen richtet sich die Tertiärprävention?", "antwort": "An Personen mit bestehender Erkrankung – Vermeidung von Folgeschäden, Wiederherstellung."}, {"frage": "Was bedeutet teilhabeorientiertes Therapieziel?", "antwort": "Der Patient soll wieder am gesellschaftlichen/beruflichen Leben teilnehmen können."}, {"frage": "Wo findet Sporttherapie statt?", "antwort": "z. B. Reha-Klinik, Physio-Praxis, Sportverein mit Reha-Angebot, Krankenhaus."}]}, {"titel": "Bewegungs-Detektiv", "art": "Bewegung", "min": 5, "anleitung": "Die Auszubildenden bewegen sich 2 Minuten frei im Raum; danach: Welche dieser Bewegungen wären im Leistungssport 'Training', welche in der Therapie 'Übung'? Kurze Sammlung an der Tafel.", "aufgaben": [{"frage": "Nenne ein Kriterium für 'Training' im sportlichen Sinn.", "antwort": "Geplante, dosierte Belastung mit Leistungsziel."}, {"frage": "Nenne ein Kriterium für 'Übung' in der Therapie.", "antwort": "Gezielte Wiederherstellung einer Funktion mit Therapieziel."}, {"frage": "Kann beides dasselbe sein?", "antwort": "Ja – MTT verbindet beides: dosiertes Training mit Therapieziel."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Nach wem ist das Theoriemodell der Superkompensation benannt?", "antwort": "Jakowlew (1977) – Gemeint ist das „Theoriemodell der Superkompensation (nach Jakowlew, 1977)“. Roux steht für die Reizstufenregel, Neumann und Schüller für das Vier-Stufen-Modell."}, {"frage": "Welche Belastungskomponente gibt das Verhältnis von Belastungs- und Pausenzeiten wieder?", "antwort": "Dichte – Die Dichte beschreibt das Verhältnis von Belastung zu Pause. Die Frequenz meint die Häufigkeit des Trainings pro Tag, Woche oder Monat."}, {"frage": "Nach wie vielen Tagen kommt es laut Vier-Stufen-Modell zur Vergrößerung der Energiespeicher?", "antwort": "Nach 10–20 Tagen – Stufe 2 (Vergrößerung der Energiespeicher, v. a. CrP und Glykogen) erfolgt nach 10–20 Tagen."}]}], "einstieg": {"titel": "Der Trainer oder die Therapeutin?", "min": 10, "situation": "Fallkarte: Ein 45-jähriger Patient, 6 Wochen nach Bandscheibenvorfall, möchte 'wieder richtig Sport machen'. Gleichzeitig meldet sich ein 45-jähriger Leistungssportler mit derselben Diagnose an – gleiche Diagnose, anderer Auftrag.Diskutiert: Wer behandelt wen mit welchem Ziel?", "impulse": [{"frage": "Welche Ziele verfolgt der Therapeut beim Patienten?", "erwartung": "Schmerzfreiheit, Funktion, Belastbarkeit im Alltag/Beruf, Teilhabe."}, {"frage": "Welche Ziele verfolgt der Trainer beim Sportler?", "erwartung": "Wettkampfleistung, maximale Belastbarkeit."}, {"frage": "Wo überschneiden sich die Wege?", "erwartung": "Beide dosieren Belastung nach trainingswissenschaftlichen Prinzipien – daher MTT."}, {"frage": "Warum ist die Unterscheidung in der Ausbildung wichtig?", "erwartung": "Weil die Verantwortung, Indikation und Zielsetzung verschieden sind (Heilmittel vs. Leistungssport)."}], "ueberleitung": "Beide brauchen dieselbe wissenschaftliche Grundlage – die Trainingslehre. In der Physio-Ausbildung nutzen wir sie als MTT: Medizinische Trainingstherapie."}, "praesentation": {"titel": "MTT, Sporttherapie und die drei Zielebenen", "min": 15, "merksatz": "MTT = trainingswissenschaftlich begründetes, dosiertes Bewegungstraining mit medizinischem Therapieziel. Sporttherapie (DVGS) ergänzt dies um bewegungs- und spieltherapeutische Elemente. Zielebenen: 1) Wiederherstellung von Struktur/Funktion, 2) Aktivität (Alltagsfertigkeiten), 3) Teilhabe (Beruf, Gesellschaft). Prävention: primär (gesund erhalten), sekundär (Früherkennung/Risikofaktoren ohne Erkrankung), tertiär (bei bestehender Erkrankung Folgeschäden vermeiden).", "schritte": [{"ueberschrift": "Definition MTT und Abgrenzung zum Sport", "text": "Die Teilnehmenden lesen die Definition aus der App-Karteikarte vor und formulieren die Abgrenzung in eigenen Worten.", "vortrag": "MTT ist ein ärztlich/therapeutisch verordnetes Training: Indikation, Ziel und Dosierung sind medizinisch begründet. Der Leistungssport dient der Leistungssteigerung im Wettkampf. Beides nutzt Training – aber mit anderem Auftrag und anderer Verantwortung."}, {"ueberschrift": "Die drei Zielebenen des Trainings in der Therapie", "text": "An der Tafel drei Ebenen zeichnen: Struktur/Funktion → Aktivität → Teilhabe; je ein Patientenbeispiel nennen.", "vortrag": "Nach dem ICF-Modell bauen wir von der Körperfunktion (z. B. Kniestreckung) über die Aktivität (Treppensteigen) bis zur Teilhabe (wieder arbeiten gehen). Das teilhabeorientierte Ziel ist das Leitmotiv der Sporttherapie – es entscheidet, wann eine Behandlung 'wirksam' ist."}, {"ueberschrift": "Primär-, Sekundär-, Tertiärprävention", "text": "Drei Säulen an die Tafel malen und Beispiele aus der Praxis sammeln (z. B. Rückenschule = primär; Ergonomie-Beratung bei Risikopatient = sekundär; Reha nach Herzinfarkt = tertiär).", "vortrag": "Prävention ist in der Physio alltäglich: Primär halten wir Gesunde gesund, sekundär greifen wir bei Risikofaktoren ein, bevor eine Erkrankung manifest wird, tertiär verhindern wir bei bestehender Erkrankung Verschlechterung und Folgeschäden. Die Tertiärprävention ist der Kern der medizinischen Rehabilitation."}]}, "arbeitsphase": {"titel": "Fallarbeit: Wer macht was – und warum?", "min": 25, "sozialform": "Partnerarbeit", "aufgaben": [{"titel": "Fall 1 – Präventionskurs", "text": "In einer Firma bietet die Physiotherapeutin einen Rückenkurs für beschwerdefreie Mitarbeiter an. Welche Präventionsform ist das und welches Ziel verfolgt sie?", "loesung": "Primärprävention; Ziel: Gesunderhaltung, Vermeidung von Rückenbeschwerden (Folgeschäden vorbeugen).", "hilfe": "Hinweis: 'beschwerdefrei' und 'gesund' sind die Schlüsselwörter."}, {"titel": "Fall 2 – Patient nach Knie-TEP", "text": "Ein 68-jähriger Patient ist 8 Wochen nach Knie-Totalendoprothese in der Reha. Die MTT baut Kraft und Gangfähigkeit auf. Primär, sekundär oder tertiär? Ziel?", "loesung": "Tertiärprävention; Ziel: Wiederherstellung von Aktivität und Teilhabe, Vermeidung von Folgeschäden (z. B. Stürze, Muskelatrophie).", "hilfe": "Hinweis: bestehende Erkrankung (OP/Arthrose) = tertiär."}, {"titel": "Fall 3 – Risikopatient ohne Erkrankung", "text": "Eine 50-jährige Raucherin mit Bluthochdruck, Übergewicht und bewegungsarmem Beruf, aber noch ohne Herzinfarkt, kommt in die Praxis. Welche Präventionsform?", "loesung": "Sekundärprävention (Risikofaktoren vorhanden, Erkrankung noch nicht manifest); Ziel: Risikoreduktion vor dem Ereignis.", "hilfe": "App-Quiz-Frage: 'Welche Präventionsform richtet sich an Personen mit Risikofaktoren, aber ohne Erkrankung?'"}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Definiere den Begriff Medizinische Trainingstherapie (MTT) und grenze ihn vom (Leistungs-)Sport ab.", "loesung": "- MTT = Anwendung von körperlichem Training bei (noch) Gesunden oder Patienten\n- im Rahmen präventiver oder kurativer Behandlung, auf ärztliche Empfehlung/Verordnung\n- mit klaren Indikationen zur Erreichung definierter Therapieziele; Fortsetzung der medizinischen Therapie mit anderen Mitteln\n- Abgrenzung: Sport zielt primär auf sportliche Leistung, MTT auf Organ- und Stoffwechselfunktionen sowie Lebensqualität", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schnelle Gruppen lösen zuerst Fall 1, danach Partnertausch mit Fall 2/3; schwächere Gruppen bekommen die App-Karteikarten als Stütze, stärkere müssen die Abgrenzung mündlich begründen.", "app_uebung": "App: Zuordnen 'Wo findet Sporttherapie statt?' und Karteikarten-Thema trainingslehre; Prüfungsaufgaben (MTT 4 P, Prävention 3 P) als Musterlösung zeigen."}, "sicherung": {"titel": "Exit-Ticket: MTT in drei Sätzen", "min": 5, "form": "Einzelarbeit, schriftlich", "text": "Formuliere in drei Sätzen: Was ist MTT, wen unterscheidet sie vom Sport, und welche drei Präventionsformen gibt es?", "aufgaben": [{"frage": "Was ist MTT?", "loesung": "Dosiertes, trainingswissenschaftlich begründetes Bewegungstraining mit medizinischem Therapieziel."}, {"frage": "Abgrenzung Sport?", "loesung": "Sport zielt primär auf sportliche Leistung; MTT auf Organ-/Stoffwechselfunktionen sowie Lebensqualität (App-Quiz)."}, {"frage": "Drei Präventionsformen?", "loesung": "Primär (gesund erhalten), sekundär (Risikofaktoren ohne Erkrankung), tertiär (bei Erkrankung Folgeschäden vermeiden)."}, {"frage": "Welche Trainingsmethode ist durch „Belastung ohne Pause“ gekennzeichnet?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Dauermethode – Die Dauermethode zeichnet sich durch eine Belastung ohne Pause aus. Die Intervallmethode arbeitet mit lohnenden, die Wiederholungsmethode mit erholenden Pausen."}]}, "hausaufgabe": "App-Thema trainingslehre: Karteikarten 1–8 üben; Prüfungsaufgaben 'MTT definieren' und 'drei Präventionsformen' als Hausaufgabe schriftlich beantworten (Musterlösung in der App).", "hinweise": ["Typische Fehlvorstellung: 'MTT ist nur Krafttraining an Geräten.' – MTT umfasst alle Belastungsformen inkl. Ausdauer, Koordination, Beweglichkeit.", "Prävention-Begriffe werden oft vertauscht: sekundär = Risikofaktoren ohne manifeste Erkrankung, tertiär = manifeste Erkrankung.", "Betonen: Das teilhabeorientierte Ziel (ICF) unterscheidet Therapie vom bloßen Training."], "quellen": ["Examenstrainer.html · DATA trainingslehre (quiz, cards, sorts, exam)", "Folien: MTT/Sporttherapie, Prävention (App-Quellenangabe 'src')"]}, "tl-02": {"nr": 2, "id": "tl-02", "thema": "trainingslehre", "titel": "Homöostase und Superkompensation – das Grundmodell der Anpassung", "dauer": 60, "ziele": ["Die Auszubildenden erklären Homöostase und Superkompensation nach Jakowlew (1977).", "Sie benennen den optimalen Zeitpunkt für den nächsten Trainingsreiz.", "Sie begründen, was bei zu hoher oder zu früher Reizsetzung passiert."], "vorwissen": "Stunde 1 (MTT-Grundlagen), physiologische Grundbegriffe (Energiebereitstellung grob).", "material": ["App, Beamer", "Zeichnung Superkompensationskurve an der Tafel", "Stifte in zwei Farben"], "physio": "In der Reha ist das Superkompensationsmodell das zentrale Planungsmodell: Nach jeder Belastung (z. B. Kraftübung nach Knie-OP) regeneriert der Körper und baut kurzzeitig über das Ausgangsniveau hinaus auf – der nächste Reiz muss in dieses Fenster gelegt werden, sonst stagniert der Patient oder überlastet sich.", "app": {"einsatz": ["Quiz trainingslehre: Superkompensation (benannt nach wem, optimaler Zeitpunkt, Folgen zu früher Reize)", "Diagramm 'Theoriemodell der Superkompensation (Jakowlew 1977)' (Folie 11) + Hotspot (Folien 11–12)", "Diagramm 'optimale vs. zu hohe/zu frühe Reizsetzung' (Folie 13)", "Reihenfolge-Übung: 'Phasen im Superkompensationsmodell' und 'Weg von der Belastung zur Anpassung'", "Prüfungsaufgabe (6 P): Superkompensation erläutern"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Modell-Retter (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der stagnierende Patient"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vom Gleichgewicht zum Leistungsaufbau"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Reizplanung am Modell · Einzelarbeit, dann Partner-Kontrolle"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Drei-Satz-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Modell-Retter", "art": "Quiz", "min": 5, "anleitung": "Fragen aus dem App-Quiz zum Superkompensationsmodell; die Gruppe notiert Stichworte, erst dann wird aufgelöst.", "aufgaben": [{"frage": "Nach wem ist das Theoriemodell der Superkompensation benannt?", "antwort": "Nach Jakowlew (1977)."}, {"frage": "Was versteht man unter Superkompensation?", "antwort": "Vorübergehender Anstieg der Leistungsfähigkeit über das Ausgangsniveau nach Erholung."}, {"frage": "Wann liegt der optimale Zeitpunkt für den nächsten Reiz?", "antwort": "Im Gipfel der Superkompensation."}, {"frage": "Was passiert bei zu hoher oder zu früher Reizsetzung?", "antwort": "Leistungsabfall, Übertraining, Verletzungsgefahr."}, {"frage": "Was ist Homöostase?", "antwort": "Das Gleichgewicht des inneren Milieus, das der Körper konstant zu halten versucht."}]}, {"titel": "Kurven-Memory", "art": "Spiel", "min": 5, "anleitung": "Paare zeichnen die Superkompensationskurve aus dem Gedächtnis; danach Vergleich mit dem App-Diagramm (Folie 11) – Abweichungen markieren.", "aufgaben": [{"frage": "Welche Achsen hat die Kurve?", "antwort": "x: Zeit; y: Leistungsfähigkeit."}, {"frage": "Welche Phasen durchläuft sie?", "antwort": "Ausgangsniveau → Belastung (Absinken) → Erholung → Superkompensation → Rückgang."}, {"frage": "Wo liegt der ideale nächste Reiz?", "antwort": "Am Gipfel der Superkompensation."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Welche Trainingsmethode ist durch „Belastung ohne Pause“ gekennzeichnet?", "antwort": "Dauermethode – Die Dauermethode zeichnet sich durch eine Belastung ohne Pause aus. Die Intervallmethode arbeitet mit lohnenden, die Wiederholungsmethode mit erholenden Pausen."}, {"frage": "Welches Merkmal kennzeichnet die Wiederholungsmethode?", "antwort": "Belastung mit erholender Pause – Bei der Wiederholungsmethode folgt auf jede Belastung eine erholende, also vollständige Pause."}, {"frage": "Welche Belastungsdauer gilt für die intensive Intervallmethode?", "antwort": "Zwischen 30 s und 2 min – Die intensive Intervallmethode (anaerober Stoffwechsel) arbeitet mit 30 s bis 2 min Belastung. 1 bis 8 min gelten für die extensive Variante."}]}], "einstieg": {"titel": "Der stagnierende Patient", "min": 10, "situation": "Fall: Ein Patient trainiert seit Monaten mit stetig gesteigerter Belastung – seine Kraft stagniert, er ist müde und reizbar. Was ist passiert? (App-Quiz-Fallfrage.)", "impulse": [{"frage": "Welche Hypothese habt ihr?", "erwartung": "Zu frühe oder zu harte Reize – keine ausreichende Erholung, evtl. Übertraining."}, {"frage": "Wo auf der Kurve steht der Patient vermutlich?", "erwartung": "Im Absinken nach der Belastung, bevor die Superkompensation erreicht ist."}, {"frage": "Was wäre die richtige Maßnahme?", "erwartung": "Reiz reduzieren oder Pause verlängern, dann neu dosieren."}, {"frage": "Warum stagniert die Leistung trotz Training?", "erwartung": "Weil die Reize nicht im Superkompensationsfenster lagen – keine Anpassung, sondern Abbau."}], "ueberleitung": "Dieses Phänomen kennen wir als Superkompensation: Der Körper baut nach Belastung nicht sofort, sondern erst in der Erholung über das Ausgangsniveau hinaus auf – vorausgesetzt, der nächste Reiz kommt zum richtigen Zeitpunkt."}, "praesentation": {"titel": "Vom Gleichgewicht zum Leistungsaufbau", "min": 15, "merksatz": "Homöostase = Gleichgewichtszustand des Organismus. Belastung stört ihn (Leistungsabfall) → Erholung stellt ihn wieder her → bei ausreichender Erholung steigt er vorübergehend darüber hinaus (Superkompensation, Jakowlew 1977). Der nächste Reiz muss in diesen Gipfel gelegt werden. Zu früh/zu hart: Leistungsabfall, Übertraining.", "schritte": [{"ueberschrift": "Homöostase und Störung durch Belastung", "text": "An der Tafel: waagerechte Linie = Ausgangsniveau; dann Abfall bei Belastung einzeichnen.", "vortrag": "Jede Belastung – ob Kraftübung oder Ausdauerlauf – stört das Gleichgewicht des Körpers. Während der Belastung sinkt die Leistungsfähigkeit messbar. Das ist normal und kein Zeichen von Schwäche."}, {"ueberschrift": "Erholung und Superkompensation", "text": "Erholungsanstieg über das Ausgangsniveau einzeichnen; Gipfel markieren; App-Diagramm Folie 11 zeigen (Hotspot: Gipfel anklicken).", "vortrag": "In der Erholung repariert der Körper nicht nur, sondern baut vorsorglich auf – das ist die Superkompensation. Der Gipfel ist der optimale Zeitpunkt für den nächsten Reiz: Wird er dort gesetzt, steigt das Ausgangsniveau dauerhaft an."}, {"ueberschrift": "Zu hohe oder zu frühe Reizsetzung", "text": "Zweite Kurve daneben zeichnen (Folie 13): Reiz im Absinken oder zu hart → Kurve fällt weiter ab.", "vortrag": "Setzen wir den Reiz zu früh, trainieren wir im 'Loch' – der Körper baut ab statt auf. Dasselbe passiert bei zu hoher Intensität: Dann kippt das System ins Übertraining. In der Therapie heißt das konkret: Regenerationspausen sind kein 'Faulenzen', sondern Teil der Behandlung."}]}, "arbeitsphase": {"titel": "Reizplanung am Modell", "min": 25, "sozialform": "Einzelarbeit, dann Partner-Kontrolle", "aufgaben": [{"titel": "Zeichne und beschrifte die Superkompensationskurve.", "text": "Zeichne und beschrifte die Superkompensationskurve.", "loesung": "Achsen, Ausgangsniveau, Belastungstief, Erholung, Gipfel, optimaler nächster Reiz – siehe App-Diagramm Folie 11.", "hilfe": "Vorlage: App-Diagramm 'Superkompensation' (Folie 11) oder Hotspot-Abbildung."}, {"titel": "Fall: 4 Wochen Krafttraining, dann stagniert die Kraft. Was prüfst du zuerst?", "text": "Fall: 4 Wochen Krafttraining, dann stagniert die Kraft. Was prüfst du zuerst?", "loesung": "Reizabstand und -intensität: Liegen die Einheiten im Superkompensationsfenster? Evtl. Übertraining durch zu frühe Reize. Maßnahme: Pause/Reizreduktion, dann Neuaufbau (vgl. App-Quiz-Fall).", "hilfe": "App-Quiz: 'Patient trainiert seit Monaten … Leistung stagniert' – dort ist die Musterlösung."}, {"titel": "Reihenfolge: Bringe die Phasen in die richtige Ordnung.", "text": "Reihenfolge: Bringe die Phasen in die richtige Ordnung.", "loesung": "App-Reihenfolge-Übung 'Phasen im Superkompensationsmodell' bzw. 'Weg von der Belastung zur Anpassung' in der App lösen.", "hilfe": "In der App unter sequences (Thema trainingslehre) selbstständig ordnen."}, {"titel": "Prüfungsnahe Aufgabe (3 P)", "text": "Nenne und erläutere die drei Formen der Prävention.", "loesung": "- Primärprävention: Erhalt der Gesundheit von Individuen, Personengruppen oder Populationen\n- Sekundärprävention: Früherkennung und rechtzeitige Behandlung; richtet sich an Personen mit Risikofaktoren ohne Erkrankung\n- Tertiärprävention: Verhinderung des Fortschreitens oder von Komplikationen bei manifester Erkrankung", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere zeichnen die Kurve mit Vorlage ab und beschriften; stärkere erklären ohne Vorlage, warum Übertraining in der Reha besonders gefährlich ist (Heilungsprozesse brauchen Zeit).", "app_uebung": "App: Diagramme Folie 11/13, Hotspots Folien 11–12, sequences 'Superkompensationsmodell', Quiz-Fallfrage 'stagnierende Leistung'."}, "sicherung": {"titel": "Drei-Satz-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Erkläre in drei Sätzen: Was ist Superkompensation, wann setzt man den nächsten Reiz, was passiert bei zu früher Reizsetzung?", "aufgaben": [{"frage": "Superkompensation?", "loesung": "Vorübergehender Leistungsanstieg über das Ausgangsniveau nach ausreichender Erholung (Jakowlew 1977)."}, {"frage": "Nächster Reiz?", "loesung": "Am Gipfel der Superkompensation."}, {"frage": "Zu früh/zu hart?", "loesung": "Leistungsabfall bis Übertraining – Anpassung bleibt aus oder kehrt sich um."}, {"frage": "Welche Präventionsform richtet sich gezielt an Personen mit Risikofaktoren, aber ohne Erkrankung?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Sekundärprävention – Die Sekundärprävention zielt auf Früherkennung und richtet sich an Personen mit Risikofaktoren, bei denen noch keine Erkrankung vorliegt."}]}, "hausaufgabe": "App-Diagramm Folie 11 ausdrucken und ins Heft kleben; Quiz trainingslehre zu Superkompensation bis Level 2 spielen; Prüfungsaufgabe (6 P) schriftlich üben.", "hinweise": ["Häufiger Fehler: Superkompensation mit 'sofortigem Kraftzuwachs' verwechseln – der Zuwachs erfolgt in der Erholung, nicht während der Belastung.", "Im Physio-Kontext: Heilungsphasen (z. B. nach OP) verlängern die Erholungskurve – Reize müssen dann weiter auseinanderliegen.", "Begriff Jakowlew prüfungsrelevant (App-Quiz)."], "quellen": ["Examenstrainer.html · DATA trainingslehre: diagrams Folie 11/13, hotspots, sequences, quiz, exam (6 P)", "Jakowlew 1977 (App-Quelle)"]}, "tl-03": {"nr": 3, "id": "tl-03", "thema": "trainingslehre", "titel": "Vier-Stufen-Modell der Anpassung und die sechs Belastungskomponenten", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben die vier Stufen nach Neumann & Schüller (1994).", "Sie nennen die sechs Belastungskomponenten und erläutern zwei davon.", "Sie begründen, warum in der 4. Belastungswoche häufig eine Regenerationswoche eingeplant wird."], "vorwissen": "Stunde 2 (Superkompensation), Belastungslehre-Vokabular.", "material": ["App, Beamer", "Tabelle Belastungskomponenten (aus App ausdrucken)", "Planer-Vorlage 'Vier-Stufen-Modell'"], "physio": "Das Vier-Stufen-Modell erklärt, warum Patienten nach längerer Immobilisation (z. B. Gips) nicht sofort mit voller Belastung starten dürfen: Jede Struktur (Knochen, Sehne, Muskel, Nervensystem) braucht ihre eigene Anpassungszeit – die langsamste Struktur bestimmt das Tempo der Therapie.", "app": {"einsatz": ["Tabelle 'Vier-Stufen-Modell (Neumann & Schüller 1994)' (Folie 16) + Diagramm 'Belastungsplanung über 6 Wochen' (Folie 17)", "Tabelle 'Belastungskomponenten' (Folie 15)", "Planer 'Vier-Stufen-Modell' (Folien 16–17)", "Reihenfolge: 'Stufen des Vier-Stufen-Modells' und 'Anpassungsgeschwindigkeit von schnell nach langsam'", "Prüfungsaufgaben: Vier-Stufen-Modell (5 P), sechs Belastungskomponenten (4 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Stufen-Rap (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der 6-Wochen-Plan"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vier Stufen, sechs Komponenten"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Planer-Workshop: Belastungskomponenten eines Falls · Partnerarbeit am Planer"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Komponenten-Speeddating · Plenum, mündlich"}], "warmups": [{"titel": "Stufen-Rap", "art": "Quiz", "min": 5, "anleitung": "App-Quiz-Fragen zum Vier-Stufen-Modell und zu den Belastungskomponenten im Wechselruf.", "aufgaben": [{"frage": "Nach wem ist das Vier-Stufen-Modell benannt?", "antwort": "Neumann & Schüller (1994)."}, {"frage": "Nach wie vielen Tagen kommt es laut Vier-Stufen-Modell zur Vergrößerung der Energiespeicher?", "antwort": "Nach 10–20 Tagen (Stufe 2: CrP- und Glykogen-Speicher, App-Quiz)."}, {"frage": "Welche Belastungskomponente gibt das Verhältnis von Belastungs- und Pausenzeiten wieder?", "antwort": "Die Belastungsdichte."}, {"frage": "Wie viele Belastungskomponenten gibt es?", "antwort": "Sechs."}, {"frage": "Warum wird in der 4. Belastungswoche häufig eine Regenerationswoche eingeplant?", "antwort": "Die 3. Anpassungsstufe (Tag 20–30) gilt als besonders störanfällig – daher wird die Belastung in Woche 4 reduziert (App-Quiz)."}]}, {"titel": "Dichte-Detektive", "art": "Rätsel", "min": 5, "anleitung": "Kurze Textaufgabe: 3 Sätze à 45 Sek. Belastung, 90 Sek. Pause – welche Komponente ist gesucht und wie rechnet man sie?", "aufgaben": [{"frage": "Belastung 45 s, Pause 90 s – Dichte?", "antwort": "45 : (45+90) = 1:3."}, {"frage": "Intensität = 80 % der Maximalkraft – welche Komponente?", "antwort": "Die Belastungsintensität."}, {"frage": "3 Sätze à 10 WH – welche Komponente?", "antwort": "Der Belastungsumfang (Wiederholungen)."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Welche Präventionsform richtet sich gezielt an Personen mit Risikofaktoren, aber ohne Erkrankung?", "antwort": "Sekundärprävention – Die Sekundärprävention zielt auf Früherkennung und richtet sich an Personen mit Risikofaktoren, bei denen noch keine Erkrankung vorliegt."}, {"frage": "Welche optimale Einarbeitungszeit (Aufwärmen) wird als Richtwert vor einem Wettkampf genannt?", "antwort": "20–40 Minuten – Nach Weineck (2009) beträgt die optimale Einarbeitungszeit vor einem Wettkampf 20–40 min, vor dem Training 15–30 min."}, {"frage": "Welcher zeitliche Abstand zwischen Ende des Aufwärmens und Wettkampfstart gilt als optimal?", "antwort": "Fünf bis zehn Minuten – Fünf bis zehn Minuten zwischen Abschluss des Aufwärmens und Wettkampfstart gelten als optimal."}]}], "einstieg": {"titel": "Der 6-Wochen-Plan", "min": 10, "situation": "Fall: Nach Knie-OP soll ein Patient in 6 Wochen wieder Treppensteigen können. Die Auszubildenden skizzieren grob einen Wochenplan – wo würdet ihr eine leichte Woche einbauen und warum?", "impulse": [{"frage": "Welche Strukturen müssen sich anpassen?", "erwartung": "Muskel, Sehne, Knochen, Knorpel, Nervensystem, Herz-Kreislauf."}, {"frage": "Welche passt sich am langsamsten an?", "erwartung": "Knorpel und Sehnen – daher längere Regenerationsphasen nötig."}, {"frage": "Wo im 6-Wochen-Plan gehört eine Regenerationswoche hin?", "erwartung": "In der 4. Woche – die 3. Stufe (Tag 20–30) ist störanfällig (Folie 17, App-Quiz)."}, {"frage": "Was passiert, wenn man sie auslässt?", "erwartung": "Übertraining, Stagnation oder Verletzung (vgl. Superkompensation, Stunde 2)."}], "ueberleitung": "Das Vier-Stufen-Modell beschreibt, in welchen Stufen der Organismus auf Belastung reagiert – und die Belastungskomponenten sagen uns, wie wir den Reiz konkret dosieren. Beides zusammen ist das Handwerkszeug der Trainingsplanung in der MTT."}, "praesentation": {"titel": "Vier Stufen, sechs Komponenten", "min": 15, "merksatz": "Vier-Stufen-Modell (Neumann & Schüller 1994): 1. Stufe: Auslenkung aus der Homöostase (Belastung), 2. Stufe: Vergrößerung der Energiespeicher (nach 10–20 Tagen, v. a. CrP/Glykogen), 3. Stufe: Optimierung der geregelten Systeme (Tag 20–30, störanfällig), 4. Stufe: abgeschlossene Adaptation – daher Belastungsreduktion in Woche 4. Sechs Belastungskomponenten: Intensität, Umfang (Dauer/Wiederholungen), Dichte (Belastung:Pause), Häufigkeit, Dauer der Einheit, Reihenfolge.", "schritte": [{"ueberschrift": "Die vier Stufen der Anpassung", "text": "Tabelle Folie 16 projizieren; Stufen 1–4 mit eigenen Worten wiedergeben; Diagramm Folie 17 (6-Wochen-Plan) zeigen.", "vortrag": "Stufe 1: Die Belastung stört das Gleichgewicht. Stufe 2: Die Energiespeicher wachsen – nach 10 bis 20 Tagen (CrP, Glykogen). Stufe 3: Optimierung der geregelten Systeme um Tag 20–30 – diese Stufe gilt als besonders störanfällig. Stufe 4: Die Adaptation ist abgeschlossen. Deshalb reduzieren wir die Belastung in der 4. Woche (Regenerationswoche)."}, {"ueberschrift": "Die sechs Belastungskomponenten", "text": "Tabelle Folie 15 an die Tafel; je eine Komponente mit Patientenbeispiel füllen (z. B. Intensität = 60 % 1RM nach Knie-OP).", "vortrag": "Jeder Reiz lässt sich über sechs Stellschrauben dosieren: Wie hart (Intensität), wie viel (Umfang), wie dicht (Belastung zu Pause), wie oft (Häufigkeit), wie lange (Einheitsdauer) und in welcher Reihenfolge. In der MTT ist die Dichte besonders wichtig: Patienten brauchen längere Pausen als Sportler."}, {"ueberschrift": "Anpassungsgeschwindigkeit – schnell nach langsam", "text": "App-Reihenfolge-Übung 'Anpassungsgeschwindigkeit' als Tafelanschrieb: Nervensystem schnell, Muskel mittel, Sehne/Knorpel langsam.", "vortrag": "Verschiedene Strukturen passen sich unterschiedlich schnell an. Das Nervensystem reagiert in Tagen, der Muskel in Wochen, Sehnen und Knorpel brauchen Monate. Deshalb darf die Belastung in der Therapie nicht schneller gesteigert werden, als die langsamste Struktur mitkommt – sonst reißt die Kette."}]}, "arbeitsphase": {"titel": "Planer-Workshop: Belastungskomponenten eines Falls", "min": 25, "sozialform": "Partnerarbeit am Planer", "aufgaben": [{"titel": "Fall: Patientin, 6 Wochen nach Knie-TEP, Ziel Kniestreckkraft. Stelle die sechs Komponenten für eine Woche auf.", "text": "Fall: Patientin, 6 Wochen nach Knie-TEP, Ziel Kniestreckkraft. Stelle die sechs Komponenten für eine Woche auf.", "loesung": "Beispiel: Intensität 40–60 % (submaximal), Umfang 3×12 WH, Dichte 1:3 (längere Pausen!), Häufigkeit 3×/Woche, Dauer 20 Min, Reihenfolge: große vor kleinen Muskelgruppen.", "hilfe": "App-Planer 'Vier-Stufen-Modell' (Folien 16–17) als Vorlage nutzen."}, {"titel": "Rechne die Dichte: 30 s Belastung, 60 s Pause.", "text": "Rechne die Dichte: 30 s Belastung, 60 s Pause.", "loesung": "30 : 90 = 1:3.", "hilfe": "Formel: Belastung : (Belastung + Pause)."}, {"titel": "Vergleiche: Gleiche Übung beim Sportler – welche Komponente würdest du ändern?", "text": "Vergleiche: Gleiche Übung beim Sportler – welche Komponente würdest du ändern?", "loesung": "Intensität und Dichte erhöhen (kürzere Pausen), Umfang ggf. steigern – in der Therapie bleiben Pausen länger.", "hilfe": "App-Quiz: 'Unterschied (Leistungs-)Sport und MTT' rekapitulieren."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Erläutere das Theoriemodell der Superkompensation nach Jakowlew und beschreibe, was bei zu früher Reizsetzung passiert.", "loesung": "- Trainingsreiz stört die Homöostase, Leistungsfähigkeit sinkt unter das Ausgangsniveau (Belastung/Ermüdung)\n- In der Regeneration steigt die Leistung wieder auf das Ausgangsniveau\n- Superkompensation: Leistung steigt über den Ausgangswert hinaus\n- Optimaler Zeitpunkt für den nächsten Reiz: Höhepunkt der Superkompensation → Leistungszuwachs bei optimaler Belastungs-Erholungs-Relation\n- Ohne neuen Reiz fällt die Leistung wieder auf das Ausgangsniveau zurück\n- Zu hohe/zu frühe Reize treffen auf unvollständige Wiederherstellung → Leistungsfähigkeit nimmt ab", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Leistungsschwächere arbeiten mit der ausgedruckten Tabelle Folie 15 und füllen sie aus; leistungsstärkere begründen jede Komponente physiologisch (z. B. warum Knorpel lange Pausen braucht).", "app_uebung": "App: Tabelle Folie 15/16, Diagramm Folie 17, Planer 'Vier-Stufen-Modell', sequences 'Stufen des Vier-Stufen-Modells', 'Anpassungsgeschwindigkeit'; Prüfungsaufgaben (5 P/4 P)."}, "sicherung": {"titel": "Komponenten-Speeddating", "min": 5, "form": "Plenum, mündlich", "text": "Die Lehrkraft nennt eine Zahl/Konstellation – die Gruppe ruft die passende Komponente: '60 % 1RM' – 'Intensität!' …", "aufgaben": [{"frage": "'3 Sätze à 10 Wiederholungen'", "loesung": "Umfang."}, {"frage": "'45 s Belastung, 90 s Pause'", "loesung": "Dichte (1:3)."}, {"frage": "'3× pro Woche, 20 Minuten'", "loesung": "Häufigkeit und Dauer der Einheit."}, {"frage": "'In der 4. Woche leicht'", "loesung": "Belastungsreduktion in Woche 4 – 3. Stufe (Tag 20–30) störanfällig (Folie 17, App-Quiz)."}, {"frage": "Wie lange sollten Cool-down-Maßnahmen dauern?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "5–15 Minuten – Für das Abwärmen werden 5–15 Minuten Cool-down-Maßnahmen wie Auslaufen, Ausschwimmen, Ergometer, Dehnen oder Massage empfohlen."}]}, "hausaufgabe": "Tabelle 'Belastungskomponenten' (Folie 15) auswendig lernen (App-Karteikarte 'Sechs Belastungskomponenten'); Planer 'Vier-Stufen-Modell' für einen eigenen Fall ausfüllen; Prüfungsaufgaben (4 P + 5 P) üben.", "hinweise": ["Fehler: Dichte wird oft als 'Pause allein' berechnet – richtig ist Belastung : (Belastung + Pause).", "Im Physio-Kontext: Die langsamste Struktur (Knorpel/Sehne) limitiert – das erklärt, warum Reha-Pläne konservativer sind als Sportpläne.", "Begriffe Neumann & Schüller 1994 und Roux (nächste Stunde) sind prüfungsrelevant."], "quellen": ["Examenstrainer.html · DATA trainingslehre: tables Folie 15/16, diagrams Folie 17, planner, sequences, exam (4 P/5 P)", "Neumann & Schüller 1994 (App-Quelle)"]}, "tl-04": {"nr": 4, "id": "tl-04", "thema": "trainingslehre", "titel": "Trainingsmethoden I: Dauermethode und Intervallmethode", "dauer": 60, "ziele": ["Die Auszubildenden definieren die Trainingsmethode und nennen die drei Formen der Dauermethode.", "Sie unterscheiden intensive und extensive Intervallmethode.", "Sie vergleichen Dauer- und Intervallmethode hinsichtlich Pausengestaltung und Ziel (prüfungsrelevant)."], "vorwissen": "Stunde 3 (Belastungskomponenten), Superkompensation (Stunde 2).", "material": ["App, Beamer", "Tabelle 'Trainingsbereiche der Dauermethode' (Ausdruck)", "Stoppuhr für eine Mini-Demo"], "physio": "In der kardiologischen und pneumologischen Rehabilitation ist die Dauermethode die Standardmethode: kontinuierliche Belastung unterhalb der anaeroben Schwelle verbessert die aerobe Kapazität des Patienten – die Basis für Alltagsbelastbarkeit. Intervalltraining wird dosiert bei stabilen Patienten eingesetzt.", "app": {"einsatz": ["Quiz trainingslehre: Dauermethode ('Belastung ohne Pause'), intensive vs. extensive Intervallmethode, Belastungsdauer II-Methode", "Karteikarte: 'Drei Formen der Dauermethode', 'Intensive vs. extensive Intervallmethode'", "Zuordnen: 'Merkmale der Trainingsmethoden'", "Prüfungsaufgabe: Dauermethode vs. Intervallmethode vergleichen (4 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Methoden-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der Läufer und die Patientin"}, {"phase": "Präsentation", "min": 15, "inhalt": "Zwei Grundtypen des Trainings"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Methoden-Memory und Fallzuordnung · Partnerarbeit"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Methoden-Quickfire · Mündlich im Plenum"}], "warmups": [{"titel": "Methoden-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz-Fragen zu Dauer- und Intervallmethode; schnelle Antworten im Plenum.", "aufgaben": [{"frage": "Welche Methode ist durch 'Belastung ohne Pause' gekennzeichnet?", "antwort": "Die Dauermethode (kontinuierlich)."}, {"frage": "Welche Belastungsdauer kennzeichnet die intensive Intervallmethode?", "antwort": "Kurze Belastungsphasen (Sekunden bis ~2 Min) mit hoher Intensität."}, {"frage": "Was kennzeichnet die extensive Intervallmethode?", "antwort": "Längere, weniger intensive Belastungsphasen mit längeren Pausen."}, {"frage": "Was ist eine Trainingsmethode allgemein?", "antwort": "Das planmäßige Vorgehen zur Erreichung eines Trainingsziels (Ablauf von Belastung und Pause)."}, {"frage": "Wie unterscheidet sich die Intervallmethode von der Dauermethode?", "antwort": "Wechsel von Belastung und Pause statt kontinuierlicher Belastung."}]}, {"titel": "Tempo-Gefühl", "art": "Bewegung", "min": 5, "anleitung": "30 Sekunden gleichmäßiges Laufen (Dauermethode) vs. 10 s schnell / 20 s langsam im Wechsel (Intervall) – danach: Was war subjektiv härter, was war kürzer belastend?", "aufgaben": [{"frage": "Welche Methode erlaubt höhere Intensität?", "antwort": "Die Intervallmethode (durch die Pausen)."}, {"frage": "Welche Methode belastet länger durchgehend?", "antwort": "Die Dauermethode."}, {"frage": "Was spürt man bei der Intervallmethode in der Pause?", "antwort": "Die Erholung setzt ein – das ist die 'lohnende Pause' (Thema Ausdauer)."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Wie lange sollten Cool-down-Maßnahmen dauern?", "antwort": "5–15 Minuten – Für das Abwärmen werden 5–15 Minuten Cool-down-Maßnahmen wie Auslaufen, Ausschwimmen, Ergometer, Dehnen oder Massage empfohlen."}, {"frage": "Welche Struktur passt sich zum Prinzip der optimalen Relation von Belastung und Erholung am langsamsten an?", "antwort": "Knochenstrukturen/Knorpel – Die Pyramide reicht von „schnell“ (Vegetativum) bis „langsam“ (Knochenstrukturen/Knorpel)."}, {"frage": "Welcher Trainingszyklus umfasst einen Zeitraum von mehreren Tagen bis zu einer Woche?", "antwort": "Mikrozyklus – Der Mikrozyklus setzt sich aus mehreren Trainingseinheiten zusammen und umfasst mehrere Tage bis eine Woche."}]}], "einstieg": {"titel": "Der Läufer und die Patientin", "min": 10, "situation": "Zwei Fälle: (a) Eine Patientin joggt 30 Minuten in gleichbleibendem Tempo ohne Pause – welche Methode? (b) Ein Läufer macht 10× 400 m mit Trabpausen – welche Methode?", "impulse": [{"frage": "Fall a – Methode?", "erwartung": "Dauermethode, kontinuierlich (App-Quiz-Fallfrage)."}, {"frage": "Fall b – Methode?", "erwartung": "Intervallmethode."}, {"frage": "Wann würdet ihr in der Therapie Dauer, wann Intervall wählen?", "erwartung": "Dauer bei Grundlagenausdauer/Herzpatienten; Intervall erst bei stabiler Belastbarkeit."}, {"frage": "Was ist der Vorteil der Pause?", "erwartung": "Höhere Intensität möglich, geringere psychische Belastung."}], "ueberleitung": "Ob Dauer- oder Intervallmethode – beide sind planmäßige Abläufe von Belastung und Pause. Heute unterscheiden wir die beiden Grundtypen und ihre Unterformen."}, "praesentation": {"titel": "Zwei Grundtypen des Trainings", "min": 15, "merksatz": "Dauermethode = kontinuierliche Belastung ohne Pause (3 Formen: extensiv kontinuierlich, intensiv kontinuierlich, variabel/Fahrtspiel). Intervallmethode = Wechsel von Belastung und Pause; extensive (längere, moderate Belastung) vs. intensive (kurze, harte Belastung). Wiederholungsmethode (nächste Stunde) arbeitet mit maximalen/seltenen Belastungen und vollständiger Pause.", "schritte": [{"ueberschrift": "Die Dauermethode und ihre drei Formen", "text": "Drei Formen an die Tafel: extensiv (niedrige Intensität, lange Dauer), intensiv (hohe Intensität), variabel (Fahrtspiel, Wechsel).", "vortrag": "Die Dauermethode ist 'Belastung ohne Pause'. Die extensive Form baut die Grundlagenausdauer auf – das ist in der Therapie die häufigste Methode. Die intensive Form belastet das Herz-Kreislauf-System stärker. Das Fahrtspiel wechselt das Tempo spielerisch und motiviert besonders Gruppen."}, {"ueberschrift": "Die Intervallmethode", "text": "Schema Belastung–Pause–Belastung an die Tafel; extensive vs. intensive Variante unterscheiden.", "vortrag": "Bei der Intervallmethode wechseln sich Belastung und Erholung ab. Die extensive Variante arbeitet mit längeren, moderateren Belastungen – sie ist herzschonender. Die intensive Variante nutzt kurze, sehr harte Reize mit hoher neuromuskulärer Beanspruchung. Entscheidend ist die Pausengestaltung: zu kurze Pausen machen die Methode unwirksam oder schädlich."}, {"ueberschrift": "Methodenwahl in der Therapie", "text": "Entscheidungsfrage an die Klasse: stabiler Herzpatient vs. Knie-OP-Patient in Woche 2 – welche Methode jeweils?", "vortrag": "Die Methode folgt dem Ziel und dem Zustand des Patienten: Dauermethode für die aerobe Grundlage und den Herzpatienten, Intervall erst bei ausreichender Belastbarkeit, Krafttraining nach dem Fünf-Stufen-Modell (Thema Kraft). Die App-Quiz-Fälle üben genau diese Zuordnung."}]}, "arbeitsphase": {"titel": "Methoden-Memory und Fallzuordnung", "min": 25, "sozialform": "Partnerarbeit", "aufgaben": [{"titel": "Ordne zu: 'Belastung ohne Pause', 'kurze harte Reize mit Pause', 'lange moderate Reize mit Pause'.", "text": "Ordne zu: 'Belastung ohne Pause', 'kurze harte Reize mit Pause', 'lange moderate Reize mit Pause'.", "loesung": "Dauermethode; intensive Intervallmethode; extensive Intervallmethode.", "hilfe": "App: Zuordnen 'Merkmale der Trainingsmethoden' (Thema trainingslehre)."}, {"titel": "Fall: 30 Min gleichmäßiges Joggen ohne Pause.", "text": "Fall: 30 Min gleichmäßiges Joggen ohne Pause.", "loesung": "Dauermethode, kontinuierlich (App-Quiz).", "hilfe": "App-Quiz-Fall: 'Eine Patientin joggt 30 Minuten …'"}, {"titel": "Fall: Therapieeinheit mit 6× 2 Min Gehen mit 3 Min Pause, moderates Tempo.", "text": "Fall: Therapieeinheit mit 6× 2 Min Gehen mit 3 Min Pause, moderates Tempo.", "loesung": "Extensive Intervallmethode – typisch für kardiovaskuläre Rehabilitation mit kontrollierter Belastung.", "hilfe": "Pausenverhältnis und moderate Intensität sind die Hinweise."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Beschreibe die vier Stufen der Anpassung nach Neumann und Schüller (1994) und begründe, warum häufig in der 4. Woche eine Regenerationswoche geplant wird.", "loesung": "- Stufe 1 (7–10 Tage): Veränderung im Bewegungsprogramm, Bewegung wird flüssiger\n- Stufe 2 (10–20 Tage): Vergrößerung der Energiespeicher (CrP, Glykogen)\n- Stufe 3 (20–30 Tage): Optimierung der geregelten Systeme und Strukturen, adaptiver Umbau in Erholungsphasen\n- Stufe 4 (30–40 Tage): Koordinierung leistungsbeeinflussender Systeme, Adaptation abgeschlossen\n- Begründung: Stufe 3 ist besonders störanfällig → in der 4. Belastungswoche (20.–30. Tag) wird die Belastung reduziert", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lösen die App-Zuordnung mit aufgeklappten Karteikarten; stärkere begründen die Methodenwahl physiologisch (Herz-Kreislauf vs. neuromuskulär) und leiten daraus die Therapiekonsequenz ab.", "app_uebung": "App: quiz trainingslehre (Methoden-Fragen), sorts 'Merkmale der Trainingsmethoden', cards 'Drei Formen der Dauermethode'/'Intensive vs. extensive Intervallmethode', exam 'Dauer vs. Intervall' (4 P)."}, "sicherung": {"titel": "Methoden-Quickfire", "min": 5, "form": "Mündlich im Plenum", "text": "Die Lehrkraft beschreibt eine Situation – die Klasse ruft die Methode.", "aufgaben": [{"frage": "'10× 400 m mit Trabpausen'", "loesung": "Intensive Intervallmethode."}, {"frage": "'45 Min Walking auf dem Laufband, gleiches Tempo'", "loesung": "Dauermethode, extensiv kontinuierlich."}, {"frage": "'Wechsel aus Sprint und Gehen im Park'", "loesung": "Dauermethode, variabel (Fahrtspiel)."}, {"frage": "'30 Min Joggen ohne Pause'", "loesung": "Dauermethode, kontinuierlich."}, {"frage": "Was versteht man unter Superkompensation?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Wiederherstellung des Leistungsniveaus über den Ausgangswert hinaus – Die durch erhöhte Belastung ausgelösten Wiederherstellungsvorgänge verbessern das Leistungsniveau über den Ausgangswert hinaus."}]}, "hausaufgabe": "Karteikarten zu den Methoden lernen; App-Zuordnung 'Merkmale der Trainingsmethoden' bis fehlerfrei; Prüfungsaufgabe 'Dauer- vs. Intervallmethode' (4 P) schriftlich ausformulieren.", "hinweise": ["Fehler: Intervall- und Wiederholungsmethode werden verwechselt – Wiederholungsmethode arbeitet mit (nahezu) maximaler Belastung und vollständiger Pause (nächste Stunde).", "Therapiebezug: Bei kardiovaskulären Patienten ist die extensive Intervall-/Dauermethode Standard, intensive Methoden nur nach Belastungsdiagnostik (PWC/Ergometrie, Thema Ausdauer).", "Begriff 'lohnende Pause' wird im Ausdauer-Thema vertieft (Folie 67)."], "quellen": ["Examenstrainer.html · DATA trainingslehre: cards 'Trainingsmethode', 'Drei Formen der Dauermethode', 'Intensive vs. extensive Intervallmethode', sorts, quiz-Fälle, exam (4 P)"]}, "tl-05": {"nr": 5, "id": "tl-05", "thema": "trainingslehre", "titel": "Wiederholungsmethode, Reizstufenregel nach Roux und die allgemeinen Trainingsprinzipien", "dauer": 60, "ziele": ["Die Auszubildenden erläutern die Reizstufenregel nach Roux (Prinzip des wirksamen Belastungsreizes).", "Sie nennen die acht allgemeinen Trainingsprinzipien und wenden sie auf Therapiebeispiele an.", "Sie erklären das Prinzip der Wiederholung/Kontinuität und der Variation."], "vorwissen": "Stunden 2–4 (Superkompensation, Vier-Stufen-Modell, Methoden).", "material": ["App, Beamer", "Tabelle 'Reizstufenregel (nach Roux)' (Folie 24, Ausdruck)", "Stiftfarben für Reizstufen"], "physio": "Die Reizstufenregel ist in der MTT zentral für die Dosierung: Ein zu schwacher Reiz (unter der Schwelle) verändert nichts – gerade bei immobilisierten Patienten droht dann Muskelabbau. Der wirksame Reiz muss überschwellig sein, aber Erholung muss folgen.", "app": {"einsatz": ["Tabelle 'Reizstufenregel (nach Roux)' (Folie 24)", "Karteikarten: 'Acht allgemeine Trainingsprinzipien', 'Reizstufenregel nach Roux', 'Prinzip der Variation', 'Prinzip der Wiederholung und Kontinuität'", "Quiz: 'Wirkung schwach überschwelliger Reize nach Roux'", "Prüfungsaufgabe: Reizstufenregel erläutern (4 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Schwellen-Sprung (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Zu viel oder zu wenig?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Die Reizstufenregel und die acht Prinzipien"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Roux in der Praxis · Partnerarbeit an Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Prinzipien-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Schwellen-Sprung", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Roux und den Prinzipien; die Gruppe diskutiert bei jeder Antwort kurz 'stimmt das für unsere Patienten?'.", "aufgaben": [{"frage": "Welche Wirkung haben schwach überschwellige Reize nach Roux?", "antwort": "Sie erhalten die Leistungsfähigkeit (keine Anpassung, kein Abbau)."}, {"frage": "Was passiert bei unterschwelligen Reizen?", "antwort": "Abbau der Leistungsfähigkeit (Inaktivitätsatrophie)."}, {"frage": "Was verlangt der wirksame Belastungsreiz?", "antwort": "Überschwelligen Reiz + ausreichende Erholung."}, {"frage": "Nenne zwei allgemeine Trainingsprinzipien.", "antwort": "z. B. Prinzip der Belastung/Erholung, der Wiederholung, der progressiven Belastungssteigerung, der Variation, der Individualität."}, {"frage": "Was besagt das Prinzip der Wiederholung und Kontinuität?", "antwort": "Anpassung entsteht erst durch wiederholte, kontinuierliche Reize über Wochen."}]}, {"titel": "Prinzipien-Pantomime", "art": "Spiel", "min": 5, "anleitung": "Begriffe aus den acht Prinzipien werden pantomimisch dargestellt, die anderen raten – verbindet Bewegung (motivierend) mit Begriffslernen.", "aufgaben": [{"frage": "'Progressive Belastungssteigerung' pantomimisch?", "antwort": "z. B. immer schwerere Hantel heben."}, {"frage": "'Prinzip der Variation'?", "antwort": "z. B. Wechsel der Übungsreihenfolge/Methoden."}, {"frage": "'Optimale Relation von Belastung und Erholung'?", "antwort": "z. B. Training – Pause – Training."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Was versteht man unter Superkompensation?", "antwort": "Wiederherstellung des Leistungsniveaus über den Ausgangswert hinaus – Die durch erhöhte Belastung ausgelösten Wiederherstellungsvorgänge verbessern das Leistungsniveau über den Ausgangswert hinaus."}, {"frage": "Wann liegt laut Superkompensationsmodell der optimale Zeitpunkt für den nächsten Trainingsreiz?", "antwort": "Auf dem Höhepunkt der Superkompensation – Der grüne Pfeil im Modell markiert den Gipfel der Superkompensation als optimalen Zeitpunkt für den nächsten Reiz."}, {"frage": "Was passiert bei zu hoher oder zu früher Reizsetzung?", "antwort": "Die Leistungsfähigkeit nimmt schrittweise ab – Fällt der neue Reiz in die unvollständige Wiederherstellung, sinkt die Leistung von Zyklus zu Zyklus (rote Belastungs-, grüne Wiederherstellungsphasen unterhalb der Nulllinie)."}]}], "einstieg": {"titel": "Zu viel oder zu wenig?", "min": 10, "situation": "Fall: Eine Patientin macht seit 4 Wochen dieselben Übungen mit dem Theraband – ohne Steigerung, ohne Beschwerden, aber auch ohne Fortschritt. Ein anderer Patient trainiert täglich hart, wird aber nicht stärker und hat Schmerzen.", "impulse": [{"frage": "Was ist beim ersten Fall das Problem?", "erwartung": "Reiz unterschwellig/erhaltend – keine Anpassung (Roux)."}, {"frage": "Was beim zweiten?", "erwartung": "Reiz zu hoch/zu häufig – keine Erholung, Übertraining (vgl. Stunde 2)."}, {"frage": "Welche Regel hilft bei der Dosierung?", "erwartung": "Die Reizstufenregel nach Roux."}, {"frage": "Was muss in beiden Fällen geändert werden?", "erwartung": "Fall 1: Reiz steigern (progressive Belastung); Fall 2: Reiz reduzieren, Erholung planen."}], "ueberleitung": "Damit ein Reiz wirksam wird, muss er die individuelle Schwelle überschreiten – und danach muss Erholung folgen. Genau das beschreibt die Reizstufenregel nach Roux."}, "praesentation": {"titel": "Die Reizstufenregel und die acht Prinzipien", "min": 15, "merksatz": "Reizstufenregel (Roux): unterschwellige Reize bauen ab, schwach überschwellige erhalten, überschwellige Reize (mit Erholung) verbessern die Leistung. Acht allgemeine Trainingsprinzipien u. a.: wirksamer Belastungsreiz, optimale Relation von Belastung und Erholung, Wiederholung/Kontinuität, progressive Steigerung, Variation, Individualität/Altersgemäßheit, richtige Belastungsfolge.", "schritte": [{"ueberschrift": "Die drei Reizstufen", "text": "Tabelle Folie 24 zeigen; drei Farbstufen an die Tafel: unterschwellig (Abbau), schwach überschwellig (Erhalt), überschwellig (Aufbau).", "vortrag": "Roux unterscheidet drei Zonen. Unter der Schwelle – etwa beim bettlägerigen Patienten – baut der Körper ab. Schwach überschwellig erhält er die Funktion. Erst der überschwellige Reiz, gefolgt von Erholung, baut auf. In der Therapie heißt das: Auch 'Erhalt' ist ein Ziel – z. B. während einer Immobilisation."}, {"ueberschrift": "Acht allgemeine Trainingsprinzipien", "text": "Karteikarte 'Acht allgemeine Trainingsprinzipien' in der App; vier davon an Patientenbeispielen durchsprechen.", "vortrag": "Die Prinzipien sind das Koordinatensystem jeder Trainingssteuerung: wirksamer Reiz, Erholung, Wiederholung, Steigerung, Variation, Individualität. Besonders Individualität und Altersgemäßheit sind in der Physio zentral – zwei Patienten mit derselben Diagnose brauchen verschiedene Reize."}, {"ueberschrift": "Variation und Wiederholung", "text": "Beispiel: Kraftausdauer-Training am Gerät – Variation durch Gerätewechsel/Reihenfolge, Wiederholung durch 3×/Woche über 6 Wochen.", "vortrag": "Wiederholung macht die Anpassung dauerhaft, Variation verhindert Monotonie und einseitige Belastung. In der Therapie nutzen wir Variation gezielt, um Bewegungsmuster neu aufzubauen (vgl. Umlernen, Thema Bewegungslehre I)."}]}, "arbeitsphase": {"titel": "Roux in der Praxis", "min": 25, "sozialform": "Partnerarbeit an Fallkarten", "aufgaben": [{"titel": "Fall: Gipsbein 6 Wochen – welche Reizstufe herrscht im Muskel, was ist das Therapieziel in dieser Phase?", "text": "Fall: Gipsbein 6 Wochen – welche Reizstufe herrscht im Muskel, was ist das Therapieziel in dieser Phase?", "loesung": "Unschwellig bis schwach überschwellig; Ziel: Erhalt der Struktur (schwach überschwellige Reize), dann langsamer Aufbau.", "hilfe": "App-Quiz: 'Folgen nach Verletzung mit und ohne Rehabilitation' (sorts)."}, {"titel": "Fall: Patient steigert seit 3 Wochen nicht. Welche Prinzipien wurden verletzt?", "text": "Fall: Patient steigert seit 3 Wochen nicht. Welche Prinzipien wurden verletzt?", "loesung": "Progressive Belastungssteigerung und wirksamer Reiz – die Belastung war unterschwellig.", "hilfe": "Reizstufenregel Folie 24 als Checkliste."}, {"titel": "Fall: Training 7 Tage/Woche, harte Einheiten, Patient erschöpft.", "text": "Fall: Training 7 Tage/Woche, harte Einheiten, Patient erschöpft.", "loesung": "Prinzip der optimalen Relation von Belastung und Erholung verletzt → Übertraining. Maßnahme: Regeneration (vgl. Superkompensation).", "hilfe": "App-Quiz: 'zu hohe oder zu frühe Reizsetzung'."}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Nenne die sechs Belastungskomponenten und erläutere zwei davon.", "loesung": "- Intensität, Dauer, Frequenz, Umfang, Dichte, Komplexität\n- z. B. Intensität: prozentuale Belastungsstärke bezogen auf die individuelle Maximalleistung\n- z. B. Dichte: Verhältnis von Belastungs- und Pausenzeiten\n- (alternativ: Umfang = Trainingsmenge pro Zeit; Frequenz = Häufigkeit pro Tag/Woche/Monat)", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere sortieren die Fälle mit der Roux-Tabelle (Folie 24) als Hilfe; stärkere begründen, welches Prinzip Priorität hat und warum (Erholung vor Steigerung).", "app_uebung": "App: table 'Reizstufenregel' Folie 24, cards 'Acht allgemeine Trainingsprinzipien'/'Reizstufenregel', sorts 'Folgen nach Verletzung mit und ohne Rehabilitation', exam (4 P)."}, "sicherung": {"titel": "Prinzipien-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die drei Reizstufen nach Roux mit je einer Therapiekonsequenz und zwei allgemeine Trainingsprinzipien mit Beispiel.", "aufgaben": [{"frage": "Drei Reizstufen?", "loesung": "Unterschwellig = Abbau (z. B. Immobilisation); schwach überschwellig = Erhalt; überschwellig + Erholung = Aufbau."}, {"frage": "Zwei Prinzipien mit Beispiel?", "loesung": "z. B. progressive Steigerung (Belastung alle 2 Wochen erhöhen); Variation (Übungsreihenfolge wechseln)."}, {"frage": "Warum wird in der 4. Belastungswoche häufig eine Regenerationswoche eingeplant?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Weil die 3. Anpassungsstufe besonders störanfällig ist – Die 3. Anpassungsstufe (Optimierung der geregelten Systeme, 20.–30. Tag) gilt als besonders störanfällig, daher wird die Belastung in Woche 4 reduziert."}]}, "hausaufgabe": "Roux-Tabelle (Folie 24) und die acht Prinzipien auswendig lernen (App-Karteikarten); drei eigene Patientenbeispiele je einem Prinzip zuordnen; Prüfungsaufgabe Reizstufenregel (4 P) üben.", "hinweise": ["Fehler: 'Erhalt' wird unterschätzt – in der Akutphase (z. B. postoperativ) ist Erhalt der Struktur ein legitimes Therapieziel (schwach überschwellige Reize).", "Prinzip 'optimale Relation von Belastung und Erholung' wird vertieft bei Superkompensation (Folie 28) und lohnender Pause (Ausdauer, Folie 67).", "Roux + Neumann & Schüller sind typische Prüfungsautoren (App-exam)."], "quellen": ["Examenstrainer.html · DATA trainingslehre: table Folie 24, cards 'Acht allgemeine Trainingsprinzipien'/'Reizstufenregel', sorts, quiz, exam (4 P)", "Roux (App-Quelle), Neumann & Schüller 1994"]}, "tl-06": {"nr": 6, "id": "tl-06", "thema": "trainingslehre", "titel": "Belastungsfolge, Periodisierung und Zyklen – Training langfristig planen", "dauer": 60, "ziele": ["Die Auszubildenden erklären das Prinzip der richtigen Belastungsfolge an einem Beispiel.", "Sie unterscheiden Mikro-, Meso- und Makrozyklus.", "Sie nennen die drei Perioden der Periodisierung (Vorbereitungs-, Wettkampf-, Übergangsperiode)."], "vorwissen": "Stunden 2–5 (Superkompensation, Vier-Stufen-Modell, Methoden, Prinzipien).", "material": ["App, Beamer", "Jahresplan-Skizze an der Tafel", "Karteikarten Periodisierung/Zyklen"], "physio": "Auch Therapie ist langfristig planbar: Die Reha-Verordnung läuft über Wochen – der Therapeut plant Mikrozyklen (Woche), Mesozyklen (Phase, z. B. Aufbau-/Belastungsphase) und den Makrozyklus (gesamte Behandlungsdauer). Das Prinzip der richtigen Belastungsfolge (erst Koordination/Technik, dann Kraft, dann Ausdauer bzw. je nach Ziel) schützt den Patienten vor Überlastung.", "app": {"einsatz": ["Karteikarten: 'Prinzip der richtigen Belastungsfolge', 'Periodisierung: drei Perioden'", "Quiz: 'Welcher Trainingszyklus umfasst mehrere Tage bis zu einer Woche?' (Mikrozyklus), 'Wann kommt Variation vor allem zur Anwendung?'", "Diagramm 'Prinzip der optimalen Relation von Belastung und Erholung' (Folie 28) + Hotspot", "Fall: 'Du planst eine Einheit mit Ausdauerlauf, Kraftausdauerzirkel und Koordinationsübungen – welche Reihenfolge?' (App-Quiz)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Reihenfolgen-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Die vermischte Einheit"}, {"phase": "Präsentation", "min": 15, "inhalt": "Belastungsfolge, Zyklen, Periodisierung"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Reha-Planung in Zyklen · Gruppenarbeit (3er-Gruppen)"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Zyklus-Schnellfrage · Mündlich, Blitzlicht-Runde"}], "warmups": [{"titel": "Reihenfolgen-Raten", "art": "Quiz", "min": 5, "anleitung": "App-Quiz-Fragen zu Zyklen, Periodisierung und Belastungsfolge.", "aufgaben": [{"frage": "Welcher Zyklus umfasst mehrere Tage bis eine Woche?", "antwort": "Der Mikrozyklus."}, {"frage": "Wie heißt der Zyklus über mehrere Wochen/Monate?", "antwort": "Mesozyklus; über ein Jahr: Makrozyklus."}, {"frage": "Nenne die drei Perioden.", "antwort": "Vorbereitungs-, Wettkampf-, Übergangsperiode."}, {"frage": "Reihenfolge in einer Einheit: Ausdauer, Kraftzirkel, Koordination – richtig so?", "antwort": "Nein – Koordination zuerst (frisch), dann Kraft, zuletzt Ausdauer (App-Quiz-Fall)."}, {"frage": "Wann kommt das Prinzip der Variation vor allem zur Anwendung?", "antwort": "In der Vorbereitungsperiode / bei Stagnation, um neue Reize zu setzen."}]}, {"titel": "Plan-Schätzung", "art": "Schätzen", "min": 5, "anleitung": "Wie viele Trainingseinheiten passen realistisch in eine Woche mit 2 Physio-Tagen? Schätzen, dann begründen – trainiert das Einschätzen von Belastungsdichte.", "aufgaben": [{"frage": "Realistische Häufigkeit in der Reha?", "antwort": "2–3×/Woche (Verordnung), Pausen dazwischen (Superkompensation)."}, {"frage": "Warum nicht täglich?", "antwort": "Erholung nötig – Prinzip der optimalen Relation von Belastung und Erholung (Folie 28)."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Warum wird in der 4. Belastungswoche häufig eine Regenerationswoche eingeplant?", "antwort": "Weil die 3. Anpassungsstufe besonders störanfällig ist – Die 3. Anpassungsstufe (Optimierung der geregelten Systeme, 20.–30. Tag) gilt als besonders störanfällig, daher wird die Belastung in Woche 4 reduziert."}, {"frage": "Welche Wirkung haben schwach überschwellige Reize nach der Reizstufenregel von Roux?", "antwort": "Sie wirken funktionserhaltend – Schwach überschwellige Reize erhalten die Funktion. Erst stark überschwellige Reize führen zu optimalen Anpassungserscheinungen."}, {"frage": "Worin unterscheiden sich (Leistungs-)Sport und MTT hauptsächlich?", "antwort": "In der Zielstellung des Trainings – Sport zielt primär auf sportliche Leistung, die MTT auf Organ- und Stoffwechselfunktionen sowie Lebensqualität."}]}], "einstieg": {"titel": "Die vermischte Einheit", "min": 10, "situation": "Fall (App-Quiz): Du planst eine Einheit mit Ausdauerlauf, Kraftausdauerzirkel und Koordinationsübungen – in welcher Reihenfolge und warum?", "impulse": [{"frage": "Welche Übung zuerst?", "erwartung": "Koordination – sie braucht frische, nicht ermüdete Nerven."}, {"frage": "Dann?", "erwartung": "Kraftzirkel, dann Ausdauerlauf (Ausdauer zuletzt, da sie ermüdend wirkt)."}, {"frage": "Welches Prinzip steckt dahinter?", "erwartung": "Prinzip der richtigen Belastungsfolge."}, {"frage": "Gilt das auch in der Therapie?", "erwartung": "Ja – z. B. Gleichgewichtstraining vor erschöpfendem Krafttraining (Sturzprophylaxe)."}], "ueberleitung": "Nicht nur innerhalb einer Stunde, sondern über Wochen und Monate muss Belastung sinnvoll gereiht werden – dafür gibt es Zyklen und die Periodisierung."}, "praesentation": {"titel": "Belastungsfolge, Zyklen, Periodisierung", "min": 15, "merksatz": "Prinzip der richtigen Belastungsfolge: In einer Einheit erst koordinativ anspruchsvolle, dann Kraft-, dann Ausdauerübungen (Ermüdung verschlechtert Technik und Koordination). Zyklen: Mikrozyklus = Tage bis 1 Woche, Mesozyklus = Wochen bis Monate, Makrozyklus = Monate bis Jahre. Periodisierung: Vorbereitungs-, Wettkampf-, Übergangsperiode mit unterschiedlicher Zielsetzung.", "schritte": [{"ueberschrift": "Belastungsfolge innerhalb der Stunde", "text": "Beispiel an die Tafel: Aufwärmen → Koordination → Kraft → Ausdauer → Cool-down; App-Quiz-Fall als Bestätigung.", "vortrag": "Die Reihenfolge schützt vor Verletzungen: Eine ermüdete Muskulatur koordiniert schlechter. Deshalb steht Koordination am Anfang der Einheit, Ausdauer am Ende. In der Therapie ist das z. B. beim Sturztraining wichtig: Gleichgewicht üben, solange der Patient frisch ist."}, {"ueberschrift": "Die drei Zyklen", "text": "Pyramide an die Tafel: Makro (Jahr) → Meso (Monate) → Mikro (Woche).", "vortrag": "Jede Planungsebene hat eigene Ziele: Der Makrozyklus umfasst die gesamte Reha-Dauer, der Mesozyklus eine Behandlungsphase (z. B. Aufbauphase), der Mikrozyklus eine Woche mit ihren 2–3 Einheiten. So bleibt die Belastung steuerbar und Superkompensation wird auf jeder Ebene genutzt."}, {"ueberschrift": "Periodisierung in der Therapie", "text": "Drei Perioden an die Tafel; Mapping: Vorbereitungsperiode = Aufbau nach OP, 'Wettkampf' = Alltags-/Berufsbelastung, Übergangsperiode = Erhaltung/Prävention.", "vortrag": "Auch ohne Wettkampf periodisieren wir: Aufbau-, Belastungs- und Erhaltungsphase. Das Prinzip der optimalen Relation von Belastung und Erholung (Folie 28) ist die Leitlinie – Pausen sind geplant, nicht zufällig."}]}, "arbeitsphase": {"titel": "Reha-Planung in Zyklen", "min": 25, "sozialform": "Gruppenarbeit (3er-Gruppen)", "aufgaben": [{"titel": "Entwerft den Mikrozyklus (1 Woche) für einen Patienten 3 Wochen nach Knie-TEP (2 Einheiten/Woche).", "text": "Entwerft den Mikrozyklus (1 Woche) für einen Patienten 3 Wochen nach Knie-TEP (2 Einheiten/Woche).", "loesung": "z. B. Mo: Kraft Rumpf/Oberschenkel leicht + Gleichgewicht; Do: Ausdauer (Fahrrad) extensiv + Mobilisation; dazwischen Erholung – Dichte ca. 1:2 Tagen.", "hilfe": "Belastungsfolge beachten: Koordination vor Kraft vor Ausdauer innerhalb der Einheit."}, {"titel": "Ordne die Phasen: Wo gehört eine Regenerationswoche im 4-Wochen-Mesozyklus hin?", "text": "Ordne die Phasen: Wo gehört eine Regenerationswoche im 4-Wochen-Mesozyklus hin?", "loesung": "In die 4. Woche (Vier-Stufen-Modell, Folie 17; Superkompensation Stunde 2).", "hilfe": "App: sequence 'Stufen des Vier-Stufen-Modells', diagram Folie 17."}, {"titel": "Fall: Welche Reihenfolge in einer Einheit mit Ausdauerlauf, Kraftausdauerzirkel, Koordination?", "text": "Fall: Welche Reihenfolge in einer Einheit mit Ausdauerlauf, Kraftausdauerzirkel, Koordination?", "loesung": "Koordination → Kraftzirkel → Ausdauerlauf (App-Quiz-Fall).", "hilfe": "App-Quiz trainingslehre direkt lösen."}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Vergleiche die Dauermethode mit der Intervallmethode.", "loesung": "- Dauermethode: Belastung ohne Pause\n- Formen: kontinuierlich (konstante Intensität), wechselnd (planmäßig verändert), variabel (nach individueller Einschätzung)\n- Intervallmethode: Belastung mit lohnender Pause\n- intensiv: anaerober Stoffwechsel, 30 s–2 min; extensiv: anaerob im GA-II-Bereich, 1–8 min", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere Gruppen bekommen das Tafel-Schema (Aufwärmen→Koordination→Kraft→Ausdauer→Cool-down); stärkere begründen zusätzlich, warum die Regenerationswoche in Woche 4 des Mesozyklus liegt (Superkompensation kumuliert).", "app_uebung": "App: cards 'Prinzip der richtigen Belastungsfolge'/'Periodisierung: drei Perioden', diagram/hotspot Folie 28, quiz-Fall 'Reihenfolge', exam-Bezug 'Prinzipien'."}, "sicherung": {"titel": "Zyklus-Schnellfrage", "min": 5, "form": "Mündlich, Blitzlicht-Runde", "text": "Jede Person nennt einen Begriff – Mikro-, Meso-, Makrozyklus, Periode, Belastungsfolge – und erklärt ihn in einem Satz.", "aufgaben": [{"frage": "Mikrozyklus?", "loesung": "Ein Trainingszyklus von mehreren Tagen bis zu einer Woche."}, {"frage": "Drei Perioden?", "loesung": "Vorbereitung, Wettkampf, Übergang."}, {"frage": "Belastungsfolge?", "loesung": "Koordination → Kraft → Ausdauer innerhalb der Einheit."}, {"frage": "Optimale Relation Belastung/Erholung?", "loesung": "Geplante Pausen sichern die Anpassung (Superkompensation)."}, {"frage": "Was ist das Ziel der Tertiärprävention?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Fortschreiten oder Komplikationen einer manifesten Erkrankung verhindern – Die Tertiärprävention setzt bei einer bereits manifesten Erkrankung an und soll Fortschreiten oder Komplikationen verhindern."}]}, "hausaufgabe": "Eigenen Mikrozyklus für einen gedachten Patienten zeichnen; Karteikarten zu Zyklen/Periodisierung/Belastungsfolge lernen; App-Quiz-Fall 'Reihenfolge' wiederholen.", "hinweise": ["Fehler: Belastungsfolge wird in der Praxis oft ignoriert ('erst Ausdauer, dann Kraft') – Koordination leidet unter Ermüdung, Verletzungsrisiko steigt.", "Im Physio-Kontext: 'Wettkampfperiode' heißt konkret die Phase der Alltags-/Berufsbelastung – das Therapieziel Teilhabe (ICF, Stunde 1).", "Folie 28 (optimale Relation) ist prüfungsrelevant und Hotspot in der App."], "quellen": ["Examenstrainer.html · DATA trainingslehre: cards 'Prinzip der richtigen Belastungsfolge'/'Periodisierung: drei Perioden', diagrams+hotspots Folie 28, quiz-Fälle"]}, "tl-07": {"nr": 7, "id": "tl-07", "thema": "trainingslehre", "titel": "Aufwärmen (Warm-up) und Abwärmen (Cool-down) – Verletzungsprophylaxe durch richtige Rahmung", "dauer": 60, "ziele": ["Die Auszubildenden nennen Arten des Aufwärmens und Richtwerte für Einarbeitungszeit und Abstand zum Wettkampf.", "Sie erläutern die physiologischen Wirkungen des Aufwärmens (Temperaturanstieg, Leistungsbereitschaft).", "Sie begründen Dauer und Inhalt des Cool-downs."], "vorwissen": "Stunden 1–6 (MTT, Superkompensation, Methoden, Prinzipien).", "material": ["App, Beamer", "Stoppuhr, Therabänder, kleine Bälle", "Planer 'Auf- und Abwärmen' (Folien 40–42)"], "physio": "Jede Therapieeinheit beginnt mit einem Aufwärmen und endet mit einem Cool-down – das senkt das Verletzungsrisiko (Muskelzerrung, Sehnenirritation) und bereitet den Patienten auf die Belastung vor bzw. führt ihn in die Erholung zurück. Beim älteren Patienten ist das Aufwärmen wegen der langsameren Durchblutung und Temperaturregulation besonders wichtig.", "app": {"einsatz": ["Diagramme: 'Temperaturanstieg beim Aufwärmen (Asmussen/Böje 1945)' (Folie 35), 'Wirkung des Aufwärmens im 3000-m-Fahrradergometertest (Hajoglou et al. 2005)' (Folie 39)", "Planer 'Auf- und Abwärmen' (Folien 40–42)", "Karteikarten: 'Arten des Aufwärmens', 'Abwärmen (Cool-down)'", "Quiz: optimale Einarbeitungszeit, Abstand Aufwärmen–Wettkampf, Cool-down-Dauer, Aufwärmen zur Verletzungsprophylaxe, Fall 'älterer Patient bei Kälte'", "Prüfungsaufgabe: Auswirkungen des Aufwärmens, Faktoren für Dauer/Intensität (6 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Temperatur-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der kalte Patient"}, {"phase": "Präsentation", "min": 15, "inhalt": "Aufwärmen und Abwärmen als feste Bausteine"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Einheiten-Rahmung planen · Partnerarbeit am Planer"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Rahmungs-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Temperatur-Raten", "art": "Schätzen", "min": 5, "anleitung": "Um wie viel Grad steigt die Muskeltemperatur beim Aufwärmen ca.? Schätzen, dann App-Diagramm Folie 35 zeigen.", "aufgaben": [{"frage": "Anstieg der Muskeltemperatur?", "antwort": "ca. 2–3 °C auf ~39 °C (Folie 35, Asmussen/Böje 1945)."}, {"frage": "Wirkung auf die Leistung?", "antwort": "Höhere Temperatur beschleunigt Stoffwechsel und Nervenleitung – Leistung steigt (3000-m-Test, Folie 39)."}, {"frage": "Wie lange dauert optimales Aufwärmen vor Wettkampf?", "antwort": "Vor Wettkampf 20–40 min, vor Training 15–30 min (Weineck 2009, App-Quiz)."}]}, {"titel": "Aktivierungs-Blitz", "art": "Bewegung", "min": 5, "anleitung": "2 Minuten активes Aufwärmen in der Gruppe (Gelenkmobilisation, leichtes Hüpfen); danach Puls messen und vergleichen.", "aufgaben": [{"frage": "Was passiert mit dem Puls?", "antwort": "Er steigt an (Herz-Kreislauf-Aktivierung)."}, {"frage": "Warum Gelenkmobilisation zuerst?", "antwort": "Schmierung der Gelenke, Vorbereitung der Muskulatur."}, {"frage": "Was ist das Ziel des Aufwärmens?", "antwort": "Verletzungsprophylaxe + Leistungsbereitschaft (App-Quiz)."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Was ist das Ziel der Tertiärprävention?", "antwort": "Fortschreiten oder Komplikationen einer manifesten Erkrankung verhindern – Die Tertiärprävention setzt bei einer bereits manifesten Erkrankung an und soll Fortschreiten oder Komplikationen verhindern."}, {"frage": "Was bedeutet das aktivitäts- und teilhabeorientierte Therapieziel?", "antwort": "Wiederbefähigung zur vollen Teilhabe am gesellschaftlichen und beruflichen Leben – Aktivitäts- und teilhabeorientiert heißt
