bellen 'Lebensphasen' (Folien 48/49)"], "physio": "Beweglichkeitstraining bei Kindern ist keine Verkleinerung des Erwachsenentrainings: spielerisch, nie schmerzhaft, nie ruckartig (Wachstumsfugen!), mit den sensiblen Phasen (Beweglichkeit früh) und dem Wachstumsschub in der Pubertät im Blick. In der pädiatrischen Physio (z. B. Skoliose, Juvenile Arthritis) ist das die Grundlage sicherer Behandlung.", "app": {"einsatz": ["Diagramm 'Modell der sensiblen Phasen (Martin 1982)' (Folie 67)", "Quiz: 'Besonderheiten des Beweglichkeitstrainings in der Pubertät' (exam 4 P), 'Grundsätze für Beweglichkeitstraining im Kindes-/Jugendalter' (App-card), 'Krafttraining im Kindes-/Jugendalter' (Kraft Std. 21, Faigenbaum)", "Karteikarten: 'Grundsätze für Beweglichkeitstraining im Kindes-/Jugendalter', 'Beweglichkeit in der Pubertät' (App)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Kinder-Grundsätze (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Soll das Kind dehnen?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Kindgerechtes Beweglichkeitstraining"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Kindgerechte Programme entwerfen · Gruppenarbeit (3er) mit App-cards und Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Kinder-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Kinder-Grundsätze", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Grundsätzen des Beweglichkeitstrainings bei Kindern.", "aufgaben": [{"frage": "Spielerisch?", "antwort": "Ja – nie leistungsorientiert, nie schmerzhaft (App-card 'Grundsätze…')."}, {"frage": "Ruckartig?", "antwort": "Nein – Wachstumsfugen gefährdet (App-card)."}, {"frage": "Dauer?", "antwort": "kurz, häufig, in den Alltag eingebaut (App-card)."}, {"frage": "Sensible Phase Beweglichkeit?", "antwort": "frühes Kindesalter (Folie 67) – Fenster nutzen (App-diagram)."}]}, {"titel": "Pubertäts-Rätsel", "art": "Rätsel", "min": 5, "anleitung": "Was ändert sich in der Pubertät für die Beweglichkeit (exam 4 P)? – App-Quiz + Folien 45/67.", "aufgaben": [{"frage": "Wachstumsschub?", "antwort": "Knochen schneller als Muskeln/Sehnen → vorübergehend steifer, ungelenk (Folien 45/67)."}, {"frage": "Konsequenz?", "antwort": "Beweglichkeit jetzt besonders pflegen; Kraftfenster öffnet sich (Folie 67) (App-exam 4 P)."}, {"frage": "Vorsicht?", "antwort": "Wachstumsfugen, Skoliose-Risiko im Schub (Std. 46/48)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Warum ist Krafttraining vor der Pubertät nicht besonders lohnend?", "antwort": "Der Testosteronspiegel ist im Vergleich zum Erwachsenen sehr niedrig – Erst mit dem pubertären Testosteronanstieg steigt der Muskelanteil deutlich an."}, {"frage": "Was kennzeichnet ein labiles Gleichgewicht?", "antwort": "Lageänderungen zerstören das Gleichgewicht, es erfolgt keine Rückkehr – Stabil: Rückstellkräfte; labil: keine Rückkehr; indifferent: neue Gleichgewichtslagen."}, {"frage": "Wie unterscheidet sich „posturale Kontrolle“ nach Pollock von „Balance“?", "antwort": "Sie meint eine Handlung, um Balance in jeder Haltung zu erhalten, zu erlangen oder wiederzuerlangen – Balance ist die Fähigkeit, nicht zu fallen (KSP über USFL); posturale Kontrolle geht darüber hinaus und umfasst jede Haltung oder Aktivität."}]}], "einstieg": {"titel": "Soll das Kind dehnen?", "min": 10, "situation": "Fall: Eltern fragen: 'Unser 8-Jähriger ist steif – soll er abends dehnen wie wir?' – was antwortest du (Grundsätze, sensible Phasen)?", "impulse": [{"frage": "Grundsätze?", "erwartung": "Spielerisch, nie schmerzhaft/ruckartig, kurz, in den Alltag integriert – nicht wie Erwachsene (App-card)."}, {"frage": "Fenster?", "erwartung": "Beweglichkeit hat früh ein sensibelens Fenster (Folie 67) – jetzt nutzen, aber kindgerecht."}, {"frage": "Elternberatung?", "erwartung": "Alltagsbewegung (klettern, schwimmen, toben) > Dehnprogramm (App-card + Prävention TL Std. 1)."}, {"frage": "App-Bezug?", "erwartung": "App: card 'Grundsätze…', diagram Folie 67."}], "ueberleitung": "Beweglichkeitstraining bei Kindern folgt eigenen Regeln – nie wie bei Erwachsenen. Heute: Grundsätze, Pubertät und die sensiblen Phasen im Programm."}, "praesentation": {"titel": "Kindgerechtes Beweglichkeitstraining", "min": 15, "merksatz": "Grundsätze (App-card): spielerisch, nie schmerzhaft oder ruckartig (Wachstumsfugen!), kurze Einheiten, häufig, alltagsintegriert; sensible Phase Beweglichkeit = frühes Kindesalter (Folie 67). Pubertät (exam 4 P): Wachstumsschub macht vorübergehend steif/ungelenk (Folien 45/67) – Beweglichkeit pflegen, Kraftfenster ab Pubertät nutzen; Skoliose-Screening im Schub. Kombination mit Claparède (Std. 46): Kind ≠ Miniaturerwachsener.", "schritte": [{"ueberschrift": "Grundsätze im Kindesalter", "text": "App-card 'Grundsätze für Beweglichkeitstraining im Kindes-/Jugendalter' aufdecken; Beispiele: Dehnen als Spiel (Tier-Dehnungen), Alltag (klettern, schwimmen).", "vortrag": "Bei Kindern trainieren wir Beweglichkeit spielerisch und alltagsintegriert – nie schmerzhaft, nie ruckartig (Wachstumsfugen!). Nach Weineck sind aktive, spielerische Dehnübungen im Zentrum – passives Stretching ist für Kinder eher nicht geeignet (Verletzungsgefahr minimal bei aktiven Formen) (App-Quiz). Bis zum 10. Lebensjahr: überwiegend allgemein und aktiv, oft verbunden mit Kräftigung (App-Quiz). Kurze, häufige Einheiten sind besser als lange Dehnprogramme. Das sensible Fenster der Beweglichkeit liegt im frühen Kindesalter (Folie 67) – wir nutzen es, indem wir Kinder vielseitig bewegen lassen."}, {"ueberschrift": "Pubertät: besonderes Fenster", "text": "Diagramm Folie 67 + Folie 45 zeigen; exam (4 P) vorbereiten: Besonderheiten des Beweglichkeitstrainings in der Pubertät.", "vortrag": "In der Pubeszenz wächst der Körper um 8–10 cm/Jahr – die Dehnfähigkeit von Muskeln und Bändern hinkt hinterher, Wirbelsäule und Hüfte sind besonders gefährdet: Überlastungen unbedingt vermeiden (App-Quiz). Der Knochen wächst schneller als Muskel/Sehne – das Kind wirkt vorübergehend steif und ungelenk (Folien 45/67); sanftes, kontinuierliches Beweglichkeitstraining schützt vor Verletzungen. Gleichzeitig öffnet sich das Kraftfenster (Folie 67): Erst ab der Pubertät bauen wir Kraft systematisch auf (Faigenbaum, Kraft Std. 21). Im Wachstumsschub achten wir besonders auf Skoliose (Std. 48)."}, {"ueberschrift": "Programm kombinieren", "text": "Beispiel-Wochenplan für eine 10-jährige Skoliose-Patientin: Beweglichkeit (sensibles Fenster) + Koordination + Rumpfstabilität – nie Maximalkraft (App-cards + TL Std. 8).", "vortrag": "Ein kindgerechtes Programm kombiniert die sensiblen Phasen: Beweglichkeit und Koordination früh fördern, Kraft erst ab der Pubertät, immer altersgemäß und individuell (TL Std. 8). Bei pädiatrischen Patienten (z. B. Skoliose) ist das die Grundlage der konservativen Therapie."}]}, "arbeitsphase": {"titel": "Kindgerechte Programme entwerfen", "min": 25, "sozialform": "Gruppenarbeit (3er) mit App-cards und Fallkarten", "aufgaben": [{"titel": "Entwerfe ein Beweglichkeitsprogramm für einen 8-Jährigen (spielerisch, alltagsintegriert, Grundsätze).", "text": "Entwerfe ein Beweglichkeitsprogramm für einen 8-Jährigen (spielerisch, alltagsintegriert, Grundsätze).", "loesung": "z. B. 3×/Woche 15 min 'Tier-Dehnungen' (Katze-Kuh, Cobra), Klettern/Schwimmen, nie schmerzhaft/ruckartig (App-card 'Grundsätze…', Folie 67).", "hilfe": "App: card 'Grundsätze für Beweglichkeitstraining im Kindes-/Jugendalter'."}, {"titel": "Fall: 14-jährige Turnerin im Wachstumsschub – Besonderheiten Beweglichkeit (exam 4 P)?", "text": "Fall: 14-jährige Turnerin im Wachstumsschub – Besonderheiten Beweglichkeit (exam 4 P)?", "loesung": "Steifigkeit durch Schub → sanftes, regelmäßiges Dehnen/Mobilisieren; Kraftfenster nutzen (Folie 67); Skoliose-Screening (App-exam 4 P).", "hilfe": "App: exam bewegungslehre2 (4 P) 'Pubertät'."}, {"titel": "Fall: Eltern wollen 6-Jährigen 'hart dehnen' – Beratung formulieren (Claparède + Grundsätze).", "text": "Fall: Eltern wollen 6-Jährigen 'hart dehnen' – Beratung formulieren (Claparède + Grundsätze).", "loesung": "Nein – Kind ist kein Miniaturerwachsener (Claparède, Std. 46); stattdessen vielseitige Alltagsbewegung, spielerisches Dehnen (App-cards).", "hilfe": "App: card 'Grundsätze…' + 'Kleine Erwachsene? (Claparède)'."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Nenne fünf Faktoren, die begrenzend auf die Flexibilität wirken, und ordne sie mechanischen bzw. weiteren Faktoren zu.", "loesung": "- Mechanisch: Struktur der Gelenke\n- Mechanisch: Umfang der Muskelmasse\n- Mechanisch: Dehnfähigkeit von Muskeln/Faszien, Sehnen, Bändern, Gelenkkapseln, Haut\n- Mechanisch: postoperative/posttraumatische Zustände\n- Weitere: Psyche (ängstlich → gehemmt), Kälte, Tageszeit, Ermüdungs-/Aufwärmzustand, Schmerz, Alter\n- (je korrekt genanntem und zugeordnetem Faktor 1 Punkt)", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit der App-card 'Grundsätze' als Checkliste; stärkere begründen am Beispiel Skoliose im Wachstumsschub, warum die Kombination Beweglichkeit + Rumpfstabilität (nicht Maximalkraft) evidenzbasiert ist (Folie 67, Kraft Std. 21).", "app_uebung": "App: diagram Folie 67, cards 'Grundsätze…'/'Kleine Erwachsene?', quiz, exam (4 P); diagrams Folien 45/48/49."}, "sicherung": {"titel": "Kinder-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne drei Grundsätze des kindgerechten Beweglichkeitstrainings und die Besonderheit in der Pubertät (Wachstumsschub).", "aufgaben": [{"frage": "Grundsätze?", "loesung": "Spielerisch, nie schmerzhaft/ruckartig (Wachstumsfugen), kurz + häufig + alltagsintegriert (App-card)."}, {"frage": "Pubertät?", "loesung": "Wachstumsschub → vorübergehend steif; Beweglichkeit pflegen, Kraftfenster ab Pubertät (Folien 45/67, exam 4 P)."}, {"frage": "Aus welchen drei Komponenten ergibt sich die posturale Kontrolle im Interaktionsmodell?  [App-Quiz: Bewegungslehre II]", "loesung": "Individuum, Aufgabe und Umwelt – PK entsteht aus der Interaktion von Individuum, Aufgabe und Umwelt; Motorik, Sensorik und Kognition sind Einflussfaktoren innerhalb des Individuums."}]}, "hausaufgabe": "App-card 'Grundsätze für Beweglichkeitstraining im Kindes-/Jugendalter' auswendig; exam-Aufgabe Pubertät (4 P) üben; Diagramm Folie 67 analysieren; kindgerechtes Beweglichkeitsprogramm für ein Beispiel entwerfen.", "hinweise": ["Fehler: Kinder-Dehnen wie Erwachsene (ruckartig, schmerzhaft) – Wachstumsfugen gefährdet (App-card).", "Pubertät: Wachstumsschub nicht beachtet → Verletzungsrisiko (Folien 45/67, exam 4 P).", "Claparède + Faigenbaum + Martin verknüpfen (Std. 46, Kraft Std. 21, Folie 67)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: diagram Folie 67, cards 'Grundsätze…', quiz, exam (4 P)", "Martin 1982 (App-Quelle Folie 67)"]}, "b2-50": {"nr": 50, "id": "b2-50", "thema": "bewegungslehre2", "titel": "Praxisstunde: Therapieplanung an Patientenfällen (Dehnen, Gleichgewicht, Haltung) + Prüfungsblick BL II", "dauer": 60, "ziele": ["Die Auszubildenden planen an realen Patientenfällen Dehn-, Gleichgewichts- und Haltungsmaßnahmen (Ziel → Methode → Dosierung).", "Sie begründen ihre Planung mit sensiblen Phasen, Dehnen je nach Ziel und Interaktionsmodell.", "Sie bearbeiten prüfungsrelevante Examensaufgaben aus dem gesamten Thema Bewegungslehre II."], "vorwissen": "Alle Stunden 41–49 (gesamte BL II) + BL I + TL + Kraft/Ausdauer (Querschnitt).", "material": ["App mit allen BL-II-Übungen, Beamer", "Fallkarten (3 Patientenfälle)", "Prüfungsaufgaben (exam, 8 Aufgaben) als Ausdruck"], "physio": "Abschlussstunde des Themenfelds: An drei Patientenfällen (Jugendlicher mit Hohlrundrücken, Seniorin mit Sturzangst, Patientin nach Knie-OP mit Extensiondefizit) wird das gesamte BL-II-Wissen praktisch verknüpft – genau so plant die Physio im Alltag. Anschließend Prüfungsblick: alle 8 exam-Aufgaben des Themas.", "app": {"einsatz": ["Alle App-Elemente Thema bewegungslehre2: quiz (40), cards (30), sorts (3), sequences (4), diagrams (10), planner (3), tables (3), exam (8 Aufgaben, 4–6 P)", "App-Fallbeispiele (LA_CASES) als Ergänzung", "Prüfungsaufgaben: 5 Faktoren Flexibilität, PNF-Methoden, Vorbereitung vs. Regeneration, Pubertät, Claparède, posturale Kontrolle, Gleichgewichtsarten, Hohlrundrücken"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Fall-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Drei Fälle, drei Domänen"}, {"phase": "Präsentation", "min": 15, "inhalt": "Planungsschritte für die drei Domänen (Wiederholung mit Prüfungsfokus)"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Fallplanungen in der Gruppe + exam · Gruppenarbeit (3er, je ein Fall) + Einzelarbeit exam in der App"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Abschluss-Check BL II · Schriftlich, einzeln"}], "warmups": [{"titel": "Fall-Blitz", "art": "Quiz", "min": 5, "anleitung": "Drei BL-II-Quiz-Fälle (App) als schneller Einstieg – welche Domäne (Dehnen/Gleichgewicht/Haltung/Entwicklung)?", "aufgaben": [{"frage": "Hohlrundrücken beim Jugendlichen?", "antwort": "Haltung (Std. 48)."}, {"frage": "Sturzangst im Alter?", "antwort": "Gleichgewicht/posturale Kontrolle (Std. 47)."}, {"frage": "Extensiondefizit nach Knie-OP?", "antwort": "Flexibilität/Dehnen je nach Ziel (Std. 41–43)."}]}, {"titel": "Methoden-Memory", "art": "Spiel", "min": 5, "anleitung": "Karteikarten-Memory: Dehnmethoden (PNF), Gleichgewichtsarten, Haltungsschwächen – Begriffe zuordnen.", "aufgaben": [{"frage": "CR-Stretching?", "antwort": "Zielmuskel anspannen→lösen→dehnen (postisometrische Relaxation) (Std. 42)."}, {"frage": "Reaktives Gleichgewicht?", "antwort": "Störung ausgleichen (Std. 47)."}, {"frage": "Hohlrundrücken?", "antwort": "BWS-Kyphose ↑, Schultern vor (Std. 48)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Aus welchen drei Komponenten ergibt sich die posturale Kontrolle im Interaktionsmodell?", "antwort": "Individuum, Aufgabe und Umwelt – PK entsteht aus der Interaktion von Individuum, Aufgabe und Umwelt; Motorik, Sensorik und Kognition sind Einflussfaktoren innerhalb des Individuums."}, {"frage": "Was zeigt die lange Reflexzeit posturaler Synergien von über 100–150 ms an?", "antwort": "Die Beteiligung supraspinaler Zentren – Die langen Latenzen sprechen für eine Verarbeitung oberhalb des Rückenmarks (Hirnstamm)."}, {"frage": "Welcher Ebene im Nervensystem werden im Modell der posturalen Kontrolle posturale Synergien und posturale Flexibilität zugeordnet?", "antwort": "Hirnstamm, Kleinhirn, Basalganglien – Im Ebenenmodell: Kortex = Aufmerksamkeit, Hirnstamm/Kleinhirn/Basalganglien = posturale Synergien und Flexibilität, Rückenmark = Reflexe. Nervenbahnen sind keine Ebene dieses Modells."}]}], "einstieg": {"titel": "Drei Fälle, drei Domänen", "min": 10, "situation": "Fallkarten: (A) 15-jähriger Schüler mit Hohlrundrücken; (B) 82-jährige Seniorin mit Sturzangst; (C) Patientin 6 Wochen nach Knie-OP mit Extensiondefizit. Welche Domäne (Haltung/Gleichgewicht/Flexibilität), welches Therapieziel?", "impulse": [{"frage": "A?", "erwartung": "Haltung: Brust dehnen, Rücken kräftigen, BWS mobilisieren, Ergonomie (Std. 48)."}, {"frage": "B?", "erwartung": "Gleichgewicht: Interaktionsmodell (Folie 94) → Training + Umwelt (Licht, Haltegriffe) (Std. 47)."}, {"frage": "C?", "erwartung": "Flexibilität: Extensiondefizit → nach Aufwärmen mobilisieren/dehnen je nach Heilungsphase (Std. 41–44)."}, {"frage": "App-Bezug?", "erwartung": "App: alle BL-II-sorts/diagrams/exam."}], "ueberleitung": "Jetzt wenden wir das gesamte BL-II-Wissen praktisch an: drei Patientenfälle planen – wie im echten Physio-Alltag und im Examen."}, "praesentation": {"titel": "Planungsschritte für die drei Domänen (Wiederholung mit Prüfungsfokus)", "min": 15, "merksatz": "Haltung (Std. 48): Inspektion + Lot → Schwäche erkennen → Dehnen (verkürzte Muskeln, PNF) + Kräftigen (schwache Muskeln) + Mobilisation + Ergonomie. Gleichgewicht (Std. 47): Interaktionsmodell (Individuum/Aufgabe/Umwelt, Folie 94) → drei Gleichgewichtsarten trainieren (statisch/dynamisch/reaktiv) → Analysatoren fordern (Augen zu, instabiler Untergrund). Flexibilität (Std. 41–44): begrenzende Faktoren klären (mechanisch/neuronal) → Ziel wählen (Vorbereitung/Regeneration/allgemein, Folien 15–17) → Methode (PNF/passiv-statisch/aktiv-dynamisch) → nie kalt dehnen (Folie 23).", "schritte": [{"ueberschrift": "Fall A: Hohlrundrücken (Haltung)", "text": "Lot-Abweichung (Kopf/Schultern vor) → PNF-Dehnung Brust (CR) + Kraft Rückenstrecker (Stufenmodell) + BWS-Mobilisation + Ergonomie-Beratung; Wachstumsschub beachten (Skoliose-Screening, Folien 45/48).", "vortrag": "Die Haltung planen wir systematisch: Inspektion und Lot zeigen die Schwäche, dann kombinieren wir Dehnen, Kräftigen und Mobilisation – und beraten zur Ergonomie. Beim Jugendlichen im Wachstumsschub denken wir an Skoliose (Std. 46/48)."}, {"ueberschrift": "Fall B: Sturzprophylaxe (Gleichgewicht)", "text": "Interaktionsmodell (Folie 94): Individuum (Kraft/Gleichgewicht/Sehen/Medikamente), Aufgabe (langsamer, Licht), Umwelt (Nachtlicht, Haltegriffe, Stolperfallen) → Training statisch/dynamisch/reaktiv, gesichert (Std. 47).", "vortrag": "Beim älteren Patienten analysieren wir das Sturzrisiko mit dem Interaktionsmodell: Individuum, Aufgabe und Umwelt (Folie 94). Daraus leiten wir Training (alle drei Gleichgewichtsarten, immer gesichert!) und Umweltanpassungen ab – das senkt Stürze nachweislich."}, {"ueberschrift": "Fall C: Extensiondefizit nach Knie-OP (Flexibilität)", "text": "Begrenzende Faktoren klären (Schmerz/Schwellung/Tonus vs. Kapsel/Muskel, Std. 41) → erst Aufwärmen (Folie 23/35) → Mobilisation + Dehnen je nach Ziel (Folien 15–17) → Verlauf messen (ROM aktiv/passiv).", "vortrag": "Beim Extensiondefizit klären wir zuerst, was begrenzt: Schmerz, Schwellung oder mechanische Strukturen (Std. 41). Dann wärmen wir auf (nie kalt dehnen, Folie 23), mobilisieren und dehnen je nach Ziel (Folien 15–17) – und messen den Verlauf (ROM aktiv/passiv). So wird die Beweglichkeit systematisch wiederhergestellt."}]}, "arbeitsphase": {"titel": "Fallplanungen in der Gruppe + exam", "min": 25, "sozialform": "Gruppenarbeit (3er, je ein Fall) + Einzelarbeit exam in der App", "aufgaben": [{"titel": "Fall A (Hohlrundrücken): 4-Wochen-Plan mit Dehnen (PNF CR Brust), Kraft (Rückenstrecker, Stufe 2–3), Mobilisation, Ergonomie – App-Bezug?", "text": "Fall A (Hohlrundrücken): 4-Wochen-Plan mit Dehnen (PNF CR Brust), Kraft (Rückenstrecker, Stufe 2–3), Mobilisation, Ergonomie – App-Bezug?", "loesung": "App: sorts 'Haltungsschwächen', exam (6 P Hohlrundrücken), card 'PNF CR', Kraft planner Folien 71–72.", "hilfe": "App: exam bewegungslehre2 (6 P), sorts, cards."}, {"titel": "Fall B (Sturzprophylaxe): Interaktionsmodell (Folie 94) ausfüllen + 4-Wochen-Gleichgewichtstraining (Progression gesichert).", "text": "Fall B (Sturzprophylaxe): Interaktionsmodell (Folie 94) ausfüllen + 4-Wochen-Gleichgewichtstraining (Progression gesichert).", "loesung": "App: diagram Folie 94, exam (5 P Strategien + 6 P Interaktionsmodell), diagrams Folien 89–90.", "hilfe": "App: exam bewegungslehre2 (5 P/6 P), diagram Folie 94."}, {"titel": "Fall C (Extensiondefizit): Faktoren klären → Aufwärmen → Mobilisation/Dehnen je nach Heilungsphase → ROM-Verlauf messen.", "text": "Fall C (Extensiondefizit): Faktoren klären → Aufwärmen → Mobilisation/Dehnen je nach Heilungsphase → ROM-Verlauf messen.", "loesung": "App: sorts 'Begrenzende Faktoren', table Folien 15–17, planner Folien 15–17, diagram Folie 23.", "hilfe": "App: sorts/diagrams/planner bewegungslehre2."}, {"titel": "Prüfungsblick: alle 8 exam-Aufgaben bewegungslehre2 in der App durchgehen (Lösungen vergleichen).", "text": "Prüfungsblick: alle 8 exam-Aufgaben bewegungslehre2 in der App durchgehen (Lösungen vergleichen).", "loesung": "App: exam bewegungslehre2 (8 Aufgaben, 4–6 P).", "hilfe": "App: exam bewegungslehre2."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Erläutere die drei PNF-Dehnmethoden (AC-, CR- und CRAC-Stretching) und ihren jeweils beabsichtigten Wirkmechanismus.", "loesung": "- PNF = Propriozeptive neuromuskuläre Fazilitation\n- AC (Antagonist-Contract): Antagonist wird während der Dehnung isometrisch angespannt\n- → reziproke (Vorwärts-)Hemmung des Zielmuskels (über Renshaw-Zellen)\n- CR (Contract-Relax): maximale isometrische Kontraktion des Zielmuskels vor der Dehnung\n- → Erregung der Sehnenspindeln, autogene Hemmung des Dehnungsreflexes\n- CRAC: Kombination – erst Zielmuskel anspannen, dann AC; autogene und reziproke Hemmung wirken zusammen", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere bearbeiten die App-exam-Aufgaben mit Lösungsanzeige; stärkere formulieren zwei exam-Aufgaben (z. B. Hohlrundrücken 6 P, posturale Kontrolle 6 P) schriftlich und vergleichen mit der App-Lösung.", "app_uebung": "App: gesamtes Thema bewegungslehre2 (quiz/cards/sorts/sequences/diagrams/tables/planner/exam) + LA_CASES."}, "sicherung": {"titel": "Abschluss-Check BL II", "min": 5, "form": "Schriftlich, einzeln", "text": "Formuliere für einen der drei Fälle in drei Sätzen: Domäne, Ziel, wichtigste Maßnahme mit App-Bezug (Folie/Übung).", "aufgaben": [{"frage": "Beispiel Fall B?", "loesung": "Gleichgewicht; Ziel: Sturzprophylaxe; Maßnahme: Interaktionsmodell (Folie 94) + Training aller drei Gleichgewichtsarten + Umweltanpassung (App-diagram Folie 94, exam 6 P)."}, {"frage": "Wichtig?", "loesung": "Domäne erkennen, Ziel formulieren (ICF), Maßnahme begründen – das ist die exam-Struktur."}, {"frage": "Wie ist die Beckenstellung typischerweise bei Hohlrücken bzw. Flachrücken?  [App-Quiz: Bewegungslehre II]", "loesung": "Hohlrücken: Becken nach vorne gekippt; Flachrücken: Becken nach hinten gekippt – Beckenstellung und Wirbelsäulenkrümmung sind funktionell verbunden: Hyperlordose geht mit Beckenkippung nach vorn einher."}]}, "hausaufgabe": "Alle 8 exam-Aufgaben bewegungslehre2 in der App wiederholen; 30 Karteikarten des Themas lernen (Spaced Repetition in der App); drei eigene Patientenfälle aus der Praxis den drei Domänen (Haltung/Gleichgewicht/Flexibilität) zuordnen.", "hinweise": ["Fehler: Fälle ohne Zielbezug geplant – im Examen zählt das ICF-Ziel (Aktivität/Teilhabe, TL Std. 1).", "Sicherheit beim Gleichgewichtstraining nie vergessen (sichern!) – auch in der Planung.", "Autoren BL II prüfungsrelevant: Fröböse/Nellessen/Wilke 2003, Hoster 1987, Zaciorskij, Weineck 2009, Scammon, Tanner 1979, Martin 1982, Claparède 1937 (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2 (vollständig: quiz 40, cards 30, sorts, sequences, diagrams, tables, planner, exam 8 Aufgaben) + LA_CASES"]}}, "reihenfolge": ["tl-01", "tl-02", "tl-03", "tl-04", "tl-05", "tl-06", "tl-07", "tl-08", "tl-09", "kr-10", "kr-11", "kr-12", "kr-13", "kr-14", "kr-15", "kr-16", "kr-17", "kr-18", "kr-19", "kr-20", "kr-21", "au-22", "au-23", "au-24", "au-25", "au-26", "au-27", "au-28", "au-29", "au-30", "au-31", "b1-32", "b1-33", "b1-34", "b1-35", "b1-36", "b1-37", "b1-38", "b1-39", "b1-40", "b2-41", "b2-42", "b2-43", "b2-44", "b2-45", "b2-46", "b2-47", "b2-48", "b2-49", "b2-50"]};

<script>
(function(){
  const D = window.TL_LEHRER;
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const themaOf = id => D.themen.find(t => t.id === id);
  document.getElementById("h-sub").textContent =
    D.meta.gesamtstunden + " Unterrichtsstunden · je " + D.meta.min_pro_stunde + " Min · " +
    D.meta.muster + " · Kontext: " + D.meta.fach;

  function sidebar(filter){
    const f = (filter||"").toLowerCase();
    let h = "";
    D.themen.forEach(t => {
      const items = t.stunden.map(id => D.stunden[id]).filter(s =>
        !f || (s.nr+" "+s.titel+" "+s.thema).toLowerCase().includes(f));
      if (!items.length) return;
      h += '<div class="tf"><div class="tf-kopf" style="color:'+t.farbe+'"><span class="dot" style="background:'+t.farbe+'"></span>'+
           esc(t.name)+' <span class="muted" style="font-weight:400;font-size:.75rem">'+items.length+' Std.</span></div>'+
           '<div class="tf-info">'+esc(t.info)+'</div><ol class="stunden">';
      items.forEach(s => {
        h += '<li data-id="'+s.id+'"'+(state.id===s.id?' class="an"':"")+'><button onclick="TL.show(\''+s.id+'\')">'+
             '<span class="nr">'+s.nr+'</span><span>'+esc(s.titel)+'</span><span class="mini">'+s.dauer+'′</span></button></li>';
      });
      h += '</ol></div>';
    });
    $("#sidebar").innerHTML = h;
  }

  const state = {id: D.reihenfolge[0], wu: 0};

  function ablaufBalken(s){
    const total = s.ablauf.reduce((a,p)=>a+p.min,0);
    const cols = {"Warm-up":"#2A5BD7","Einstieg":"#7448D0","Präsentation":"#0B8F80","Arbeitsphase":"#C8432C","Ergebnissicherung":"#E5A800"};
    let h = '<div class="ablauf">';
    s.ablauf.forEach(p => {
      h += '<div style="width:'+(p.min/total*100)+'%;background:'+(cols[p.phase]||"#888")+'" title="'+esc(p.phase)+" – "+p.min+" Min – "+esc(p.inhalt)+'">'+p.min+'′</div>';
    });
    h += '</div><div class="ablauf-sum">Ablauf: '+s.ablauf.map(p=>p.phase+" "+p.min+"′").join(" → ")+' = '+total+' Min</div>';
    return h;
  }

  function warmups(s){
    let h = '<div class="wu-optionen">';
    s.warmups.forEach((w,i) => {
      h += '<div class="wu'+(state.wu===i?' an':'')+'" onclick="TL.wu('+i+')">'+
           '<div class="art">'+esc(w.art)+' · '+w.min+' Min</div><b>'+esc(w.titel)+'</b>'+
           '<p class="muted" style="font-size:.85rem">'+esc(w.anleitung)+'</p></div>';
    });
    h += '</div>';
    const w = s.warmups[state.wu];
    h += '<div class="kasten" style="margin-top:10px"><b>Ausgewähltes Warm-up: '+esc(w.titel)+'</b> <span class="chip">'+esc(w.art)+'</span><span class="chip">'+w.min+' Min</span>'+
         '<p class="muted">'+esc(w.anleitung)+'</p>'+
         '<table><tr><th>Aufgabe</th><th>Antwort (klicken zum Aufdecken)</th></tr>'+
         w.aufgaben.map((a,i)=>'<tr><td>'+esc(a.frage)+'</td><td><button class="los-btn" onclick="this.nextElementSibling.classList.toggle(\'auf\');this.textContent=this.textContent==\'anzeigen\'?\'verbergen\':\'anzeigen\'">anzeigen</button><div class="los">'+esc(a.antwort)+'</div></td></tr>').join('')+
         '</table></div>';
    return h;
  }

  function phaseEinstieg(s){
    const e = s.einstieg;
    return '<h3>2 · Einstieg <span class="chip">'+e.min+' Min</span></h3>'+
      '<div class="kasten"><b>'+esc(e.titel)+'</b><p>'+esc(e.situation)+'</p></div>'+
      e.impulse.map(i=>'<div class="impuls"><b>Frage:</b> '+esc(i.frage)+'<div class="erw"><b>Erwartung:</b> '+esc(i.erwartung)+'</div></div>').join('')+
      '<p class="muted"><b>Überleitung:</b> '+esc(e.ueberleitung)+'</p>';
  }

  function phasePraes(s){
    const p = s.praesentation;
    return '<h3>3 · Präsentation <span class="chip">'+p.min+' Min</span></h3>'+
      '<div class="kasten merksatz"><b>Merksatz / Tafelbild:</b> '+esc(p.merksatz)+'</div>'+
      p.schritte.map(x=>'<div class="schritt"><h4>'+esc(x.ueberschrift)+'</h4><p>'+esc(x.text)+'</p><p class="muted"><b>Sprechtext (Vortrag):</b> '+esc(x.vortrag)+'</p></div>').join('');
  }

  function phaseArbeit(s){
    const a = s.arbeitsphase;
    return '<h3>4 · Arbeitsphase <span class="chip">'+a.min+' Min</span> <span class="chip">'+esc(a.sozialform)+'</span></h3>'+
      '<p class="muted">'+esc(a.app_uebung)+'</p>'+
      a.aufgaben.map((x,i)=>'<div class="kasten"><b>Aufgabe '+(i+1)+': '+esc(x.titel)+'</b><p>'+esc(x.text)+'</p>'+
        '<button class="los-btn" onclick="this.nextElementSibling.classList.toggle(\'auf\')">Lösung / Hilfe anzeigen</button>'+
        '<div class="los"><p><b>Hilfe:</b> '+esc(x.hilfe)+'</p><p><b>Lösung:</b> '+esc(x.loesung)+'</p></div></div>').join('')+
      '<p class="muted"><b>Differenzierung:</b> '+esc(a.differenzierung)+'</p>';
  }

  function phaseSicherung(s){
    const x = s.sicherung;
    return '<h3>5 · Ergebnissicherung <span class="chip">'+x.min+' Min</span> <span class="chip">'+esc(x.form)+'</span></h3>'+
      '<div class="kasten"><b>'+esc(x.titel)+'</b><p>'+esc(x.text)+'</p>'+
      '<table><tr><th>Aufgabe</th><th>Lösung (klicken zum Aufdecken)</th></tr>'+
      x.aufgaben.map(a=>'<tr><td>'+esc(a.frage)+'</td><td><button class="los-btn" onclick="this.nextElementSibling.classList.toggle(\'auf\');this.textContent=this.textContent==\'anzeigen\'?\'verbergen\':\'anzeigen\'">anzeigen</button><div class="los">'+esc(a.loesung)+'</div></td></tr>').join('')+
      '</table></div>';
  }

  function meta(s){
    const t = themaOf(s.thema);
    return '<div class="grid2" style="margin-top:22px">'+
      '<div><h3>Stundendaten</h3><p><b>Ziele:</b></p><ul>'+s.ziele.map(z=>'<li>'+esc(z)+'</li>').join('')+'</ul>'+
      '<p class="muted"><b>Vorwissen:</b> '+esc(s.vorwissen)+'</p>'+
      '<p class="muted"><b>Material:</b> '+s.material.map(esc).join(', ')+'</p>'+
      '<p class="muted"><b>Hausaufgabe:</b> '+esc(s.hausaufgabe)+'</p></div>'+
      '<div><h3>Kontext &amp; App-Bezug</h3>'+
      '<div class="kasten physio"><b>Kontext Physiotherapie:</b> '+esc(s.physio)+'</div>'+
      '<div class="kasten"><b>App-Einsatz (Examenstrainer.html):</b> Thema <span class="badge" style="background:'+t.farbe+'">'+esc(t.name)+'</span><br>'+
      s.app.einsatz.map(e=>'<span class="chip">'+esc(e)+'</span>').join('')+'</div>'+
      '<div class="kasten warn"><b>Hinweise / typische Fehlvorstellungen:</b><ul>'+s.hinweise.map(h=>'<li>'+esc(h)+'</li>').join('')+'</ul></div>'+
      '<p class="muted"><b>Quellen:</b> '+s.quellen.map(esc).join(' · ')+'</p></div></div>';
  }

  window.TL = {
    show(id){
      state.id = id;
      const s = D.stunden[id], t = themaOf(s.thema);
      document.getElementById("main").innerHTML =
        '<span class="badge" style="background:'+t.farbe+'">'+esc(t.name)+'</span> <span class="chip">Stunde '+s.nr+' von '+D.meta.gesamtstunden+'</span> <span class="chip">'+s.dauer+' Min</span>'+
        '<h2 style="margin-top:8px">'+s.nr+'. '+esc(s.titel)+'</h2>'+
        ablaufBalken(s)+
        '<h3>1 · Warm-up – mehrere Optionen zur Wahl <span class="chip">je '+s.warmups[0].min+' Min</span></h3>'+warmups(s)+
        phaseEinstieg(s)+phasePraes(s)+phaseArbeit(s)+phaseSicherung(s)+meta(s);
      sidebar($("#suche").value);
      window.scrollTo({top:0});
    },
    wu(i){ state.wu = i; TL.show(state.id); }
  };

  function uebersicht(){
    let h = '<h2>Übersicht: '+D.meta.gesamtstunden+' Unterrichtsstunden</h2>'+
      '<p class="muted">'+esc(D.meta.kontext)+'</p>'+
      '<p class="muted"><b>Muster jeder Stunde:</b> '+esc(D.meta.muster)+' ('+D.meta.min_pro_stunde+' Min). Die Themenfelder sind unterschiedlich inhaltsreich – die Stundenzahl ist proportional zum Umfang der App-Inhalte verteilt.</p>'+
      '<div class="uebersicht">';
    D.themen.forEach(t=>{
      h += '<div class="ue-karte"><span class="dot" style="background:'+t.farbe+'"></span> <b>'+t.stunden.length+'</b> Std.<br><b>'+esc(t.name)+'</b><br><span class="muted" style="font-size:.8rem">'+esc(t.info)+'</span></div>';
    });
    h += '</div><table><tr><th>Nr.</th><th>Themenfeld</th><th>Titel</th><th>Ablauf (Min)</th><th>App-Bezug</th></tr>';
    D.reihenfolge.forEach(id=>{
      const s = D.stunden[id], t = themaOf(s.thema);
      h += '<tr><td>'+s.nr+'</td><td><span class="dot" style="background:'+t.farbe+'"></span> '+esc(t.name.split(" (")[0])+'</td><td><a href="#" onclick="TL.show(\''+s.id+'\');return false">'+esc(s.titel)+'</a></td><td>'+s.ablauf.map(p=>p.phase+' '+p.min).join(", ")+'</td><td style="font-size:.8rem">'+s.app.einsatz.slice(0,3).map(esc).join(', ')+'</td></tr>';
    });
    h += '</table><p class="muted">'+esc(D.meta.app)+'</p>';
    document.getElementById("main").innerHTML = h;
    sidebar($("#suche").value);
    window.scrollTo({top:0});
  }

  document.getElementById("suche").addEventListener("input", e => sidebar(e.target.value));
  document.getElementById("b-uebersicht").addEventListener("click", uebersicht);
  TL.show(D.reihenfolge[0]);
})();
</script>
</body>
</html>
