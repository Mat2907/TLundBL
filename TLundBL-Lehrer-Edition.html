: Wiederbefähigung zur vollen Teilhabe inkl. Wiederherstellung und Erweiterung der Handlungskompetenz."}, {"frage": "Wann kommt das Prinzip der Variation der Belastung vor allem zur Anwendung?", "antwort": "Wenn kontinuierliche Steigerung keine Verbesserung mehr bringt – Es wird variiert, wenn mit der kontinuierlichen Belastungssteigerung keine weitere Leistungsverbesserung mehr zu erreichen ist."}]}], "einstieg": {"titel": "Der kalte Patient", "min": 10, "situation": "Fall (App-Quiz): Ein älterer, untrainierter Patient trainiert früh morgens bei kaltem Regenwetter – wie sollte er sich aufwärmen?", "impulse": [{"frage": "Was ist das Risiko?", "erwartung": "Kalte Muskulatur ist verletzungsanfälliger (Zerrung)."}, {"frage": "Wie lange/intensiv aufwärmen?", "erwartung": "Länger und gründlicher, evtl. mit wärmender Kleidung/Indoor-Teil."}, {"frage": "Welche Körperbereiche zuerst?", "erwartung": "Große Muskelgruppen, dann spezifisch die Zielmuskulatur."}, {"frage": "Was zeigt die Temperaturkurve (Folie 35)?", "erwartung": "Der Anstieg braucht Zeit – bei Kälte entsprechend länger."}], "ueberleitung": "Aufwärmen ist kein 'Extra', sondern Teil jeder Einheit – auch in der Therapie. Heute klären wir: was, wie lange, in welcher Reihenfolge – und was das Abwärmen leistet."}, "praesentation": {"titel": "Aufwärmen und Abwärmen als feste Bausteine", "min": 15, "merksatz": "Aufwärmen: allgemein (große Muskelgruppen, Herz-Kreislauf) + spezifisch (Zielmuskulatur/Bewegung); Arten: aktiv (Bewegung), passiv (Wärme/Dusche/Massage), spezifisch vs. unspezifisch. Wirkungen: Temperaturanstieg (~39 °C Muskel), schnellere Nervenleitung, bessere Dehnbarkeit, psychische Bereitschaft. Richtwerte (Weineck 2009): Einarbeitungszeit 15–30 min vor Training, 20–40 min vor Wettkampf; Abstand zum Start 5–10 min. Cool-down: 5–15 min leicht weiterbewegen + Dehnen; senkt Laktat schneller, beruhigt Herz-Kreislauf.", "schritte": [{"ueberschrift": "Arten und Ablauf des Aufwärmens", "text": "Allgemein → spezifisch an die Tafel; Aktivierungsübung aus dem Warm-up der Stunde vorzeigen (2 Min).", "vortrag": "Wir unterscheiden aktives Aufwärmen durch Bewegung – das ist das Wirksamste – von passiver Wärmezufuhr. Der Ablauf ist immer: erst allgemein (große Muskelgruppen, Herz-Kreislauf aktivieren), dann spezifisch (die Muskelgruppen, die gleich belastet werden)."}, {"ueberschrift": "Wirkungen des Aufwärmens", "text": "Diagramme Folie 35 (Temperaturanstieg) und Folie 39 (3000-m-Fahrradergometertest) zeigen; Hotspots in der App.", "vortrag": "Die Muskeltemperatur steigt um etwa 2–3 Grad – dadurch laufen Stoffwechsel und Nervenleitung schneller, die Muskulatur ist dehnbarer und reißfester. Der Fahrradergometertest zeigt messbar: aufgewärmte Sportler leisten im 3000-m-Test mehr. Für Patienten heißt das: weniger Schmerzen und Verletzungen bei der Belastung."}, {"ueberschrift": "Richtwerte und Cool-down", "text": "Planer 'Auf- und Abwärmen' (Folien 40–42) ausfüllen: Einarbeitungszeit, Abstand zum Start, Cool-down-Dauer und -Inhalt.", "vortrag": "Vor Belastung: 15–30 Minuten Einarbeitungszeit (Training) bzw. 20–40 Minuten (Wettkampf); der Abstand zum Start sollte 5–10 Minuten betragen, sonst verflacht der Effekt. Cool-down: 5–15 Minuten leicht bewegen und dehnen – das Herz-Kreislauf-System fährt herunter, Stoffwechselendprodukte (Laktat) werden schneller abgebaut."}]}, "arbeitsphase": {"titel": "Einheiten-Rahmung planen", "min": 25, "sozialform": "Partnerarbeit am Planer", "aufgaben": [{"titel": "Plane Aufwärmen und Cool-down für eine Krafttrainingseinheit (Knie-OP-Patient, 45 Min).", "text": "Plane Aufwärmen und Cool-down für eine Krafttrainingseinheit (Knie-OP-Patient, 45 Min).", "loesung": "Aufwärmen 15 Min (Richtwert 15–30 min Training): 5 Min Fahrradfahren allgemein + 10 Min spezifisch (Kniebeugen ohne Gewicht, Beinheben). Cool-down 10 Min: leichtes Radfahren + Dehnen der belasteten Muskulatur.", "hilfe": "App-Planer 'Auf- und Abwärmen' (Folien 40–42) als Struktur."}, {"titel": "Fall: älterer Patient, kaltes Regenwetter, Training um 7 Uhr.", "text": "Fall: älterer Patient, kaltes Regenwetter, Training um 7 Uhr.", "loesung": "Längeres Aufwärmen (20–40 min – höheres Alter, Morgen und Kälte/Regen verlängern das Aufwärmen, App-Quiz-Fall); evtl. indoor beginnen, wärmende Kleidung; spezifischer Teil für die betroffenen Gelenke.", "hilfe": "App-Quiz trainingslehre: 'älterer, untrainierter Patient … kaltem Regenwetter'."}, {"titel": "Wie lange sollten Cool-down-Maßnahmen dauern?", "text": "Wie lange sollten Cool-down-Maßnahmen dauern?", "loesung": "5–15 Minuten (App-Quiz).", "hilfe": "App-Quiz + Planer Folien 40–42."}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Erläutere die Reizstufenregel nach Roux (Prinzip des wirksamen Belastungsreizes).", "loesung": "- Unterschwellige Reize: keine Wirkung\n- Schwach überschwellige Reize: funktionserhaltend\n- Stark überschwellige Reize: optimale Anpassungserscheinungen, Verbesserung des Leistungsniveaus\n- Zu starke Reize: funktionsschädigend", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere füllen den Planer mit vorgegebenen Bausteinen aus; stärkere begründen, warum der Abstand zwischen Aufwärmen und Belastung kurz gehalten werden muss (Temperatur fällt wieder ab, Folie 35).", "app_uebung": "App: diagrams Folien 35/39, planner 'Auf- und Abwärmen' Folien 40–42, cards 'Arten des Aufwärmens'/'Abwärmen', quiz-Fälle, exam (6 P)."}, "sicherung": {"titel": "Rahmungs-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne zwei Wirkungen des Aufwärmens, den Richtwert für die Einarbeitungszeit und Dauer/Ziel des Cool-downs.", "aufgaben": [{"frage": "Zwei Wirkungen?", "loesung": "z. B. Temperaturanstieg der Muskulatur, schnellere Nervenleitung, Verletzungsprophylaxe, psychische Bereitschaft."}, {"frage": "Einarbeitungszeit?", "loesung": "15–30 min (Training) / 20–40 min (Wettkampf); Abstand zum Start 5–10 min."}, {"frage": "Cool-down?", "loesung": "5–15 Min leicht bewegen/dehnen; Herz-Kreislauf beruhigen, Laktatabbau fördern."}, {"frage": "Was besagt das Prinzip der Wiederholung und Kontinuität?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Jede Trainingsunterbrechung führt zur Rückbildung der Adaptionen – Jede Unterbrechung des Trainings führt zur Rückbildung der Adaptionen und der Leistungsfähigkeit."}]}, "hausaufgabe": "Planer 'Auf- und Abwärmen' (Folien 40–42) für eine eigene Einheit ausfüllen; Diagramme Folie 35/39 ins Heft übertragen; Prüfungsaufgabe (6 P) 'Auswirkungen des Aufwärmens' üben.", "hinweise": ["Fehler: Aufwärmen wird bei 'nur Therapie' übersprungen – gerade Patienten mit degenerativen Veränderungen profitieren vom Temperaturanstieg (bessere Dehnbarkeit).", "Abstand Aufwärmen–Belastung zu lang: Effekt verflacht (Folie 35, Temperatur fällt).", "Autoren prüfungsrelevant: Asmussen/Böje 1945, Hajoglou et al. 2005 (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA trainingslehre: diagrams Folie 35/39, planner Folien 40–42, cards 'Arten des Aufwärmens'/'Abwärmen', quiz, exam (6 P)", "Asmussen & Böje 1945; Hajoglou et al. 2005 (App-Quellen)"]}, "tl-08": {"nr": 8, "id": "tl-08", "thema": "trainingslehre", "titel": "Sensible Phasen, Altersgemäßheit und Individualität", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben das Modell der sensiblen Phasen (Martin et al. 1999).", "Sie nennen die Konsequenzen für das Training von Kindern und Jugendlichen (10–12-Jährige).", "Sie erläutern die Prinzipien der Altersgemäßheit und Individualität an Patientenbeispielen."], "vorwissen": "Stunden 1–7; Grundlagen Entwicklung (Vorschulalter).", "material": ["App, Beamer", "Diagramm 'Modell günstiger Phasen der Trainierbarkeit' (Folie 31, Ausdruck)", "Fallkarten Kindergruppe"], "physio": "In der pädiatrischen Physiotherapie ist das Modell der sensiblen Phasen die Leitlinie: Koordination und Beweglichkeit haben frühe Fenster, Kraft und Ausdauer spätere. Gleichzeitig gilt: Jedes Kind ist verschieden – das Prinzip der Individualität verhindert Überforderung (z. B. frühes Krafttraining).", "app": {"einsatz": ["Diagramm 'Modell günstiger Phasen der Trainierbarkeit (sensible Phasen, Martin et al. 1999)' (Folie 31)", "Quiz: 'Du leitest eine Sportgruppe mit 10- bis 12-Jährigen – welche Fähigkeit ist laut Modell der sensiblen Phasen hier besonders trainierbar?'", "Karteikarten: 'Prinzip der Altersgemäßheit und Individualität'", "Sequenz: 'Anpassungsgeschwindigkeit von schnell nach langsam' (als Brücke zu den sensiblen Phasen)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Phasen-Rätsel (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Die Kindergruppe"}, {"phase": "Präsentation", "min": 15, "inhalt": "Sensible Phasen und individuelle Dosierung"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Fälle altersgemäß dosieren · Gruppenarbeit (3er-Gruppen), je ein Fall"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Fenster-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Phasen-Rätsel", "art": "Rätsel", "min": 5, "anleitung": "Altersangaben (6, 10, 14, 18 Jahre) werden genannt – welche Fähigkeit hat gerade ihr sensibelstes Fenster? Zuordnen.", "aufgaben": [{"frage": "Mit 10–12 Jahren besonders trainierbar?", "antwort": "Die Differenzierungsfähigkeit (4 Sterne bei 10–12 J., Martin et al. 1999; App-Quiz: Sportgruppe 10–12-Jährige)."}, {"frage": "Frühes Fenster?", "antwort": "Beweglichkeit (ca. 6–10 Jahre)."}, {"frage": "Späteres Fenster?", "antwort": "Kraft (ab Pubertät), Ausdauer (ab Jugend)."}, {"frage": "Warum sind sensible Phasen wichtig?", "antwort": "In diesen Fenstern sind Anpassungen am effektivsten – verpasst man sie, ist Aufholen schwerer."}]}, {"titel": "Verschieden-gleich", "art": "Blitzlicht", "min": 5, "anleitung": "Jede Person nennt einen Satz: 'Zwei 10-Jährige mit gleicher Diagnose – warum trotzdem verschiedene Pläne?'", "aufgaben": [{"frage": "Beispiel?", "antwort": "Reifegrad, Vorerfahrung, Motivation, soziales Umfeld unterscheiden sich."}, {"frage": "Prinzip?", "antwort": "Individualität – jede Dosierung ist personenbezogen."}, {"frage": "Konsequenz?", "antwort": "Standardpläne reichen nicht; Ziel und Reiz werden individuell festgelegt."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Was besagt das Prinzip der Wiederholung und Kontinuität?", "antwort": "Jede Trainingsunterbrechung führt zur Rückbildung der Adaptionen – Jede Unterbrechung des Trainings führt zur Rückbildung der Adaptionen und der Leistungsfähigkeit."}, {"frage": "Wie trägt das Aufwärmen zur Verletzungsprophylaxe bei?", "antwort": "Höhere Temperatur verringert die Muskelviskosität – Die erhöhte Muskeltemperatur senkt die Muskelviskosität, was die Kontraktionsgeschwindigkeit verbessert und Verletzungen vorbeugt."}, {"frage": "Was zeigt das Diagramm zum 3000-m-Fahrradergometertest (Hajoglou et al. 2005)?", "antwort": "Mit Aufwärmen sind die Abschnittszeiten meist kürzer – Beide Aufwärmgruppen benötigen v. a. bei 1000–1500 m deutlich weniger Zeit (ca. 44 s gegenüber ca. 47 s) als die Gruppe ohne Aufwärmen."}]}], "einstieg": {"titel": "Die Kindergruppe", "min": 10, "situation": "Fall (App-Quiz): Du leitest eine Sportgruppe mit 10- bis 12-Jährigen – welche Fähigkeit ist laut Modell der sensiblen Phasen hier besonders trainierbar?", "impulse": [{"frage": "Antwort?", "erwartung": "Die Differenzierungsfähigkeit – 4 Sterne im Modell bei 10–12 Jahren (App-Quiz)."}, {"frage": "Warum gerade jetzt?", "erwartung": "Das sensible Fenster der Koordination liegt im späten Kindesalter (Folie 31)."}, {"frage": "Was folgt daraus für die Therapie?", "erwartung": "Bewegungslernen und Koordination früh anregen – z. B. bei Kindern mit Entwicklungsverzögerung."}, {"frage": "Gilt das auch für Kraft?", "erwartung": "Nein – Kraft hat ein späteres Fenster (Pubertät); frühes Maximalkrafttraining ist kontraindiziert (Thema Kraft)."}], "ueberleitung": "Wann welche Fähigkeit am besten trainierbar ist, beschreibt das Modell der sensiblen Phasen – zusammen mit Individualität und Altersgemäßheit bildet es den Rahmen für kindgerechte Therapie."}, "praesentation": {"titel": "Sensible Phasen und individuelle Dosierung", "min": 15, "merksatz": "Modell der sensiblen Phasen (Martin et al. 1999, Folie 31): Jede Fähigkeit hat ein Fenster optimaler Trainierbarkeit – Beweglichkeit früh (Kindesalter), Koordination spätes Kindesalter/Jugend, Kraft und Ausdauer ab Pubertät. Prinzip der Altersgemäßheit: Belastung und Methode müssen zum Entwicklungsstand passen. Prinzip der Individualität: Reifegrad, Vorerfahrung, Motivation – derselbe Plan passt nicht für alle.", "schritte": [{"ueberschrift": "Das Modell der sensiblen Phasen", "text": "Diagramm Folie 31 projizieren; Balken für Koordination, Kraft, Ausdauer, Beweglichkeit im Altersverlauf einzeichnen.", "vortrag": "Martin et al. zeigen: Die Trainierbarkeit ist altersabhängig. Beweglichkeit hat ihr Fenster früh, Bei 10–12 Jahren erreicht die Differenzierungsfähigkeit ihr Maximum (4 Sterne, Martin); das späte Schulkindalter gilt allgemein als bestes Lernalter mit koordinativer Schulung. Kraft und Ausdauer folgen erst in der Pubertät."}, {"ueberschrift": "Altersgemäßheit in der Therapie", "text": "Beispiele: Skoliose-Therapie beim Jugendlichen (Wachstumsschub beachten), Gangschule beim Kleinkind (motorische Meilensteine).", "vortrag": "Altersgemäßheit heißt: Wir fordern, was entwicklungsbiologisch möglich ist – nicht mehr, aber auch nicht weniger. Beim Jugendlichen im Wachstumsschub z. B. verändert sich die Körperproportion schnell; Koordination und Haltung müssen neu 'eingestellt' werden."}, {"ueberschrift": "Individualität", "text": "Zwei Patienten, gleiche Diagnose (z. B. Kreuzbandruptur), gleiches Alter – gleiche Belastung? Diskussion.", "vortrag": "Nein: Reifegrad, Trainingszustand, Motivation und soziales Umfeld unterscheiden sich. Das Prinzip der Individualität verlangt, Ziel und Dosierung individuell festzulegen – in der MTT durch regelmäßige Verlaufskontrolle (Kraftmessung, Gangbild, Schmerzskala)."}]}, "arbeitsphase": {"titel": "Fälle altersgemäß dosieren", "min": 25, "sozialform": "Gruppenarbeit (3er-Gruppen), je ein Fall", "aufgaben": [{"titel": "Fall A: 11-Jährige, Skoliose, konservative Therapie – was betonst du, was vermeidest du?", "text": "Fall A: 11-Jährige, Skoliose, konservative Therapie – was betonst du, was vermeidest du?", "loesung": "Betonen: Differenzierungsfähigkeit/Koordination (Fenster 10–12 J.), Rumpfstabilität, spielerische Formen; vermeiden: Maximalkraft, einseitige Belastung.", "hilfe": "App: diagram Folie 31, quiz 'Sportgruppe 10–12-Jährige'."}, {"titel": "Fall B: 16-Jähriger nach Kreuzband-OP, sportlich – Kraftfenster?", "text": "Fall B: 16-Jähriger nach Kreuzband-OP, sportlich – Kraftfenster?", "loesung": "Ab Pubertät ist Kraft trainierbar; stufenweise nach Fünf-Stufen-Modell (Thema Kraft), aber individuell nach Heilungsverlauf.", "hilfe": "Prinzip Individualität + Vier-Stufen-Modell (Stunde 3)."}, {"titel": "Fall C: Zwei 70-jährige Patienten, gleiche Hüft-TEP – gleiche Aufbauphase?", "text": "Fall C: Zwei 70-jährige Patienten, gleiche Hüft-TEP – gleiche Aufbauphase?", "loesung": "Nein – Individualität: Vorerkrankungen, Kognition, Motivation; Verlaufskontrolle entscheidet das Tempo.", "hilfe": "App: card 'Prinzip der Altersgemäßheit und Individualität'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Beschreibe die Auswirkungen des Aufwärmens auf den Organismus und nenne Faktoren, die Dauer und Intensität des Aufwärmens beeinflussen.", "loesung": "- Anstieg von Herzfrequenz und Blutdruck, Steigerung des Atemzeitvolumens\n- Bessere Muskeldurchblutung, erhöhte Energie- und Sauerstoffversorgung, höhere psychische Leistungsbereitschaft\n- Erhöhung der Körperkern- und Muskeltemperatur → geringere Muskelviskosität → höhere Kontraktionsgeschwindigkeit, Verletzungsprophylaxe\n- Vorbereitung passiver Strukturen (Knorpel), Optimierung neuromuskulärer Prozesse, empfindlichere Sinnesrezeptoren\n- Faktoren: Alter (älter → behutsamer, länger), Trainingszustand (Untrainierte weniger intensiv), Tageszeit (morgens länger), Außentemperatur (Wärme verkürzt, Kälte/Regen verlängert)\n- Zeitpunkt: 5–10 min Abstand zum Wettkampfstart", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit dem Diagramm Folie 31 als Entscheidungsbaum; stärkere diskutieren Zielkonflikte (z. B. kindliches Bewegungsbedürfnis vs. Schonung post-OP).", "app_uebung": "App: diagram Folie 31, quiz-Fall 'Sportgruppe 10–12-Jährige', card 'Altersgemäßheit/Individualität', sequence 'Anpassungsgeschwindigkeit'."}, "sicherung": {"titel": "Fenster-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne zwei sensible Phasen mit Altersfenster und begründe an einem Beispiel, warum Individualität wichtiger ist als ein Standardplan.", "aufgaben": [{"frage": "Zwei Fenster?", "loesung": "z. B. Beweglichkeit früh (Kindesalter), Koordination spätes Kindesalter (10–12 J.), Kraft ab Pubertät."}, {"frage": "Individualität?", "loesung": "z. B. gleicher Befund, anderer Reifegrad/Vorerfahrung → andere Dosierung; Verlaufskontrolle steuert den Plan."}, {"frage": "Ein Patient trainiert seit Monaten mit stetig gesteigerter Belastung, seine Leistung stagniert aber. Welches Prinzip solltest Du jetzt anwenden?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Prinzip der Variation der Belastung – Bringt die kontinuierliche Steigerung keinen Fortschritt mehr, wird variiert, z. B. durch Tempo, Zusatzlasten, Pausengestaltung oder Methodenwechsel."}]}, "hausaufgabe": "Diagramm Folie 31 ins Heft zeichnen; App-Quiz-Fall 'Sportgruppe 10–12-Jährige' wiederholen; drei Patientenbeispiele aus der eigenen Praxis (anonym) dem Prinzip Individualität zuordnen.", "hinweise": ["Fehler: Sensible Phasen werden als 'harte Grenzen' missverstanden – sie sind Fenster erhöhter Trainierbarkeit, kein Verbot.", "Krafttraining im Kindesalter: nicht maximal, aber koordinativ und mit Eigenkörpergewicht möglich (Thema Kraft, Stunde 12: Faigenbaum).", "Autor Martin et al. 1999 prüfungsrelevant (App-Quelle Folie 31)."], "quellen": ["Examenstrainer.html · DATA trainingslehre: diagram Folie 31 (Martin et al. 1999), quiz-Fall, card 'Altersgemäßheit/Individualität'", "Martin et al. 1999 (App-Quelle)"]}, "tl-09": {"nr": 9, "id": "tl-09", "thema": "trainingslehre", "titel": "Fallbeispiele und Trainingsplanung in der Therapie (Praxis- und Prüfungsstunde)", "dauer": 60, "ziele": ["Die Auszubildenden wählen zu einem Patientenfall die passende Trainingsmethode und stellen die Belastungskomponenten zusammen.", "Sie begründen ihre Planung mit Superkompensation, Vier-Stufen-Modell und Prinzipien.", "Sie bearbeiten prüfungsrelevante Examensaufgaben aus dem App-Thema Trainingslehre."], "vorwissen": "Alle Stunden 1–8 (gesamtes Thema Trainingslehre).", "material": ["App mit Fallbeispielen (LA_CASES), Beamer", "Planer-Vorlagen", "Prüfungsaufgaben (exam) als Ausdruck"], "physio": "Diese Stunde ist die Brücke zur Prüfung: Die App-Fallbeispiele (30 Fälle, 18 Methoden, Bereiche Kraft/Ausdauer/Therapie) simulieren genau die Planungsaufgabe des Examens – Methode wählen, Belastungskomponenten festlegen, gegen die Unterrichtstabellen prüfen. In der Praxis plant die Physio so die MTT-Verordnung.", "app": {"einsatz": ["Fallbeispiele (App-Bereich 'Fallbeispiele'): 30 Fälle (k1–k30), 18 Methoden, Bereiche Kraft/Ausdauer/Krafttraining in der Therapie", "Planer-Übungen: 'Auf- und Abwärmen', 'Vier-Stufen-Modell'", "Prüfungsaufgaben (exam, 8 Aufgaben, 4–6 P): MTT, Prävention, Superkompensation, Vier-Stufen-Modell, Belastungskomponenten, Methodenvergleich, Roux, Aufwärmen", "Zuordnungen: 'Merkmale der Trainingsmethoden', 'Wo findet Sporttherapie statt?', 'Folgen nach Verletzung mit/ohne Reha'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Methoden-Memory (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der Planungsauftrag"}, {"phase": "Präsentation", "min": 15, "inhalt": "Planungsschritte im Überblick (Wiederholung mit Prüfungsfokus)"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Fallbeispiele in der App bearbeiten · Einzelarbeit am Gerät (App) oder Partnerpuzzle mit ausgedruckten Fällen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Planungs-Exit: Der Ein-Satz-Plan · Schriftlich, einzeln"}], "warmups": [{"titel": "Methoden-Memory", "art": "Spiel", "min": 5, "anleitung": "Karteikarten-Memory mit Methodenbegriffen (Dauer-, Intervall-, Wiederholungsmethode, IK, Hypertrophie …) – activate Vorwissen aus den Stunden 4–5.", "aufgaben": [{"frage": "Dauermethode?", "antwort": "Kontinuierliche Belastung ohne Pause."}, {"frage": "IK-Training?", "antwort": "Konzentrisches Maximalkrafttraining (85–100 % 1RM) – Thema Kraft."}, {"frage": "Anfängermethode?", "antwort": "Kraftausdauerndes Training mit moderaten Lasten – Thema Kraft."}]}, {"titel": "Fall-Blitz", "art": "Quiz", "min": 5, "anleitung": "Drei App-Fallbeispiele (LA_CASES) werden vorgelesen – welche Methode passt? Schnell raten, dann in der App nachprüfen.", "aufgaben": [{"frage": "Gewichtheber, mehr motorische Einheiten gleichzeitig ansteuern (IK)?", "antwort": "Konzentrisches IK-Training (Fall k1)."}, {"frage": "Gewichtheber überwindend, explosiv?", "antwort": "Schnellkraft-/Reaktivkraft-orientiert (Fall k1: 'hebt überwindend mit explosivem Krafteinsatz')."}, {"frage": "Patientin joggt 30 Min ohne Pause?", "antwort": "Dauermethode (kontinuierlich)."}]}, {"titel": "App-Quiz-Blitz: Trainingslehre Grundlagen", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Trainingslehre Grundlagen' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema trainingslehre).", "aufgaben": [{"frage": "Ein Patient trainiert seit Monaten mit stetig gesteigerter Belastung, seine Leistung stagniert aber. Welches Prinzip solltest Du jetzt anwenden?", "antwort": "Prinzip der Variation der Belastung – Bringt die kontinuierliche Steigerung keinen Fortschritt mehr, wird variiert, z. B. durch Tempo, Zusatzlasten, Pausengestaltung oder Methodenwechsel."}, {"frage": "Du planst eine Einheit mit Ausdauerlauf, Kraftausdauerzirkel und Koordinationsübungen. Welche Reihenfolge ist richtig?", "antwort": "Koordination – Kraftausdauer – Ausdauer – Übungen, die einen erholten Zustand brauchen (Koordination), kommen zuerst, danach Kraftausdauer, zum Schluss die Ausdauer."}, {"frage": "Eine Patientin joggt 30 Minuten in gleichbleibendem Tempo ohne Pause. Welche Methode wendet sie an?", "antwort": "Dauermethode mit kontinuierlicher Belastung – Belastung ohne Pause mit durchgängig konstanter Intensität entspricht der kontinuierlichen Dauermethode."}]}], "einstieg": {"titel": "Der Planungsauftrag", "min": 10, "situation": "Fall: 58-jährige Patientin, 10 Wochen nach Knie-TEP, Ziel: sicher Treppensteigen im Alltag. Plant in der Gruppe: Methode, Belastungskomponenten, Zyklen – wie im Examen.", "impulse": [{"frage": "Welche Methode(n)?", "erwartung": "Kraft (Stufenmodell Fröböse – Thema Kraft) + Ausdauer (Dauermethode) + Koordination/Gleichgewicht."}, {"frage": "Welche Belastungskomponenten zuerst festlegen?", "erwartung": "Intensität und Umfang (aus Befund), dann Dichte/Häufigkeit."}, {"frage": "Wie begründest du den Plan?", "erwartung": "Vier-Stufen-Modell, Superkompensation, Prinzip Individualität – Heilungsphase beachten."}, {"frage": "Wo in der App prüfst du nach?", "erwartung": "Fallbeispiele: Methode wählen → Belastungskomponenten zusammenstellen → gegen Tabellen prüfen."}], "ueberleitung": "Jetzt wenden wir alles an: Fall → Methode → Belastungskomponenten → Begründung. Genau so sieht die Planungsaufgabe im Examen aus."}, "praesentation": {"titel": "Planungsschritte im Überblick (Wiederholung mit Prüfungsfokus)", "min": 15, "merksatz": "Planungsschritte: 1) Befund/Ziel (ICF: Aktivität/Teilhabe), 2) Methode wählen (Dauer/Intervall/Wiederholung bzw. Kraftstufen), 3) sechs Belastungskomponenten dosieren, 4) Zyklen/Periodisierung (Mikro–Meso–Makro), 5) Prinzipien prüfen (Roux, Superkompensation, Individualität), 6) Kontrolle/Anpassung. Prüfungsrelevant: Superkompensation (6 P), Vier-Stufen-Modell (5 P), Belastungskomponenten (4 P), Methodenvergleich (4 P), Roux (4 P), Aufwärmen (6 P).", "schritte": [{"ueberschrift": "Schritt 1–2: Ziel und Methode", "text": "Fall Knie-TEP: Ziel Treppensteigen (Aktivität) → Methoden: Kraft nach Stufenmodell + Ausdauer Dauermethode + Koordination.", "vortrag": "Die Methode folgt immer dem Ziel – nicht umgekehrt. Im Examen wird genau diese Zuordnung geprüft (App-Fallbeispiele)."}, {"ueberschrift": "Schritt 3–4: Dosierung und Zyklen", "text": "Sechs Komponenten am Beispiel: Intensität 40–60 %, Umfang 3×12 WH, Dichte 1:3, Häufigkeit 3×/Woche, Dauer 30 Min, Reihenfolge groß→klein. Regenerationswoche in Woche 4.", "vortrag": "Die Belastungskomponenten (Folie 15) und das Vier-Stufen-Modell (Folie 16/17) sind die 'Tabellen aus dem Unterricht', gegen die im App-Fallbeispiel geprüft wird."}, {"ueberschrift": "Schritt 5–6: Prinzipien und Kontrolle", "text": "Roux: Reiz überschwellig? Superkompensation: nächster Reiz im Fenster? Kontrolle: Kraftmessung, Schmerzskala, Gangbild – Plan anpassen.", "vortrag": "Trainingsplanung ist ein Regelkreis: Planen – Durchführen – Kontrollieren – Anpassen. In der Therapie dokumentieren wir das (Befundverlauf), im Examen begründen wir es."}]}, "arbeitsphase": {"titel": "Fallbeispiele in der App bearbeiten", "min": 25, "sozialform": "Einzelarbeit am Gerät (App) oder Partnerpuzzle mit ausgedruckten Fällen", "aufgaben": [{"titel": "Bearbeite 3 Fallbeispiele (LA_CASES) in der App: Methode wählen + Belastungskomponenten zusammenstellen.", "text": "Bearbeite 3 Fallbeispiele (LA_CASES) in der App: Methode wählen + Belastungskomponenten zusammenstellen.", "loesung": "z. B. k1 (Gewichtheber, IK) → konzentrisches IK-Training, 85–100 %, 3–6 WH, lange Pausen; k-Fall '30 Min Joggen' → Dauermethode. Gegen Tabellen (Folien) prüfen – die App macht das automatisch.", "hilfe": "App: Bereich 'Fallbeispiele' → Schritt 1 Methode, Schritt 2 Belastungskomponenten, 'Plan prüfen'."}, {"titel": "Prüfungsaufgabe (6 P): Erläutere das Theoriemodell der Superkompensation und was bei zu früher Reizsetzung passiert.", "text": "Prüfungsaufgabe (6 P): Erläutere das Theoriemodell der Superkompensation und was bei zu früher Reizsetzung passiert.", "loesung": "Musterlösung in der App (exam): Homöostase → Belastung → Erholung → Superkompensation (Jakowlew); zu früh: Leistungsabfall/Übertraining.", "hilfe": "App: exam trainingslehre, Aufgabe Superkompensation (6 P) – Lösung anzeigen."}, {"titel": "Prüfungsaufgabe (4 P): Sechs Belastungskomponenten nennen und zwei erläutern.", "text": "Prüfungsaufgabe (4 P): Sechs Belastungskomponenten nennen und zwei erläutern.", "loesung": "Intensität, Umfang, Dichte, Häufigkeit, Dauer, Reihenfolge; z. B. Dichte = Verhältnis Belastung:Pause.", "hilfe": "App: exam + Tabelle Folie 15."}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Definiere den Begriff Medizinische Trainingstherapie (MTT) und grenze ihn vom (Leistungs-)Sport ab.", "loesung": "- MTT = Anwendung von körperlichem Training bei (noch) Gesunden oder Patienten\n- im Rahmen präventiver oder kurativer Behandlung, auf ärztliche Empfehlung/Verordnung\n- mit klaren Indikationen zur Erreichung definierter Therapieziele; Fortsetzung der medizinischen Therapie mit anderen Mitteln\n- Abgrenzung: Sport zielt primär auf sportliche Leistung, MTT auf Organ- und Stoffwechselfunktionen sowie Lebensqualität", "hilfe": "App: Thema 'trainingslehre' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere beginnen mit den App-Fallbeispielen (geringe Hemmschwelle, sofortiges Feedback); stärkere formulieren zwei exam-Aufgaben schriftlich aus und vergleichen mit der App-Lösung.", "app_uebung": "App: LA_CASES (30 Fälle, 18 Methoden, 3 Bereiche), planner, exam (8 Aufgaben), tables Folien 15/16/17, sorts."}, "sicherung": {"titel": "Planungs-Exit: Der Ein-Satz-Plan", "min": 5, "form": "Schriftlich, einzeln", "text": "Formuliere für den Einstiegsfall (Knie-TEP, Treppensteigen) einen Satz: Methode + wichtigste Belastungskomponente + Begründung in einem Prinzip.", "aufgaben": [{"frage": "Beispielantwort?", "loesung": "'Kraft nach Fünf-Stufen-Modell mit 50 % Intensität, 3×10 WH, Dichte 1:3, 3×/Woche – begründet durch Vier-Stufen-Modell und Superkompensation (Erholung nach OP).'"}, {"frage": "Wichtig?", "loesung": "Zielbezug (Treppensteigen), Dosierung, prinzipielle Begründung – das sind die exam-Punkte."}, {"frage": "Ein älterer, untrainierter Patient trainiert früh morgens bei kaltem Regenwetter. Wie sollte er sich aufwärmen?  [App-Quiz: Trainingslehre Grundlagen]", "loesung": "Länger, allmählicher und weniger intensiv – Höheres Alter, Morgen und Kälte/Regen verlängern das Aufwärmen. Untrainierte wärmen weniger intensiv auf als Trainierte."}]}, "hausaufgabe": "Alle 8 exam-Aufgaben des Themas trainingslehre in der App einmal durchgehen (Lösungen vergleichen); 5 Fallbeispiele (LA_CASES) selbstständig lösen; Prüfungsrelevante Tabellen (Folien 15/16/24/28) auswendig lernen.", "hinweise": ["Fehler: Plan wird ohne Zielbezug erstellt – im Examen zählt die ICF-orientierte Zielsetzung (Aktivität/Teilhabe).", "Fallbeispiele in der App prüfen automatisch gegen die Unterrichtstabellen – als 'Plan prüfen' nutzen.", "Häufige Prüfungsautoren in diesem Thema: Jakowlew, Neumann & Schüller, Roux, Martin (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA trainingslehre (quiz/cards/sorts/sequences/diagrams/tables/planner/exam) + LA_CASES (Fallbeispiele k1–k30, Methoden, Bereiche)"]}, "kr-10": {"nr": 10, "id": "kr-10", "thema": "kraft", "titel": "Kraftfähigkeiten im Überblick: Maximalkraft, Schnellkraft, Reaktivkraft, Kraftausdauer", "dauer": 60, "ziele": ["Die Auszubildenden nennen die drei (vier) Kraftfähigkeiten und definieren sie (prüfungsrelevant, 6 P).", "Sie unterscheiden Varianten der Maximalkraft (isometrisch, dynamisch, auxotonisch).", "Sie erklären das Kraftdefizit und seine Bedeutung für die Therapie."], "vorwissen": "Trainingslehre (Belastungskomponenten, Prinzipien), Muskelphysiologie-Grundlagen.", "material": ["App, Beamer", "Diagramm 'Varianten der Maximalkraft' (Folie 5) + Labels/Hotspots", "Hantel leichtere Stufen"], "physio": "In der MTT ist die Unterscheidung der Kraftfähigkeiten die Basis der Behandlungsplanung: Nach einer Knie-OP startet der Patient mit Kraftausdauer (Stufe 1–2 Fröböse), steigert dann Maximalkraft – Schnellkraft/Reaktivkraft erst in der Spätphase (z. B. vor der Rückkehr in den Sport). Das Kraftdefizit erklärt, warum untrainierte Patienten trotz 'starker' Muskulatur oft funktionell eingeschränkt sind (neuronale Komponente).", "app": {"einsatz": ["Diagramm + Hotspot/Labels 'Varianten der Maximalkraft' (Folien 5–6)", "Quiz kraft (46 Fragen): 1RM, Kraftdefizit, Kontraktionsformen, exam (6 P) 'drei Kraftfähigkeiten'", "Karteikarten: 'Maximalkraft – Definition', 'Kraftdefizit (5–40 %)', 'Schnellkraft – Definition', 'Reaktivkraft – Definition', 'Kraftausdauer – Definition'", "Zuordnen: 'Testverfahren und gemessene Kraftfähigkeit'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Kraft-Begriffe-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der 'starke' Patient"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vier Gesichter der Kraft"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Kraftfähigkeiten zuordnen · Partnerarbeit"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Kraft-Quickfire · Mündlich, Blitzlicht"}], "warmups": [{"titel": "Kraft-Begriffe-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz-Fragen zu den Kraftfähigkeiten; richtiges Kommando rufen, dann kurze Begründung.", "aufgaben": [{"frage": "Wie wird das Gewicht bezeichnet, das gerade noch einmal konzentrisch bewegt werden kann?", "antwort": "1RM (Einer-Wiederholungs-Maximum)."}, {"frage": "Wie wird das Kraftdefizit ermittelt?", "antwort": "Differenz zwischen willkürlich erreichbarer und theoretisch möglicher Kraft (elektrisch stimulierbar)."}, {"frage": "Wie groß ist das Kraftdefizit ungefähr?", "antwort": "ca. 5–40 % (Differenz isometrische vs. absolute Maximalkraft, App-Quiz)."}, {"frage": "Nenne die drei Kraftfähigkeiten.", "antwort": "Maximalkraft, Schnellkraft, Kraftausdauer (plus Reaktivkraft als Unterform der Schnellkraft)."}, {"frage": "Was ist Kraftausdauer?", "antwort": "Ermüdungswiderstandsfähigkeit bei lang andauernder/ wiederholter Kraftleistung."}]}, {"titel": "Stufen-Demo", "art": "Bewegung", "min": 5, "anleitung": "Leichte Hantel: 1× maximal (Maximalkraft), 10× schnell (Schnellkraft), 20× ohne Pause (Kraftausdauer) – subjektive Unterschiede benennen.", "aufgaben": [{"frage": "Was war bei 1× am schwersten?", "antwort": "Die Maximalkraft-Leistung (hohe Last, eine WH)."}, {"frage": "Was bei 10× schnell?", "antwort": "Schnellkraft – Tempo entscheidend."}, {"frage": "Was bei 20×?", "antwort": "Kraftausdauer – Brennen/Ermüdung am Ende."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "In welchem Kraftbereich liegt laut Grafik „Intensitätsbereich im Kraft- und Schnelligkeitstraining“ das Schnellkrafttraining?", "antwort": "Im mittleren Bereich von ca. 30–70 % der Kraft – Die Grafik teilt in Schnelligkeits- (bis ca. 30 %), Schnellkraft- (ca. 30–70 %) und Maximalkrafttraining (ab ca. 70 %) ein."}, {"frage": "Eine Sportlerin schafft mit 76 kg genau 2 Wiederholungen. Wie hoch ist ihre geschätzte Maximalkraft nach der Hochrechnungstabelle?", "antwort": "ca. 80 kg – 2 WH entsprechen 95 % → Maximalkraft = 76 kg : 0,95 = 80 kg."}, {"frage": "Ein Patient war 2 Wochen immobilisiert. Mit welcher Therapiedauer ist laut Faustregel zu rechnen?", "antwort": "ca. 8 Wochen – Verhältnis 1 : 4 – eine Woche Immobilisation zieht ca. 4 Wochen Therapie nach sich, also 2 × 4 = 8 Wochen."}]}], "einstieg": {"titel": "Der 'starke' Patient", "min": 10, "situation": "Fall: Ein Patient nach längerer Immobilisation hat laut Messung einen kräftigen Oberschenkel – trotzdem kann er kaum Treppensteigen. Wie passt das zusammen?", "impulse": [{"frage": "Erklärung?", "erwartung": "Kraftdefizit: neuronale Ansteuerung (Rekrutierung) ist reduziert – Muskelquerschnitt allein reicht nicht."}, {"frage": "Welche Kraftfähigkeit fehlt?", "erwartung": "Funktionelle Maximalkraft/Kraftausdauer im Alltag."}, {"frage": "Therapiekonsequenz?", "erwartung": "Neuronale Reaktivierung (leichte, häufige Reize) vor Hypertrophie (vgl. Fünf-Stufen-Modell)."}, {"frage": "App-Bezug?", "erwartung": "Quiz: 'Kraftdefizit', 'Warum kann Maximalkraft um bis zu 30 % steigen, ohne dass der Muskel dicker wird?'"}], "ueberleitung": "Kraft ist nicht gleich Kraft. Heute unterscheiden wir die Kraftfähigkeiten – die Grundlage dafür, in der Therapie die richtige Belastungsform zu wählen."}, "praesentation": {"titel": "Vier Gesichter der Kraft", "min": 15, "merksatz": "Maximalkraft = größte willkürliche Kraft (isometrisch/dynamisch/auxotonisch). Schnellkraft = Fähigkeit, schnell Kraft zu entwickeln (Startkraft, Explosivkraft; inkl. Reaktivkraft beim DVZ). Kraftausdauer = Ermüdungswiderstand bei wiederholter Kraftleistung. Kraftdefizit: Differenz zwischen isometrischer und absoluter Maximalkraft – ca. 5–40 %; Training der neuronalen Ansteuerung (IK) steigert die Kraft zuerst um bis zu 30 % ohne Muskelwachstum.", "schritte": [{"ueberschrift": "Maximalkraft und ihre Varianten", "text": "Diagramm Folie 5 zeigen; isometrisch (statisch), dynamisch/auxotonisch (mit Bewegung, konstantes/ansteigendes Drehmoment) unterscheiden; Hotspot Folien 5–6.", "vortrag": "Die Maximalkraft messen wir z. B. als 1RM – das Gewicht, das gerade noch einmal bewegt werden kann. Varianten: isometrisch ohne Bewegung, dynamisch mit Bewegung. In der Therapie nutzen wir meist dynamische, submaximale Varianten (gelenkschonend)."}, {"ueberschrift": "Schnellkraft und Reaktivkraft", "text": "Definitionen an die Tafel; Beispiele: Sprintstart (Startkraft), Sprung (Reaktivkraft/DVZ – Details Stunde 6).", "vortrag": "Schnellkraft ist die Fähigkeit, in kurzer Zeit viel Kraft zu entwickeln – entscheidend für Alltagsbewegungen (z. B. Abstützen bei Sturzgefahr). Die Reaktivkraft nutzt den Dehnungs-Verkürzungs-Zyklus (nächste Stunden)."}, {"ueberschrift": "Kraftausdauer und das Kraftdefizit", "text": "Kraftausdauer-Definition (Gühlich & Schmidtbleicher, nächste Stunde im Detail); Kraftdefizit erklären: ca. 30 % Reserve durch neuronale Ansteuerung.", "vortrag": "Kraftausdauer ist die Ermüdungsresistenz bei wiederholter Belastung – die wichtigste Kraftfähigkeit in der frühen Reha. Das Kraftdefizit (5–40 %) zeigt: Kraftanstieg zu Beginn kommt vor allem aus besserer neuronaler Ansteuerung (Rekrutierung, Frequenzierung, Synchronisation) – bis zu 30 % mehr Kraft ohne Hypertrophie; Fortschritte sind deshalb zuerst 'unsichtbar'."}]}, "arbeitsphase": {"titel": "Kraftfähigkeiten zuordnen", "min": 25, "sozialform": "Partnerarbeit", "aufgaben": [{"titel": "Ordne zu: 'Treppensteigen 3 Etagen ohne Pause', 'schweren Koffer aus dem Auto heben', 'Abbremsen beim Stolpern', '1× Bankdrücken maximal'.", "text": "Ordne zu: 'Treppensteigen 3 Etagen ohne Pause', 'schweren Koffer aus dem Auto heben', 'Abbremsen beim Stolpern', '1× Bankdrücken maximal'.", "loesung": "Kraftausdauer; Maximalkraft; Reaktivkraft/Schnellkraft; Maximalkraft (1RM).", "hilfe": "App: sorts 'Testverfahren und gemessene Kraftfähigkeit' + quiz kraft."}, {"titel": "Fall: Patient nach Gips – warum steigt die Kraft in den ersten 2 Wochen, ohne dass der Muskel wächst?", "text": "Fall: Patient nach Gips – warum steigt die Kraft in den ersten 2 Wochen, ohne dass der Muskel wächst?", "loesung": "IK bringt bis zu 30 % mehr Maximalkraft ohne Hypertrophie; das Kraftdefizit (5–40 %) wird abgebaut (App-Quiz).", "hilfe": "App-Quiz: 'Warum kann die Maximalkraft um bis zu 30 % steigen, ohne dass der Muskel dicker wird?' – optimales Zusammenspiel der IK (App)."}, {"titel": "Definiere die drei Kraftfähigkeiten in je einem Satz (prüfungsrelevant).", "text": "Definiere die drei Kraftfähigkeiten in je einem Satz (prüfungsrelevant).", "loesung": "Maximalkraft: größte willkürliche Kraft. Schnellkraft: schnelle Kraftentwicklung. Kraftausdauer: Ermüdungswiderstand bei Dauer-/Wiederholungsbelastung.", "hilfe": "App: exam kraft (6 P) 'drei Kraftfähigkeiten' + Karteikarten."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Erläutere die intramuskuläre Koordination und ihre Bedeutung für die Maximalkraft.", "loesung": "- Definition: Zusammenwirken von Nerv und Muskel innerhalb eines gezielten Bewegungsablaufs\n- Rekrutierung: Anzahl der aktivierten motorischen Einheiten\n- Frequenzierung: Abstufung der Impulsfrequenz (ZNS schickt Aktionspotenziale)\n- Synchronisation: gleichzeitige Aktivierung motorischer Einheiten\n- Optimales Zusammenwirken: bis zu 30 % mehr Maximalkraft ohne Hypertrophie (Nicht-Spitzensportler)", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lösen die Zuordnung mit den Karteikarten; stärkere begründen zusätzlich die Therapiekonsequenz (frühe Reha = Kraftausdauer/neuronale Reaktivierung, Spätphase = Maximalkraft).", "app_uebung": "App: diagrams/labels/hotspots Folien 5–6, sorts 'Testverfahren', cards 'Maximalkraft'/'Schnellkraft'/'Reaktivkraft'/'Kraftausdauer'/'Kraftdefizit', exam (6 P)."}, "sicherung": {"titel": "Kraft-Quickfire", "min": 5, "form": "Mündlich, Blitzlicht", "text": "Die Lehrkraft nennt eine Alltagssituation – die Klasse ruft die Kraftfähigkeit.", "aufgaben": [{"frage": "'Schnell aus dem Stuhl aufstehen'", "loesung": "Schnellkraft."}, {"frage": "'Einkaufstasche die Treppe hoch tragen'", "loesung": "Kraftausdauer."}, {"frage": "'Schweren Schrank verschieben (einmalig)'", "loesung": "Maximalkraft."}, {"frage": "'Beim Stolpern abstützen'", "loesung": "Reaktivkraft."}, {"frage": "'1RM'", "loesung": "Maximalkraft-Messung."}, {"frage": "Ein Athlet will gezielt Muskelmasse aufbauen. Welche Belastungsgestaltung passt zum Hypertrophietraining?  [App-Quiz: Kraft und Krafttraining]", "loesung": "60–90 %, 8–12 WH, 2–3 min Pause, 3–5 Sätze – Hypertrophietraining: Last 60–90 %, 8–12 (6–20) WH bis zur Erschöpfung, 2–3 min Pause, 3–5 Sätze je Übung."}]}, "hausaufgabe": "Karteikarten zu den Kraftfähigkeiten lernen; App-Zuordnung 'Testverfahren und gemessene Kraftfähigkeit' fehlerfrei; exam-Aufgabe 'drei Kraftfähigkeiten definieren' (6 P) schriftlich üben.", "hinweise": ["Fehler: Schnellkraft und Reaktivkraft werden vermischt – Reaktivkraft ist die Sonderform beim Dehnungs-Verkürzungs-Zyklus (Stunde 6).", "Therapiebezug: Kraftdefizit (neuronale Komponente) erklärt, warum frühe Reha neuronale Reize braucht – nicht nur Hypertrophie.", "1RM-Begriff und 30 %-Kraftdefizit sind typische Quiz-/Prüfungsfragen (App)."], "quellen": ["Examenstrainer.html · DATA kraft: diagrams/labels/hotspots Folien 5–6, sorts, cards, quiz, exam (6 P)"]}, "kr-11": {"nr": 11, "id": "kr-11", "thema": "kraft", "titel": "Kontraktionsformen: konzentrisch, exzentrisch, isometrisch, isotonisch, auxotonisch", "dauer": 60, "ziele": ["Die Auszubildenden unterscheiden die Kontraktionsformen und nennen je ein Beispiel.", "Sie erklären, welche Kontraktionsform nachgebend ist und wann die Muskellänge zunimmt.", "Sie ordnen Kontraktionsformen typischen Therapie-/Alltagssituationen zu."], "vorwissen": "Stunde 10 (Kraftfähigkeiten), Muskelphysiologie (Aktin/Myosin grob).", "material": ["App, Beamer", "Tabelle 'Kontraktionsformen' (Folie 7)", "Therabänder, leichte Hanteln für Demo", "Liegestütz-Station"], "physio": "Die Wahl der Kontraktionsform ist ein zentrales Steuerungsmittel der MTT: Exzentrisches Training belastet den Muskel stark bei geringerem Energieverbrauch (gut z. B. bei Sehnenproblemen – Tendinopathie), isometrisches Training ist gelenkschonend (frühe Post-OP-Phase), konzentrisches Training baut alltagsrelevante Kraft auf.", "app": {"einsatz": ["Tabelle/Diagramm 'Kontraktionsformen' (Folie 7)", "Zuordnen: 'Merkmale der Kontraktionsformen (Beispiel Liegestütz)'", "Quiz: 'Welche Kontraktionsform ist nachgebend, wobei die Muskellänge zunimmt?' (exzentrisch), 'isotonisch vs. auxotonisch laut Tabelle'", "Karteikarte: 'Kontraktionsformen'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Formen-Ruf (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der Liegestütz"}, {"phase": "Präsentation", "min": 15, "inhalt": "Fünf Arbeitsweisen des Muskels"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Formen-Puzzle · Partnerarbeit mit Fallkarten und App"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Formen-Check · Mündlich, Einzelabfrage"}], "warmups": [{"titel": "Formen-Ruf", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Kontraktionsformen; bei jeder Antwort wird die Bewegung pantomimisch mitgemacht.", "aufgaben": [{"frage": "Welche Form ist nachgebend (Muskellänge nimmt zu)?", "antwort": "Exzentrisch (z. B. kontrolliertes Senken)."}, {"frage": "Welche Form hat keine Bewegung?", "antwort": "Isometrisch (Halten)."}, {"frage": "Unterschied isotonisch/auxotonisch?", "antwort": "Isotonisch: konstante Last; auxotonisch: Last/Drehmoment steigt mit dem Gelenkwinkel."}, {"frage": "Beispiel konzentrisch?", "antwort": "Hochdrücken beim Liegestütz."}, {"frage": "Beispiel exzentrisch?", "antwort": " kontrolliertes Absenken beim Liegestütz."}]}, {"titel": "Band-Demo", "art": "Bewegung", "min": 5, "anleitung": "Mit Theraband: konzentrisch (ziehen), exzentrisch (langsames Nachgeben), isometrisch (halten) – 5 Wdh. jeweils; spüren, welche Form am anstrengendsten wirkt.", "aufgaben": [{"frage": "Welche Form ist subjektiv härtester bei gleicher Last?", "antwort": "Oft exzentrisch (höhere Kraft bei geringerem Aufwand)."}, {"frage": "Welche Form ist gelenkschonend?", "antwort": "Isometrisch (keine Bewegung) – frühe Post-OP-Phase."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Ein Athlet will gezielt Muskelmasse aufbauen. Welche Belastungsgestaltung passt zum Hypertrophietraining?", "antwort": "60–90 %, 8–12 WH, 2–3 min Pause, 3–5 Sätze – Hypertrophietraining: Last 60–90 %, 8–12 (6–20) WH bis zur Erschöpfung, 2–3 min Pause, 3–5 Sätze je Übung."}, {"frage": "Du planst eine Einheit mit Kniebeuge, Beinstrecker an der Maschine und Wadenheben. Welche Reihenfolge entspricht den Regeln der Übungsreihenfolge?", "antwort": "Kniebeuge – Beinstrecker – Wadenheben – Mehrgelenkig vor eingelenkig und große vor kleine Muskelgruppen: Die Kniebeuge kommt zuerst, kleine Muskelgruppen zum Schluss."}, {"frage": "Eine Sportlerin hat 8 WH geplant, schafft aber in allen Sätzen 10 WH. Was ist zu tun?", "antwort": "Die Intensität um 2,5–10 % erhöhen – Steigerung der Intensität: Sobald 2 WH mehr als geplant möglich sind, wird die Last um 2,5–10 % erhöht."}]}], "einstieg": {"titel": "Der Liegestütz", "min": 10, "situation": "Demo an der Liegestütz-Station: Hochdrücken (konzentrisch) – kontrolliertes Senken (exzentrisch) – Halten in der Mitte (isometrisch). Welche Phase ist am schwersten? Warum?", "impulse": [{"frage": "Schwerste Phase?", "erwartung": "Exzentrisch – hier entwickelt der Muskel die höchste Kraft (bremsend)."}, {"frage": "Warum ist das wichtig?", "erwartung": "Exzentrisches Training ist effektiv bei geringem Energieverbrauch – gut für Sehnen (Tendinopathie)."}, {"frage": "Wo isometrisch in der Therapie?", "erwartung": "Frühe Post-OP-Phase, gelenkschonend, z. B. Quadrizeps-Anspannung."}, {"frage": "App-Bezug?", "erwartung": "App: sorts 'Merkmale der Kontraktionsformen (Beispiel Liegestütz)'."}], "ueberleitung": "Muskeln arbeiten auf verschiedene Weise – je nachdem, ob sie sich verkürzen, verlängern oder gleich lang bleiben. Diese Kontraktionsformen steuern wir gezielt in der Therapie."}, "praesentation": {"titel": "Fünf Arbeitsweisen des Muskels", "min": 15, "merksatz": "Konzentrisch: Muskel verkürzt sich (überwindend). Exzentrisch: Muskel verlängert sich unter Spannung (nachgebend/bremsend) – höchste Kraft, geringster Energieverbrauch. Isometrisch: Muskel bleibt gleich lang (Halten) – gelenkschonend. Isotonisch: konstante äußere Last. Auxotonisch: Widerstand steigt mit dem Gelenkwinkel (z. B. Theraband).", "schritte": [{"ueberschrift": "Konzentrisch und exzentrisch", "text": "Liegestütz-Demo wiederholen; Tabelle Folie 7 projizieren.", "vortrag": "Beim Hochdrücken arbeitet der Muskel konzentrisch – er verkürzt sich und überwindet die Last. Beim Senken arbeitet er exzentrisch – er verlängert sich, bremst die Bewegung. Exzentrisch kann der Muskel die größte Kraft entwickeln, bei gleichzeitig geringstem Energieverbrauch."}, {"ueberschrift": "Isometrisch, isotonisch, auxotonisch", "text": "Isometrisch = Halten ohne Bewegung (z. B. Wandstütz); isotonisch vs. auxotonisch am Theraband demonstrieren.", "vortrag": "Isometrisches Training ist die gelenkschonendste Form – deshalb in der frühen Post-OP-Phase Standard (z. B. Quadrizeps drückt gegen fixierten Widerstand). Isotonisch bedeutet konstante Last (freie Hantel), auxotonisch einen mit dem Winkel steigenden Widerstand (Theraband) – das entspricht eher der natürlichen Kraftkurve des Gelenks."}, {"ueberschrift": "Therapeutische Steuerung", "text": "Fallkarten: Tendinopathie (exzentrisch), frühe Knie-OP (isometrisch), Alltagskraft (konzentrisch).", "vortrag": "Wir wählen die Kontraktionsform nach Ziel und Heilungsphase: exzentrisch bei Sehnenproblemen, isometrisch nach OP, konzentrisch für Alltagskraft. Das App-Zuordnen 'Merkmale der Kontraktionsformen (Beispiel Liegestütz)' übt genau diese Zuordnung."}]}, "arbeitsphase": {"titel": "Formen-Puzzle", "min": 25, "sozialform": "Partnerarbeit mit Fallkarten und App", "aufgaben": [{"titel": "Ordne die Phasen des Liegestützes den Kontraktionsformen zu.", "text": "Ordne die Phasen des Liegestützes den Kontraktionsformen zu.", "loesung": "Hochdrücken = konzentrisch; Senken = exzentrisch; Halten = isometrisch (App-sorts).", "hilfe": "App: sorts 'Merkmale der Kontraktionsformen (Beispiel Liegestütz)'."}, {"titel": "Fall: Patellasehnen-Tendinopathie – welche Form ist evidenzbasiert Standard?", "text": "Fall: Patellasehnen-Tendinopathie – welche Form ist evidenzbasiert Standard?", "loesung": "Exzentrisches Training (schrittweise steigende Belastung, z. B. decline squat).", "hilfe": "Exzentrisch = höchste Kraft bei geringem Energieverbrauch; App-Quiz 'nachgebend'."}, {"titel": "Fall: 2 Tage nach Knie-OP – welche Form für Quadrizeps?", "text": "Fall: 2 Tage nach Knie-OP – welche Form für Quadrizeps?", "loesung": "Isometrisch (Anspannen ohne Bewegung) – gelenkschonend, schmerzarm.", "hilfe": "Tabelle Folie 7 + Therapieerfahrung."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Beschreibe die Durchführung eines 1RM-Tests und erläutere die indirekte Methode zur Bestimmung der Maximalkraft.", "loesung": "- Erwärmung allgemein und speziell\n- Submaximale Belastung: geschätztes Gewicht für 3–5 WH\n- Serienpause ca. 2–4 min\n- Maximale Belastung: schrittweise ca. 10 % steigern, bis nur noch 1 WH möglich\n- Indirekt: WH-Zahl bei bestimmtem Gewicht ermitteln, Intensität aus Tabelle ablesen\n- Maximalkraft = geschaffte kg : Belastungsintensität in % (z. B. 2 WH = 95 %)", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere sortieren mit der Tabelle Folie 7; stärkere diskutieren, warum exzentrisches Training trotz höherer Kraft schonender für die Sehne sein kann (geringer Energieumsatz, geringere Temperatur).", "app_uebung": "App: table/diagram Folie 7, sorts 'Kontraktionsformen', quiz kraft, card 'Kontraktionsformen'."}, "sicherung": {"titel": "Formen-Check", "min": 5, "form": "Mündlich, Einzelabfrage", "text": "Nenne die fünf Kontraktionsformen mit je einem Alltagsbeispiel.", "aufgaben": [{"frage": "Fünf Formen?", "loesung": "Konzentrisch (Treppensteigen hoch), exzentrisch (Treppe hinunter/bremsen), isometrisch (Halten), isotonisch (konstante Hantellast), auxotonisch (Theraband)."}, {"frage": "Nachgebend = ?", "loesung": "Exzentrisch (Muskellänge nimmt zu)."}, {"frage": "Eine Patientin hat bereits gut belastbare Strukturen; Ziel ist nun mehr Muskelquerschnitt. Welche Stufe und Dosierung passen?  [App-Quiz: Kraft und Krafttraining]", "loesung": "Stufe 3: 40–70 % der Maximalkraft, 8–15 WH, 2–6 Serien – Muskelaufbautraining (Stufe 3) setzt gut belastbare Strukturen voraus: 40–70 %, 8–15 WH, 2–6 Serien über 3–5 Wochen."}]}, "hausaufgabe": "Tabelle 'Kontraktionsformen' (Folie 7) lernen; App-Zuordnung 'Kontraktionsformen (Liegestütz)' fehlerfrei; drei Therapie-Fälle (Tendinopathie, Post-OP, Alltagskraft) schriftlich der passenden Form zuordnen.", "hinweise": ["Fehler: exzentrisch und isotonisch werden verwechselt – exzentrisch beschreibt die Muskelaktion (Verlängerung), isotonisch die Lastcharakteristik (konstant).", "Therapiebezug: exzentrisch bei Tendinopathie, isometrisch post-OP – typische Indikationen in der Praxis.", "Begriff 'auxotonisch' prüfungsrelevant (App-Tabelle Folie 7)."], "quellen": ["Examenstrainer.html · DATA kraft: diagram/table Folie 7, sorts 'Kontraktionsformen', quiz, card 'Kontraktionsformen'"]}, "kr-12": {"nr": 12, "id": "kr-12", "thema": "kraft", "titel": "Intramuskuläre Koordination: Rekrutierung, Frequenzierung, Synchronisation", "dauer": 60, "ziele": ["Die Auszubildenden erläutern die intramuskuläre Koordination und ihre Bedeutung für die Maximalkraft (prüfungsrelevant, 5 P).", "Sie unterscheiden inter- und intramuskuläre Koordination.", "Sie begründen, warum Maximalkraft zuerst ohne Muskelwachstum steigt."], "vorwissen": "Stunde 10 (Kraftfähigkeiten, Kraftdefizit), Stunde 11 (Kontraktionsformen).", "material": ["App, Beamer", "Diagramm 'Kraftanstiegskurven' (Folie 9, Boxer vs. Kugelstoßer)", "Karteikarten 'Rekrutierung, Frequenzierung, Synchronisation'"], "physio": "In der frühen Rehabilitation nach Immobilisation ist die intramuskuläre Koordination der wichtigste Therapiegegenstand: Die Muskulatur muss lernen, mehr motorische Einheiten gleichzeitig und schneller anzusteuern – das erklärt den schnellen Kraftzuwachs der ersten Wochen (Kraftdefizit-Abbau, Stunde 10).", "app": {"einsatz": ["Quiz: 'Welche drei Mechanismen bilden die intramuskuläre Koordination?', 'Warum kann die Maximalkraft bei Nicht-Spitzensportlern um bis zu 30 % steigen …?', 'Vergleich Kraftanstiegskurven Boxer vs. Kugelstoßer'", "Diagramm 'Kraftanstiegskurven' (Folie 9)", "Karteikarten: 'Intermuskuläre vs. intramuskuläre Koordination', 'Rekrutierung, Frequenzierung, Synchronisation', 'Einflussfaktoren auf die Maximalkraft'", "Prüfungsaufgabe: intramuskuläre Koordination erläutern (5 P)", "Fallbeispiele k1–k4 (LA_CASES): Gewichtheber/Kugelstoßerin/Hocht springer – IK-Training"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "ME-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Zwei Sportler, ein Muskel"}, {"phase": "Präsentation", "min": 15, "inhalt": "Drei Mechanismen der intramuskulären Koordination"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "IK-Training planen (Fallbeispiele) · Einzelarbeit in der App (LA_CASES) oder Partnerpuzzle"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Drei-Mechanismen-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "ME-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Rekrutierung/Frequenzierung/Synchronisation; Antworten pantomimisch begleiten (viele Einheiten = viele Finger).", "aufgaben": [{"frage": "Welche drei Mechanismen bilden die intramuskuläre Koordination?", "antwort": "Rekrutierung (mehr Einheiten), Frequenzierung (schnellere Impulsfolge), Synchronisation (gleichzeitige Aktivierung)."}, {"frage": "Inter- vs. intramuskulär?", "antwort": "Inter = Zusammenspiel verschiedener Muskeln; intra = Ansteuerung innerhalb eines Muskels."}, {"frage": "Warum steigt die Kraft zuerst ohne Muskelwachstum?", "antwort": "Neuronale Anpassung (IK) – bis zu ca. 30 % (Kraftdefizit)."}, {"frage": "Boxer vs. Kugelstoßer (Folie 9)?", "antwort": "Boxer: schneller Kraftanstieg (Schnellkraft); Kugelstoßer: hohe Endkraft (Maximalkraft)."}]}, {"titel": "Zähl-Wettbewerb", "art": "Spiel", "min": 5, "anleitung": "Schnell so viele Finger wie möglich zeigen – die schnellste 'Frequenz' gewinnt; Übertragung auf die Impulsfrequenz der Nerven.", "aufgaben": [{"frage": "Was entspricht der Fingerfrequenz?", "antwort": "Die Frequenzierung: höhere Impulsfrequenz = mehr Kraft."}, {"frage": "Was wäre 'mehr Finger gleichzeitig'?", "antwort": "Rekrutierung/Synchronisation."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Eine Patientin hat bereits gut belastbare Strukturen; Ziel ist nun mehr Muskelquerschnitt. Welche Stufe und Dosierung passen?", "antwort": "Stufe 3: 40–70 % der Maximalkraft, 8–15 WH, 2–6 Serien – Muskelaufbautraining (Stufe 3) setzt gut belastbare Strukturen voraus: 40–70 %, 8–15 WH, 2–6 Serien über 3–5 Wochen."}, {"frage": "Du betreust einen 12-Jährigen im Krafttraining. Welche Dosierung entspricht den Empfehlungen nach Faigenbaum (2010)?", "antwort": "2–3x pro Woche, 1(–3) Sätze, (6) 10–15 WH, 1–3 min Pause – Für Kinder und Jugendliche: 2–3x/Woche, 1(–3) Sätze, (6) 10–15 WH, 1–3 min Pause, verschiedenste Übungen; professionelle Betreuung ist Voraussetzung."}, {"frage": "Eine Patientin schafft beim Beinpressen 11 Wiederholungen mit 45 kg. Laut Tabelle entsprechen 11 WH einer Belastungsintensität von 75 %. Wie hoch ist ihre Maximalkraft nach der indirekten Methode?", "antwort": " – Indirekte Methode (Dreisatz): Maximalkraft = geschaffte kg : Belastungsintensität → 45 kg : 0,75 = 60 kg."}]}], "einstieg": {"titel": "Zwei Sportler, ein Muskel", "min": 10, "situation": "Fall: Boxer und Kugelstoßer haben ähnlich großen Brustmuskel – aber der Kugelstoßer stößt weiter. Der Boxer schlägt schneller. Was unterscheidet die beiden? (App: Kraftanstiegskurven Folie 9.)", "impulse": [{"frage": "Unterschied?", "erwartung": "Kraftanstiegsgeschwindigkeit: Boxer = schneller Anstieg (Schnellkraft), Kugelstoßer = höhere Maximalkraft."}, {"frage": "Trainingsfolge?", "erwartung": "Beide trainieren IK – aber mit unterschiedlicher Betonung (schnell vs. schwer)."}, {"frage": "Therapiebezug?", "erwartung": "Nach Immobilisation zuerst IK (schnelle, koordinierte Ansteuerung), dann Hypertrophie."}, {"frage": "App-Fälle?", "erwartung": "LA_CASES k1–k4: Gewichtheber, Kugelstoßerin, Hocht springer – alle IK-Training (ikk/ikx)."}], "ueberleitung": "Die intramuskuläre Koordination entscheidet, wie viel der vorhandenen Muskelmasse wir wirklich abrufen können – sie ist der erste Trainingseffekt und das wichtigste Ziel der frühen Reha."}, "praesentation": {"titel": "Drei Mechanismen der intramuskulären Koordination", "min": 15, "merksatz": "Intramuskuläre Koordination = Ansteuerung innerhalb eines Muskels: 1) Rekrutierung (mehr motorische Einheiten gleichzeitig), 2) Frequenzierung (höhere Impulsfrequenz der Motoneurone), 3) Synchronisation (gleichzeitigere Aktivierung der Einheiten). Intermuskuläre Koordination = Zusammenspiel verschiedener Muskeln. Folge: Kraftanstieg zuerst neuronal (bis ~30 %, Kraftdefizit), dann strukturell (Hypertrophie).", "schritte": [{"ueberschrift": "Rekrutierung, Frequenzierung, Synchronisation", "text": "Drei Begriffe an die Tafel mit Symbolen (mehr Einheiten, schnellere Impulse, gleichzeitiger); Karteikarte in der App aufdecken.", "vortrag": "Ein Muskel besteht aus vielen motorischen Einheiten. Je mehr davon gleichzeitig (Rekrutierung) und je schneller hintereinander (Frequenzierung) feuern, desto mehr Kraft – und je synchroner sie arbeiten, desto effektiver. Genau das trainieren wir in der frühen Reha mit vielen leichten, schnellen Wiederholungen."}, {"ueberschrift": "Inter- vs. intramuskulär", "text": "Beispiel: Radfahren – intra: Quadrizeps-Ansteuerung; inter: Zusammenspiel Quadrizeps/Gluteus/Hamstrings.", "vortrag": "Intramuskulär = innerhalb eines Muskels, intermuskulär = zwischen Muskeln. Beides ist trainierbar; in der Therapie nach OP ist zuerst die intramuskuläre Reaktivierung des betroffenen Muskels dran, dann das Zusammenspiel (intermuskulär) – z. B. Gangbild."}, {"ueberschrift": "Warum Kraft zuerst ohne Wachstum steigt", "text": "Kraftdefizit (Stunde 10, 5–40 %) an die Tafel; Verlauf: erst neuronal, dann Hypertrophie (Zeitspanne Radlinger, Stunde 17).", "vortrag": "Das Kraftdefizit beträgt ca. 5–40 % – die Muskulatur wird nicht voll angesteuert. Deshalb steigt die Kraft in den ersten Wochen um bis zu 30 %, ohne dass der Muskel dicker wird (optimales Zusammenspiel der IK): Die neuronale Steuerung verbessert sich zuerst. Erst danach folgt das strukturelle Wachstum (Hypertrophie)."}]}, "arbeitsphase": {"titel": "IK-Training planen (Fallbeispiele)", "min": 25, "sozialform": "Einzelarbeit in der App (LA_CASES) oder Partnerpuzzle", "aufgaben": [{"titel": "Fall k1: Gewichtheber will Maximalkraft über mehr gleichzeitige motorische Einheiten steigern. Methode + Dosierung?", "text": "Fall k1: Gewichtheber will Maximalkraft über mehr gleichzeitige motorische Einheiten steigern. Methode + Dosierung?", "loesung": "Konzentrisches IK-Training (ikk): 85–100 % 1RM, 1–5 WH, 3–5 Sätze, lange Pausen (2–5 Min) – App-Fall k1 + Planer 'Konzentrisches IK-Training' (Folie 46).", "hilfe": "App: LA_CASES k1–k4, planner 'Konzentrisches IK-Training', table Folie 46."}, {"titel": "Fall: Kugelstoßerin, intramuskuläre Koordination verbessern, Sätze mit hoher Last.", "text": "Fall: Kugelstoßerin, intramuskuläre Koordination verbessern, Sätze mit hoher Last.", "loesung": "IK-Training (ikx-Variante, explosiv-kontrolliert) – App-Fall k2.", "hilfe": "App: LA_CASES k2."}, {"titel": "Fall: Hocht springer trainiert IK mit Niedersprüngen (von Kasten).", "text": "Fall: Hocht springer trainiert IK mit Niedersprüngen (von Kasten).", "loesung": "Reaktivkraft-/IK-nahe Belastung: Niedersprünge = plyometrisch (DVZ) – hier als ikx-Fall eingeordnet (App-Fall k4).", "hilfe": "App: LA_CASES k4, diagram DVZ Folien 31–32 (Stunde 15)."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Vergleiche das konzentrische IK-Training mit dem Hypertrophietraining anhand der Belastungskomponenten.", "loesung": "- Arbeitsweise: beide konzentrisch\n- Bewegungsgeschwindigkeit: IK explosiv – Hypertrophie langsam bis zügig\n- Last: IK 85–100 % 1RM – Hypertrophie 60–90 %\n- Intensität: IK maximal – Hypertrophie submaximal\n- Dauer: IK 1–3 (–5) WH – Hypertrophie 8–12 (6–20) WH bis zur Erschöpfung\n- Pause: IK 3–5 (eher > 6) min – Hypertrophie 2–3 min\n- Umfang: IK 3–8 Sätze – Hypertrophie 3–5 Sätze je Übung bei 3–5 Übungen", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere bearbeiten die Fälle direkt in der App mit aufgeklappten Tabellen; stärkere begründen, warum lange Pausen beim IK-Training nötig sind (vollständige ATP-/Kreatinphosphat-Resynthese, Halbwertszeit – Thema Ausdauer).", "app_uebung": "App: LA_CASES k1–k4, planner 'IK-Training' Folie 46, diagram Folie 9, cards 'IK', exam (5 P)."}, "sicherung": {"titel": "Drei-Mechanismen-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die drei Mechanismen der intramuskulären Koordination und erkläre, warum die Kraft in der frühen Reha zuerst steigt, ohne dass der Muskel wächst.", "aufgaben": [{"frage": "Drei Mechanismen?", "loesung": "Rekrutierung, Frequenzierung, Synchronisation."}, {"frage": "Kraftanstieg ohne Wachstum?", "loesung": "Neuronale Anpassung – Abbau des Kraftdefizits (ca. 30 %), bevor Hypertrophie folgt."}, {"frage": "Ein Sportler schafft beim Bankdrücken genau 20 Wiederholungen mit 30 kg. Wie hoch ist seine Maximalkraft laut Hochrechnungstabelle?  [App-Quiz: Kraft und Krafttraining]", "loesung": " – Laut Hochrechnungstabelle entsprechen 20 WH einer Belastungsintensität von 60 %. Maximalkraft = 30 kg : 0,60 = 50 kg."}]}, "hausaufgabe": "Karteikarten 'IK' lernen; App-Fälle k1–k4 (LA_CASES) lösen; exam-Aufgabe 'intramuskuläre Koordination' (5 P) schriftlich üben; Diagramm Folie 9 beschriften.", "hinweise": ["Fehler: Inter- und intramuskuläre Koordination werden vertauscht – intra = ein Muskel, inter = Muskeln untereinander.", "Therapiebezug: frühe Reha = neuronale Reaktivierung (IK) – das erklärt schnelle Anfangsfortschritte nach Immobilisation.", "App-Fälle k1–k4 (ikk/ikx) sind direkt prüfungsrelevant (Fallbeispiele)."], "quellen": ["Examenstrainer.html · DATA kraft: diagram Folie 9, cards 'IK'/'Rekrutierung…', LA_CASES k1–k4, planner Folie 46, exam (5 P)"]}, "kr-13": {"nr": 13, "id": "kr-13", "thema": "kraft", "titel": "Maximalkraft bestimmen: 1RM-Test, indirekte Hochrechnung, isokinetische Messung", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben die Durchführung eines 1RM-Tests (prüfungsrelevant, 6 P).", "Sie erläutern die indirekte Methode (Hochrechnung aus Wiederholungszahl).", "Sie nennen weitere Testverfahren (isokinetisch) und ordnen sie der gemessenen Kraftfähigkeit zu."], "vorwissen": "Stunden 10–12 (Kraftfähigkeiten, Kontraktionsformen, IK).", "material": ["App, Beamer", "Tabelle 'Hochrechnung der Maximalkraft' (Folien 17–18) + Diagramm 'Hochrechnungstabelle Intensität–Wiederholungen' (Folie 18)", "Rechenbeispiele an der Tafel"], "physio": "Ohne verlässliche Ausgangsmessung lässt sich die MTT nicht dosieren: Der 1RM-Test (oder die schonendere indirekte Hochrechnung) liefert die Basis für die Prozentberechnung der Trainingsintensität – z. B. 60 % 1RM in der frühen Reha nach Knie-OP. Der Test muss standardisiert sein, sonst ist der Verlauf nicht vergleichbar.", "app": {"einsatz": ["Reihenfolge: 'Durchführung des 1RM-Tests' (App-sequence)", "Tabellen: 'Hochrechnung der Maximalkraft' (Folien 17–18), Diagramm Folie 18 + Hotspot", "Zuordnen: 'Testverfahren und gemessene Kraftfähigkeit'", "Quiz-Rechenfälle: 76 kg genau 2 WH → geschätzte Maximalkraft; 20 WH mit 30 kg; 11 WH mit 45 kg (Tabelle %); 80 kg >1 WH → nächster Schritt der Serienmethode", "Prüfungsaufgabe: 1RM-Test + indirekte Methode (6 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "WH-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Wie viel Prozent darf der Patient heben?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vom Test zur Dosierung"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Rechnen mit der Tabelle · Einzelarbeit, Partner-Kontrolle"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Dosierungs-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "WH-Raten", "art": "Schätzen", "min": 5, "anleitung": "Wie viel Prozent 1RM sind ca. 10 WH? Schätzen, dann Tabelle Folie 18 in der App nachschlagen.", "aufgaben": [{"frage": "10 WH ≈ ? % 1RM", "antwort": "ca. 75 % (Tabelle Folie 18)."}, {"frage": "2 WH ≈ ?", "antwort": "ca. 95 %."}, {"frage": "20 WH ≈ ?", "antwort": "ca. 60 %."}, {"frage": "Wofür nutzt man das?", "antwort": "Indirekte 1RM-Schätzung ohne Maximalbelastung (patientenschonend)."}]}, {"titel": "Test-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Testverfahren (isokinetisch, 1RM, indirekt).", "aufgaben": [{"frage": "Was misst die isokinetische Kraftmessung?", "antwort": "Kraft bei konstanter Geschwindigkeit (Drehmomentverlauf)."}, {"frage": "Vorteil der indirekten Methode?", "antwort": "Keine maximale Ausbelastung nötig – sicher für Patienten (App-Quiz PWC-Bezug Ausdauer)."}, {"frage": "Reihenfolge 1RM-Test?", "antwort": "App-sequence 'Durchführung des 1RM-Tests' in der App ordnen."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Ein Sportler schafft beim Bankdrücken genau 20 Wiederholungen mit 30 kg. Wie hoch ist seine Maximalkraft laut Hochrechnungstabelle?", "antwort": " – Laut Hochrechnungstabelle entsprechen 20 WH einer Belastungsintensität von 60 %. Maximalkraft = 30 kg : 0,60 = 50 kg."}, {"frage": "Beim 1RM-Test schaffst du mit 80 kg noch mehr als eine Wiederholung. Mit welchem Gewicht machst du nach der Serienpause den nächsten Versuch?", "antwort": " – Beim 1RM-Test wird die Last schrittweise um ca. 10 % gesteigert, bis nur noch eine Wiederholung gelingt: 80 kg + 8 kg = 88 kg."}, {"frage": "Konzentrisches IK-Training, ansteigende Variante (85 – 90 – 95 – 100 %): Dein 1RM beträgt 120 kg. Mit welcher Last absolvierst du den zweiten Satz?", "antwort": " – Der zweite Satz der ansteigenden Variante liegt bei 90 % des 1RM: 0,90 × 120 kg = 108 kg."}]}], "einstieg": {"titel": "Wie viel Prozent darf der Patient heben?", "min": 10, "situation": "Fall: Nach Knie-TEP soll die Patientin mit 60 % ihrer Maximalkraft trainieren. Ihre geschätzte Maximalkraft (indirekt): 75 kg. Wie viel kg sind das – und wie kommst du auf die 75 kg?", "impulse": [{"frage": "Berechnung?", "erwartung": "60 % von 75 kg = 45 kg."}, {"frage": "Woher die 75 kg?", "erwartung": "Indirekte Hochrechnung: z. B. 10 WH mit 56 kg → ca. 75 % → 1RM ≈ 75 kg (Tabelle Folie 18)."}, {"frage": "Warum nicht direkt 1RM testen?", "erwartung": "Post-OP zu belastend – indirekte Methode ist patientenschonend."}, {"frage": "App-Bezug?", "erwartung": "App-Quiz: '11 WH mit 45 kg – welche Belastung laut Tabelle?'"}], "ueberleitung": "Jede Kraftdosierung in der MTT basiert auf Prozent des 1RM – deshalb müssen wir die Maximalkraft bestimmen, direkt oder indirekt."}, "praesentation": {"titel": "Vom Test zur Dosierung", "min": 15, "merksatz": "1RM-Test: standardisiertes Aufwärmen, schrittweise Steigerung bis nur noch 1 WH möglich (Serienmethode: Last schrittweise um ca. 10 % steigern (z. B. 80 kg + 8 kg = 88 kg), bis nur 1 WH gelingt (App-Quiz)). Indirekte Methode: submaximale Sätze (z. B. 10 WH) → Hochrechnung über Tabelle (Folien 17–18): WH ↔ % 1RM. Isokinetisch: Kraft bei konstanter Winkelgeschwindigkeit. Alle Verfahren ordnen sich einer Kraftfähigkeit zu (App-sorts).", "schritte": [{"ueberschrift": "Durchführung des 1RM-Tests", "text": "App-sequence 'Durchführung des 1RM-Tests' schrittweise aufdecken; Sicherheitshinweise (Erfahrung, Aufsicht, korrekte Technik).", "vortrag": "Der 1RM-Test ist der Goldstandard, aber belastend: nach standardisiertem Aufwärmen steigern wir in Serien (z. B. +5–10 kg), bis nur noch eine Wiederholung gelingt. Sicherheit hat Vorrang – in der Therapie messen wir deshalb meist indirekt."}, {"ueberschrift": "Indirekte Hochrechnung", "text": "Tabelle Folien 17–18 projizieren; Beispiel rechnen: 10 WH mit 56 kg ≈ 75 % → 1RM ≈ 75 kg.", "vortrag": "Die Hochrechnungstabelle ordnet Wiederholungszahlen Prozentwerten des 1RM zu: ca. 10 WH = 75 %, 2 WH = 95 %, 20 WH = 60 %. Rechnen wir rückwärts, schätzen wir das 1RM ohne Maximalbelastung – ideal für Patienten in der Reha."}, {"ueberschrift": "Weitere Testverfahren", "text": "App-sorts 'Testverfahren und gemessene Kraftfähigkeit': isokinetisch (Drehmoment bei konstanter Geschwindigkeit), isometrisch (Kraftmessdose), dynamisch (1RM).", "vortrag": "Je nach Fragestellung wählen wir das Verfahren: isokinetisch für den Drehmomentverlauf (z. B. bei Dysbalancen), isometrisch für schmerzfreie Maximalkraft, dynamisch für die alltagsnahe 1RM. In der App ordnen wir jedes Verfahren der passenden Kraftfähigkeit zu."}]}, "arbeitsphase": {"titel": "Rechnen mit der Tabelle", "min": 25, "sozialform": "Einzelarbeit, Partner-Kontrolle", "aufgaben": [{"titel": "Eine Sportlerin schafft mit 76 kg genau 2 WH. Geschätzte Maximalkraft?", "text": "Eine Sportlerin schafft mit 76 kg genau 2 WH. Geschätzte Maximalkraft?", "loesung": "2 WH ≈ 95 % → 1RM ≈ 80 kg (App-Quiz, Formel/Tabelle).", "hilfe": "App-Quiz kraft: '76 kg genau 2 WH' – Musterlösung in der App."}, {"titel": "Beim Bankdrücken schaffst du genau 20 WH mit 30 kg. 1RM?", "text": "Beim Bankdrücken schaffst du genau 20 WH mit 30 kg. 1RM?", "loesung": "20 WH ≈ 60 % → 1RM ≈ 50 kg (App-Quiz).", "hilfe": "App: quiz kraft Rechenfälle."}, {"titel": "11 WH mit 45 kg am Beinpresse – Belastung in % laut Tabelle?", "text": "11 WH mit 45 kg am Beinpresse – Belastung in % laut Tabelle?", "loesung": "ca. 70–75 % 1RM (Tabelle Folie 18; App-Quiz).", "hilfe": "App: quiz '11 WH 45 kg'."}, {"titel": "1RM-Test: mit 80 kg schaffst du noch mehr als eine WH – wie gehst du weiter?", "text": "1RM-Test: mit 80 kg schaffst du noch mehr als eine WH – wie gehst du weiter?", "loesung": "Serienmethode: + ca. 10 % (80 kg → 88 kg), bis nur 1 WH gelingt (App-Quiz).", "hilfe": "App: sequence 'Durchführung des 1RM-Tests'."}, {"titel": "Prüfungsnahe Aufgabe (8 P)", "text": "Beschreibe das Fünf-Stufen-Modell zum Muskeltraining nach Froböse mit Zielen und Intensitäten der Stufen.", "loesung": "- Stufe 1 Aktivierung/Innervationsschulung: Bahnung des afferenten Sets, Wahrnehmung, < 30 % Fmax, 2–3 Wochen, 4–8 TE\n- Stufe 2 Lokales Muskelausdauertraining: Ökonomisierung, Ermüdungswiderstand; 30–40 %, 20–40 WH, 1–6 Serien, 2–4 Wochen\n- Stufe 3 Muskelaufbautraining: Hypertrophie; 40–70 %, 8–15 WH, 2–6 Serien; Voraussetzung gut belastbare Strukturen\n- Stufe 4 Neuromuskuläre Kraftqualitäten: Frequenzierung/Rekrutierung (FT-Fasern); IK- und Reaktivkrafttraining 75–100 %, 1–6 WH, 3–6 Serien; voll belastbare Strukturen\n- Stufe 5 Vielfältige, situations(un)abhängige Kraftqualitäten: Funktionelles Training, > 30 %, Widerstands- und Geschwindigkeitsvariationen", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere rechnen mit der ausgedruckten Tabelle Folie 18; stärkere leiten daraus die Therapiedosierung ab (60 % von geschätztem 1RM in der frühen Reha) und diskutieren, warum die indirekte Methode post-OP vorzuziehen ist.", "app_uebung": "App: tables/diagram Folien 17–18 + hotspot, sorts 'Testverfahren', sequences '1RM-Test', quiz-Rechenfälle, exam (6 P)."}, "sicherung": {"titel": "Dosierungs-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "10 WH mit 60 kg entsprechen ca. 75 % 1RM. Wie hoch ist das geschätzte 1RM, und wie viel kg sind 60 % davon (Therapiedosis)?", "aufgaben": [{"frage": "1RM?", "loesung": "ca. 80 kg (60 kg / 0,75)."}, {"frage": "60 % Dosis?", "loesung": "ca. 48 kg."}, {"frage": "Methode?", "loesung": "Indirekte Hochrechnung (Tabelle Folien 17–18) – patientenschonend."}, {"frage": "Hypertrophietraining, ansteigende Variante (60 – 70 – 80 – 90 %): Dein 1RM beträgt 90 kg. Welche Last nimmst du im dritten Satz?  [App-Quiz: Kraft und Krafttraining]", "loesung": " – Der dritte Satz liegt bei 80 % des 1RM: 0,80 × 90 kg = 72 kg."}]}, "hausaufgabe": "Tabelle 'Hochrechnung' (Folien 17–18) als Spickzettel ins Heft; App-sequence '1RM-Test' ordnen; drei Rechenfälle aus dem App-Quiz lösen; exam-Aufgabe (6 P) '1RM-Test + indirekte Methode' üben.", "hinweise": ["Fehler: Direkter 1RM-Test post-OP – kontraindiziert; immer indirekte Methode in der frühen Phase.", "WH-%-Werte (Folie 18) sind Richtwerte – individuelle Abweichungen möglich; Verlauf messen, nicht nur einmal testen.", "Prüfungsrelevant: 1RM-Test-Durchführung (6 P) + indirekte Methode (App-exam)."], "quellen": ["Examenstrainer.html · DATA kraft: tables/diagram/hotspot Folien 17–18, sorts 'Testverfahren', sequence '1RM-Test', quiz-Rechenfälle, exam (6 P)"]}, "kr-14": {"nr": 14, "id": "kr-14", "thema": "kraft", "titel": "Schnellkraft: Startkraft, Explosivkraft, Kraft-Zeit-Kurve, Muskelfasertypen", "dauer": 60, "ziele": ["Die Auszubildenden definieren Schnellkraft und unterscheiden Startkraft und Explosivkraft.", "Sie beschreiben die Kraft-Zeit-Kurve und die Schnellkraftkomponenten (Folien 24–26).", "Sie erklären, warum das Schnellkraftniveau trotz genetisch festgelegter Faserverteilung verbesserbar ist (Zeitprogramme)."], "vorwissen": "Stunden 10–13 (Kraftfähigkeiten, IK, 1RM).", "material": ["App, Beamer", "Diagramme: 'Kraft-Zeit-Kurve' (Folie 24), 'Trainierter vs. Anfänger + Schnellkraftkomponenten' (Folien 25–26, Hotspot/Labels)", "Reaktionsspiele (Ball fallen lassen)"], "physio": "Schnellkraft ist in der Geriatrie und Sturzprophylaxe zentral: Wer schnell Kraft entwickeln kann (z. B. beim Stolpern abstützen), stürzt seltener. Im Sport nach Reha (Return to Sport) ist Schnellkraft die letzte Stufe vor Vollbelastung – sie wird erst trainiert, wenn Maximalkraft und Kraftausdauer aufgebaut sind (Prinzip der Belastungsfolge).", "app": {"einsatz": ["Diagramme + Hotspots/Labels: 'Kraft-Zeit-Kurve' (Folie 24), 'Schnellkraftkomponenten' (Folien 25–26)", "Karteikarten: 'Schnellkraft – Definition', 'Startkraft, Explosivkraft, muskuläre Leistungsfähigkeit', 'Zeitprogramme', 'Muskelfaserverteilung (FT/ST)', 'Einflussfaktoren auf die Schnellkraft', 'Schnellkraftindex'", "Quiz: 'Wie ist die Startkraft definiert?', 'Wie lässt sich das Schnellkraftniveau trotz genetisch festgelegter Faserverteilung verbessern?'", "Zuordnen: 'Testverfahren und gemessene Kraftfähigkeit' (Schnellkrafttests)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Reaktions-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der Stolpernde"}, {"phase": "Präsentation", "min": 15, "inhalt": "Schnellkraft auf der Kraft-Zeit-Kurve"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Schnellkraft-Fälle · Partnerarbeit mit App-Fällen und Diagrammen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Schnellkraft-Definition · Schriftlich, einzeln"}], "warmups": [{"titel": "Reaktions-Blitz", "art": "Spiel", "min": 5, "anleitung": "Ball-fallen-lassen-Reaktion: Partner lässt Ball fallen, man fängt ihn – je schneller die Reaktion/Kraft, desto kürzer die Fallstrecke. 5 Versuche.", "aufgaben": [{"frage": "Was trainiert das?", "antwort": "Schnellkraft/Reaktionsschnelligkeit – Alltagsbezug: Stolpern abstützen."}, {"frage": "Startkraft-Definition?", "antwort": "Kraftwert 50 ms nach Kontraktionsbeginn; ab 300 ms ist die muskuläre Leistungsfähigkeit bestimmend (App-Quiz)."}, {"frage": "Explosivkraft?", "antwort": "Maximale Kraftanstiegsgeschwindigkeit (spätere Phase der Kurve)."}]}, {"titel": "Kurven-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Startkraft/Explosivkraft/Zeitprogrammen/FT-ST-Fasern.", "aufgaben": [{"frage": "Wie ist die Startkraft definiert?", "antwort": "Kraft in den ersten ca. 250 ms der Kontraktion."}, {"frage": "Was sind FT-/ST-Fasern?", "antwort": "Schnelle (FT) vs. langsame (ST) Muskelfasern – genetisch verteilt."}, {"frage": "Wie verbessert man Schnellkraft trotz genetisch festgelegter Faserverteilung?", "antwort": "ST→FT-Umwandlung ist ausgeschlossen; über Hypertrophietraining steigt der Querschnittsanteil der FT-Fasern (App-Quiz)."}, {"frage": "Schnellkraftindex?", "antwort": "Verhältnis von Maximalkraft zu Zeit – Maß für die Schnellkraft."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Hypertrophietraining, ansteigende Variante (60 – 70 – 80 – 90 %): Dein 1RM beträgt 90 kg. Welche Last nimmst du im dritten Satz?", "antwort": " – Der dritte Satz liegt bei 80 % des 1RM: 0,80 × 90 kg = 72 kg."}, {"frage": "Kraftausdauertraining: Dein 1RM beim Rudern liegt bei 70 kg. Wie viel Kilogramm darf die Last nach den Belastungskomponenten höchstens betragen?", "antwort": " – Kraftausdauertraining: Last 50–60 % des 1RM. Obergrenze: 0,60 × 70 kg = 42 kg (Untergrenze: 35 kg)."}, {"frage": "Anfängermethode: Mit der gewählten Last könnte ein Anfänger höchstens 24 Wiederholungen schaffen. Wie viele Wiederholungen führt er pro Satz aus?", "antwort": " – Bei der Anfängermethode werden ca. 50 % der maximal möglichen Wiederholungen ausgeführt: 0,5 × 24 = 12 WH (im Bereich 8–15 WH)."}]}], "einstieg": {"titel": "Der Stolpernde", "min": 10, "situation": "Fall: Ein älterer Patient stolpert – kann er sich abstützen oder stürzt er? Was entscheidet darüber physiologisch?", "impulse": [{"frage": "Entscheidend?", "erwartung": "Schnellkraft/Reaktivkraft: schnelle Kraftentwicklung in Millisekunden."}, {"frage": "Trainierbar im Alter?", "erwartung": "Ja, begrenzt – Zeitprogramme und Koordination (App-Quiz FT/ST)."}, {"frage": "Reihenfolge im Training?", "erwartung": "Erst Maximalkraft/Kraftausdauer, dann Schnellkraft (Belastungsfolge, TL Stunde 6)."}, {"frage": "App-Bezug?", "erwartung": "App: diagram Folien 25–26 (Komponenten der Schnellkraft)."}], "ueberleitung": "Schnellkraft entscheidet über Sturzprophylaxe und Return-to-Sport – aber sie wird erst spät im Therapieverlauf trainiert. Heute: Was ist Schnellkraft und wie messen wir sie?"}, "praesentation": {"titel": "Schnellkraft auf der Kraft-Zeit-Kurve", "min": 15, "merksatz": "Kraft-Zeit-Kurve: Kraft steigt nach Beginn der Kontraktion an. Startkraft = Kraftwert bei 50 ms nach Kontraktionsbeginn; ab 300 ms bestimmt die muskuläre Leistungsfähigkeit; Schnellkraftindex = Kraftmaximum / benötigte Zeit (isometrisch). Muskelfase
