chem Mechanismus. Heute: die fünf Methoden und PNF im Detail."}, "praesentation": {"titel": "Fünf Dehnmethoden im Vergleich", "min": 15, "merksatz": "Fünf Methoden (Folie 11): aktiv-dynamisch (schwunghaft), aktiv-statisch (halten), passiv-dynamisch (federn), passiv-statisch (Stretching, halten 15–30 s), PNF (AC: Antagonist anspannen; CR: Zielmuskel anspannen→lösen→dehnen; CRAC: kombiniert). Mechanismus: reziproke Hemmung (AC) und postisometrische Relaxation (CR/CRAC) über Golgi-Sehnenorgan/Spindel. Hoster (Folie 10): aktiv vs. passiv, dynamisch vs. statisch.", "schritte": [{"ueberschrift": "Die fünf Methoden (Folie 11)", "text": "Diagramm Folie 11 projizieren; fünf Methoden mit Merkmalen an die Tafel; App-sorts 'Aktive oder passive Dehnungsarten (Hoster)' lösen.", "vortrag": "Es gibt fünf Dehnmethoden: aktiv-dynamisch (rhythmisches Schwingen), aktiv-statisch (selbst halten), passiv-dynamisch (federnd durch äußere Kraft), passiv-statisch (klassisches Stretching: langsam dehnen und 15–30 Sekunden halten) und PNF. Nach Hoster unterscheiden wir außerdem aktiv vs. passiv und dynamisch vs. statisch (Folie 10). Die Wahl richtet sich nach Ziel und Patient."}, {"ueberschrift": "PNF: AC-, CR-, CRAC-Stretching", "text": "Drei Karten in der App aufdecken; Demo CR an der Wade; Wirkmechanismus an die Tafel (reziproke Hemmung + postisometrische Relaxation via Golgi).", "vortrag": "PNF nutzt neuronale Mechanismen: Beim AC-Stretching spannen wir den Antagonisten an – durch reziproke Hemmung entspannt der Zielmuskel. Beim CR-Stretching spannen wir den Zielmuskel selbst isometrisch an, lösen und dehnen dann passiv – das Golgi-Sehnenorgan hemmt nach der Anspannung die Aktivität (postisometrische Relaxation). CRAC kombiniert beides. PNF ist besonders wirksam bei Verspannungen – prüfungsrelevant mit Wirkmechanismus (6 Punkte)."}, {"ueberschrift": "Wann welche Methode?", "text": "Vorschau Std. 43: aktiv-dynamisch zum Aufwärmen, passiv-statisch zur Regeneration/allgemeinen Beweglichkeit; PNF bei Verspannung/Verkürzung; Kontraindikationen beachten.", "vortrag": "Die Methode folgt dem Ziel: Zum Aufwärmen aktiv-dynamisch, zur Regeneration passiv-statisch, bei Verkürzung/Verspannung PNF. Kontraindikationen (akute Entzündung, Hypermobilität, Frakturgefahr) schließen Dehnen aus – das klären wir in der nächsten Stunde mit 'Dehnen je nach Ziel' (Folien 15–17)."}]}, "arbeitsphase": {"titel": "Methoden zuordnen und PNF üben", "min": 25, "sozialform": "Partnerarbeit mit App-cards und Demo", "aufgaben": [{"titel": "Ordne zu: 'Antagonist anspannen', 'Zielmuskel anspannen→lösen→dehnen', 'Kombination', 'passiv 20 s halten'.", "text": "Ordne zu: 'Antagonist anspannen', 'Zielmuskel anspannen→lösen→dehnen', 'Kombination', 'passiv 20 s halten'.", "loesung": "AC, CR, CRAC, passiv-statisch (App-cards + Folie 11).", "hilfe": "App: cards 'AC/CR/CRAC', diagram Folie 11."}, {"titel": "Übt CR-Stretching für die Wade (Partnerdemo): 5–10 s isometrisch → lösen → 20–30 s dehnen. Was spürt ihr?", "text": "Übt CR-Stretching für die Wade (Partnerdemo): 5–10 s isometrisch → lösen → 20–30 s dehnen. Was spürt ihr?", "loesung": "Postisometrische Relaxation – Muskel gibt stärker nach (App-card 'CR-Stretching').", "hilfe": "App: card 'CR-Stretching'."}, {"titel": "Fall: frische Fraktur / akute Entzündung – dehnen?", "text": "Fall: frische Fraktur / akute Entzündung – dehnen?", "loesung": "Nein – Kontraindikationen: knöcherne Blockaden, frische/instabile Frakturen, akute Entzündung, starker akuter Schmerz, frische Hämatome (App-Quiz) → Ruhigstellung/Schmerztherapie.", "hilfe": "App: quiz 'Kontraindikation Flexibilitätstraining'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Erläutere die drei PNF-Dehnmethoden (AC-, CR- und CRAC-Stretching) und ihren jeweils beabsichtigten Wirkmechanismus.", "loesung": "- PNF = Propriozeptive neuromuskuläre Fazilitation\n- AC (Antagonist-Contract): Antagonist wird während der Dehnung isometrisch angespannt\n- → reziproke (Vorwärts-)Hemmung des Zielmuskels (über Renshaw-Zellen)\n- CR (Contract-Relax): maximale isometrische Kontraktion des Zielmuskels vor der Dehnung\n- → Erregung der Sehnenspindeln, autogene Hemmung des Dehnungsreflexes\n- CRAC: Kombination – erst Zielmuskel anspannen, dann AC; autogene und reziproke Hemmung wirken zusammen", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit den App-cards; stärkere führen die PNF-Demo durch und begründen den neuronalen Mechanismus (Golgi/Spindel, BL I Std. 37) – und diskutieren, warum PNF bei akuter Entzündung kontraindiziert ist.", "app_uebung": "App: diagram Folie 11, sorts 'Dehnungsarten (Hoster)', cards 'AC/CR/CRAC'/'Passiv-statisch'/'Kontraindikationen', quiz, exam (6 P)."}, "sicherung": {"titel": "Methoden-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die drei PNF-Methoden mit je einem Satz Wirkmechanismus und eine Kontraindikation fürs Dehnen.", "aufgaben": [{"frage": "PNF?", "loesung": "AC: Antagonist anspannen (reziproke Hemmung); CR: Zielmuskel anspannen→lösen→dehnen (postisometrische Relaxation); CRAC: kombiniert."}, {"frage": "Kontraindikation?", "loesung": "z. B. akute Entzündung, frische/instabile Fraktur, starker akuter Schmerz, frisches Hämatom, knöcherne Blockade (App-Quiz)."}, {"frage": "Was bezeichnet der Begriff Phylogenese?  [App-Quiz: Bewegungslehre II]", "loesung": "Die Stammesentwicklung einer Spezies im Sinne der biologischen Evolution – Phylogenese ist die Stammesentwicklung (Evolution der Arten), Ontogenese die Entwicklung des Individuums."}]}, "hausaufgabe": "Diagramm Folie 11 ins Heft; App-sorts 'Dehnungsarten (Hoster)' fehlerfrei; Karteikarten 'AC/CR/CRAC'/'Passiv-statisch'/'Kontraindikationen' lernen; exam-Aufgabe PNF (6 P) üben; CR-Demo mit Partner protokollieren.", "hinweise": ["Fehler: AC und CR vertauscht – AC = Antagonist, CR = Zielmuskel (contract-relax) (App-cards).", "Postisometrische Relaxation ohne Golgi-Bezug erklärt – BL I Std. 37 verknüpfen.", "Kontraindikationen nicht beachtet → Schaden (App-card 'Kontraindikationen')."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: diagram Folie 11, sorts 'Dehnungsarten', cards 'AC/CR/CRAC'/'Kontraindikationen', quiz, exam (6 P)"]}, "b2-43": {"nr": 43, "id": "b2-43", "thema": "bewegungslehre2", "titel": "Dehnen je nach Ziel: Vorbereitung, Regeneration, allgemeine Beweglichkeit – und Kontraindikationen", "dauer": 60, "ziele": ["Die Auszubildenden vergleichen Dehnen zur Vorbereitung mit Dehnen zur Regeneration (Ziel/Wirkung, Methode, Durchführung) (prüfungsrelevant, 6 P).", "Sie wählen die passende Dehnmethode je nach Ziel aus der Tabelle (Folien 15–17).", "Sie nennen Kontraindikationen und die Problematik der Pauschalisierung (drei Anwendergruppen)."], "vorwissen": "Stunden 41–42 (Flexibilität, Dehnmethoden).", "material": ["App, Beamer", "Tabelle 'Dehnen je nach Ziel' (Folien 15–17)", "Planer: 'Dehnen zur Vorbereitung' (Folie 16), 'Dehnen zur Regeneration' (Folie 17), 'Dehnen für die allgemeine Beweglichkeit' (Folie 15)"], "physio": "In der Praxis fragen Patienten ständig: 'Soll ich vor dem Sport dehnen oder danach?' – die Antwort ist zielabhängig: Vor Belastung aktiv-dynamisch (kurz, schwunghaft – steigert Leistungsbereitschaft, Folie 16), nach Belastung passiv-statisch (Regeneration, Folie 17), für die allgemeine Beweglichkeit langfristig gehalten (Folie 15). Pauschalaussagen ('Dehnen ist immer gut') sind falsch – Kontraindikationen und Anwendergruppen beachten.", "app": {"einsatz": ["Tabelle 'Dehnen je nach Ziel' (Folien 15–17)", "Planer: 'Dehnen zur Vorbereitung' (Folie 16), 'Dehnen zur Regeneration' (Folie 17), 'Dehnen für die allgemeine Beweglichkeit' (Folie 15)", "Quiz: 'Vergleiche Dehnen zur Vorbereitung vs. Regeneration (exam 6 P)', 'Drei Anwendergruppen (Problematik der Pauschalisierung)', 'Kontraindikationen'", "Karteikarten: 'Dehnen zur Vorbereitung vor Wettkampf/Training', 'Dehnen zur Regeneration', 'Langzeitdehnen zur Entwicklung der allgemeinen Beweglichkeit', 'Drei Anwendergruppen', 'Kontraindikationen für Flexibilitätstraining', 'Fazit zum Beweglichkeitstraining'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Ziel-Dehnen-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Vor oder nach dem Sport?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Dehnen je nach Ziel"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Planer ausfüllen und Fälle entscheiden · Einzelarbeit mit App-Planern + Partnerdiskussion"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Ziel-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Ziel-Dehnen-Raten", "art": "Quiz", "min": 5, "anleitung": "App-Quiz: Welche Methode vor dem Training, welche danach, welche langfristig?", "aufgaben": [{"frage": "Vor Belastung?", "antwort": "Aktiv-dynamisch, kurz (Folie 16) – steigert Temperatur/Leistungsbereitschaft, kein statisches Halten (App-Quiz)."}, {"frage": "Nach Belastung/Regeneration?", "antwort": "Passiv-statisch, länger halten (Folie 17) – Regeneration (App-Quiz)."}, {"frage": "Langfristig/allgemeine Beweglichkeit?", "antwort": "Langzeitdehnen, regelmäßig (Folie 15) (App-card)."}, {"frage": "Pauschalisierung problematisch?", "antwort": "Ja – drei Anwendergruppen (z. B. Sportler, Senioren, Patienten) brauchen Unterschiedliches (App-card)."}]}, {"titel": "Planer-Demo", "art": "Spiel", "min": 5, "anleitung": "App-Planer 'Dehnen zur Vorbereitung'/'Regeneration'/'allgemeine Beweglichkeit' (Folien 15–17) für ein Beispiel ausfüllen – dann vergleichen.", "aufgaben": [{"frage": "Vorbereitung: dynamisch, 5–10 s schwingen?", "antwort": "Ja – Folie 16 (App-planner)."}, {"frage": "Regeneration: statisch, 20–30 s halten?", "antwort": "Ja – Folie 17 (App-planner)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Was bezeichnet der Begriff Phylogenese?", "antwort": "Die Stammesentwicklung einer Spezies im Sinne der biologischen Evolution – Phylogenese ist die Stammesentwicklung (Evolution der Arten), Ontogenese die Entwicklung des Individuums."}, {"frage": "Was bedeutet Akzeleration in der motorischen Ontogenese?", "antwort": "Beschleunigte Entwicklung – Akzeleration ist die beschleunigte Entwicklung, Retardierung die Entwicklungsverzögerung. Sportler weisen meist Akzeleration auf."}, {"frage": "Wie viel Prozent der Kopfgröße eines Erwachsenen sind mit etwa 6 Jahren erreicht?", "antwort": "Ca. 90 % – Nach Scammon erreicht der Kopf mit 6 Jahren ca. 90 % der Erwachsenengröße, das allgemeine Körperwachstum nur ca. 50 %."}]}], "einstieg": {"titel": "Vor oder nach dem Sport?", "min": 10, "situation": "Fall: Patient fragt: 'Ich spiele zweimal pro Woche Fußball – wann soll ich dehnen, und wie?' – was antwortest du auf Basis der Tabelle (Folien 15–17)?", "impulse": [{"frage": "Vorher?", "erwartung": "Aktiv-dynamisch, kurz (Folie 16) – nicht statisch dehnen vor Belastung (Leistungsminderung, Verletzungsrisiko)."}, {"frage": "Nachher?", "erwartung": "Passiv-statisch zur Regeneration (Folie 17)."}, {"frage": "Langfristig?", "erwartung": "Allgemeine Beweglichkeit mit Langzeitdehnen (Folie 15)."}, {"frage": "App-Bezug?", "erwartung": "App: exam (6 P) 'Dehnen Vorbereitung vs. Regeneration'."}], "ueberleitung": "Dehnen ist nicht gleich Dehnen – das Ziel bestimmt Methode und Durchführung. Heute: die Tabelle 'Dehnen je nach Ziel' und die Planer."}, "praesentation": {"titel": "Dehnen je nach Ziel", "min": 15, "merksatz": "Tabelle Folien 15–17: (1) Allgemeine Beweglichkeit: Langzeitdehnen, passiv-statisch oder aktiv, regelmäßig, 20–60 s (Folie 15). (2) Vorbereitung vor Belastung: aktiv-dynamisch, kurz, schwunghaft – erhöht Leistungsbereitschaft, kein statisches Dehnen vor Maximalbelastung (Folie 16). (3) Regeneration: passiv-statisch nach Belastung, entspannt halten (Folie 17). Kontraindikationen: akute Entzündung, frische Verletzung/OP, Hypermobilität, Osteoporose (Vorsicht). Pauschalisierung vermeiden: drei Anwendergruppen (Sportler, Senioren, Patienten) brauchen unterschiedliche Programme.", "schritte": [{"ueberschrift": "Die drei Ziele im Vergleich", "text": "Tabelle Folien 15–17 spaltenweise vergleichen; App-Planer für alle drei Ziele (Folien 15/16/17) ausfüllen; exam (6 P) vorbereiten.", "vortrag": "Drei Ziele, drei Methoden: Für die allgemeine Beweglichkeit dehnen wir langfristig und regelmäßig (Langzeitdehnen, Folie 15). Vor einer Belastung dehnen wir aktiv-dynamisch und kurz (Folie 16) – das wärmt auf und bereitet vor, ohne die Leistung zu mindern. Nach der Belastung regenerieren wir passiv-statisch (Folie 17). Im Examen vergleichen wir Vorbereitung und Regeneration in Ziel, Wirkung, Methode und Durchführung (6 Punkte)."}, {"ueberschrift": "Kontraindikationen und Anwendergruppen", "text": "App-cards 'Kontraindikationen' und 'Drei Anwendergruppen' aufdecken; Diskussion: Wann kein Dehnen?", "vortrag": "Dehnen ist nicht immer gut: Bei akuter Entzündung, frischer Verletzung oder Hypermobilität ist Dehnen kontraindiziert – stattdessen stabilisieren. Auch die Pauschalisierung ist problematisch: Sportler, Senioren und Patienten brauchen unterschiedliche Programme (drei Anwendergruppen). Als Therapeuten differenzieren wir individuell."}, {"ueberschrift": "Praxis: Dehnen im Physio-Alltag", "text": "Beispiele: nach Knie-OP isometrisch/passiv je nach Heilungsphase; vor dem Gehtraining aktiv-dynamisch; bei älteren Patienten mit Osteoporose Vorsicht (Kontraindikationen).", "vortrag": "Im Alltag wenden wir das Gelernte sofort an: Nach einer OP dehnen wir je nach Heilungsphase vorsichtig passiv, vor dem Gehtraining aktivieren wir dynamisch, und bei älteren Patienten mit Osteoporose vermeiden wir ruckartige Dehnungen. So wird aus der Tabelle konkrete Behandlungsplanung."}]}, "arbeitsphase": {"titel": "Planer ausfüllen und Fälle entscheiden", "min": 25, "sozialform": "Einzelarbeit mit App-Planern + Partnerdiskussion", "aufgaben": [{"titel": "Fülle die App-Planer (Folien 15/16/17) für einen Fußballspieler aus: vor/nach dem Training + langfristiges Programm.", "text": "Fülle die App-Planer (Folien 15/16/17) für einen Fußballspieler aus: vor/nach dem Training + langfristiges Programm.", "loesung": "Vorher: aktiv-dynamisch kurz (Folie 16); nachher: passiv-statisch (Folie 17); langfristig: Langzeitdehnen (Folie 15) (App-planner).", "hilfe": "App: planner 'Dehnen zur Vorbereitung/Regeneration/allgemeine Beweglichkeit'."}, {"titel": "Fall: 70-jähriger Patient mit Osteoporose fragt nach Dehnübungen – was empfiehlst du?", "text": "Fall: 70-jähriger Patient mit Osteoporose fragt nach Dehnübungen – was empfiehlst du?", "loesung": "Vorsicht/Kontraindikation (Osteoporose: keine ruckartigen/Überkopf-Dehnungen) – eher Mobilisation + Kraft (App-card 'Kontraindikationen').", "hilfe": "App: card 'Kontraindikationen für Flexibilitätstraining'."}, {"titel": "Prüfungsaufgabe (6 P): Vergleiche Dehnen zur Vorbereitung mit Dehnen zur Regeneration.", "text": "Prüfungsaufgabe (6 P): Vergleiche Dehnen zur Vorbereitung mit Dehnen zur Regeneration.", "loesung": "Ziel/Wirkung (Leistungsbereitschaft vs. Erholung), Methode (aktiv-dynamisch vs. passiv-statisch), Durchführung (kurz vs. länger halten) (App-exam).", "hilfe": "App: exam bewegungslehre2 (6 P)."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Vergleiche das Dehnen zur Vorbereitung vor einem Wettkampf mit dem Dehnen zur Regeneration (Ziel/Wirkung, Methode, Durchführung).", "loesung": "- Vorbereitung: Kurzzeitdehnen, Aufbau eines Dehnungsrückstands (hält 20–60 min)\n- Wirkung: höhere Schmerztoleranz, Sensibilisierung der Rezeptoren\n- Methode: weiches dynamisches Andehnen + Schwunggymnastik; 3–4 Übungen, 1–2 Sätze, 15–20 s, maximal\n- Regeneration: Entspannungsdehnen (Langzeitdehnen), mentale Regeneration\n- Wirkung: physisch-psychische Entspannung, Unterstützung von Eiweißsynthese/Wiederherstellung\n- Methode: statisch (+ dynamisch); 1× danach, 3–4 Übungen, 1 Satz, 20–30 s, weich submaximal", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit den drei App-Planern (Folien 15–17) als Schablone; stärkere begründen an einem Beispiel (z. B. Wirbelsäulen-Patient), warum statisches Dehnen vor Maximalbelastung leistungsmindernd sein kann und wann es sinnvoll ist.", "app_uebung": "App: table Folien 15–17, planner Folien 15/16/17, cards 'Dehnen je nach Ziel'/'Kontraindikationen'/'Drei Anwendergruppen'/'Fazit', quiz, exam (6 P)."}, "sicherung": {"titel": "Ziel-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Ordne zu: aktiv-dynamisch kurz / passiv-statisch nach Belastung / Langzeitdehnen langfristig – und nenne eine Kontraindikation fürs Dehnen.", "aufgaben": [{"frage": "Zuordnung?", "loesung": "Vorbereitung = aktiv-dynamisch kurz (Folie 16); Regeneration = passiv-statisch (Folie 17); allgemeine Beweglichkeit = Langzeitdehnen (Folie 15)."}, {"frage": "Kontraindikation?", "loesung": "z. B. akute Entzündung, frische/instabile Fraktur, starker akuter Schmerz, frisches Hämatom (App-Quiz)."}, {"frage": "Wann setzt der pubertäre Wachstumsschub bei Mädchen ein?  [App-Quiz: Bewegungslehre II]", "loesung": "Zwischen dem 11. und 13. Lebensjahr – Bei Mädchen beginnt der Wachstumsschub zwischen dem 11. und 13., bei Jungen zwischen dem 13. und 15. Lebensjahr."}]}, "hausaufgabe": "Tabelle 'Dehnen je nach Ziel' (Folien 15–17) lernen; drei App-Planer (Folien 15/16/17) ausfüllen; exam-Aufgabe (6 P) 'Vorbereitung vs. Regeneration' üben; Karteikarten 'Dehnen je nach Ziel'/'Kontraindikationen'/'Drei Anwendergruppen' lernen.", "hinweise": ["Fehler: statisches Dehnen vor Maximalbelastung empfohlen – leistungsmindernd (Folie 16, App-Quiz).", "Pauschalaussagen vermeiden – drei Anwendergruppen (App-card).", "Prüfungsrelevant: Vergleich Vorbereitung vs. Regeneration (6 P) + Kontraindikationen (App-exam)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: table Folien 15–17, planner Folien 15/16/17, cards, quiz, exam (6 P)"]}, "b2-44": {"nr": 44, "id": "b2-44", "thema": "bewegungslehre2", "titel": "Beweglichkeit und Erwärmungszustand, Effekte des Flexibilitätstrainings, Minimalprogramm", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben den Zusammenhang zwischen Beweglichkeit und Erwärmungszustand (Zaciorskij, Folie 23).", "Sie nennen Ziele und Effekte des Flexibilitätstrainings in der Therapie.", "Sie erläutern das Minimalprogramm nach Weineck und warum Beweglichkeit mit dem Alter abnimmt."], "vorwissen": "Stunden 41–43 (Flexibilität, Dehnmethoden, Dehnen je nach Ziel), TL Std. 7 (Aufwärmen, Temperatur Folie 35).", "material": ["App, Beamer", "Diagramm 'Beweglichkeit in Abhängigkeit vom Erwärmungszustand' (Folie 23)", "Karteikarten 'Beweglichkeit und Erwärmungszustand (Zaciorskij)', 'Effekte des Flexibilitätstrainings', 'Ziele des Flexibilitätstrainings in der Therapie', 'Minimalprogramm (Weineck)', 'Warum nimmt die Beweglichkeit mit dem Alter ab?'"], "physio": "In der Praxis dehnen wir nie 'kalt': Die Beweglichkeit steigt mit der Muskeltemperatur (Folie 23) – deshalb Aufwärmen vor Dehnen (TL Std. 7). Umgekehrt nimmt die Beweglichkeit im Alter ab (veränderte Faszie, weniger Wasser, Bewegungsmangel) – das Minimalprogramm (Weineck) ist die untere Schwelle, die wir bei Senioren mindestens anbieten, um Alltagsbewegungen zu erhalten.", "app": {"einsatz": ["Diagramm 'Beweglichkeit in Abhängigkeit vom Erwärmungszustand' (Folie 23)", "Quiz: 'Beweglichkeit und Erwärmungszustand (Zaciorskij)', 'Ziele/Effekte des Flexibilitätstrainings in der Therapie', 'Warum nimmt die Beweglichkeit mit dem Alter ab?', 'Minimalprogramm (Weineck)'", "Karteikarten: 'Beweglichkeit und Erwärmungszustand (Zaciorskij)', 'Ziele des Flexibilitätstrainings in der Therapie', 'Effekte des Flexibilitätstrainings', 'Minimalprogramm (Weineck)', 'Warum nimmt die Beweglichkeit mit dem Alter ab?'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Temperatur-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der steife Senior"}, {"phase": "Präsentation", "min": 15, "inhalt": "Beweglichkeit ist temperatur- und altersabhängig"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Programme für verschiedene Patienten · Gruppenarbeit mit App-cards und Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Temperatur-Alter-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Temperatur-Raten", "art": "Schätzen", "min": 5, "anleitung": "Um wie viel steigt die Beweglichkeit bei erwärmtem Muskel ungefähr (Folie 23)? Schätzen, dann App-Diagramm.", "aufgaben": [{"frage": "Anstieg bei Erwärmung?", "antwort": "deutlich (ca. 10–20 % mehr ROM, Zaciorskij, Folie 23)."}, {"frage": "Praktische Konsequenz?", "antwort": "Immer aufwärmen vor Dehnen/Mobilisation (TL Std. 7, Folie 35)."}, {"frage": "Umgekehrt?", "antwort": "Kalter Muskel = steifer, verletzungsanfälliger."}]}, {"titel": "Alter-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz: Warum nimmt die Beweglichkeit mit dem Alter ab? Minimalprogramm (Weineck)?", "aufgaben": [{"frage": "Ursachen Alter?", "antwort": "Faszienveränderung (weniger elastisch, mehr quervernetzt), weniger Wasser im Gewebe, Bewegungsmangel, degenerative Veränderungen (App-card)."}, {"frage": "Minimalprogramm Weineck?", "antwort": "2–3×/Woche, wenige Übungen, alle großen Gelenke, geringe Intensität – untere Schwelle für Senioren (App-card)."}, {"frage": "Effekte des Flex-Trainings?", "antwort": "ROM erhalten/verbessern, Muskelverspannung lösen, Schmerz lindern, Verletzungsprophylaxe (App-card)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Wann setzt der pubertäre Wachstumsschub bei Mädchen ein?", "antwort": "Zwischen dem 11. und 13. Lebensjahr – Bei Mädchen beginnt der Wachstumsschub zwischen dem 11. und 13., bei Jungen zwischen dem 13. und 15. Lebensjahr."}, {"frage": "Wie verändert sich der Muskelanteil bei Jungen in der Pubertät?", "antwort": "Er steigt von 27 % auf 40 % – Durch den Testosteronanstieg nimmt der Muskelanteil bei Jungen von 27 % auf 40 % zu, die anaerobe Arbeitsfähigkeit steigt."}, {"frage": "Welche Lebensphase gilt als „bestes Lernalter“ mit der besten motorischen Lernfähigkeit in der Kindheit?", "antwort": "Spätes Kindesalter (ca. 10–12/13 Jahre) – Das späte Schulkindalter ist durch die beste motorische Lernfähigkeit gekennzeichnet; Schwerpunkt ist die koordinative Schulung."}]}], "einstieg": {"titel": "Der steife Senior", "min": 10, "situation": "Fall: 80-jähriger Patient kann die Schuhe nicht mehr selbst binden (Hüftflexion/Rückenbeuge eingeschränkt). Was sind Ursachen (Alter, Bewegungsmangel) – und welches Programm empfiehlst du mindestens?", "impulse": [{"frage": "Ursachen?", "erwartung": "Alter (Faszie/Wasser), Bewegungsmangel, evtl. degenerative Veränderungen (App-card 'Warum nimmt Beweglichkeit mit Alter ab?')."}, {"frage": "Programm?", "erwartung": "Minimalprogramm (Weineck): 2–3×/Woche, große Gelenke, geringe Intensität (App-card)."}, {"frage": "Ziel?", "erwartung": "Alltagsbewegungen erhalten (Schuhe binden, Aufstehen) – Teilhabe (ICF, TL Std. 1)."}, {"frage": "App-Bezug?", "erwartung": "App: cards 'Minimalprogramm (Weineck)', 'Ziele des Flex-Trainings in der Therapie'."}], "ueberleitung": "Beweglichkeit ändert sich mit Temperatur und Alter – beides steuert unsere Therapie: nie kalt dehnen, und im Alter das Minimalprogramm als Untergrenze."}, "praesentation": {"titel": "Beweglichkeit ist temperatur- und altersabhängig", "min": 15, "merksatz": "Zaciorskij (Folie 23): Beweglichkeit steigt mit der Muskeltemperatur (aufgewärmt ~10–20 % mehr ROM) – deshalb Aufwärmen vor Dehnen. Mit dem Alter nimmt sie ab: Faszie wird weniger elastisch (Quervernetzung, weniger Wasser), Bewegungsmangel, degenerative Veränderungen. Effekte des Flex-Trainings in der Therapie: ROM erhalten/verbessern, Verspannungen lösen, Schmerzen lindern, Verletzungsprophylaxe, Haltungsverbesserung. Minimalprogramm (Weineck): 2–3×/Woche, alle großen Gelenke, wenige Übungen, geringe Intensität.", "schritte": [{"ueberschrift": "Erwärmungszustand und Beweglichkeit", "text": "Diagramm Folie 23 projizieren; Kurve: kalt → warm = mehr ROM; Verknüpfung mit Aufwärmen (TL Std. 7, Temperatur Folie 35).", "vortrag": "Zaciorskij zeigt: Die Beweglichkeit steigt mit der Muskeltemperatur deutlich an – ein aufgewärmter Muskel lässt etwa 10 bis 20 Prozent mehr Bewegung zu. Deshalb dehnen und mobilisieren wir nie 'kalt', sondern nach dem Aufwärmen (Temperaturanstieg, TL Stunde 7, Folie 35). Umgekehrt ist ein kalter Muskel steifer und verletzungsanfälliger."}, {"ueberschrift": "Effekte und Ziele des Flexibilitätstrainings in der Therapie", "text": "App-cards 'Ziele'/'Effekte des Flexibilitätstrainings' aufdecken; Patientenbeispiele: Contracturen nach Immobilisation, Hohlrundrücken (Std. 48).", "vortrag": "In der Therapie trainieren wir Beweglichkeit, um das Bewegungsausmaß zu erhalten oder zu verbessern, Muskelverspannungen zu lösen, Schmerzen zu lindern und Verletzungen vorzubeugen – und um die Haltung zu verbessern (Hohlrundrücken, Stunde 48). Ziele sind immer alltagsrelevant: Schuhe binden, sich umdrehen, aufstehen."}, {"ueberschrift": "Alter und Minimalprogramm", "text": "App-card 'Warum nimmt die Beweglichkeit mit dem Alter ab?' + 'Minimalprogramm (Weineck)'; Diskussion: Was ist die untere Schwelle für Senioren?", "vortrag": "Erste Effekte des Langzeitdehnens zeigen sich nach 4–8 Wochen – allerdings durch höhere Schmerz-/Dehnungstoleranz, nicht durch muskuläre Anpassung (die braucht 1–5 Jahre) (App-Quiz). Kurzzeitdehnen (Vorbereitung): Der Dehnungsrückstand hält nur 20–60 Minuten (Wiemann 2000) (App-Quiz). Mit dem Alter nimmt die Beweglichkeit ab (Faszie steifer/wasserärmer, Bewegungsmangel, Degeneration). Weineck-Minimalprogramm: 2–3×/Woche, alle großen Gelenke, wenige Übungen, geringe Intensität – die Untergrenze für Senioren/bettlägerige Patienten."}]}, "arbeitsphase": {"titel": "Programme für verschiedene Patienten", "min": 25, "sozialform": "Gruppenarbeit mit App-cards und Fallkarten", "aufgaben": [{"titel": "Fall: 80-jähriger, Schuhe binden schwierig – Minimalprogramm konkretisieren (welche Gelenke, welche Übungen, wie oft)?", "text": "Fall: 80-jähriger, Schuhe binden schwierig – Minimalprogramm konkretisieren (welche Gelenke, welche Übungen, wie oft)?", "loesung": "z. B. 2–3×/Woche: Hüftbeuger-Dehnung, Rückenstreckung, Schulterkreisen, Nackenmobilisation – geringe Intensität (App-card 'Minimalprogramm (Weineck)').", "hilfe": "App: card 'Minimalprogramm (Weineck)'."}, {"titel": "Fall: Patient nach 4 Wochen Gips (Wade/OSG) – kalt dehnen? Reihenfolge?", "text": "Fall: Patient nach 4 Wochen Gips (Wade/OSG) – kalt dehnen? Reihenfolge?", "loesung": "Nein – erst aufwärmen (Temperatur Folie 23/35), dann Mobilisation/Dehnen (App-diagram Folie 23).", "hilfe": "App: diagram 'Beweglichkeit und Erwärmungszustand' Folie 23."}, {"titel": "Effekte des Flex-Trainings bei einem Patienten mit chronischem LWS-Syndrom nennen und begründen.", "text": "Effekte des Flex-Trainings bei einem Patienten mit chronischem LWS-Syndrom nennen und begründen.", "loesung": "Verspannungen lösen, ROM verbessern, Schmerz lindern, Haltung verbessern → bessere Alltagsfunktion (App-card 'Effekte des Flexibilitätstrainings').", "hilfe": "App: card 'Effekte des Flexibilitätstrainings'."}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Erläutere die Besonderheiten des Beweglichkeitstrainings in der Pubeszenz und leite Konsequenzen für die Praxis ab.", "loesung": "- Wachstumsschub: Längenzunahme um 8–10 cm pro Jahr\n- Verminderte mechanische Widerstandsfähigkeit des passiven Bewegungsapparats; Wirbelsäule und Hüftgelenk besonders gefährdet\n- Dehnfähigkeit von Muskeln und Bändern hinkt dem Wachstum hinterher\n- Konsequenz: vielseitiges, allgemeines Beweglichkeitstraining unbedingt nötig, Überlastungen des passiven Bewegungsapparats unbedingt vermeiden", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit den App-cards als Schablone; stärkere begründen, warum das Aufwärmen vor dem Dehnen nicht nur sicherer, sondern wirksamer ist (Folie 23) und wann im Alter das Minimalprogramm ausreicht vs. wann ein intensiveres Programm nötig ist.", "app_uebung": "App: diagram Folie 23, cards 'Erwärmungszustand (Zaciorskij)'/'Ziele'/'Effekte'/'Minimalprogramm (Weineck)'/'Alter', quiz."}, "sicherung": {"titel": "Temperatur-Alter-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Warum dehnen wir nie kalt (Folie 23)? Nenne zwei Gründe für die Abnahme der Beweglichkeit im Alter und das Minimalprogramm (Weineck) in einem Satz.", "aufgaben": [{"frage": "Nie kalt?", "loesung": "Kalter Muskel ist steifer (geringere ROM) und verletzungsanfälliger; erwärmt ~10–20 % mehr Beweglichkeit (Zaciorskij, Folie 23)."}, {"frage": "Alter?", "loesung": "Faszie steifer/wasserärmer, Bewegungsmangel, Degeneration. Minimalprogramm: 2–3×/Woche, große Gelenke, geringe Intensität."}, {"frage": "Wann erfolgt das aufrechte Gehen in der Regel?  [App-Quiz: Bewegungslehre II]", "loesung": "Meist zu Beginn des 2. Lebensjahres – Nach Rollen, Robben/Kriechen und Krabbeln folgt das Gehen; aufrechtes Gehen meist zu Beginn des 2. Lebensjahres."}]}, "hausaufgabe": "Diagramm Folie 23 ins Heft; Karteikarten 'Erwärmungszustand (Zaciorskij)'/'Minimalprogramm (Weineck)'/'Effekte'/'Alter' lernen; App-Quiz bewegungslehre2 (Erwärmung, Alter, Minimalprogramm) wiederholen.", "hinweise": ["Fehler: kalt dehnen/mobilisieren – erhöhte Verletzungsgefahr, geringerer Effekt (Folie 23).", "Minimalprogramm vergessen – es ist die Untergrenze für Senioren/ bettlägerige Patienten (App-card).", "Zaciorskij und Weineck prüfungsrelevant (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: diagram Folie 23, cards 'Erwärmungszustand (Zaciorskij)'/'Minimalprogramm (Weineck)'/'Effekte'/'Alter', quiz", "Zaciorskij; Weineck 2009 (App-Quellen)"]}, "b2-45": {"nr": 45, "id": "b2-45", "thema": "bewegungslehre2", "titel": "Entwicklung und Wachstum: Scammon-Kurven, Körperlänge, hormonelles System (Tanner), sensible Phasen", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben das Wachstum von Kopf/Gehirn vs. allgemeinem Körperwachstum nach Scammon (Folie 43).", "Sie erläutern die jährliche Zunahme der Körperlänge (Folie 45) und das hormonelle System im Wachstum (Tanner, Folie 46).", "Sie ordnen den sensiblen Phasen (Martin 1982, Folie 67) die richtigen Altersfenster zu."], "vorwissen": "Stunde 41–44 (BL II), TL Std. 8 (sensible Phasen im Training).", "material": ["App, Beamer", "Diagramme: 'Entwicklung von Kopf/Gehirn und allgemeinem Körperwachstum (Scammon)' (Folie 43) + Labels/Hotspot, 'Jährliche Zunahme der Körperlänge' (Folie 45), 'Wachstum und hormonelles System (Tanner 1979)' (Folie 46), 'Modell der sensiblen Phasen (Martin 1982)' (Folie 67)"], "physio": "In der pädiatrischen Physio müssen wir Wachstum und Reifung verstehen: Der Kopf wächst früh (neural), der Körper später (lymphatisch/general) – das erklärt, warum Kleinkinder kopflastig wirken und Jugendliche unproportioniert. Der pubertäre Wachstumsschub (Folie 45, Tanner Folie 46) verändert Proportionen schnell – Koordination und Haltung müssen 'neu eingestellt' werden (Wachstumsschmerzen, Skoliose-Risiko).", "app": {"einsatz": ["Diagramme + Labels/Hotspot: 'Scammon-Kurven' (Folie 43), 'Jährliche Zunahme Körperlänge' (Folie 45), 'Tanner hormonell' (Folie 46), 'Sensible Phasen (Martin 1982)' (Folie 67)", "Quiz bewegungslehre2: Scammon, Tanner, sensible Phasen, Wachstumsschub", "Karteikarten: 'Ontogenese', 'Entwicklung des gezielten Greifens'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Wachstums-Raten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der 'kopflastige' Säugling und der 'langbeinige' Jugendliche"}, {"phase": "Präsentation", "min": 15, "inhalt": "Wachstum verstehen: Scammon, Tanner, sensible Phasen"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Wachstum in der Therapie anwenden · Gruppenarbeit mit Diagrammen und Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Wachstums-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Wachstums-Raten", "art": "Schätzen", "min": 5, "anleitung": "Wann ist der größte Wachstumsschub – mit 6, 12 oder 16 Jahren? Schätzen, dann Folien 45/46 in der App.", "aufgaben": [{"frage": "Größter Schub?", "antwort": "Pubertät: Mädchen 11.–13., Jungen 13.–15. Lebensjahr (Folie 45, App-Quiz); Muskelanteil Jungen steigt von 27 % auf 40 % (Testosteron, App-Quiz)."}, {"frage": "Kopf vs. Körper (Scammon)?", "antwort": "Kopf mit 6 J. ca. 90 % der Erwachsenengröße, Körper nur ca. 50 % (App-Quiz); Kopf/Gehirn früh, Rumpf/Extremitäten spät (Folie 43) – daher Proportionswandel."}, {"frage": "Hormone (Tanner)?", "antwort": "Geschlechtshormone + Wachstumshormon treiben den Schub (Folie 46)."}]}, {"titel": "Phasen-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Scammon/Tanner/sensiblen Phasen.", "aufgaben": [{"frage": "Scammon: Was wächst früh?", "antwort": "Kopf/Gehirn (neural) – Folie 43."}, {"frage": "Was wächst spät?", "antwort": "Rumpf und Extremitäten (general/lymphatisch) – Folie 43."}, {"frage": "Sensible Phasen (Martin, Folie 67)?", "antwort": "Fenster optimaler Trainierbarkeit je Fähigkeit (Beweglichkeit früh, Koordination spät-Kindesalter, Kraft Pubertät) – TL Std. 8."}, {"frage": "Ontogenese?", "antwort": "Individualentwicklung von der Befruchtung bis zum Tod (App-card)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Wann erfolgt das aufrechte Gehen in der Regel?", "antwort": "Meist zu Beginn des 2. Lebensjahres – Nach Rollen, Robben/Kriechen und Krabbeln folgt das Gehen; aufrechtes Gehen meist zu Beginn des 2. Lebensjahres."}, {"frage": "Wie ist die Unterstützungsfläche definiert?", "antwort": "Kleinste Fläche, die die Kontaktstellen aktiver Körperabschnitte mit der Unterlage einschließt – Die Unterstützungsfläche umfasst alle Kontaktstellen mit der Unterlage einschließlich der Fläche dazwischen."}, {"frage": "Wo werden posturale Synergien koordiniert?", "antwort": "Im Hirnstamm – Posturale Synergien werden im Hirnstamm koordiniert und laufen ohne Mitwirkung des Bewusstseins ab."}]}], "einstieg": {"titel": "Der 'kopflastige' Säugling und der 'langbeinige' Jugendliche", "min": 10, "situation": "Beobachtung: Ein Säugling hat einen großen Kopf im Verhältnis zum Körper; ein 14-Jähriger wirkt oft 'ungelenk' (lange Beine). Was erklärt das?", "impulse": [{"frage": "Scammon (Folie 43)?", "erwartung": "Unterschiedliches Wachstum der Gewebe: neural früh, general spät → Proportionswandel."}, {"frage": "Konsequenz Jugendliche?", "erwartung": "Koordination/Haltung müssen neu eingestellt werden (Wachstumsschub, Folie 45) – Verletzungsrisiko bei Sport."}, {"frage": "Physio?", "erwartung": "Bei Skoliose-Screening im Wachstumsschub besonders aufpassen (Std. 48)."}, {"frage": "App-Bezug?", "erwartung": "App: diagrams Folien 43/45/46."}], "ueberleitung": "Wachstum ist nicht gleichmäßig – verschiedene Gewebe wachsen zu verschiedenen Zeiten (Scammon). Das zu verstehen ist in der Kinderphysio essenziell. Heute: Wachstumskurven und sensible Phasen."}, "praesentation": {"titel": "Wachstum verstehen: Scammon, Tanner, sensible Phasen", "min": 15, "merksatz": "Scammon (Folie 43): vier Gewebetypen wachsen unterschiedlich schnell – neural (Kopf/Gehirn) früh, general (Körper) und lymphatisch mittel, genital spät (Pubertät). Körperlänge (Folie 45): zwei Schübe (Säugling, Pubertät: Mädchen ~11–13, Jungen ~13–15). Tanner (Folie 46): hormonelle Steuerung (Wachstumshormon, Geschlechtshormone) mit Stadien. Sensible Phasen (Martin 1982, Folie 67): Fenster optimaler Trainierbarkeit je Fähigkeit – Beweglichkeit früh, Koordination spätes Kindesalter, Kraft/Ausdauer Pubertät (TL Std. 8).", "schritte": [{"ueberschrift": "Scammon: vier Wachstumstypen", "text": "Diagramm Folie 43 projizieren; Labels/Hotspot in der App; Kurven neural/general/lymphatisch/genital einzeichnen.", "vortrag": "Scammon zeigt: Nicht alles wächst gleich schnell. Das Nervensystem (Kopf, Gehirn) ist früh weitgehend ausgewachsen, der Gesamtkörper (general) und die Lymphorgane wachsen später, die Genitalorgane erst in der Pubertät. Deshalb wirkt ein Säugling kopflastig und ein Jugendlicher nach dem Schub oft ungelenk – die Proportionen ändern sich laufend (Folie 43)."}, {"ueberschrift": "Körperlänge und Hormone", "text": "Diagramme Folien 45/46 zeigen: Säuglings- und Pubertätsschub; Tanner-Stadien hormonell (Folie 46).", "vortrag": "Die Körperlänge wächst in zwei Schüben: im Säuglingsalter und in der Pubertät – bei Mädchen etwa mit 11 bis 13, bei Jungen mit 13 bis 15 Jahren (Folie 45). Gesteuert wird das hormonell: Wachstumshormon und in der Pubertät die Geschlechtshormone (Tanner-Stadien, Folie 46). In dieser Phase ändern sich Proportionen schnell – Koordination und Haltung müssen neu 'kalibriert' werden. Das späte Schulkindalter gilt als bestes Lernalter mit bester motorischer Lernfähigkeit (App-Quiz)."}, {"ueberschrift": "Sensible Phasen (Martin)", "text": "Diagramm Folie 67 projizieren; Balken je Fähigkeit; Verknüpfung TL Std. 8 (sensible Phasen im Training).", "vortrag": "Martin beschreibt sensible Phasen: Zeitfenster, in denen bestimmte Fähigkeiten besonders gut trainierbar sind – Beweglichkeit früh im Kindesalter, Koordination im späten Kindesalter, Kraft und Ausdauer ab der Pubertät (Folie 67). In der pädiatrischen Therapie nutzen wir diese Fenster gezielt (z. B. Beweglichkeit bei Kleinkindern), ohne zu überfordern (TL Std. 8: Prinzip der Altersgemäßheit)."}]}, "arbeitsphase": {"titel": "Wachstum in der Therapie anwenden", "min": 25, "sozialform": "Gruppenarbeit mit Diagrammen und Fallkarten", "aufgaben": [{"titel": "Fall: 13-jährige Turnerin im Wachstumsschub mit Rückenschmerzen – was erklärst du (Proportionen, Folie 43/45), was empfiehlst du?", "text": "Fall: 13-jährige Turnerin im Wachstumsschub mit Rückenschmerzen – was erklärst du (Proportionen, Folie 43/45), was empfiehlst du?", "loesung": "Proportionswandel + schnelles Wachstum → vorübergehende Koordinationsstörung/Skolioserisiko; Empfehlung: Techniktraining, Rumpfstabilisation, Skoliose-Screening (App-diagrams Folien 43/45).", "hilfe": "App: diagrams Folien 43/45/46."}, {"titel": "Ordne die sensiblen Phasen (Folie 67) den Altersfenstern zu: Beweglichkeit, Koordination, Kraft, Ausdauer.", "text": "Ordne die sensiblen Phasen (Folie 67) den Altersfenstern zu: Beweglichkeit, Koordination, Kraft, Ausdauer.", "loesung": "Beweglichkeit früh (Kindesalter); Koordination spätes Kindesalter (~10–12); Kraft/Ausdauer ab Pubertät (App-diagram Folie 67 + TL Std. 8).", "hilfe": "App: diagram 'Modell der sensiblen Phasen (Martin 1982)' Folie 67."}, {"titel": "Fall: 8-Jährige mit Entwicklungsverzögerung – welche Fähigkeit hat jetzt ihr Fenster (Folie 67)?", "text": "Fall: 8-Jährige mit Entwicklungsverzögerung – welche Fähigkeit hat jetzt ihr Fenster (Folie 67)?", "loesung": "Beweglichkeit/Koordination früh – gezielt anregen (App-diagram Folie 67).", "hilfe": "App: diagram Folie 67, quiz 'sensible Phasen'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "„Das Kind ist kein Miniaturerwachsener.“ Erläutere diese Aussage anhand von drei körperlichen Entwicklungsmerkmalen.", "loesung": "- Proportionen: Verhältnis Kopf- zu Körperhöhe ändert sich mit dem Alter (Kopf beim Kind relativ groß)\n- Kopf/Gehirn: mit 6 Jahren ca. 90 % der Erwachsenengröße, Körperwachstum erst ca. 50 %; mit ca. 12 Jahren fast erwachsen\n- → sehr gut funktionierendes ZNS, hohe koordinative Leistungsfähigkeit\n- Wachstumsgeschwindigkeit nimmt ab Geburt ab, Ausnahme Pubertätsschub\n- Hormone: Testosteron vor der Pubertät sehr niedrig → Krafttraining wenig lohnend\n- Subjektive Belastungsempfindung (bezogen auf HFmax) ist bei Kindern geringer und steigt mit dem Alter", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lesen die Diagramme mit Labels/Hotspots (Folien 43/45/46/67) ab; stärkere diskutieren, warum im Wachstumsschub das Verletzungsrisiko steigt (Knochen schneller als Sehnen/Muskeln, Radlinger Folie 43 Kraft) und leiten daraus Präventionsempfehlungen ab.", "app_uebung": "App: diagrams Folien 43/45/46/67 + labels/hotspots (Folie 43), quiz bewegungslehre2, cards 'Ontogenese'/'Entwicklung des gezielten Greifens'."}, "sicherung": {"titel": "Wachstums-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne zwei Scammon-Gewebe mit unterschiedlichem Wachstumstempo (Folie 43) und ordne zwei sensible Phasen ihren Altersfenstern zu (Folie 67).", "aufgaben": [{"frage": "Scammon?", "loesung": "z. B. neural (Kopf/Gehirn) früh vs. genital spät (Pubertät) – Folie 43."}, {"frage": "Sensible Phasen?", "loesung": "z. B. Beweglichkeit früh (Kindesalter), Kraft ab Pubertät – Folie 67."}, {"frage": "Welche Aussage beschreibt das Formetric®-System korrekt?  [App-Quiz: Bewegungslehre II]", "loesung": "Berührungsloses, strahlungsfreies Verfahren mit Kamera- und Projektortechnik – Formetric® projiziert Messlinien auf den Rücken und berechnet per Kamera/PC die Wirbelsäulenform; die MediMouse® wird dagegen über den Rücken geführt."}]}, "hausaufgabe": "Diagramme Folien 43/45/46/67 ins Heft; App-Hotspot 'Scammon' (Folie 43) durcharbeiten; App-Quiz bewegungslehre2 (Wachstum, sensible Phasen) wiederholen; ein pädiatrisches Fallbeispiel (Wachstumsschub) analysieren.", "hinweise": ["Fehler: Scammon-Kurven vertauscht – neural früh, genital spät (Folie 43, App-labels).", "Sensible Phasen mit festen Verboten verwechselt – es sind Fenster, kein Verbot (TL Std. 8).", "Autoren prüfungsrelevant: Scammon, Tanner 1979, Martin 1982 (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: diagrams Folien 43/45/46/67 + labels/hotspots, quiz, cards", "Scammon; Tanner 1979; Martin 1982 (App-Quellen)"]}, "b2-46": {"nr": 46, "id": "b2-46", "thema": "bewegungslehre2", "titel": "Lebensphasen: Kindesalter, Jugend, Erwachsenenalter – 'Das Kind ist kein Miniaturerwachsener'", "dauer": 60, "ziele": ["Die Auszubildenden erläutern 'Das Kind ist kein Miniaturerwachsener' (Claparède 1937) anhand von drei körperlichen Entwicklungsmerkmalen (prüfungsrelevant, 6 P).", "Sie beschreiben die Lebensphasen bis zum späten Kindesalter und Jugend/Erwachsenenalter (Tabellen Folien 48–49).", "Sie ordnen Entwicklungsmeilensteine (Greifen, aufrechte Haltung, Fortbewegung) in die richtige Reihenfolge."], "vorwissen": "Stunde 45 (Wachstum, sensible Phasen).", "material": ["App, Beamer", "Tabellen 'Lebensphasen: bis zum späten Kindesalter' (Folie 48), 'Lebensphasen: Jugend und Erwachsenenalter' (Folie 49)", "Reihenfolgen: 'Lebensphasen von Geburt bis Kindheit', 'Entwicklung des gezielten Greifens', 'aufrechte Haltung im Säuglingsalter', 'Fortbewegung im Säuglingsalter'"], "physio": "In der Kinderphysio leitet jede Lebensphase eigene Schwerpunkte ab: Säugling (Reflexe → gezieltes Greifen → Sitzen/Stehen → Laufen), Kindesalter (Beweglichkeit, Koordination), Jugend (Wachstumsschub, Kraftfenster). Claparède: Kinder sind keine kleinen Erwachsenen – Proportionen, Nervensystem und Belastbarkeit unterscheiden sich grundlegend.", "app": {"einsatz": ["Tabellen 'Lebensphasen' (Folien 48/49)", "Reihenfolgen: 'Lebensphasen von der Geburt bis zur Kindheit', 'Entwicklung des gezielten Greifens', 'Entwicklung der aufrechten Haltung im Säuglingsalter', 'Fortbewegung im Säuglingsalter'", "Quiz: \"'Das Kind ist kein Miniaturerwachsener' (Claparède 1937) – drei körperliche Entwicklungsmerkmale\" (exam 6 P), 'Besonderheiten des Beweglichkeitstrainings in der Pubertät' (exam 4 P)", "Karteikarten: \"'Kleine Erwachsene?' (Claparède 1937)\", 'Entwicklung des gezielten Greifens'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Meilenstein-Rätsel (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum fällt das Kind so oft hin?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Lebensphasen und 'kein Miniaturerwachsener'"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Meilensteine und Fälle · Gruppenarbeit mit App-sequences und Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Claparède-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Meilenstein-Rätsel", "art": "Rätsel", "min": 5, "anleitung": "Ordne die Meilensteine: gezieltes Greifen, Sitzen, Stehen, Laufen – App-sequences in der richtigen Reihenfolge.", "aufgaben": [{"frage": "Reihenfolge Greifen→Sitzen→Stehen→Laufen?", "antwort": "ca. 4–6 Monate Greifen, ~6–8 Monate Sitzen, ~12 Monate Stehen/Laufen (App-sequence 'Lebensphasen…')."}, {"frage": "Aufrechte Haltung?", "antwort": "Kopfheben → Drehen → Krabbeln → Sitzen → Stehen (App-sequence)."}, {"frage": "Fortbewegung Säugling?", "antwort": "Krabbeln → Robben → Laufen (App-sequence)."}]}, {"titel": "Claparède-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz: 'Das Kind ist kein Miniaturerwachsener' – drei körperliche Merkmale (exam 6 P).", "aufgaben": [{"frage": "Merkmal 1?", "antwort": "Proportionen: großer Kopf, kurze Extremitäten (Scammon, Folie 43)."}, {"frage": "Merkmal 2?", "antwort": "Nervensystem: unreif (Reflexe statt bewusster Steuerung, Myelinisierung läuft)."}, {"frage": "Merkmal 3?", "antwort": "Belastbarkeit: Wachstumsfugen, geringere Knochendichte, andere Thermoregulation (App-exam)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Welche Aussage beschreibt das Formetric®-System korrekt?", "antwort": "Berührungsloses, strahlungsfreies Verfahren mit Kamera- und Projektortechnik – Formetric® projiziert Messlinien auf den Rücken und berechnet per Kamera/PC die Wirbelsäulenform; die MediMouse® wird dagegen über den Rücken geführt."}, {"frage": "Welche Aussage zum Verhältnis von aktiver und passiver Flexibilität trifft zu?", "antwort": "Die aktive Flexibilität ist im Allgemeinen geringer als die passive – Mit Hilfe äußerer Kräfte lässt sich ein größeres Bewegungsausmaß erreichen als allein aus eigener Muskelkraft."}, {"frage": "Welche Strukturen bieten den entscheidenden Dehnungswiderstand im Muskel?", "antwort": "Die bindegewebigen Bestandteile wie Muskelfaszien und Muskelhülle – Die kontraktilen Elemente bieten erst bei Ermüdung (ATP-Abfall) mehr Widerstand; entscheidend ist das Bindegewebe."}]}], "einstieg": {"titel": "Warum fällt das Kind so oft hin?", "min": 10, "situation": "Beobachtung: Ein 2-Jähriger läuft unsicher, stolpert oft – ist das 'normal'? Was ist entwicklungsbedingt (Proportionen, Gleichgewicht, Nervensystem)?", "impulse": [{"frage": "Proportionen?", "erwartung": "Kopfschwerpunkt hoch, kurze Beine → Gleichgewicht schwieriger (Folie 43)."}, {"frage": "Nervensystem?", "erwartung": "Reifung läuft – Feinkoordination entwickelt sich erst (BL I Std. 33: sensible Phasen)."}, {"frage": "Normal?", "erwartung": "Ja – entwicklungsbedingt; Therapie nur bei Abweichung vom Meilensteinplan (Folien 48/49)."}, {"frage": "App-Bezug?", "erwartung": "App: sequences 'Lebensphasen', table Folien 48/49."}], "ueberleitung": "Kinder entwickeln sich in Phasen mit Meilensteinen – und sie sind keine kleinen Erwachsenen. Heute: die Lebensphasen und Claparèdes Satz."}, "praesentation": {"titel": "Lebensphasen und 'kein Miniaturerwachsener'", "min": 15, "merksatz": "Lebensphasen (Tabellen Folien 48–49): Säugling (Reflexe → gezieltes Greifen ~4–6 Mon. → Sitzen → Stehen/Laufen ~12 Mon.), Kleinkind/Kindesalter (Beweglichkeit, Koordination), Jugend (Wachstumsschub, Pubertät), Erwachsenenalter. Claparède (1937): 'Das Kind ist kein Miniaturerwachsener' – Proportionen (Kopf/Extremitäten, Folie 43), unreifes Nervensystem (Reflexe, Myelinisierung), andere Belastbarkeit (Wachstumsfugen, Thermoregulation). Pubertät: Beweglichkeit vorübergehend ↓ (schnelles Wachstum), Kraftfenster öffnet sich (Folie 67).", "schritte": [{"ueberschrift": "Die Lebensphasen im Überblick", "text": "Tabellen Folien 48/49 projizieren; App-sequences 'Lebensphasen…', 'Greifen', 'aufrechte Haltung', 'Fortbewegung' ordnen.", "vortrag": "Die Entwicklung folgt Meilensteinen: gezieltes Greifen mit etwa 4 bis 6 Monaten, Sitzen mit 6 bis 8, Stehen und Laufen um 12 Monate (Folien 48/49, App-sequences). Im Kindesalter sind Beweglichkeit und Koordination die Schwerpunkte, in der Jugend der Wachstumsschub. Abweichungen vom Zeitplan sind ein Grund für die pädiatrische Abklärung."}, {"ueberschrift": "'Das Kind ist kein Miniaturerwachsener' (Claparède 1937)", "text": "Drei körperliche Entwicklungsmerkmale an die Tafel; App-exam (6 P) vorbereiten.", "vortrag": "Claparède hat recht: Kinder unterscheiden sich körperlich grundlegend von Erwachsenen – die Proportionen (großer Kopf, kurze Gliedmaßen, Folie 43), das noch unreife Nervensystem (Reflexe statt bewusster Steuerung) und die Belastbarkeit (offene Wachstumsfugen, andere Thermoregulation). Deshalb trainieren und behandeln wir Kinder anders: technikorientiert, nie maximal, mit Pausen (vgl. Kraft Std. 21, Faigenbaum). Das ist prüfungsrelevant (6 Punkte)."}, {"ueberschrift": "Pubertät: besonderes Fenster", "text": "App-Quiz/exam (4 P): Besonderheiten des Beweglichkeitstrainings in der Pubertät – schnelles Wachstum → vorübergehende Steifigkeit/ Koordinationsstörung; Kraftfenster öffnet sich (Folie 67).", "vortrag": "In der Pubertät wächst der Körper schneller als die Muskulatur mit – vorübergehend wirkt das Kind steif und ungelenk. Gleichzeitig öffnet sich das Kraftfenster (Folie 67). Für die Therapie: Beweglichkeit jetzt besonders pflegen, Kraft erst mit Beginn der Pubertät steigern (TL Std. 8)."}]}, "arbeitsphase": {"titel": "Meilensteine und Fälle", "min": 25, "sozialform": "Gruppenarbeit mit App-sequences und Fallkarten", "aufgaben": [{"titel": "Ordne die Meilensteine (App-sequence 'Entwicklung des gezielten Greifens'/'aufrechte Haltung'/'Fortbewegung'/'Lebensphasen').", "text": "Ordne die Meilensteine (App-sequence 'Entwicklung des gezielten Greifens'/'aufrechte Haltung'/'Fortbewegung'/'Lebensphasen').", "loesung": "App-sequences direkt in der App ordnen.", "hilfe": "App: sequences bewegungslehre2 (4 Stück)."}, {"titel": "Fall: 14-Jähriger, im Wachstumsschub, 'ungelenk', Rückenschmerzen – welche Entwicklungsmerkmale erklärens das (Claparède, Folien 43/45)? Therapie?", "text": "Fall: 14-Jähriger, im Wachstumsschub, 'ungelenk', Rückenschmerzen – welche Entwicklungsmerkmale erklärens das (Claparède, Folien 43/45)? Therapie?", "loesung": "Proportionswandel + schnelles Wachstum → vorübergehende Koordinationsstörung; Therapie: Rumpfstabilisation, Technik, Beweglichkeit pflegen (Folien 43/45/48/49).", "hilfe": "App: tables Folien 48/49, diagrams Folien 43/45."}, {"titel": "Prüfungsaufgabe (6 P): 'Das Kind ist kein Miniaturerwachsener' – drei körperliche Merkmale erläutern.", "text": "Prüfungsaufgabe (6 P): 'Das Kind ist kein Miniaturerwachsener' – drei körperliche Merkmale erläutern.", "loesung": "Musterlösung in der App: Proportionen, Nervensystem, Belastbarkeit (App-exam).", "hilfe": "App: exam bewegungslehre2 (6 P, Claparède 1937)."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Beschreibe das Interaktionsmodell der posturalen Kontrolle und die im Nervensystem beanspruchten Ebenen.", "loesung": "- Posturale Kontrolle (PK) = Ergebnis der Interaktion von Individuum, Aufgabe (Aktivität) und Umwelt\n- Einflussfaktoren beim Individuum: Motorik, Sensorik, Kognition\n- Ebene 1: Sensomotorischer Kortex – Aufmerksamkeit\n- Ebene 2: Hirnstamm, Kleinhirn, Basalganglien – posturale Synergien, posturale Flexibilität\n- Ebene 3: Rückenmark – Reflexe\n- Abgrenzung: Balance = nicht fallen (KSP über USFL); PK = Balance in jeder Haltung/Aktivität erhalten, erlangen, wiedererlangen", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen die App-sequences; stärkere diskutieren ein Fallbeispiel (z. B. Sportverletzung im Wachstumsschub) und begründen, warum Kraftdosierungen für Erwachsene nicht übertragbar sind (Wachstumsfugen).", "app_uebung": "App: tables Folien 48/49, sequences (4), diagrams Folien 43/45, quiz, cards 'Kleine Erwachsene? (Claparède)', exam (6 P + 4 P)."}, "sicherung": {"titel": "Claparède-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Erläutere 'Das Kind ist kein Miniaturerwachsener' an drei körperlichen Entwicklungsmerkmalen und nenne zwei Meilensteine des Säuglingsalters mit Alter.", "aufgaben": [{"frage": "Drei Merkmale?", "loesung": "Proportionen (Kopf/Extremitäten), unreifes Nervensystem, Belastbarkeit (Wachstumsfugen) (Claparède 1937)."}, {"frage": "Meilensteine?", "loesung": "z. B. gezieltes Greifen ~4–6 Mon., Laufen ~12 Mon. (Folie 48)."}, {"frage": "Worauf beruhen die ersten Effekte des Langzeitdehnens nach 4–8 Wochen?  [App-Quiz: Bewegungslehre II]", "loesung": "Auf einer Erhöhung der Schmerztoleranz – Muskuläre Anpassungen treten erst nach 1–5 Jahren auf; frühe Effekte erklärt die höhere Schmerz-/Dehnungstoleranz."}]}, "hausaufgabe": "Tabellen 'Lebensphasen' (Folien 48/49) lernen; alle vier App-sequences (Meilensteine) ordnen; exam-Aufgaben (6 P Claparède, 4 P Pubertät) üben; Karteikarte 'Kleine Erwachsene? (Claparède 1937)' auswendig.", "hinweise": ["Fehler: Kinder wie kleine Erwachsene behandeln – Proportionen/Nervensystem/Belastbarkeit sind verschieden (App-exam 6 P).", "Meilensteine auswendig: Greifen ~4–6 Mon., Laufen ~12 Mon. (Folie 48, App-sequences).", "Claparède 1937 als Autor merken (App-Quelle)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: tables Folien 48/49, sequences (4), diagrams Folien 43/45, quiz, cards, exam (6 P + 4 P)", "Claparède 1937 (App-Quelle)"]}, "b2-47": {"nr": 47, "id": "b2-47", "thema": "bewegungslehre2", "titel": "Gleichgewicht: Arten, Analysatoren, posturale Kontrolle (Interaktionsmodell)", "dauer": 60, "ziele": ["Die Auszubildenden vergleichen die drei Gleichgewichtsarten und nennen Strategien zur Erhöhung der Standfestigkeit (prüfungsrelevant, 5+6 P).", "Sie beschreiben das Interaktionsmodell der posturalen Kontrolle und die beanspruchten Ebenen im Nervensystem (prüfungsrelevant, 6 P).", "Sie nennen die Analysatoren der Gleichgewichtsregulation und Korrekturmaßnahmen."], "vorwissen": "Stunden 32–40 (BL I: koordinative Fähigkeiten, Sensomotorik, ZNS-Ebenen), Stunde 41 (Flexibilität).", "material": ["App, Beamer", "Diagramme: 'Gleichgewichtsarten' (Folien 89–90) + Hotspot/Labels", "'Modell der posturalen Kontrolle: Interaktionsmodell und Ebenen im Nervensystem' (Folie 94)", "Balance-Board, Kissen für Demo"], "physio": "Gleichgewicht ist die Basis sicherer Alltagsbewegung – und in der Geriatrie (Sturzprophylaxe) sowie Neurologie (Schlaganfall, Parkinson) das zentrale Therapieziel. Das Interaktionsmodell (Folie 94) zeigt: Individuum (Motorik/Sensorik) + Aufgabe + Umwelt müssen zusammenspielen; die ZNS-Ebenen (BL I Std. 38) steuern die posturale Kontrolle. Training: instabiler Untergrund, Sinnesvariation (Augen zu), Doppelaufgaben.", "app": {"einsatz": ["Diagramme + Hotspot/Labels: 'Gleichgewichtsarten' (Folien 89–90), 'Modell der posturalen Kontrolle' (Folie 94)", "Quiz: 'Wann ist ein Körper im Gleichgewicht?', 'Vergleiche die drei Gleichgewichtsarten + Strategien zur Standfestigkeit' (exam 5 P), 'Interaktionsmodell der posturalen Kontrolle + Ebenen im Nervensystem' (exam 6 P), 'Analysatoren der Gleichgewichtsregulation', 'Korrektur von Störungen der Körperbalance'", "Karteikarten: 'Wann ist ein Körper im Gleichgewicht?', 'Analysatoren der Gleichgewichtsregulation', 'Korrektur von Störungen der Körperbalance'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Gleichgewichts-Arten (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum stürzt der alte Patient?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Gleichgewicht und posturale Kontrolle"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Gleichgewicht analysieren und trainieren · Partnerarbeit mit App-Diagrammen und Balance-Übungen (gesichert)"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Gleichgewichts-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Gleichgewichts-Arten", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu den drei Gleichgewichtsarten.", "aufgaben": [{"frage": "Drei Gleichgewichtsarten?", "antwort": "Statisches (Halten), dynamisches (Bewegung), reaktives (Störung ausgleichen) (App-diagram Folien 89–90)."}, {"frage": "Wann ist ein Körper im Gleichgewicht?", "antwort": "Wenn der Schwerpunkt über der Standfläche liegt (bzw. kontrolliert bewegt wird) (App-card)."}, {"frage": "Strategien zur Standfestigkeit?", "antwort": "Breitere Standfläche, tieferer Schwerpunkt, Fixieren des Blicks, Abstützen (App-exam 5 P)."}]}, {"titel": "Balance-Demo", "art": "Bewegung", "min": 5, "anleitung": "Einbeinstand stabil → instabil (Kissen) → mit geschlossenen Augen → mit Kopfdrehung – welche Analysatoren/Sinne werden jeweils ausgeschaltet?", "aufgaben": [{"frage": "Kissen?", "antwort": "Propriozeption/taktil erschwert → mehr vestibulär/visuell (App-table Analysatoren, BL I Folie 36)."}, {"frage": "Augen zu?", "antwort": "Visueller Anteil entfällt → vestibulär + propriozeptiv übernehmen (App-card)."}, {"frage": "Kopfdrehung?", "antwort": "Vestibulär gereizt → reaktives Gleichgewicht gefordert (Folien 89–90)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Worauf beruhen die ersten Effekte des Langzeitdehnens nach 4–8 Wochen?", "antwort": "Auf einer Erhöhung der Schmerztoleranz – Muskuläre Anpassungen treten erst nach 1–5 Jahren auf; frühe Effekte erklärt die höhere Schmerz-/Dehnungstoleranz."}, {"frage": "Welcher Nachteil wird beim dynamischen Dehnen befürchtet?", "antwort": "Die Auslösung des Dehnungsreflexes – Durch federnde, schnelle Bewegungen kann der Dehnungsreflex ausgelöst werden, der der Dehnung entgegenwirkt."}, {"frage": "Durch welche Maßnahme lässt sich der Muskeltonus herabsetzen?", "antwort": "Durch Dehnen oder eine langsame, warme Massage – Dehnen und langsame, warme Massage senken den Tonus; muskuläre Belastung oder schnelle, klopfende Massage erhöhen ihn."}]}], "einstieg": {"titel": "Warum stürzt der alte Patient?", "min": 10, "situation": "Fall: 82-jähriger Patient stürzt nachts auf dem Weg zur Toilette – welke Faktoren (Individuum/Aufgabe/Umwelt, Folie 94)?", "impulse": [{"frage": "Individuum?", "erwartung": "Kraft ↓, Propriozeption ↓ (Diabetes?), Sehen ↓, Medikamente (App-diagram Folie 94)."}, {"frage": "Aufgabe?", "erwartung": "Dunkelheit, Eile, unebener Boden (Folie 94)."}, {"frage": "Umwelt?", "erwartung": "Beleuchtung, Stolperfallen, fehlende Haltegriffe (Folie 94)."}, {"frage": "App-Bezug?", "erwartung": "App: diagram Folien 89–90/94, exam (6 P Interaktionsmodell)."}], "ueberleitung": "Gleichgewicht ist mehr als 'nicht umfallen' – es ist ein Zusammenspiel von Körper, Aufgabe und Umwelt. Heute: die drei Gleichgewichtsarten und das Interaktionsmodell der posturalen Kontrolle."}, "praesentation": {"titel": "Gleichgewicht und posturale Kontrolle", "min": 15, "merksatz": "Drei Gleichgewichtsarten (Folien 89–90): statisch (Halten einer Position), dynamisch (kontrollierte Bewegung), reaktiv (Ausgleich von Störungen). Gleichgewicht = Schwerpunkt über Standfläche. Interaktionsmodell der posturalen Kontrolle (Folie 94): Individuum (Motorik, Sensorik, Kognition) × Aufgabe × Umwelt → posturale Kontrolle; ZNS-Ebenen (BL I Std. 38): Rückenmark (Reflexe), Hirnstamm, Kleinhirn (Feinabstimmung), Kortex (bewusste Strategien). Analysatoren: vestibulär, visuell, propriozeptiv/taktil. Strategien: breitere Standfläche, tieferer Schwerpunkt, Blickfixierung, Abstützen.", "schritte": [{"ueberschrift": "Die drei Gleichgewichtsarten", "text": "Diagramme Folien 89–90 projizieren; Hotspot/Labels in der App; je Art ein Beispiel (Stehen, Gehen, Stoß von hinten).", "vortrag": "Wir unterscheiden drei Gleichgewichtsarten: statisch – eine Position halten (z. B. Stehen); dynamisch – eine Bewegung kontrolliert ausführen (z. B. Gehen); reaktiv – eine plötzliche Störung ausgleichen (z. B. Stoß von hinten). Ein Körper ist im Gleichgewicht, wenn sein Schwerpunkt über der Standfläche liegt. Strategien zur Standfestigkeit: breitere Standfläche, tieferer Schwerpunkt, Blick auf einen festen Punkt, Abstützen an Möbeln."}, {"ueberschrift": "Interaktionsmodell der posturalen Kontrolle (Folie 94)", "text": "Diagramm Folie 94 zeigen: Individuum × Aufgabe × Umwelt; ZNS-Ebenen (Folie 38, BL I Std. 38) zuordnen; exam (6 P).", "vortrag": "Die posturale Kontrolle entsteht aus dem Zusammenspiel dreier Faktoren (Folie 94): Individuum (Motorik, Sensorik, Kognition), Aufgabe (z. B. Gehen) und Umwelt (Boden, Licht, Hindernisse) (App-Quiz). Balance = Fähigkeit, nicht zu fallen (KSP über Unterstützungsfläche); posturale Kontrolle umfasst darüber hinaus jede Haltung/Aktivität (Pollock). Gleichgewichtsarten: stabil (Rückstellkräfte), labil (keine Rückkehr), indifferent (neue Lagen) (App-Quiz). ZNS-Ebenen: Rückenmark = Reflexe, Hirnstamm/Kleinhirn/Basalganglien = posturale Synergien (Latenzen > 100–150 ms), Kortex = Aufmerksamkeit (App-Quiz). Prüf/relevant (6 Punkte)."}, {"ueberschrift": "Analysatoren und Korrektur", "text": "App-cards 'Analysatoren der Gleichgewichtsregulation'/'Korrektur von Störungen'; Demo: Augen zu + Kissen → welcher Sinn übernimmt?", "vortrag": "Drei Analysatoren sichern das Gleichgewicht: das vestibuläre System (Innenohr), das visuelle System und das propriozeptiv-taktile System (Gelenke, Muskulatur, Haut). Fällt einer aus – z. B. die Propriozeption bei Polyneuropathie – übernehmen die anderen, bis auch sie überfordert sind. In der Therapie trainieren wir gezielt: instabiler Untergrund, geschlossene Augen, Kopfdrehungen, Doppelaufgaben – immer gesichert."}]}, "arbeitsphase": {"titel": "Gleichgewicht analysieren und trainieren", "min": 25, "sozialform": "Partnerarbeit mit App-Diagrammen und Balance-Übungen (gesichert)", "aufgaben": [{"titel": "Analysiere das nächtliche Sturzbeispiel (EI) mit dem Interaktionsmodell (Folie 94): Individuum/Aufgabe/Umwelt – Maßnahmen je Faktor?", "text": "Analysiere das nächtliche Sturzbeispiel (EI) mit dem Interaktionsmodell (Folie 94): Individuum/Aufgabe/Umwelt – Maßnahmen je Faktor?", "loesung": "Individuum: Kraft/Gleichgewicht trainieren, Sehen korrigieren, Medikamente prüfen; Aufgabe: langsamer gehen, Licht an; Umwelt: Nachtlicht, Haltegriffe, Stolperfallen entfernen (App-diagram Folie 94).", "hilfe": "App: diagram 'Modell der posturalen Kontrolle' Folie 94, exam (6 P)."}, {"titel": "Ordne die Strategien zur Standfestigkeit zu (App-exam 5 P): breitere Standfläche, tieferer Schwerpunkt, Blickfixierung, Abstützen.", "text": "Ordne die Strategien zur Standfestigkeit zu (App-exam 5 P): breitere Standfläche, tieferer Schwerpunkt, Blickfixierung, Abstützen.", "loesung": "App-exam direkt; physikalisch begründen (Schwerpunkt über Standfläche).", "hilfe": "App: exam bewegungslehre2 (5 P)."}, {"titel": "Vergleiche die drei Gleichgewichtsarten (Folien 89–90) mit je einem Alltagsbeispiel und einer Übung.", "text": "Vergleiche die drei Gleichgewichtsarten (Folien 89–90) mit je einem Alltagsbeispiel und einer Übung.", "loesung": "Statisch: Einbeinstand; dynamisch: Gehen auf Linie; reaktiv: Stoß von hinten (Partner, gesichert) (App-diagrams/hotspots Folien 89–90).", "hilfe": "App: diagrams/hotspots/labels Folien 89–90."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Vergleiche die drei Gleichgewichtsarten und nenne Strategien, mit denen die Standfestigkeit eines stehenden Körpers erhöht werden kann.", "loesung": "- Stabil: Lageänderung erzeugt Rückstellkräfte, Körper kehrt in Ausgangslage zurück\n- Labil: Lageänderung zerstört das Gleichgewicht, keine Rückkehr\n- Indifferent: Lageänderung führt zu neuen Gleichgewichtslagen\n- Strategie: Unterstützungsfläche verbreitern (breiter Stand, Gehstütze)\n- Strategie: tiefen Körperschwerpunkt einnehmen (in die Knie gehen), ggf. Körpergewicht erhöhen", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit den App-Labels (Folien 89–90) und dem Diagramm Folie 94; stärkere planen ein 4-Wochen-Gleichgewichtstraining für einen Senioren (Progression: stabil → instabil → Augen zu → Doppelaufgabe) und begründen die Reihenfolge (Sicherheit zuerst).", "app_uebung": "App: diagrams Folien 89–90/94 + hotspots/labels, cards 'Gleichgewicht'/'Analysatoren'/'Korrektur', quiz, exam (5 P + 6 P)."}, "sicherung": {"titel": "Gleichgewichts-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die drei Gleichgewichtsarten mit je einem Beispiel und zwei Strategien zur Erhöhung der Standfestigkeit.", "aufgaben": [{"frage": "Drei Arten?", "loesung": "Statisch (Stehen), dynamisch (Gehen), reaktiv (Stoß ausgleichen) (Folien 89–90)."}, {"frage": "Zwei Strategien?", "loesung": "z. B. breitere Standfläche + tieferer Schwerpunkt (oder Blickfixierung, Abstützen)."}, {"frage": "Warum ist Stretching bzw. passives Dehnen für Kinder eher nicht geeignet?  [App-Quiz: Bewegungslehre II]", "loesung": "Die Bewegungsarmut von Dehnprogrammen widerspricht Bewegungsdrang und Spielmentalität – Nach Weineck stehen aktive, spielerische Dehnübungen im Zentrum, da deren Verletzungsgefahr minimal ist."}]}, "hausaufgabe": "Diagramme Folien 89–90/94 ins Heft; App-Hotspots 'Gleichgewichtsarten' (Folien 89–90) durcharbeiten; exam-Aufgaben (5 P Strategien, 6 P Interaktionsmodell) üben; Balance-Demo mit Partner (gesichert) protokollieren.", "hinweise": ["Fehler: statisch/dynamisch/reaktiv vertauscht – App-diagram Folien 89–90 checken.", "Interaktionsmodell (Folie 94): Individuum/Aufgabe/Umwelt nicht vergessen – alle drei Faktoren (App-exam 6 P).", "Sicherheit beim Balancetraining: immer sichern (Sturzprophylaxe in der eigenen Therapie!)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: diagrams Folien 89–90/94 + hotspots/labels, cards, quiz, exam (5 P + 6 P)"]}, "b2-48": {"nr": 48, "id": "b2-48", "thema": "bewegungslehre2", "titel": "Haltung: Haltungsinspektion, Lot, Haltungsschwächen (Hohlrundrücken) und Trainingsmaßnahmen", "dauer": 60, "ziele": ["Die Auszubildenden nennen die Bestandteile der Haltungsinspektion und das Lot in der Sagittalebene (prüfungsrelevant).", "Sie ordnen Haltungsschwächen zu (App-sorts) und beschreiben das Erscheinungsbild eines Hohlrundrückens.", "Sie erläutern geeignete Trainingsmaßnahmen beim Hohlrundrücken (prüfungsrelevant, 6 P)."], "vorwissen": "Stunden 41–47 (BL II), Stunde 44 (Effekte Flex-Training), Kraft Std. 21 (Dysbalancen Folie 102).", "material": ["App, Beamer", "Zuordnung 'Erscheinungsbild der Haltungsschwächen' (App-sorts)", "Lot-Schnur/Faden für Demo an der Tafel", "Fotoanalyse einer Haltung (anonymisiert)"], "physio": "Die Haltungsanalyse ist Standard in der Physio (Befund!): Wir inspizieren von dorsal/lateral/ventral, prüfen das Lot in der Sagittalebene (Ohr–Schulter–Hüfte–Knie–Knöchel) und erkennen Schwächen (Hohlrundrücken, Hohlkreuz, Skoliose). Beim Hohlrundrücken (vermehrte Brustkyphose, vorgezogene Schultern, Kopf vor) dehnen wir Brustmuskulatur und kräftigen die Rückenstrecker – kombiniert mit Mobilisation der Brustwirbelsäule.", "app": {"einsatz": ["Zuordnen: 'Erscheinungsbild der Haltungsschwächen' (App-sorts)", "Quiz: 'Haltungsinspektion – Bestandteile und Lot in der Sagittalebene' (App-card), 'Erscheinungsbild eines Hohlrundrückens + Trainingsmaßnahmen' (exam 6 P)", "Karteikarte: 'Haltungsinspektion – Bestandteile und Lot in der Sagittalebene'", "Kraft: diagram 'Muskuläre Dysbalancen: Rumpfkraftmessung' (Folie 102) als Ergänzung"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Haltungs-Quiz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der runde Rücken des Schülers"}, {"phase": "Präsentation", "min": 15, "inhalt": "Haltungsinspektion und Hohlrundrücken"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Haltung analysieren und behandeln · Partnerarbeit mit App-sorts und Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Haltungs-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Haltungs-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Haltungsinspektion und Lot.", "aufgaben": [{"frage": "Bestandteile der Haltungsinspektion?", "antwort": "Dorsal, lateral, ventral; stehend/sitzend; Lot in Sagittal- und Frontalebene (App-card)."}, {"frage": "Lot in der Sagittalebene?", "antwort": "Ohr – Schulter – Hüftgelenk – Knie – Knöchel auf einer Linie (App-card)."}, {"frage": "Hohlrundrücken: Erscheinungsbild?", "antwort": "Verstärkte LWS-Lordose + Hängebauch (Beckenkippung nach vorn) (App-Quiz); Rundrücken: BWS-Kyphose ↑, Kopf vor."}, {"frage": "Maßnahmen?", "antwort": "Brustmuskulatur dehnen, Rückenstrecker kräftigen, BWS mobilisieren (App-exam 6 P)."}]}, {"titel": "Lot-Demo", "art": "Bewegung", "min": 5, "anleitung": "Partner inspiziert die Haltung lateral mit Lot (Faden): Liegt Ohr–Schulter–Hüfte–Knie–Knöchel auf einer Linie? Abweichungen markieren.", "aufgaben": [{"frage": "Abweichung vorne?", "antwort": "z. B. Kopf vor → Hohlrundrücken-Verdacht (App-sorts)."}, {"frage": "Abweichung hinten?", "antwort": "z. B. Becken gekippt → Hohlkreuz (App-sorts)."}, {"frage": "Physio-Bezug?", "antwort": "Lot-Abweichung = Ausgangspunkt der Haltungskorrektur."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Warum ist Stretching bzw. passives Dehnen für Kinder eher nicht geeignet?", "antwort": "Die Bewegungsarmut von Dehnprogrammen widerspricht Bewegungsdrang und Spielmentalität – Nach Weineck stehen aktive, spielerische Dehnübungen im Zentrum, da deren Verletzungsgefahr minimal ist."}, {"frage": "Warum sollte im späten Schulkindalter auf Hürdensitzübungen verzichtet werden?", "antwort": "Der gesamte Bandapparat des Kniegelenks wird biomechanisch ungünstig belastet – Entscheidend ist die ungünstige Belastung des Knie-Bandapparats bei Hürdensitzübungen."}, {"frage": "Warum sind Überlastungen in der Pubeszenz unbedingt zu vermeiden?", "antwort": "Die mechanische Widerstandsfähigkeit des passiven Bewegungsapparats ist vermindert – Durch den Wachstumsschub (8–10 cm/Jahr) hinkt die Dehnfähigkeit von Muskeln und Bändern hinterher; Wirbelsäule und Hüfte sind besonders gefährdet."}]}], "einstieg": {"titel": "Der runde Rücken des Schülers", "min": 10, "situation": "Fall: 15-jähriger Schüler sitzt viel am PC, Schultern hängen nach vorne, Brustwirbelsäule gerundet. Welche Haltungsschwäche vermutest du – und welches Lot weicht ab?", "impulse": [{"frage": "Haltungsschwäche?", "erwartung": "Hohlrundrücken (App-sorts 'Erscheinungsbild der Haltungsschwächen')."}, {"frage": "Lot-Abweichung?", "erwartung": "Kopf/Schultern vor der Lot-Linie (App-card 'Lot Sagittalebene')."}, {"frage": "Maßnahmen?", "erwartung": "Brust dehnen, Rücken kräftigen, BWS mobilisieren, Ergonomie-Beratung (App-exam 6 P)."}, {"frage": "Wachstumsschub beachten?", "erwartung": "Ja – Pubertät (Std. 46, Folien 45/48) verstärkt Skoliose-/Haltungsrisiko."}], "ueberleitung": "Haltung ist das sichtbare Ergebnis von Muskelbalance und Gewohnheit – wir analysieren sie systematisch mit Lot und Inspektion. Heute: Haltungsinspektion und der Hohlrundrücken."}, "praesentation": {"titel": "Haltungsinspektion und Hohlrundrücken", "min": 15, "merksatz": "Haltungsinspektion: dorsal, lateral, ventral; stehend und sitzend; Lot in der Sagittalebene (Ohr–Schulter–Hüfte–Knie–Knöchel). Haltungsschwächen (App-sorts): Hohlrundrücken (BWS-Kyphose ↑, Schultern vor, Kopf vor), Hohlkreuz (LWS-Lordose ↑, Beckenkippung), Skoliose (seitliche Abweichung, Frontalebene). Haltungsschwächen: Hohlrundrücken = Hyperlordose + Hängebauch (Beckenkippung nach vorn): Hüftbeuger, vordere Oberschenkel und unterer Rücken dehnen; Bauch, Gesäß und hintere Oberschenkel kräftigen. Rundrücken = BWS-Kyphose ↑ + vorgeschobener Kopf: Brust- und Gesäßmuskel dehnen; Bauch, Schultergürtel und Rücken kräftigen (App-Quiz, App-sorts).", "schritte": [{"ueberschrift": "Die Haltungsinspektion", "text": "App-card 'Haltungsinspektion – Bestandteile und Lot' aufdecken; Lot an der Tafel zeichnen (Ohr–Schulter–Hüfte–Knie–Knöchel); Inspektion dorsal/lateral/ventral.", "vortrag": "Wir inspizieren die Haltung systematisch: von dorsal (hinten), lateral (seitlich) und ventral (vorne), im Stehen und Sitzen. In der Sagittalebene prüfen wir das Lot: Ohr, Schulter, Hüftgelenk, Knie und Knöchel sollten auf einer senkrechten Linie liegen. Abweichungen zeigen Haltungsschwächen – das ist die Basis jedes Haltungsbefundes."}, {"ueberschrift": "Haltungsschwächen erkennen", "text": "App-sorts 'Erscheinungsbild der Haltungsschwächen' lösen; Hohlrundrücken/Hohlkreuz/Skoliose an die Tafel mit Merkmalen.", "vortrag": "Typische Schwächen: der Hohlrundrücken mit vermehrter Brustkyphose, vorgezogenen Schultern und vorgebeugtem Kopf; das Hohlkreuz mit verstärkter Lendenlordose und Beckenkippung; die Skoliose als seitliche Abweichung in der Frontalebene. Im App-Sort ordnen wir die Erscheinungsbilder den Schwächen zu."}, {"ueberschrift": "Hohlrundrücken behandeln", "text": "App-exam (6 P) vorbereiten: Maßnahmen = Brustmuskulatur dehnen (PNF CR), Rückenstrecker kräftigen (Kraft Std. 20 Stufenmodell), BWS mobilisieren, Haltungsschulung + Ergonomie (Sitzen am PC); Rumpfkraft messen (kraft Folie 102).", "vortrag": "Beim Hohlrundrücken (Hängebauch) sind Hüftbeuger und vorderer Oberschenkel verkürzt, Bauch und Gesäß schwach: Wir dehnen Hüftbeuger/vordere OS (PNF CR, Stunde 42), kräftigen Bauch/Gesäß/hintere OS (Stufenmodell, Kraft Std. 20), mobilisieren die LWS und schulen Haltung/Ergonomie. Beim Rundrücken (Kyphose, Kopf vor) dehnen wir Brust/Gesäß und kräftigen Bauch/Schultergürtel/Rücken (App-Quiz). Die Rumpfkraftmessung (Kraft Folie 102) zeigt die Dysbalance objektiv. Prüf/relevant (6 Punkte)."}]}, "arbeitsphase": {"titel": "Haltung analysieren und behandeln", "min": 25, "sozialform": "Partnerarbeit mit App-sorts und Fallkarten", "aufgaben": [{"titel": "Inspiziert die Haltung eines Partners lateral (Lot) – welche Abweichungen (App-sorts)?", "text": "Inspiziert die Haltung eines Partners lateral (Lot) – welche Abweichungen (App-sorts)?", "loesung": "z. B. Kopf vor, Schultern gerundet → Hohlrundrücken (App-sorts 'Erscheinungsbild der Haltungsschwächen').", "hilfe": "App: sorts 'Erscheinungsbild der Haltungsschwächen'."}, {"titel": "Fall: Hohlrundrücken beim 15-jährigen Schüler – 3 konservative Maßnahmen + je 1 Begründung.", "text": "Fall: Hohlrundrücken beim 15-jährigen Schüler – 3 konservative Maßnahmen + je 1 Begründung.", "loesung": "1) Hüftbeuger/vordere OS dehnen – PNF CR (verkürzt, App), 2) Bauch/Gesäß/hintere OS kräftigen (schwach, App), 3) LWS-Mobilisation + Haltungsschulung/Ergonomie (App-exam 6 P).", "hilfe": "App: exam bewegungslehre2 (6 P)."}, {"titel": "Fall: 70-jährige Patientin mit Hohlkreuz und LWS-Schmerzen – Lot-Abweichung? Maßnahmen?", "text": "Fall: 70-jährige Patientin mit Hohlkreuz und LWS-Schmerzen – Lot-Abweichung? Maßnahmen?", "loesung": "Beckenkippung nach vorne, Lendenlordose ↑ (App-sorts); Maßnahmen: Bauchmuskulatur kräftigen, Hüftbeuger dehnen, Haltungsschulung (App-sorts + exam).", "hilfe": "App: sorts, exam."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Beschreibe das Erscheinungsbild eines Hohlrundrückens und erläutere geeignete Trainingsmaßnahmen.", "loesung": "- Kopf vorgeschoben, Schultergürtel vorverlagert, Schulterblätter als „Flügel“\n- Verstärkte BWS-Kyphose, eingesunkener Brustkorb\n- Verstärkte LWS-Lordose, Becken nach vorne gekippt, Hängebauch\n- Dehnen: Brustmuskulatur, Darmbein-Lendenmuskulatur, vordere Oberschenkelmuskulatur, unterer Rücken\n- Kräftigen: Bauchmuskulatur, Schultergürtel, obere Rückenmuskulatur, Gesäßmuskulatur\n- Ziel: Ausgleich der muskulären Dysbalancen", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit den App-sorts und der Lot-Skizze; stärkere messen die Rumpfdysbalance (Kraft Folie 102) am Partner und leiten daraus ein konkretes Kraft-Dehn-Programm ab (Kombination Kraft Std. 20 + Dehnen Std. 42–43).", "app_uebung": "App: sorts 'Erscheinungsbild der Haltungsschwächen', card 'Haltungsinspektion – Bestandteile und Lot', quiz, exam (6 P); kraft diagram Folie 102."}, "sicherung": {"titel": "Haltungs-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die Lot-Linie in der Sagittalebene, das Erscheinungsbild des Hohlrundrückens und zwei geeignete Trainingsmaßnahmen.", "aufgaben": [{"frage": "Lot?", "loesung": "Ohr–Schulter–Hüfte–Knie–Knöchel (App-card)."}, {"frage": "Hohlrundrücken?", "loesung": "LWS-Lordose ↑ + Hängebauch, Beckenkippung vorn (App-Quiz); Rundrücken: BWS-Kyphose ↑, Kopf vor."}, {"frage": "Maßnahmen?", "loesung": "Hohlrundrücken: Hüftbeuger/vordere OS dehnen (PNF), Bauch/Gesäß/hintere OS kräftigen + Ergonomie (App-exam 6 P)."}, {"frage": "Warum ist Krafttraining vor der Pubertät nicht besonders lohnend?  [App-Quiz: Bewegungslehre II]", "loesung": "Der Testosteronspiegel ist im Vergleich zum Erwachsenen sehr niedrig – Erst mit dem pubertären Testosteronanstieg steigt der Muskelanteil deutlich an."}]}, "hausaufgabe": "App-sorts 'Erscheinungsbild der Haltungsschwächen' fehlerfrei; Lot-Skizze ins Heft; exam-Aufgabe 'Hohlrundrücken + Maßnahmen' (6 P) üben; Partner-Haltungsinspektion (lateral, Lot) dokumentieren.", "hinweise": ["Fehler: Lot-Punkte vertauscht – Ohr, Schulter, Hüfte, Knie, Knöchel (App-card).", "Hohlrundrücken nur mit 'geradem Sitzen' behandeln – Dehnen + Kräftigen + Mobilisation kombinieren (App-exam 6 P).", "Wachstumsschub (Std. 46) bei jugendlichen Haltungsschwächen mitdenken (Skoliose-Screening)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: sorts 'Erscheinungsbild der Haltungsschwächen', card 'Haltungsinspektion…', quiz, exam (6 P)", "Kraft: diagram Folie 102 (Rumpfkraftmessung)"]}, "b2-49": {"nr": 49, "id": "b2-49", "thema": "bewegungslehre2", "titel": "Beweglichkeitstraining im Kindes- und Jugendalter – Grundsätze und Pubertät", "dauer": 60, "ziele": ["Die Auszubildenden nennen die Grundsätze für Beweglichkeitstraining im Kindes-/Jugendalter.", "Sie erläutern die Besonderheiten in der Pubertät und leiten Konsequenzen für die Praxis ab (prüfungsrelevant, 4 P).", "Sie kombinieren sensible Phasen (Folie 67), Claparède und Faigenbaum zu einem kindgerechten Programm."], "vorwissen": "Stunden 41–48 (gesamte BL II), TL Std. 8 (sensible Phasen), Kraft Std. 21 (Faigenbaum).", "material": ["App, Beamer", "Diagramm 'Modell der sensiblen Phasen (Martin 1982)' (Folie 67)", "Karteikarten 'Grundsätze für Beweglichkeitstraining im Kindes-/Jugendalter'", "Ta
