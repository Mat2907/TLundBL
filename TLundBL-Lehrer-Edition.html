ndphase auf der operierten Seite verkürzt, sehen wir genau, welche Phase gestört ist – und behandeln gezielt. Die App ordnet typische Bewegungen ihren Phasenstrukturen zu."}]}, "arbeitsphase": {"titel": "Bewegungen phasenweise analysieren", "min": 25, "sozialform": "Partnerarbeit mit App-sorts und eigenen Beispielen", "aufgaben": [{"titel": "Zerlege das Aufstehen vom Stuhl in die drei Phasen und beschreibe je eine Störung.", "text": "Zerlege das Aufstehen vom Stuhl in die drei Phasen und beschreibe je eine Störung.", "loesung": "Vorbereitung: Rumpfvorneigen (Störung: Rumpf bleibt zurück); Hauptphase: Abdruck über die Beine (Störung: Arme schieben allein); Endphase: Stand (Störung: Zittern/Unsicherheit) (App-sorts + Meinel & Schnabel).", "hilfe": "App: sorts 'Phasenstruktur der Bewegung'."}, {"titel": "Ordne zu: Sprung (azyklisch), Rudern (zyklisch), Kugelstoß (azyklisch mit Verschmelzung bei hoher Geschwindigkeit).", "text": "Ordne zu: Sprung (azyklisch), Rudern (zyklisch), Kugelstoß (azyklisch mit Verschmelzung bei hoher Geschwindigkeit).", "loesung": "Sprung/Kugelstoß = azyklisch; Rudern = zyklisch (App-sorts).", "hilfe": "App: sorts."}, {"titel": "Fall: Patient nach Schlaganfall – Aufstehen in Zeitlufe üben. Warum (Phasenverschmelzung)?", "text": "Fall: Patient nach Schlaganfall – Aufstehen in Zeitlufe üben. Warum (Phasenverschmelzung)?", "loesung": "Langsam = Phasen nicht verschmolzen → einzeln trainierbar (App-Quiz 'Phasenverschmelzung').", "hilfe": "App: quiz 'Phasenverschmelzung'."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Beschreibe die Strukturierung azyklischer und zyklischer Bewegungen nach Meinel & Schnabel jeweils mit Beispiel.", "loesung": "Azyklisch: Vorbereitungsphase – Hauptphase – Endphase (z. B. Tennis-Vorhand: Ausholen, Schlag, Ausschwingen)\nVorbereitungsphase bereitet Hauptaktion optimal vor (Ausholen, Anlauf)\nHauptphase: unmittelbare Lösung der Bewegungsaufgabe\nEndphase: Übergang in stabilen Zustand bzw. Vorbereitung weiterer Akte\nZyklisch: Zwischenphase – Hauptphase – Zwischenphase durch Phasenverschmelzung (z. B. Schwimmen, Laufen)", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit den App-sorts; stärkere filmen (Handy) das Aufstehen eines Partners in Zeitlupe und markieren die Phasen – und leiten daraus eine Übungsprogression ab.", "app_uebung": "App: sorts 'Phasenstruktur der Bewegung', cards 'Phasen azyklisch'/'Phasenverschmelzung', quiz, exam (5 P)."}, "sicherung": {"titel": "Phasen-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die drei Phasen einer azyklischen Bewegung, erkläre die Phasenverschmelzung und gib je ein Beispiel für azyklisch und zyklisch.", "aufgaben": [{"frage": "Drei Phasen?", "loesung": "Vorbereitung – Hauptphase – Endphase."}, {"frage": "Verschmelzung?", "loesung": "Bei schneller Ausführung fließen Vorbereitung und Hauptphase zusammen."}, {"frage": "Beispiele?", "loesung": "Azyklisch: Sprung/Aufstehen; zyklisch: Laufen/Rudern."}, {"frage": "Wie wird Bewegung handlungstheoretisch definiert (Grosser/Hermann u. a., 1987)?  [App-Quiz: Bewegungslehre I]", "loesung": "Als zielgerichteter koordinierter Prozess mit räumlich-zeitlicher Veränderung – Bewegung ist ein zielgerichteter koordinierter Prozess, der sich in einer räumlich-zeitlichen Veränderung ausdrückt. Die Innensicht (Steuerungsprozesse) heißt dagegen Motorik."}]}, "hausaufgabe": "App-sorts 'Phasenstruktur der Bewegung' fehlerfrei; Karteikarten 'Phasen azyklisch'/'Phasenverschmelzung' lernen; exam-Aufgabe (5 P) 'Meinel & Schnabel azyklisch/zyklisch' üben.", "hinweise": ["Fehler: zyklische Bewegung als 'ohne Phasen' beschrieben – sie hat eine wiederkehrende Phase (App-sorts).", "Phasenverschmelzung nicht verstanden → langsames Üben als therapeutisches Prinzip (Zeitlupe) verankern.", "Autoren Meinel & Schnabel prüfungsrelevant (App-exam 5 P)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: sorts 'Phasenstruktur der Bewegung', cards, quiz, exam (5 P)", "Meinel & Schnabel (App-Quelle)"]}, "b1-36": {"nr": 36, "id": "b1-36", "thema": "bewegungslehre1", "titel": "Bewegungsmerkmale: qualitativ und quantitativ", "dauer": 60, "ziele": ["Die Auszubildenden unterscheiden qualitative und quantitative Bewegungsmerkmale.", "Sie nennen Beispiele für beide Merkmalsklassen und wenden sie auf die Bewegungsbeobachtung an.", "Sie ordnen Merkmale zu (App-sorts 'Quantitative Bewegungsmerkmale')."], "vorwissen": "Stunde 35 (Phasenstruktur).", "material": ["App, Beamer", "Zuordnung 'Quantitative Bewegungsmerkmale'", "Stoppuhr, Maßband, Goniometer für Demo"], "physio": "In der Befunddokumentation brauchen wir objektive (quantitative: Gelenkwinkel, Gehstrecke, Zeit) und beschreibende (qualitative: flüssig, zittrig, ökonomisch) Merkmale. Beides zusammen ergibt das Bewegungsbild – die Basis für Zielsetzung und Verlaufskontrolle in der Physio.", "app": {"einsatz": ["Zuordnen: 'Quantitative Bewegungsmerkmale' (App-sorts)", "Karteikarten: 'Qualitative Bewegungsmerkmale', 'Quantitative Bewegungsmerkmale'", "Quiz bewegungslehre1 zu Bewegungsmerkmalen"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Merkmale-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Guter oder schlechter Gang?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Zwei Merkmalstypen"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Befunde formulieren · Partnerarbeit mit App-sorts und Beispielbewegungen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Merkmals-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Merkmale-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu qualitativen/quantitativen Merkmalen.", "aufgaben": [{"frage": "Qualitative Merkmale?", "antwort": "z. B. flüssig, rhythmisch, ökonomisch, präzise – beschreibend/bewertend."}, {"frage": "Quantitative Merkmale?", "antwort": "z. B. Zeit, Strecke, Winkel, Kraft – messbar (App-sorts)."}, {"frage": "Beispiel quantitativ beim Gehen?", "antwort": "Schrittfrequenz, Gehgeschwindigkeit, Doppelstützzeit."}, {"frage": "Beispiel qualitativ?", "antwort": "Gangbild flüssig vs. hinkend."}]}, {"titel": "Messen-Demo", "art": "Bewegung", "min": 5, "anleitung": "Partner messen am Aufstehen: Zeit (s), Rumpfvorneigewinkel (ca., Goniometer-App), subjektive Qualität (1–5).", "aufgaben": [{"frage": "Was ist objektiver?", "antwort": "Zeit/Winkel (quantitativ)."}, {"frage": "Was ist subjektiver?", "antwort": "Qualitätsbewertung (qualitativ) – trotzdem wichtig im Befund."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Wie wird Bewegung handlungstheoretisch definiert (Grosser/Hermann u. a., 1987)?", "antwort": "Als zielgerichteter koordinierter Prozess mit räumlich-zeitlicher Veränderung – Bewegung ist ein zielgerichteter koordinierter Prozess, der sich in einer räumlich-zeitlichen Veränderung ausdrückt. Die Innensicht (Steuerungsprozesse) heißt dagegen Motorik."}, {"frage": "Worauf zielt eine verlaufsorientierte Bewegung ab?", "antwort": "Auf die bestmögliche Verlaufsform und Fehlerminimierung – Verlaufsorientiert heißt: bestmögliche Verlaufsform, Ausführungsoptimierung und Fehlerminimierung. Resultatsorientiert zielt auf Zeit, Weite oder Treffer."}, {"frage": "Welcher Bereich gehört im Modell der körperlichen Leistungsfähigkeit zur Kondition?", "antwort": "Kraft, Schnelligkeit, Ausdauer, Beweglichkeit – Im Modell steht unter Kondition: Kraft, Schnelligkeit, Ausdauer, Beweglichkeit. Koordinative Fähigkeiten und Fertigkeiten bilden den Bereich Technik."}]}], "einstieg": {"titel": "Guter oder schlechter Gang?", "min": 10, "situation": "Fall: Zwei Patienten nach Schlaganfall – beide gehen 10 m in 20 s (gleich quantitativ). Aber einer hinkt deutlich. Was sagt das über die Merkmalstypen?", "impulse": [{"frage": "Gleich quantitativ?", "erwartung": "Ja – gleiche Zeit/Strecke."}, {"frage": "Unterschied qualitativ?", "erwartung": "Ja – Gangbild flüssig vs. hinkend (App-card 'Qualitative Bewegungsmerkmale')."}, {"frage": "Physio-Konsequenz?", "erwartung": "Beide messen UND beobachten – nur dann vollständiger Befund."}], "ueberleitung": "Bewegungen kann man messen (quantitativ) oder beschreiben (qualitativ) – beides braucht die Physio. Heute: die Merkmalstypen."}, "praesentation": {"titel": "Zwei Merkmalstypen", "min": 15, "merksatz": "Quantitative Merkmale sind messbar: Zeit (Reaktionszeit, Bewegungszeit), Weg/Strecke, Winkel (Gelenk), Kraft, Frequenz (Schritte/min). Qualitative Merkmale beschreiben den Verlauf: Bewegungsfluss, Rhythmus, Präzision, Konstanz, Umfang, ökonomisch vs. ungünstig. In der Physio dokumentieren wir beides (z. B. 'Gehgeschwindigkeit 0,8 m/s' + 'Gangbild leicht hinkend').", "schritte": [{"ueberschrift": "Quantitative Merkmale", "text": "App-sorts 'Quantitative Bewegungsmerkmale' lösen; Beispiele an die Tafel mit Messgrößen (Stoppuhr, Goniometer, Kraftmessung).", "vortrag": "Quantitative Merkmale sind messbar: Wie lange dauert die Bewegung, welchen Weg legt sie zurück, welcher Gelenkwinkel wird erreicht, wie viel Kraft wird aufgebracht, wie hoch ist die Frequenz? Beim Gehen messen wir zum Beispiel Gehgeschwindigkeit in Metern pro Sekunde oder die Schrittfrequenz. Diese Werte dokumentieren wir im Befund und verfolgen sie im Verlauf."}, {"ueberschrift": "Qualitative Merkmale", "text": "App-card 'Qualitative Bewegungsmerkmale'; Beispiele: flüssig, rhythmisch, präzise, ökonomisch, konstanzarm.", "vortrag": "Qualitative Merkmale beschreiben, wie die Bewegung aussieht: Ist sie flüssig oder stockend, rhythmisch oder arrhythmisch, präzise oder holprig, ökonomisch oder mit unnötigem Kraftaufwand? Diese Beschreibungen sind subjektiver, aber für die Therapie oft aussagekräftiger – ein 'hinkendes' Gangbild sagt mehr als eine reine Zeitmessung."}, {"ueberschrift": "Beide Typen in der Praxis", "text": "Beispiel Befund: 'Aufstehen 8 s (quantitativ), Bewegung stockend im Übergang (qualitativ)'. App-sorts + cards kombinieren.", "vortrag": "Ein guter Befund kombiniert beides: 'Der Patient steht in 8 Sekunden auf (quantitativ) – im Übergang von der Vorbereitungs- zur Hauptphase stockt er jedoch (qualitativ)'. Daraus leiten wir die Therapie ab: Zeitlupe-Üben des Übergangs (Std. 35)."}]}, "arbeitsphase": {"titel": "Befunde formulieren", "min": 25, "sozialform": "Partnerarbeit mit App-sorts und Beispielbewegungen", "aufgaben": [{"titel": "Formuliere einen Befund für das Aufstehen deines Partners – je ein quantitatives und ein qualitatives Merkmal.", "text": "Formuliere einen Befund für das Aufstehen deines Partners – je ein quantitatives und ein qualitatives Merkmal.", "loesung": "z. B. 'Aufstehen in 6 s (quantitativ); flüssig, symmetrisch (qualitativ)' (App-cards).", "hilfe": "App: cards 'Qualitative/Quantitative Bewegungsmerkmale'."}, {"titel": "Ordne die Messgrößen zu (App-sorts 'Quantitative Bewegungsmerkmale'): Zeit, Weg, Winkel, Kraft, Frequenz.", "text": "Ordne die Messgrößen zu (App-sorts 'Quantitative Bewegungsmerkmale'): Zeit, Weg, Winkel, Kraft, Frequenz.", "loesung": "App-sorts direkt lösen.", "hilfe": "App: sorts 'Quantitative Bewegungsmerkmale'."}, {"titel": "Fall: Verlaufskontrolle nach 4 Wochen – welche quantitativen Werte vergleichst du (Ganggeschwindigkeit, Aufstehzeit, Gelenkwinkel)?", "text": "Fall: Verlaufskontrolle nach 4 Wochen – welche quantitativen Werte vergleichst du (Ganggeschwindigkeit, Aufstehzeit, Gelenkwinkel)?", "loesung": "Messbare Verlaufswerte dokumentieren: z. B. Aufstehzeit 8→5 s, Gehgeschwindigkeit 0,8→1,1 m/s – objektiver Therapieerfolg.", "hilfe": "App: sorts + Physio-Dokumentation."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Vergleiche Muskelspindel und Golgi-Sehnenorgan hinsichtlich Funktion und Wirkung.", "loesung": "Muskelspindel: meldet Länge, Längenänderung, Geschwindigkeit der Längenänderung\nKernsackfasern: Längenveränderung; Kernkettenfasern: Längenzustand\nGamma-System hält die Empfindlichkeit an die Muskellänge angepasst\nGolgi-Sehnenorgan: Spannungssensor, kontrolliert Kontraktionskraft\nAktivierung über Ib-Fasern und Interneurone hemmt das α-Motoneuron des eigenen Muskels", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit den App-cards/Sorts; stärkere messen ein echtes Aufstehen (Stoppuhr, Winkel-App) und diskutieren, warum beide Merkmalstypen im Befund stehen müssen (Verlaufskontrolle, Qualitätsziel).", "app_uebung": "App: sorts 'Quantitative Bewegungsmerkmale', cards 'Qualitative/Quantitative Bewegungsmerkmale', quiz."}, "sicherung": {"titel": "Merkmals-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne drei quantitative und drei qualitative Bewegungsmerkmale mit je einem Beispiel.", "aufgaben": [{"frage": "Quantitativ?", "loesung": "Zeit (Aufstehdauer), Weg (Gehstrecke), Winkel (Knieflexion), Kraft, Frequenz (Schritte/min)."}, {"frage": "Qualitativ?", "loesung": "Fluss, Rhythmus, Präzision, Konstanz, Ökonomie (z. B. 'Gang flüssig, leicht hinkend')."}, {"frage": "Was bedeutet Training der koordinativen Fähigkeiten nach Korobkov?  [App-Quiz: Bewegungslehre I]", "loesung": "„Training der Trainierbarkeit“ – Koordinative Fähigkeiten sind Grundlage der sensomotorischen Lernfähigkeit, daher nennt Korobkov ihr Training „Training der Trainierbarkeit“."}]}, "hausaufgabe": "App-sorts 'Quantitative Bewegungsmerkmale' fehlerfrei; Karteikarten 'Qualitative/Quantitative Merkmale' lernen; einen eigenen Befund (quantitativ + qualitativ) formulieren.", "hinweise": ["Fehler: nur quantitative Werte dokumentiert – qualitative Merkmale (Fluss, Rhythmus) fehlen dann im Befund.", "Quantitative Merkmale müssen wiederholbar messbar sein (gleiche Bedingungen) – sonst kein Verlauf vergleichbar.", "App-sorts 'Quantitative Bewegungsmerkmale' ist prüfungsrelevant (App-Quiz)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: sorts 'Quantitative Bewegungsmerkmale', cards 'Qualitative/Quantitative Bewegungsmerkmale', quiz"]}, "b1-37": {"nr": 37, "id": "b1-37", "thema": "bewegungslehre1", "titel": "Sensomotorik: Regelkreis, Analysatoren, Propriozeption (Muskelspindel, Golgi-Sehnenorgan)", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben das sensomotorische System als Regelkreis mit Ist-Sollwert-Vergleich (Folie 33).", "Sie vergleichen Muskelspindel und Golgi-Sehnenorgan hinsichtlich Funktion und Wirkung (prüfungsrelevant, 5 P).", "Sie nennen die Analysatoren und das Gamma-System."], "vorwissen": "Stunden 32–36 (Bewegung, Koordination, Phasen, Merkmale), Neuroanatomie grob.", "material": ["App, Beamer", "Diagramme: 'Sensomotorisches System (Regelkreis)' (Folie 33) + Hotspot/Labels (Folien 33, 37)", "Tabelle 'Analysatoren' (Folie 36)", "Reflexhammer für Demo (Patellasehne)"], "physio": "Die Propriozeption ist die Grundlage jeder Bewegungssteuerung – und in der Neuroreha (Schlaganfall, Polyneuropathie, nach Gelenkersatz) häufig gestört. Muskelspindel (Längenänderung → Dehnungsreflex) und Golgi-Sehnenorgan (Spannung → Schutzhemmung) sind die wichtigsten Sensoren; das Gamma-System stellt die Spindelvorspannung ein. Das sensomotorische Training (Std. 40) baut auf diesem Verständnis auf.", "app": {"einsatz": ["Diagramme + Hotspot/Labels: 'Sensomotorisches System (Regelkreis)' (Folien 33, 37)", "Reihenfolgen: 'Ablauf im sensomotorischen System', 'Ist-Sollwert-Vergleich einer Bewegungshandlung'", "Tabelle 'Analysatoren' (Folie 36)", "Karteikarten: 'Extero- vs. propriozeptive Quellen', 'Afferente Nervenbahnen', 'Propriozeption', 'Kernsack- vs. Kernkettenfasern', 'Gamma-System', 'Golgi-Sehnenorgan', 'Einsatzbereiche propriozeptiven Trainings'", "Quiz: 'Vergleiche Muskelspindel und Golgi-Sehnenorgan' (exam 5 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Regelkreis-Rätsel (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum spürt der Patient sein Gelenk nicht richtig?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Der sensomotorische Regelkreis und seine Sensoren"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Sensoren zuordnen und anwenden · Partnerarbeit mit App-sorts, Tabelle Folie 36 und Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Sensoren-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Regelkreis-Rätsel", "art": "Quiz", "min": 5, "anleitung": "App-sequence 'Ist-Sollwert-Vergleich' und 'Ablauf im sensomotorischen System' – Begriffe in die richtige Reihenfolge bringen.", "aufgaben": [{"frage": "Ist-Sollwert-Vergleich?", "antwort": "Tatsächlicher Zustand (Ist) wird mit gewünschtem (Soll) verglichen – Differenz steuert die Korrektur (App-sequence)."}, {"frage": "Afferenz?", "antwort": "Hinführende (sensorische) Bahnen zum ZNS."}, {"frage": "Efferenz?", "antwort": "Wegführende (motorische) Bahnen zum Muskel."}]}, {"titel": "Reflex-Demo", "art": "Bewegung", "min": 5, "anleitung": "Patellasehnenreflex auslösen (Reflexhammer) – Muskelspindel meldet Dehnung → Kontraktion. Diskussion: Welche Sensoren sind beteiligt?", "aufgaben": [{"frage": "Muskelspindel?", "antwort": "Ja – registriert Längenänderung der Muskelfaser (Dehnungsreflex)."}, {"frage": "Golgi-Sehnenorgan?", "antwort": "Registriert Spannung (zu viel Kraft → Hemmung, Schutz)."}, {"frage": "Physio-Bezug?", "antwort": "Propriozeption trainieren (Std. 40) – z. B. nach Kreuzband-OP (Gelenksensoren geschädigt)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Was bedeutet Training der koordinativen Fähigkeiten nach Korobkov?", "antwort": "„Training der Trainierbarkeit“ – Koordinative Fähigkeiten sind Grundlage der sensomotorischen Lernfähigkeit, daher nennt Korobkov ihr Training „Training der Trainierbarkeit“."}, {"frage": "Welche koordinative Fähigkeit ist für muskuläre Feinabstimmung wie Ballgefühl zuständig?", "antwort": "Differenzierungsfähigkeit – Die (kinästhetische) Differenzierungsfähigkeit ist die Fähigkeit zur muskulären Feinabstimmung, z. B. Ball-, Wasser- oder Schneegefühl."}, {"frage": "Ein Mittelfeldspieler spielt den Ball genau im richtigen Moment in den Lauf des Stürmers. Welche Fähigkeit zeigt sich hier vor allem?", "antwort": "Zeitliche Orientierungsfähigkeit – Das Timing, den Ball zum richtigen Zeitpunkt in den Lauf zu spielen, ist das Beispiel für zeitliche Orientierungsfähigkeit."}]}], "einstieg": {"titel": "Warum spürt der Patient sein Gelenk nicht richtig?", "min": 10, "situation": "Fall: Nach Kreuzband-OP 'knickt' das Knie immer wieder um – der Patient merkt die Fehlstellung zu spät. Welches Sinnessystem ist gestört?", "impulse": [{"frage": "Propriozeption?", "erwartung": "Ja – Gelenkrezeptoren/Muskelspindel-Anpassung gestört (App: card 'Propriozeption')."}, {"frage": "Folge?", "erwartung": "Fehlende Ist-Wert-Rückmeldung → Regelkreis gestört (Folie 33)."}, {"frage": "Therapie?", "erwartung": "Propriozeptives/sensomotorisches Training (Std. 40, Planer Folie 62)."}, {"frage": "App-Bezug?", "erwartung": "App: diagram Folien 33/37, hotspots, quiz 'Muskelspindel vs. Golgi'."}], "ueberleitung": "Jede Bewegung wird über einen Regelkreis gesteuert: Sensoren melden den Ist-Zustand, das ZNS vergleicht mit dem Soll – erst dann Korrektur. Heute: die Sensoren dieses Regelkreises."}, "praesentation": {"titel": "Der sensomotorische Regelkreis und seine Sensoren", "min": 15, "merksatz": "Regelkreis (Folie 33): Sollwert (gewünschte Bewegung) → Steuerbefehl (Efferenz) → Bewegung → Sensoren melden Ist-Zustand (Afferenz) → Vergleich → Korrektur. Analysatoren (Folie 36): visuell, akustisch, taktil, vestibulär, propriozeptiv (Muskelspindel: Längenänderung, Kernsack-/Kernkettenfasern; Golgi-Sehnenorgan: Spannung; Gelenkrezeptoren). Gamma-System: stellt die Spindelvorspannung ein (Empfindlichkeit). Exterozeptiv = von außen (visuell/akustisch), propriozeptiv = körpereigen.", "schritte": [{"ueberschrift": "Der Regelkreis (Ist-Sollwert-Vergleich)", "text": "Diagramm Folie 33 an die Tafel zeichnen; App-sequence 'Ablauf im sensomotorischen System' + 'Ist-Sollwert-Vergleich' ordnen; Hotspots Folien 33/37.", "vortrag": "Bewegungssteuerung ist ein Regelkreis: Das ZNS vergleicht den gewünschten Sollwert mit dem gemeldeten Istwert und korrigiert die Differenz. Die App-sequence zeigt den Ablauf: Steuerbefehl über efferente Bahnen zum Muskel, Bewegung, Sensoren melden zurück über afferente Bahnen. Ist der Ist-Sollwert-Vergleich gestört – etwa nach Kreuzband-OP –, reagiert der Patient zu spät."}, {"ueberschrift": "Muskelspindel vs. Golgi-Sehnenorgan", "text": "App-card + Tabelle Folie 36; Vergleich an die Tafel: Muskelspindel = Länge (Dehnungsreflex, Kernsack/Kernketten), Golgi = Spannung (Schutzhemmung bei Überlastung); exam (5 P).", "vortrag": "Zwei Sensoren sind zentral: Die Muskelspindel in der Muskulatur misst die Muskellänge und löst bei schneller Dehnung den Dehnungsreflex aus (Kernkettenfasern messen statisch, Kernsackfasern dynamisch). Das Golgi-Sehnenorgan in der Sehne misst die Muskelspannung: Seine Ib-Fasern erregen hemmende Interneurone, die das α-Motoneuron des eigenen Muskels hemmen (autogene Hemmung) – ein Schutzmechanismus (App-Quiz). Die Muskelspindel meldet Länge, Längenänderung und Geschwindigkeit der Längenänderung; das Gamma-System stellt ihre Empfindlichkeit (Vorspannung) ein."}, {"ueberschrift": "Analysatoren und extero-/propriozeptiv", "text": "Tabelle Folie 36 projizieren; Zuordnung exterozeptiv (visuell, akustisch, taktil) vs. propriozeptiv (Spindel, Golgi, Gelenk, vestibulär); App: sorts 'Informationsquellen der Sensomotorik'.", "vortrag": "Fünf Analysatoren versorgen uns mit Information: visuell, akustisch, taktil, vestibulär (Gleichgewicht) und propriozeptiv (Körperlage im Raum). Exterozeptiv heißt: Information von außen (z. B. sehen), propriozeptiv: körpereigene Sensoren (z. B. Muskelspindel). In der Therapie nach Gelenk-OP oder bei Neuropathie ist besonders die Propriozeption gestört – deshalb trainieren wir sie gezielt (nächste Stunde)."}]}, "arbeitsphase": {"titel": "Sensoren zuordnen und anwenden", "min": 25, "sozialform": "Partnerarbeit mit App-sorts, Tabelle Folie 36 und Fallkarten", "aufgaben": [{"titel": "Ordne zu (App-sorts 'Informationsquellen der Sensomotorik'): Sehen des Balls, Spüren der Gelenkstellung, Hören des Kommandos, Gleichgewichtsorgan.", "text": "Ordne zu (App-sorts 'Informationsquellen der Sensomotorik'): Sehen des Balls, Spüren der Gelenkstellung, Hören des Kommandos, Gleichgewichtsorgan.", "loesung": "Visuell, propriozeptiv, akustisch, vestibulär (App-sorts + Tabelle Folie 36).", "hilfe": "App: sorts 'Informationsquellen der Sensomotorik'."}, {"titel": "Fall: Patient nach Schlaganfall – welche Analysatoren sind oft betroffen, welche Therapie folgt?", "text": "Fall: Patient nach Schlaganfall – welche Analysatoren sind oft betroffen, welche Therapie folgt?", "loesung": "Propriozeption + vestibulär + visuell möglich → sensomotorisches Training, Gleichgewicht (Std. 40, Planer Folie 62).", "hilfe": "App: table Folie 36, planner 'Sensomotorisches Training' Folie 62."}, {"titel": "Vergleiche Muskelspindel und Golgi-Sehnenorgan (Funktion/Wirkung) – prüfungsrelevant.", "text": "Vergleiche Muskelspindel und Golgi-Sehnenorgan (Funktion/Wirkung) – prüfungsrelevant.", "loesung": "Spindel: Längenänderung → Dehnungsreflex (Kernketten statisch, Kernsack dynamisch); Golgi: Spannung → hemmt bei Überlastung (Schutz) (App-exam 5 P).", "hilfe": "App: exam bewegungslehre1 (5 P) + cards 'Kernsack- vs. Kernkettenfasern'/'Golgi-Sehnenorgan'/'Gamma-System'."}, {"titel": "Prüfungsnahe Aufgabe (8 P)", "text": "Beschreibe die vier Phasen des motorischen Lernens und nenne je ein methodisches Kennzeichen.", "loesung": "Vorbereitungsphase: Lernvoraussetzungen (Kondition, Koordination, Bewegungserfahrung, Motivation)\nAneignungsphase: Bewegungsvorstellung durch Vormachen und kurze Erklärung; Grobkoordination; nur grobe Hauptfehler korrigieren\nVervollkommnungsphase: wiederholendes Üben unter Standardbedingungen; Rückschläge/Plateau; verstärkte Arbeit mit Sprache\nStabilisations-/Automatisierungsphase: variable Verfügbarkeit, ganzheitliches Üben, komplexe Situationen, Aufmerksamkeit weglenken", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit Tabelle Folie 36 und den App-sorts; stärkere diskutieren das Gamma-System (Vorspannung der Spindel) und warum nach Immobilisation die propriozeptive Rückmeldung schlechter wird (Rezeptoren brauchen Bewegung).", "app_uebung": "App: diagrams Folien 33/37 + hotspots/labels, table Folie 36, sequences 'Ablauf sensomotorisch'/'Ist-Sollwert', sorts 'Informationsquellen', cards, exam (5 P)."}, "sicherung": {"titel": "Sensoren-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die beiden wichtigsten propriozeptiven Sensoren mit je einer Funktion und erkläre den Ist-Sollwert-Vergleich in einem Satz.", "aufgaben": [{"frage": "Zwei Sensoren?", "loesung": "Muskelspindel (Länge → Dehnungsreflex), Golgi-Sehnenorgan (Spannung → Schutzhemmung)."}, {"frage": "Ist-Sollwert?", "loesung": "Gemeldeter Istzustand wird mit gewünschtem Soll verglichen – Differenz steuert die Korrektur (Folie 33)."}, {"frage": "Warum gilt die Reaktionsfähigkeit als Sonderfall unter den koordinativen Fähigkeiten?  [App-Quiz: Bewegungslehre I]", "loesung": "Sie ist zugleich Teilkomponente der konditionellen Eigenschaft Schnelligkeit – Die Reaktionsfähigkeit ist einerseits koordinative Fähigkeit, andererseits Teilkomponente der Schnelligkeit."}]}, "hausaufgabe": "Diagramme Folien 33/37 ins Heft; Tabelle 'Analysatoren' (Folie 36) lernen; App-sequences 'Ist-Sollwert'/'Ablauf' ordnen; exam-Aufgabe 'Muskelspindel vs. Golgi' (5 P) üben; Hotspots Folien 33/37 durcharbeiten.", "hinweise": ["Fehler: Muskelspindel und Golgi vertauscht – Spindel = Länge, Golgi = Spannung (App-exam 5 P).", "Afferent/efferent vertauscht – afferent = zum ZNS (Sensorik), efferent = weg (Motorik).", "Propriozeption ist nach Gelenk-OP/Neuropathie oft gestört – sensomotorisches Training (Std. 40)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: diagrams/hotspots/labels Folien 33/37, table Folie 36, sequences, sorts, cards, exam (5 P)"]}, "b1-38": {"nr": 38, "id": "b1-38", "thema": "bewegungslehre1", "titel": "Schichten des ZNS und ihre Aufgaben in der Motorik", "dauer": 60, "ziele": ["Die Auszubildenden nennen die Schichten des ZNS und ordnen ihnen ihre Aufgaben in der Motorik zu (Folie 38).", "Sie unterscheiden Rückenmark, Hirnstamm, Kleinhirn, Basalganglien und motorischen Kortex.", "Sie leiten Konsequenzen für die Therapie ab (z. B. Kleinhirn → Koordination)."], "vorwissen": "Stunde 37 (Sensomotorik, Regelkreis), Neuroanatomie-Grundlagen.", "material": ["App, Beamer", "Diagramm 'Schichten des ZNS und ihre Aufgaben in der Motorik' (Folie 38)", "Hirnmodell (optional)"], "physio": "Das Verständnis der ZNS-Ebenen erklärt viele Therapiephänomene: Nach Schlaganfall (Kortex) ist die bewusste Planung gestört, beim Kleinhirn-Infarkt die Feinabstimmung (Ataxie), bei Basalganglien-Erkrankungen (Parkinson) die Bewegungsinitiierung. Daraus leiten wir ab, auf welcher Ebene wir behandeln (z. B. propriozeptive Reize bei Kleinhirnstörungen).", "app": {"einsatz": ["Diagramm 'Schichten des ZNS und ihre Aufgaben in der Motorik' (Folie 38)", "Quiz bewegungslehre1 zu ZNS-Ebenen", "Karteikarte: 'Schichten des ZNS und ihre Aufgaben in der Motorik' (App)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Ebenen-Ruf (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum zittert der Patient so?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vom Reflex zur bewussten Bewegung"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Ebenen zuordnen · Partnerarbeit mit Fallkarten und Diagramm Folie 38"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Ebenen-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Ebenen-Ruf", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu ZNS-Ebenen; bei jeder Ebene ein passendes Patientenbeispiel rufen.", "aufgaben": [{"frage": "Rückenmark?", "antwort": "Reflexe, einfache Bewegungsprogramme (z. B. Dehnungsreflex)."}, {"frage": "Hirnstamm?", "antwort": "Stützmotorik + Orientierung im Raum (App-Quiz); posturale Synergien mit Latenzen > 100–150 ms."}, {"frage": "Kleinhirn?", "antwort": "Feinabstimmung, Koordination, Gleichgewicht (Ataxie bei Störung)."}, {"frage": "Basalganglien?", "antwort": "Bewegungsinitiierung, Automatisierung (Parkinson: Rigor, Tremor, Akinesie)."}, {"frage": "Motorischer Kortex?", "antwort": "Bewusste, zielgerichtete Bewegung (Feinmotorik), Pyramidenbahn."}]}, {"titel": "Ebenen-Pantomime", "art": "Spiel", "min": 5, "anleitung": "Bewegungen pantomimisch einer Ebene zuordnen: Reflex (Rückenmark), Gleichgewicht (Kleinhirn), gezieltes Greifen (Kortex).", "aufgaben": [{"frage": "Reflex = Rückenmark?", "antwort": "Ja – ohne Bewusstsein (Patellareflex)."}, {"frage": "Koordination = Kleinhirn?", "antwort": "Ja – Feinabstimmung."}, {"frage": "Gezieltes Greifen = Kortex?", "antwort": "Ja – bewusste Planung (Pyramidenbahn)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Warum gilt die Reaktionsfähigkeit als Sonderfall unter den koordinativen Fähigkeiten?", "antwort": "Sie ist zugleich Teilkomponente der konditionellen Eigenschaft Schnelligkeit – Die Reaktionsfähigkeit ist einerseits koordinative Fähigkeit, andererseits Teilkomponente der Schnelligkeit."}, {"frage": "Warum sollten Turner Mannschaftsspiele ins Training einbeziehen?", "antwort": "Weil Reaktions- und Umstellungsfähigkeit im Turnen unzureichend geschult werden – Reaktions- und Umstellungsfähigkeit werden in manchen Sportarten wie Turnen nur unzureichend geschult; Mannschaftsspiele ergänzen dies."}, {"frage": "Bei welcher Bewegung wird die Kopplungsfähigkeit besonders deutlich?", "antwort": "Beim Dribbling oder beim Armeinsatz im Hochsprung – Kopplungsfähigkeit koordiniert Teilkörperbewegungen zur Gesamtbewegung; Beispiele sind Dribbling, Skipping, Armeinsatz Hochsprung, Aufschlag."}]}], "einstieg": {"titel": "Warum zittert der Patient so?", "min": 10, "situation": "Fall: Patient mit Kleinhirn-Schädigung (z. B. nach Kleinhirnblutung) – Bewegungen sind unkoordiniert, 'überschießend' (Intentionstremor). Welche Ebene ist betroffen, und was trainieren wir?", "impulse": [{"frage": "Ebene?", "erwartung": "Kleinhirn – Feinabstimmung/Koordination (Folie 38)."}, {"frage": "Training?", "erwartung": "Koordinationstraining mit propriozeptivem Feedback, langsame Bewegungen (Std. 40)."}, {"frage": "Andere Ebenen?", "erwartung": "Basalganglien (Parkinson) → Initiierung gestört; Kortex (Schlaganfall) → Planung gestört."}, {"frage": "App-Bezug?", "erwartung": "App: diagram Folie 38."}], "ueberleitung": "Das ZNS steuert Bewegung auf mehreren Ebenen – von Reflex bis bewusster Planung. Wer die Ebenen kennt, versteht die Symptome. Heute: die Schichten und ihre Aufgaben (Folie 38)."}, "praesentation": {"titel": "Vom Reflex zur bewussten Bewegung", "min": 15, "merksatz": "ZNS-Ebenen (Folie 38): Rückenmark (Reflexe, Rhythmusgeneratoren z. B. Gehen), Hirnstamm (Stützmotorik, Orientierung im Raum, Vitalfunktionen), Kleinhirn (Feinabstimmung, Koordination, Gleichgewicht, motorisches Lernen), Basalganglien (Initiierung, Automatisierung), Großhirn/motorischer Kortex (Ziel- und Erwerbsmotorik, bewusste Feinmotorik). Sensomotorische Regelkreise (SMRK): 4. extrapyramidal (Haltung, Rumpf, proximale Gelenke, automatisiert z. B. Autofahren), 5. pyramidal (neue differenzierte Bewegungen, Greif-/Feinmotorik, distal, bewusst) (App-Quiz). Höhere Ebenen steuern die niedrigeren.", "schritte": [{"ueberschrift": "Die fünf Ebenen im Überblick", "text": "Diagramm Folie 38 projizieren; Ebenen von unten nach oben aufzeichnen mit je einer Aufgabe.", "vortrag": "Bewegung entsteht auf mehreren Ebenen des ZNS: Das Rückenmark organisiert Reflexe und rhythmische Bewegungen (z. B. das Grundmuster des Gehens). Der Hirnstamm regelt Stützmotorik, räumliche Orientierung, Tonus und lebenswichtige Funktionen; posturale Synergien laufen hier ab (Latenzen > 100–150 ms, App-Quiz). Das Kleinhirn sorgt für die Feinabstimmung – Koordination und Gleichgewicht. Die Basalganglien initiieren und automatisieren Bewegungen. Der motorische Kortex schließlich plant und steuert die bewusste, zielgerichtete Bewegung – besonders die Feinmotorik."}, {"ueberschrift": "Symptome bei Schädigung", "text": "Beispiele an die Tafel: Kortex (Schlaganfall) → Hemiparese, gestörte Feinmotorik; Kleinhirn → Ataxie, Intentionstremor; Basalganglien (Parkinson) → Rigor, Tremor, Akinesie, Gangstörung (Festination).", "vortrag": "Jede Ebene hat ein typisches Schädigungsbild: Schädigung des motorischen Kortex (Schlaganfall) führt zu Lähmung und gestörter Feinmotorik. Kleinhirnstörungen zeigen Ataxie und Intentionstremor. Bei Parkinson (Basalganglien) ist die Bewegungsinitiierung gestört – der Patient 'friert' ein (Freezing). In der Therapie richten wir uns nach der betroffenen Ebene: z. B. propriozeptives Feedback bei Kleinhirnstörungen, Rhythmusvorgaben (auditiv) bei Parkinson."}, {"ueberschrift": "Hierarchie der Steuerung", "text": "Höhere Ebenen modulieren niedrigere – z. B. Kortex kann Reflexe hemmen (Babinski-Zeichen bei Pyramidenbahnschaden).", "vortrag": "Die Ebenen arbeiten hierarchisch: Höhere Zentren steuern und hemmen die niedrigeren. Ist die Pyramidenbahn geschädigt, fallen die hemmenden Einflüsse weg – Reflexe werden überschießend (positives Babinski-Zeichen). Dieses Verständnis hilft uns, Befunde einzuordnen und die Therapie auf der richtigen Ebene anzusetzen."}]}, "arbeitsphase": {"titel": "Ebenen zuordnen", "min": 25, "sozialform": "Partnerarbeit mit Fallkarten und Diagramm Folie 38", "aufgaben": [{"titel": "Ordne die Symptome der Ebene zu: (a) Ataxie/Intentionstremor, (b) Hemiparese/Feinmotorik gestört, (c) Rigor/Freezing, (d) überschießende Reflexe.", "text": "Ordne die Symptome der Ebene zu: (a) Ataxie/Intentionstremor, (b) Hemiparese/Feinmotorik gestört, (c) Rigor/Freezing, (d) überschießende Reflexe.", "loesung": "a: Kleinhirn; b: motorischer Kortex/Pyramidenbahn; c: Basalganglien; d: Rückenmark/Pyramidenbahnschaden (Folie 38).", "hilfe": "App: diagram Folie 38, quiz bewegungslehre1."}, {"titel": "Fall: Parkinson-Patient mit Freezing beim Gehen – welche Ebene, welche Therapiehilfe?", "text": "Fall: Parkinson-Patient mit Freezing beim Gehen – welche Ebene, welche Therapiehilfe?", "loesung": "Basalganglien (Initiierung) → externe Rhythmus-/Cueing-Hilfen (visuelle Streifen, akustisches Metronom) (Folie 38 + Therapie).", "hilfe": "App: diagram Folie 38."}, {"titel": "Fall: Patient nach Schlaganfall – welche Ebene primär betroffen, welche Übung?", "text": "Fall: Patient nach Schlaganfall – welche Ebene primär betroffen, welche Übung?", "loesung": "Motorischer Kortex → bewusste, wiederholte Bewegungsplanung, bilaterales Training, CIMT (constraint-induced movement therapy) (Folie 38).", "hilfe": "App: diagram Folie 38."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Erläutere, warum Umlernen in der Therapie schwieriger ist als Neulernen, und nenne vier Maßnahmen des Therapeuten.", "loesung": "In der Therapie meist Um-/Wiedererlernen (Trauma, Schonhaltung, Umprogrammierung)\nEin sehr ähnliches Muster muss anstelle des bestehenden ausgebildet werden\nGefahr: Rückgriff auf Bekanntes (proaktive Interferenz)\nMaßnahmen: verbale Hinweise auf Teilkomponenten; optische Hilfe (Spiegel); taktile Infos (führen, Widerstand)\nUnmittelbare Korrektur (kinästhetisches Gedächtnis nur ca. 15–20 s); Patient Bewegung verbalisieren lassen", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit dem Diagramm Folie 38 als Vorlage; stärkere diskutieren, wie mehrere Ebenen gleichzeitig betroffen sein können (z. B. Schlaganfall + periphere Neuropathie) und welche Ebene Priorität hat.", "app_uebung": "App: diagram Folie 38, quiz bewegungslehre1 (ZNS), cards."}, "sicherung": {"titel": "Ebenen-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne vier ZNS-Ebenen mit je einer motorischen Aufgabe und einem typischen Schädigungssymptom.", "aufgaben": [{"frage": "Vier Ebenen?", "loesung": "z. B. Rückenmark (Reflexe), Kleinhirn (Koordination/Ataxie), Basalganglien (Initiierung/Parkinson), Kortex (bewusste Feinmotorik/Hemiparese)."}, {"frage": "Worin unterscheiden sich Fähigkeiten und Fertigkeiten?  [App-Quiz: Bewegungslehre I]", "loesung": "Fähigkeiten gelten als angeboren, Fertigkeiten sind erlernt – Fähigkeiten gelten als angeboren und sind Voraussetzung, um Fertigkeiten (erlernte Verhaltensanteile wie Gehen oder Aufschlag) zu erwerben."}]}, "hausaufgabe": "Diagramm Folie 38 ins Heft; App-Quiz bewegungslehre1 (ZNS-Ebenen) wiederholen; drei Patientenbeispiele (Schlaganfall, Parkinson, Kleinhirnschaden) der richtigen Ebene zuordnen.", "hinweise": ["Fehler: Kleinhirn und Basalganglien werden vertauscht – Kleinhirn = Koordination, Basalganglien = Initiierung (Folie 38).", "Kortex-Schädigung = kontralaterale Lähmung (Pyramidenbahn kreuzt) – klinischer Bezug.", "Diagramm Folie 38 ist Hotspot-Thema in der App."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: diagram Folie 38, quiz, cards"]}, "b1-39": {"nr": 39, "id": "b1-39", "thema": "bewegungslehre1", "titel": "Motorisches Lernen: Phasen nach Hirtz, Lernkurve, Umlernen in der Therapie", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben die vier Phasen des motorischen Lernens nach Hirtz (1995) mit je einem methodischen Kennzeichen (prüfungsrelevant, 8 P).", "Sie erläutern die Lernverlaufskurve (Folien 75–76).", "Sie erklären, warum Umlernen in der Therapie schwieriger ist als Neulernen, und nennen vier Maßnahmen des Therapeuten (prüfungsrelevant, 6 P)."], "vorwissen": "Stunden 32–38 (alle BL-I-Grundlagen).", "material": ["App, Beamer", "Tabelle 'Phasen des motorischen Lernens (Hirtz 1995)' (Folien 65–67), Diagramme 'Phasencharakter' (Folie 68), 'Lernverlaufskurve' (Folien 75–76) + Hotspot/Labels", "Reihenfolgen: 'Phasen des motorischen Lernens (Hirtz)', 'Phasen des Umlernprozesses'"], "physio": "Motorisches Lernen ist der Kern der Physio: Jede neue Bewegung (z. B. Gehen mit Prothese) durchläuft die Lernphasen – und bei neurologischen Patienten müssen alte, eingefahrene Muster (Spastik, Schonhaltung) erst 'umgelernt' werden. Das Umlernen ist schwieriger, weil alte Engramme stabil sind – deshalb arbeiten wir mit vielen Wiederholungen, variierenden Bedingungen und propriozeptivem Feedback.", "app": {"einsatz": ["Tabelle 'Phasen des motorischen Lernens (Hirtz 1995)' (Folien 65–67), Diagramme 'Phasencharakter' (Folie 68) und 'Lernverlaufskurve' (Folien 75–76) + Hotspot/Labels", "Reihenfolgen: 'Phasen des motorischen Lernens (Hirtz 1995)', 'Phasen des Umlernprozesses'", "Quiz: vier Phasen + methodische Kennzeichen, Lernkurve, Umlernen schwieriger", "Prüfungsaufgaben: vier Phasen + Kennzeichen (8 P), Umlernen + 4 Maßnahmen (6 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Lernphasen-Rap (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der eingefahrene Gang"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vier Phasen des motorischen Lernens (Hirtz 1995)"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Lernphasen im eigenen Üben · Partnerarbeit: eine neue Bewegung (z. B. Einbeinstand mit Drehung) selbst lernen und die Phasen benennen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Lernphasen-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Lernphasen-Rap", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Hirtz-Phasen; sequence 'Phasen des motorischen Lernens' in der App ordnen.", "aufgaben": [{"frage": "Vier Phasen nach Hirtz?", "antwort": "1. Grobkoordination (Verständnis, erste Versuche), 2. Feinkoordination (Verfeinerung), 3. Festigung (Automatisierung), 4. Automatisierung/Variable Verfügbarkeit (App-sequence)."}, {"frage": "Methodisches Kennzeichen Phase 1?", "antwort": "Vormachen, Erklären, viele Wiederholungen mit Hilfen."}, {"frage": "Lernkurve?", "antwort": "Anfang steiler Anstieg, dann Plateau, ggf. Leistungsabfall ('Tal'), dann weiterer Anstieg (Folien 75–76)."}, {"frage": "Umlernen schwieriger?", "antwort": "Alte Muster sind automatisiert/stabil – sie müssen zuerst gehemmt werden (App-exam 6 P)."}]}, {"titel": "Lernkurven-Zeichnen", "art": "Spiel", "min": 5, "anleitung": "Die Gruppe zeichnet die typische Lernkurve aus dem Gedächtnis – Vergleich mit App-Diagramm Folien 75–76 (Hotspot).", "aufgaben": [{"frage": "Plateau/Tal?", "antwort": "Mittleres 'Leistungstal' vor dem Durchbruch – normal, nicht aufgeben (Folie 76)."}, {"frage": "App?", "antwort": "App: labels/hotspots 'Lernverlaufskurve' Folien 75–76."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Worin unterscheiden sich Fähigkeiten und Fertigkeiten?", "antwort": "Fähigkeiten gelten als angeboren, Fertigkeiten sind erlernt – Fähigkeiten gelten als angeboren und sind Voraussetzung, um Fertigkeiten (erlernte Verhaltensanteile wie Gehen oder Aufschlag) zu erwerben."}, {"frage": "Welcher Analysator nimmt nach Neumaier kinästhetische Informationen auf?", "antwort": "Muskelspindeln, Golgi-Sehnenorgane, Gelenkrezeptoren – Kinästhetische Informationen (Dehnung, Muskelspannung) kommen von Muskelspindeln, Golgi-Sehnenorganen und Gelenkrezeptoren."}, {"frage": "Eine Übung verlangt, viele Anforderungen gleichzeitig (simultan) zu bewältigen. Welche Druckbedingung liegt vor?", "antwort": "Organisationsdruck – Organisationsdruck = viele gleichzeitige Anforderungen. Komplexitätsdruck betrifft viele hintereinander geschaltete (sukzessive) Anforderungen."}]}], "einstieg": {"titel": "Der eingefahrene Gang", "min": 10, "situation": "Fall: Patient nach Schlaganfall geht seit Monaten mit gestrecktem Knie und Zirkumduktion (Schonhaltung). Warum ist das 'Umlernen' so schwer – und was würdest du als Therapeut tun?", "impulse": [{"frage": "Altes Muster automatisiert?", "erwartung": "Ja – Jahre lang eingefahren, stabile Engramme (App-exam 6 P)."}, {"frage": "Maßnahmen?", "erwartung": "z. B. altes Muster hemmen (z. B. Kniebeuge-Übung), neues üben mit vielen WH, variierende Bedingungen, Feedback (App-exam)."}, {"frage": "App-Bezug?", "erwartung": "App: sequence 'Phasen des Umlernprozesses', exam (6 P)."}], "ueberleitung": "Jede neue Bewegung durchläuft Lernphasen – und alte Muster müssen umgelernt werden. Das motorische Lernen ist das Herzstück der Therapie. Heute: Phasen nach Hirtz und die Lernkurve."}, "praesentation": {"titel": "Vier Phasen des motorischen Lernens (Hirtz 1995)", "min": 15, "merksatz": "1. Phase (Aneignung): Bewegungsvorstellung entsteht, Grobkoordination wird erlernt, nur grobe Hauptfehler werden korrigiert (App-Quiz). 2. Phase: Feinkoordination – Verfeinerung, Fehler abnehmend. 3. Phase: Festigung – Bewegung stabilisiert sich. 4. Phase: Automatisierung/variable Verfügbarkeit – Bewegung auch unter Druck/Nebenaufgaben sicher. Lernkurve (Folien 75–76): steiler Anfang, Plateau/Leistungstal, weiterer Anstieg. Umlernen: alte automatisierte Muster müssen gehemmt werden – schwieriger als Neulernen; Maßnahmen: gezieltes Üben, Variation, Feedback, Hemmung des alten Musters.", "schritte": [{"ueberschrift": "Die vier Phasen nach Hirtz", "text": "Tabelle Folien 65–67 projizieren; App-sequence 'Phasen des motorischen Lernens (Hirtz)' ordnen; je Phase ein methodisches Kennzeichen an die Tafel.", "vortrag": "Hirtz beschreibt vier Phasen: In der Grobkoordination verstehen wir die Bewegung und probieren – mit vielen Fehlern. In der Feinkoordination verfeinern wir sie. In der Festigungsphase wird sie stabil, in der vierten Phase automatisiert und variable verfügbar – auch unter Stress. Jede Phase hat methodische Kennzeichen: Vormachen und Erklären am Anfang, gezieltes Üben mit Feedback in der Mitte, variable Übungsbedingungen am Ende. Das ist prüfungsrelevant (8 Punkte)."}, {"ueberschrift": "Die Lernverlaufskurve", "text": "Diagramme Folien 75–76 (Hotspot/Labels in der App) zeigen: steiler Anstieg, dann Plateau mit möglichem 'Tal', dann weiterer Anstieg bis zur Automatisierung.", "vortrag": "Lernen verläuft nicht linear: Am Anfang steigen die Leistungen schnell, dann folgt ein Plateau – manchmal sogar ein kurzzeitiger Abfall (das 'Tal'), wenn alte habits aufbrechen. Danach steigt die Kurve weiter bis zur Automatisierung. Wichtig für uns: Im Tal nicht aufgeben, sondern weiter üben – der Durchbruch kommt (Folien 75–76)."}, {"ueberschrift": "Umlernen in der Therapie", "text": "Alte Muster (z. B. Schonhaltung) sind automatisiert → sie müssen gehemmt werden (proaktive Interferenz: Rückfall ins alte Muster, App-Quiz), bevor das Neue gelernt wird; 4 Maßnahmen: gezieltes Üben mit hoher WH-Zahl, Variation der Bedingungen, propriozeptives/externes Feedback, Hemmung des alten Musters (App-exam 6 P).", "vortrag": "Umlernen ist schwieriger als Neulernen, weil alte Bewegungsmuster automatisiert und stabil im Nervensystem verankert sind. Wir müssen das alte Muster zuerst hemmen – zum Beispiel die Zirkumduktion beim Gehen durch gezielte Kniebeugen-Übungen – und dann das neue Muster mit vielen Wiederholungen, variierenden Bedingungen und gutem Feedback einschleifen. Vier Maßnahmen des Therapeuten sind hier prüfungsrelevant (6 Punkte)."}]}, "arbeitsphase": {"titel": "Lernphasen im eigenen Üben", "min": 25, "sozialform": "Partnerarbeit: eine neue Bewegung (z. B. Einbeinstand mit Drehung) selbst lernen und die Phasen benennen", "aufgaben": [{"titel": "Durchlaufe die 4 Hirtz-Phasen an einer selbstgewählten Bewegung – protokolliere: In welcher Phase bist du, welches methodische Kennzeichen hilft?", "text": "Durchlaufe die 4 Hirtz-Phasen an einer selbstgewählten Bewegung – protokolliere: In welcher Phase bist du, welches methodische Kennzeichen hilft?", "loesung": "z. B. Phase 1: Vormachen lassen, grob probieren; Phase 2: gezieltes Üben mit Feedback; Phase 3: WH ohne Denken; Phase 4: mit Doppelaufgabe (App-sequence).", "hilfe": "App: sequence 'Phasen des motorischen Lernens (Hirtz 1995)'."}, {"titel": "Fall: Patient mit Spastik nach Schlaganfall – umlernen des Greifens. Welche 4 Maßnahmen planst du?", "text": "Fall: Patient mit Spastik nach Schlaganfall – umlernen des Greifens. Welche 4 Maßnahmen planst du?", "loesung": "z. B. 1) viele WH mit leichtem Objekt, 2) Variation (verschiedene Positionen), 3) propriozeptives + visuelles Feedback, 4) Hemmung der Spastik (z. B. Armlagerung, langsames Dehnen) (App-exam 6 P).", "hilfe": "App: exam bewegungslehre1 (6 P) 'Umlernen + 4 Maßnahmen'."}, {"titel": "Lies die Lernkurve Folien 75–76: Wo ist das 'Tal', was bedeutet es therapeutisch?", "text": "Lies die Lernkurve Folien 75–76: Wo ist das 'Tal', was bedeutet es therapeutisch?", "loesung": "Mittleres Plateau/Tal nach anfänglichem Anstieg – normal, nicht aufgeben; weiter üben bis Automatisierung (App-labels/hotspots Folien 75–76).", "hilfe": "App: labels 'Lernverlaufskurve (Lernstadien)' Folie 75, hotspots Folien 75–76."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Vergleiche Adams' Closed-loop-Theorie mit Schmidts Schema-Theorie.", "loesung": "Adams: Lernen durch Verfeinerung der Feedback-Kontrolle; Ziel: Reduktion des Bewegungsfehlers\nElemente: Exekutive, Effektor, Feedback, Komparator; Wahrnehmungs- und Gedächtnisspur; KR hat Führungsrolle\nKritik: nur langsame Positionierungsbewegungen, Variabilität unbeachtet, Deafferenzierungsstudien\nSchmidt: Recall Schema (Produktion) und Recognition Schema (Evaluierung)\nAuch für schnelle Bewegungen anwendbar; erklärt positive Wirkung variabler Übung", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen die App-sequence und lesen die Kurve mit Labels; stärkere wenden die Phasen auf ein echtes Patientenbeispiel an (z. B. Aufstehen nach Hüft-OP) und planen die methodischen Kennzeichen je Phase.", "app_uebung": "App: table Folien 65–67, diagrams Folien 68/75–76 + hotspots/labels, sequences 'Phasen (Hirtz)'/'Umlernprozess', quiz, exam (8 P + 6 P)."}, "sicherung": {"titel": "Lernphasen-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die vier Phasen des motorischen Lernens nach Hirtz und erkläre in einem Satz, warum Umlernen schwieriger ist als Neulernen.", "aufgaben": [{"frage": "Vier Phasen?", "loesung": "Grobkoordination → Feinkoordination → Festigung → Automatisierung/variable Verfügbarkeit (Hirtz 1995)."}, {"frage": "Umlernen schwerer?", "loesung": "Alte Muster sind automatisiert/stabil – sie müssen erst gehemmt werden, bevor das Neue gelernt werden kann."}, {"frage": "Ein Spieler muss nach einem intensiven Sprintprogramm noch präzise Pässe spielen. Welche Druckbedingung wird vor allem erhöht?  [App-Quiz: Bewegungslehre I]", "loesung": "Belastungsdruck – Belastungsdruck heißt Bewältigung von Anforderungen unter physisch-konditioneller oder psychischer Beanspruchung, hier nach Vorbelastung."}]}, "hausaufgabe": "Tabelle 'Phasen des motorischen Lernens' (Folien 65–67) lernen; Diagramme Folien 75–76 analysieren (Hotspots); App-sequences 'Phasen (Hirtz)'/'Umlernprozess' ordnen; exam-Aufgaben (8 P + 6 P) üben.", "hinweise": ["Fehler: Phasenreihenfolge vertauscht – App-sequence checken (Hirtz: Grob → Fein → Festigung → Automatisierung).", "Umlernen: 'alte Muster hemmen' nicht vergessen – 4 Maßnahmen (App-exam 6 P).", "Autor Hirtz 1995 (bzw. Hirtz 2000 lt. App-card 'Motorisches Lernen (Hirtz 2000)') prüfungsrelevant."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: table Folien 65–67, diagrams Folien 68/75–76 + hotspots/labels, sequences, quiz, exam (8 P + 6 P)", "Hirtz 1995/2000 (App-Quellen)"]}, "b1-40": {"nr": 40, "id": "b1-40", "thema": "bewegungslehre1", "titel": "Lerntheorien und Korrigieren: Adams (Closed-loop), Schmidt (Schema), Informationsintervalle, sensomotorisches Training", "dauer": 60, "ziele": ["Die Auszubildenden vergleichen Adams' Closed-loop-Theorie mit Schmidts Schema-Theorie (prüfungsrelevant, 6 P).", "Sie nennen die fünf Dimensionen der Fremdinformation beim Korrigieren mit je einem Therapeuten-Tipp (prüfungsrelevant, 5 P).", "Sie planen ein sensomotorisches Training (Planer Folie 62)."], "vorwissen": "Stunden 32–39 (alle BL-I-Themen).", "material": ["App, Beamer", "Diagramme: \"Adams' Closed-loop-Theorie (1971)\" (Folien 78–79) + Hotspot/Labels, 'Informationsintervalle im Anschluss an eine Bewegung' (Folie 102)", "Planer 'Sensomotorisches Training' (Folie 62)", "Drei-Speicher-Modell (Karteikarte)"], "physio": "Wie lernen wir Bewegungen wirklich – über Feedback-Schleifen (Adams) oder über Schemata (Schmidt)? Und wie korrigieren wir als Therapeuten wirksam? Diese Stunde gibt das theoretische Fundament für das Geben von Feedback in der Behandlung (zu viel/weniges/wrong timing schadet) und für das sensomotorische Training nach Gelenk-OP/neurologischen Erkrankungen.", "app": {"einsatz": ["Diagramme + Hotspot/Labels: \"Adams' Closed-loop-Theorie (1971)\" (Folien 78–79), 'Informationsintervalle im Anschluss an eine Bewegung' (Folie 102)", "Planer 'Sensomotorisches Training' (Folie 62)", "Karteikarten: \"Schema-Theorie (Schmidt 1975)\", 'Drei-Speicher-Modell', 'Ist-Sollwert-Vergleich', 'Einsatzbereiche propriozeptiven Trainings'", "Prüfungsaufgaben: Adams vs. Schmidt (6 P), fünf Dimensionen Fremdinformation + Therapeuten-Tipps (5 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Theorien-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Wie korrigiere ich richtig?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Zwei Lerntheorien und wirksames Korrigieren"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Feedback- und Trainingsplanung · Partnerarbeit mit App-Planer und exam-Aufgaben"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Feedback-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Theorien-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Adams/Schmidt/Drei-Speicher-Modell.", "aufgaben": [{"frage": "Adams Closed-loop?", "antwort": "Bewegung wird über Feedback-Schleife korrigiert (perceptual trace + memory trace) – gut für langsame, präzise Bewegungen (App-diagram Folien 78–79)."}, {"frage": "Schmidt Schema-Theorie?", "antwort": "Abstrakte Bewegungsregeln (Schemata) werden gespeichert – auch neue Bewegungen möglich (App-card, Schmidt 1975)."}, {"frage": "Drei-Speicher-Modell?", "antwort": "Sensorischer Speicher, Kurzzeit-/Arbeitsgedächtnis, Langzeitgedächtnis (App-card)."}, {"frage": "Informationsintervalle (Folie 102)?", "antwort": "Zeit zwischen Bewegung und Feedback – zu früh/zu spät wirkt sich unterschiedlich aus (App-diagram Folie 102)."}]}, {"titel": "Feedback-Demo", "art": "Spiel", "min": 5, "anleitung": "Partner führt Bewegung aus – anderer gibt Feedback sofort vs. nach 10 s vs. gar nicht. Vergleich: Was wirkt besser?", "aufgaben": [{"frage": "Sofortiges Feedback?", "antwort": "Gut bei neuen Bewegungen (Closed-loop, Adams) – aber nicht bei jeder WH (sonst abhängig)."}, {"frage": "Verzögertes/seltenes Feedback?", "antwort": "Fördert Eigenwahrnehmung/Schema (Schmidt) – besser für Festigung."}, {"frage": "App?", "antwort": "App: diagram 'Informationsintervalle' Folie 102."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Ein Spieler muss nach einem intensiven Sprintprogramm noch präzise Pässe spielen. Welche Druckbedingung wird vor allem erhöht?", "antwort": "Belastungsdruck – Belastungsdruck heißt Bewältigung von Anforderungen unter physisch-konditioneller oder psychischer Beanspruchung, hier nach Vorbelastung."}, {"frage": "Balancieren mit verbundenen Augen ist nach Harre welche methodische Maßnahme?", "antwort": "Variation der Informationsaufnahme – Balancieren mit Blick nach oben, geneigtem Kopf oder verbundenen Augen ist ein Beispiel für die Variation der Informationsaufnahme."}, {"frage": "Was verbessern gemischte sportliche Zusatzangebote laut Exkurs nachweislich?", "antwort": "Die exekutiven Funktionen – Sie machen nicht intelligent, verbessern aber die exekutiven Funktionen (Arbeitsgedächtnis, Inhibition, kognitive Flexibilität)."}]}], "einstieg": {"titel": "Wie korrigiere ich richtig?", "min": 10, "situation": "Fall: Du korrigierst einen Patienten nach jedem einzelnen Aufstehversuch laut und ausführlich – er macht trotzdem Fehler. Was läuft schief beim Feedback?", "impulse": [{"frage": "Zu viel/zu frühes Feedback?", "erwartung": "Abhängigkeit, keine Eigenwahrnehmung (Folie 102, Informationsintervalle)."}, {"frage": "Besser?", "erwartung": "Feedback dosieren, selbst einschätzen lassen, dann kurzes, präzises Feedback (5 Dimensionen, App-exam 5 P)."}, {"frage": "App-Bezug?", "erwartung": "App: exam bewegungslehre1 'fünf Dimensionen der Fremdinformation'."}], "ueberleitung": "Lerntheorien erklären, wie Feedback wirkt – und wie wir als Therapeuten korrigieren. Heute: Adams vs. Schmidt, Informationsintervalle, Fremdinformation – und das sensomotorische Training."}, "praesentation": {"titel": "Zwei Lerntheorien und wirksames Korrigieren", "min": 15, "merksatz": "Adams (1971, Closed-loop): Bewegung über Feedback-Schleifen (memory trace + perceptual trace) korrigiert – wirksam bei langsamen, präzisen Bewegungen (Folien 78–79). Schmidt (1975, Schema-Theorie): abstrakte Schemata werden gespeichert – erlaubt auch neue/ungeübte Bewegungen. Drei-Speicher-Modell: sensorischer Speicher → Kurzzeitgedächtnis → Langzeitgedächtnis. Fremdinformation (Feedback) hat fünf Dimensionen (z. B. Zeitpunkt/Intervall, Häufigkeit, Präzision, modalität, Richtung) – Therapeuten-Tipps je Dimension. Informationsintervalle (Folie 102): Abstand Bewegung–Feedback. Sensomotorisches Training (Folie 62): propriozeptives Üben nach OP/neurologisch.", "schritte": [{"ueberschrift": "Adams vs. Schmidt", "text": "Diagramme Folien 78–79 (Closed-loop) zeigen; Hotspots/Labels in der App; Vergleich an die Tafel; exam (6 P).", "vortrag": "Adams' Closed-loop-Theorie beschreibt die Bewegung als geschlossene Schleife: Ein Speicherbild (memory trace) wird mit dem wahrgenommenen Ergebnis (perceptual trace) verglichen und korrigiert – das funktioniert besonders bei langsamen, präzisen Bewegungen. Schmidt ergänzt: Wir speichern abstrakte Bewegungsschemata, mit denen wir auch neue, noch nicht geübte Bewegungen ausführen können. Für die Therapie heißt das: Beide Prozesse nutzen – Feedback-Schleifen für Präzision, Schemata für Übertrag auf neue Situationen."}, {"ueberschrift": "Fremdinformation wirksam geben", "text": "Fünf Dimensionen an die Tafel mit Therapeuten-Tipps; App-exam (5 P); Informationsintervalle Folie 102 (Zeitpunkt des Feedbacks).", "vortrag": "Feedback (Fremdinformation) hat fünf Dimensionen – zum Beispiel Intervall (wann?), Häufigkeit (wie oft?), Präzision, Modalität (verbal/visuell/taktil) und Richtung (was genau?). Als Therapeuten geben wir Feedback dosiert: nicht nach jeder Wiederholung, sondern gezielt; wir lassen den Patienten zuerst selbst einschätzen und korrigieren dann kurz und präzise. Das Intervall zwischen Bewegung und Feedback (Folie 102) beeinflusst das Lernen ebenfalls. Diese fünf Dimensionen mit Tipps sind prüfungsrelevant (5 Punkte)."}, {"ueberschrift": "Sensomotorisches Training in der Praxis", "text": "Planer 'Sensomotorisches Training' (Folie 62) ausfüllen; Beispiele: Balance-Übungen nach Kreuzband-OP, propriozeptives Training bei Polyneuropathie (Diabetes).", "vortrag": "Das sensomotorische Training (Folie 62) stärkt die Kopplung von Wahrnehmung und Bewegung – besonders wichtig nach Gelenk-OP (Kreuzband: Rezeptoren geschädigt) und bei neurologischen Erkrankungen. Wir üben auf instabilem Untergrund, mit geschlossenen Augen, mit Zusatzaufgaben – immer mit sicherem Rahmen. Pausen nach Fröböse: lohnende Pause mind. 60 s; statische Übungen 10–15 s; Erwärmung 7–10 min; Regeneration zwischen den Einheiten ca. 48–72 h (App-Quiz). Der App-Planer (Folie 62) hilft, ein solches Programm zu strukturieren."}]}, "arbeitsphase": {"titel": "Feedback- und Trainingsplanung", "min": 25, "sozialform": "Partnerarbeit mit App-Planer und exam-Aufgaben", "aufgaben": [{"titel": "Vergleiche Adams und Schmidt in zwei Sätzen (prüfungsrelevant).", "text": "Vergleiche Adams und Schmidt in zwei Sätzen (prüfungsrelevant).", "loesung": "Adams: Feedback-Schleife korrigiert Bewegung (langsames, präzises Lernen); Schmidt: Schemata erlauben neue Bewegungen/Übertrag (App-exam 6 P).", "hilfe": "App: exam bewegungslehre1 (6 P) + diagrams Folien 78–79."}, {"titel": "Nenne die fünf Dimensionen der Fremdinformation mit je einem Tipp für Therapeuten.", "text": "Nenne die fünf Dimensionen der Fremdinformation mit je einem Tipp für Therapeuten.", "loesung": "z. B. Intervall (nicht nach jeder WH), Häufigkeit (dosiert), Präzision (konkret), Modalität (passend), Richtung (auf das Wesentliche) (App-exam 5 P).", "hilfe": "App: exam bewegungslehre1 (5 P)."}, {"titel": "Plane ein sensomotorisches Training nach Kreuzband-OP (App-Planer Folie 62).", "text": "Plane ein sensomotorisches Training nach Kreuzband-OP (App-Planer Folie 62).", "loesung": "z. B. 3×/Woche: Einbeinstand instabil, Balance-Board, mit/ohne visuelle Kontrolle, Zusatzaufgaben; Progression steigern (App-planner Folie 62).", "hilfe": "App: planner 'Sensomotorisches Training' Folie 62."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Nenne die fünf Dimensionen der Fremdinformation beim Korrigieren und erläutere je einen Tipp für Therapeuten.", "loesung": "Informationsinhalt (Was?): zuerst nur wichtigstes Bewegungskriterium; keine „Nicht-Anweisungen“\nInformationsübermittlung (Wie?): Lob und Korrektur mischen; Schlüsselworte und Bilder\nZeitstruktur (Wann?): Lernenden zuerst selbst beurteilen lassen (>5 s); bis 2 min unkritisch\nInformationsumfang (Wie viel?): höchstens ein bis zwei Detailinformationen\nInformationshäufigkeit (Wie oft?): anfangs häufig (bis 50 %), später reduzieren (Fading)", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lösen die exam-Aufgaben mit den App-Diagrammen (Folien 78–79/102); stärkere geben einem Partner bewusst dosiertes Feedback (Intervall/Häufigkeit üben) und begründen die Wahl nach Adams/Schmidt je Lernphase.", "app_uebung": "App: diagrams Folien 78–79/102 + hotspots/labels, planner Folie 62, cards 'Schema-Theorie'/'Drei-Speicher-Modell', exam (6 P + 5 P)."}, "sicherung": {"titel": "Feedback-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Vergleiche Closed-loop (Adams) und Schema-Theorie (Schmidt) in einem Satz und nenne zwei Dimensionen der Fremdinformation mit Therapeuten-Tipp.", "aufgaben": [{"frage": "Vergleich?", "loesung": "Adams: Korrektur über Feedback-Schleife; Schmidt: abstrakte Schemata für neue Bewegungen."}, {"frage": "Zwei Dimensionen?", "loesung": "z. B. Intervall (Feedback nicht nach jeder WH) + Häufigkeit (dosiert, nicht dauernd)."}, {"frage": "Welche exekutive Funktion beschreibt die Fähigkeit, spontane Impulse zu unterdrücken?  [App-Quiz: Bewegungslehre I]", "loesung": "Inhibition – Inhibition = spontane Impulse unterdrücken und Aufmerksamkeit lenken."}]}, "hausaufgabe": "Diagramme Folien 78–79/102 ins Heft; Planer 'Sensomotorisches Training' (Folie 62) für einen Fall ausfüllen; exam-Aufgaben (6 P Adams/Schmidt, 5 P Fremdinformation) üben; App-Hotspots Folien 78–79 durcharbeiten.", "hinweise": ["Fehler: Adams und Schmidt als Gegensätze gesehen – in der Praxis ergänzen sie sich (je nach Lernphase).", "Feedback-Intervall (Folie 102): zu häufiges Feedback macht abhängig – dosieren (App-exam).", "Autoren prüfungsrelevant: Adams 1971, Schmidt 1975 (App-exam)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: diagrams/hotspots/labels Folien 78–79/102, planner Folie 62, cards, exam (6 P + 5 P)", "Adams 1971; Schmidt 1975 (App-Quellen)"]}, "b2-41": {"nr": 41, "id": "b2-41", "thema": "bewegungslehre2", "titel": "Flexibilität: Definition, aktive vs. passive Beweglichkeit, begrenzende Faktoren", "dauer": 60, "ziele": ["Die Auszubildenden definieren Flexibilität nach Fröböse, Nellessen, Wilke (2003) (prüfungsrelevant).", "Sie unterscheiden aktive und passive Beweglichkeit und die Arten nach Hoster (Folie 10).", "Sie nennen fünf begrenzende Faktoren und ordnen sie mechanischen bzw. weiteren Faktoren zu (prüfungsrelevant, 5 P)."], "vorwissen": "Anatomie (Gelenk, Muskel, Sehne, Faszie), BL I (Bewegungsanalyse).", "material": ["App, Beamer", "Diagramme: 'Arten der Beweglichkeit (Hoster 1987)' (Folie 10) + Labels/Hotspot", "Goniometer für Demo", "Zuordnung 'Begrenzende Faktoren der Flexibilität'"], "physio": "Flexibilität ist in der Physio allgegenwärtig: Bewegungsausmaß (Range of Motion) nach OP, Muskelverkürzungen bei Schonhaltung, Dehnungsbehandlung. Wer die begrenzenden Faktoren kennt (Gelenk, Muskel, Sehne, Faszie, neuronale Faktoren), wählt die richtige Dehnmethode – und weiß, wann Dehnen kontraindiziert ist (z. B. Hypermobilität, akute Entzündung).", "app": {"einsatz": ["Diagramme + Labels/Hotspot: 'Arten der Beweglichkeit (Hoster 1987)' (Folie 10)", "Zuordnen: 'Begrenzende Faktoren der Flexibilität', 'Aktive oder passive Dehnungsarten (Hoster 1987)'", "Quiz bewegungslehre2 (40 Fragen): 'Definition Flexibilität (Fröböse, Nellessen, Wilke 2003)?', 'Aktive vs. passive Flexibilität', 'Fünf begrenzende Faktoren' (exam 5 P)", "Karteikarten: 'Flexibilität – Definition', 'Aktive vs. passive Flexibilität', 'Mechanische Faktoren…', 'Weitere begrenzende Faktoren', 'Woraus ergibt sich der Widerstand gegen eine Dehnung?'", "Prüfungsaufgabe: fünf begrenzende Faktoren, mechanisch/weitere (5 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Flex-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Warum kann der Patient das Knie nicht durchstrecken?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Flexibilität und ihre Grenzen"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Faktoren zuordnen und ROM messen · Partnerarbeit mit App-sorts und Goniometer"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Flex-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Flex-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Definition und begrenzenden Faktoren.", "aufgaben": [{"frage": "Flexibilität-Definition (Fröböse, Nellessen, Wilke 2003)?", "antwort": "Maximale Bewegungsamplitude eines Gelenks/Systems, beeinflusst durch Struktur + neuronale Steuerung (App-Quiz)."}, {"frage": "Aktiv vs. passiv?", "antwort": "Aktiv: durch eigene Muskelkraft; passiv: durch äußere Kraft (App-card)."}, {"frage": "Mechanische begrenzende Faktoren?", "antwort": "z. B. Gelenkform/Kapsel, Muskel, Sehne, Faszie, Haut (App-sorts)."}, {"frage": "Weitere Faktoren?", "antwort": "z. B. neuronale Steuerung (Muskeltonus), Temperatur, Alter, Schmerz (App-card 'Weitere begrenzende Faktoren')."}]}, {"titel": "Dehn-Demo", "art": "Bewegung", "min": 5, "anleitung": "Partner dehnt aktiv vs. passiv (z. B. Wade) – Unterschied spüren und benennen (aktiv = eigene Kraft, passiv = äußere Kraft).", "aufgaben": [{"frage": "Aktiv spürst du?", "antwort": "Die eigene Muskelkraft arbeitet gegen die Dehnung."}, {"frage": "Passiv?", "antwort": "Äußere Kraft (Therapeut) bewegt das Gelenk – oft größeres Ausmaß."}, {"frage": "Physio-Bezug?", "antwort": "Beide messen wir (goniometrisch) – ROM aktiv/passiv dokumentieren."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Wie wird Flexibilität (nach Froböse, Nellessen, Wilke 2003) definiert?", "antwort": "Fähigkeit, Bewegungen mit möglichst großem Bewegungsmaß in einem oder mehreren Gelenken auszuführen – Flexibilität (Beweglichkeit, Gelenkigkeit) bezieht sich auf das Bewegungsmaß (die Amplitude) in den Gelenken."}, {"frage": "Was versteht man unter passiver Flexibilität?", "antwort": "Das Bewegungsausmaß, das mit Hilfe äußerer Kräfte erreicht werden kann – Passive Flexibilität wird durch äußere Kräfte (Partner, Schwerkraft, Gerät) erreicht; die aktive Flexibilität aus eigener Muskelkraft ist im Allgemeinen geringer."}, {"frage": "Wofür steht die Abkürzung „AC“ beim AC-Stretching?", "antwort": "Antagonist-Contract – Beim AC-Stretching wird der Antagonist (Gegenspieler) während der Dehnung isometrisch angespannt."}]}], "einstieg": {"titel": "Warum kann der Patient das Knie nicht durchstrecken?", "min": 10, "situation": "Fall: Nach Knie-OP kann der Patient das Knie weder aktiv noch passiv voll strecken (Extensiondefizit). Welche Strukturen könnten begrenzen – mechanisch oder neuronal?", "impulse": [{"frage": "Mechanisch?", "erwartung": "Gelenkkapsel, Muskel (Hamstrings verkürzt), Sehne, Schwellung (App-sorts)."}, {"frage": "Neuronal?", "erwartung": "Erhöhter Muskeltonus (Schutzspannung), Schmerzhemmung (App-card 'Weitere Faktoren')."}, {"frage": "Therapiekonsequenz?", "erwartung": "Schmerz/Tonus behandeln, dann Dehnen/Mobilisation – Reihenfolge beachten."}, {"frage": "App-Bezug?", "erwartung": "App: sorts 'Begrenzende Faktoren der Flexibilität'."}], "ueberleitung": "Beweglichkeit ist begrenzt – durch mechanische Strukturen und durch die neuronale Steuerung. Heute klären wir: Was ist Flexibilität, und was begrenzt sie?"}, "praesentation": {"titel": "Flexibilität und ihre Grenzen", "min": 15, "merksatz": "Flexibilität (Fröböse, Nellessen, Wilke 2003) = maximale Bewegungsamplitude eines Gelenks, bestimmt durch Strukturen (Gelenk, Muskel, Sehne, Faszie, Haut) und neuronale Faktoren (Tonus, Schmerz, Temperatur, Alter). Aktiv = eigene Muskelkraft; passiv = äußere Kraft. Arten nach Hoster (Folie 10): aktiv-dynamisch, aktiv-statisch, passiv-statisch, passiv-dynamisch. Widerstand gegen Dehnung entsteht v. a. durch Muskel/Faszie (viskoelastisch) und neuronale Reflexe.", "schritte": [{"ueberschrift": "Definition und aktive/passive Flexibilität", "text": "App-card 'Flexibilität – Definition' + Diagramm Folie 10 (Arten nach Hoster) zeigen; aktiv vs. passiv an der Tafel.", "vortrag": "Flexibilität ist die maximale Bewegungsamplitude eines Gelenks – nach Fröböse, Nellessen und Wilke bestimmt durch die Strukturen und die neuronale Steuerung. Wir unterscheiden aktiv (eigene Muskelkraft bewegt das Gelenk) und passiv (äußere Kraft). Hoster (Folie 10) unterscheidet vier Arten: aktiv-dynamisch, aktiv-statisch, passiv-statisch und passiv-dynamisch – je nach Kraftquelle und Halten/Bewegen."}, {"ueberschrift": "Begrenzende Faktoren", "text": "App-sorts 'Begrenzende Faktoren der Flexibilität' lösen; fünf Faktoren an die Tafel: mechanisch (Gelenk/Kapsel, Muskel, Sehne, Faszie, Haut) vs. weitere (Tonus, Schmerz, Temperatur, Alter) (App-exam 5 P).", "vortrag": "Fünf Faktoren begrenzen die Beweglichkeit: mechanisch sind das Gelenk mit Kapsel, der Muskel, die Sehne, die Faszie und die Haut. Weitere Faktoren sind die neuronale Steuerung (Muskeltonus), Schmerz, Temperatur (kalter Muskel ist steifer, Folie 23 Std. 44) und das Alter. Im Examen sollen fünf Faktoren genannt und den mechanischen bzw. weiteren zugeordnet werden (5 Punkte)."}, {"ueberschrift": "Widerstand gegen die Dehnung", "text": "App-card 'Woraus ergibt sich der Widerstand gegen eine Dehnung?' – viskoelastische Eigenschaften von Muskel/Faszie + Dehnungsreflex (Spindel, BL I Std. 37).", "vortrag": "Beim Dehnen spüren wir Widerstand – das kommt vor allem von den viskoelastischen Eigenschaften von Muskel und Faszie (sie geben bei konstanter Dehnung langsam nach) und vom Dehnungsreflex der Muskelspindel. Deshalb wirken Dehnungen besser, wenn wir langsam dehnen und die Muskulatur entspannt ist."}]}, "arbeitsphase": {"titel": "Faktoren zuordnen und ROM messen", "min": 25, "sozialform": "Partnerarbeit mit App-sorts und Goniometer", "aufgaben": [{"titel": "Ordne die begrenzenden Faktoren (App-sorts): Gelenkkapsel, verkürzter Muskel, Faszie, Tonuserhöhung, Schmerz.", "text": "Ordne die begrenzenden Faktoren (App-sorts): Gelenkkapsel, verkürzter Muskel, Faszie, Tonuserhöhung, Schmerz.", "loesung": "Mechanisch: Kapsel, Muskel, Faszie; weitere: Tonus, Schmerz (App-sorts + exam 5 P).", "hilfe": "App: sorts 'Begrenzende Faktoren der Flexibilität'."}, {"titel": "Miss das Knieflexions-Ausmaß aktiv und passiv (Goniometer) – Unterschied begründen.", "text": "Miss das Knieflexions-Ausmaß aktiv und passiv (Goniometer) – Unterschied begründen.", "loesung": "Passiv meist größer (keine antagonistische Muskelaktivität) – aktiv/passiv dokumentieren (App-card 'Aktive vs. passive Flexibilität').", "hilfe": "App: card 'Aktive vs. passive Flexibilität'."}, {"titel": "Fall: Extensiondefizit nach Knie-OP – welche Faktoren prüfst du, in welcher Reihenfolge behandelst du?", "text": "Fall: Extensiondefizit nach Knie-OP – welche Faktoren prüfst du, in welcher Reihenfolge behandelst du?", "loesung": "Zuerst Schmerz/Schwellung/Tonus (neuronal), dann Mobilisation/Dehnen (mechanisch) – App-sorts.", "hilfe": "App: sorts + quiz 'begrenzende Faktoren'."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Nenne fünf Faktoren, die begrenzend auf die Flexibilität wirken, und ordne sie mechanischen bzw. weiteren Faktoren zu.", "loesung": "- Mechanisch: Struktur der Gelenke\n- Mechanisch: Umfang der Muskelmasse\n- Mechanisch: Dehnfähigkeit von Muskeln/Faszien, Sehnen, Bändern, Gelenkkapseln, Haut\n- Mechanisch: postoperative/posttraumatische Zustände\n- Weitere: Psyche (ängstlich → gehemmt), Kälte, Tageszeit, Ermüdungs-/Aufwärmzustand, Schmerz, Alter\n- (je korrekt genanntem und zugeordnetem Faktor 1 Punkt)", "hilfe": "App: Thema 'bewegungslehre2' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit den App-sorts; stärkere messen ein echtes Gelenk (ROM aktiv/passiv) und diskutieren, warum das passive Ausmaß größer ist (antagonistische Hemmung) und was das für die Therapie bedeutet (Dehnen in entspannter Position).", "app_uebung": "App: diagrams Folie 10 + labels/hotspots, sorts 'Begrenzende Faktoren'/'Dehnungsarten', cards, quiz, exam (5 P)."}, "sicherung": {"titel": "Flex-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Definiere Flexibilität, nenne zwei mechanische und zwei weitere begrenzende Faktoren und unterscheide aktiv/passiv.", "aufgaben": [{"frage": "Definition?", "loesung": "Maximale Bewegungsamplitude eines Gelenks (Struktur + neuronale Steuerung) (Fröböse, Nellessen, Wilke 2003)."}, {"frage": "Faktoren?", "loesung": "Mechanisch: z. B. Muskel, Gelenkkapsel; weitere: Tonus, Schmerz, Temperatur, Alter."}, {"frage": "Aktiv/passiv?", "loesung": "Aktiv = eigene Kraft; passiv = äußere Kraft."}, {"frage": "Welche Wirkung ist beim CR-Stretching beabsichtigt?  [App-Quiz: Bewegungslehre II]", "loesung": "Erregung der Sehnenspindeln mit autogener Hemmung des Dehnungsreflexes – Die maximale isometrische Kontraktion des Zielmuskels vor der Dehnung soll über die Sehnenspindeln den Dehnungsreflex hemmen (autogene Hemmung)."}]}, "hausaufgabe": "Diagramm Folie 10 (Hoster-Arten) ins Heft; App-sorts 'Begrenzende Faktoren' fehlerfrei; exam-Aufgabe (5 P) üben; Karteikarten 'Flexibilität'/'Aktive vs. passive'/'Faktoren' lernen; ROM aktiv/passiv an einem Gelenk messen und dokumentieren.", "hinweise": ["Fehler: aktiv und passiv vertauscht – aktiv = eigene Muskelkraft (App-card).", "Mechanisch vs. weitere Faktoren nicht trennen können – App-exam verlangt die Zuordnung (5 P).", "Autoren prüfungsrelevant: Fröböse/Nellessen/Wilke 2003, Hoster 1987 (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre2: diagram Folie 10 + labels/hotspots, sorts, cards, quiz, exam (5 P)", "Fröböse/Nellessen/Wilke 2003; Hoster 1987 (App-Quellen)"]}, "b2-42": {"nr": 42, "id": "b2-42", "thema": "bewegungslehre2", "titel": "Dehnmethoden: die fünf Methoden und PNF (AC-, CR-, CRAC-Stretching)", "dauer": 60, "ziele": ["Die Auszubildenden erläutern die drei PNF-Dehnmethoden (AC-, CR-, CRAC-Stretching) und ihren Wirkmechanismus (prüfungsrelevant, 6 P).", "Sie unterscheiden die fünf Dehnmethoden (Folie 11) und die aktiven/passiven Dehnungsarten nach Hoster.", "Sie erklären den Mechanismus der postisometrischen Relaxation."], "vorwissen": "Stunde 41 (Flexibilität, begrenzende Faktoren), BL I Std. 37 (Muskelspindel/Golgi).", "material": ["App, Beamer", "Diagramm 'Die fünf Dehnmethoden' (Folie 11)", "Zuordnung 'Aktive oder passive Dehnungsarten (Hoster 1987)'", "Theraband, Matte"], "physio": "Die richtige Dehnmethode je nach Ziel und Patient ist Kernkompetenz der Physio: PNF (AC/CR/CRAC) nutzt die postisometrische Relaxation (Golgi-Sehnenorgan hemmt nach isometrischer Anspannung) – besonders wirksam bei Muskelverspannungen und nach Immobilisation. Aktives dynamisches Dehnen eignet sich zum Aufwärmen, passiv-statisches (Stretching) zur Regeneration – Details nächste Stunde.", "app": {"einsatz": ["Diagramm 'Die fünf Dehnmethoden' (Folie 11)", "Zuordnen: 'Aktive oder passive Dehnungsarten (Hoster 1987)'", "Quiz: AC-/CR-/CRAC-Stretching + Wirkmechanismus (exam 6 P), 'Passiv-statisches Dehnen (Stretching) – Varianten'", "Karteikarten: 'Aktive Dehnungsarten (Hoster 1987)', 'Passiv-statisches Dehnen – Varianten', 'AC-Stretching', 'CR-Stretching', 'CRAC-Stretching'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "PNF-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der verspannte Nacken"}, {"phase": "Präsentation", "min": 15, "inhalt": "Fünf Dehnmethoden im Vergleich"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Methoden zuordnen und PNF üben · Partnerarbeit mit App-cards und Demo"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Methoden-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "PNF-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu AC/CR/CRAC; Mechanismus pantomimisch darstellen (anspannen → lösen → dehnen).", "aufgaben": [{"frage": "AC-Stretching (antagonist contraction)?", "antwort": "Antagonist des Zielmuskels wird angespannt → reziproke Hemmung dehnt den Zielmuskel (App-card)."}, {"frage": "CR-Stretching (contract-relax)?", "antwort": "Zielmuskel isometrisch anspannen → lösen → passiv dehnen (postisometrische Relaxation) (App-card)."}, {"frage": "CRAC?", "antwort": "CR + anschließend Antagonist anspannen (AC) – kombiniert (App-card)."}, {"frage": "Wirkmechanismus CR?", "antwort": "Max. isometrische Kontraktion des Zielmuskels hemmt über die Sehnenspindeln (Ib-Fasern → hemmende Interneurone) den Dehnungsreflex – autogene Hemmung (App-Quiz; BL I Std. 37)."}]}, {"titel": "Dehn-Demo", "art": "Bewegung", "min": 5, "anleitung": "Partnerdemo CR-Stretching (Wade): isometrisch gegen Widerstand 5–10 s → lösen → passiv dehnen 20–30 s. Unterschied zum statischen Dehnen spüren.", "aufgaben": [{"frage": "Spürt man die Relaxation?", "antwort": "Ja – nach der Anspannung lässt der Muskel mehr nach (postisometrische Relaxation)."}, {"frage": "App?", "antwort": "App: card 'CR-Stretching', diagram Folie 11."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre II", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre II' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre2).", "aufgaben": [{"frage": "Welche Wirkung ist beim CR-Stretching beabsichtigt?", "antwort": "Erregung der Sehnenspindeln mit autogener Hemmung des Dehnungsreflexes – Die maximale isometrische Kontraktion des Zielmuskels vor der Dehnung soll über die Sehnenspindeln den Dehnungsreflex hemmen (autogene Hemmung)."}, {"frage": "Welche der folgenden Situationen ist eine Kontraindikation für Flexibilitätstraining?", "antwort": "Frisches Hämatom – Kontraindikationen sind knöcherne Blockaden, frische/instabile Frakturen, akute Entzündung, starker akuter Schmerz und frische Hämatome."}, {"frage": "Wie lange hält der durch Kurzzeitdehnen aufgebaute Dehnungsrückstand an?", "antwort": "20–60 Minuten – Der Dehnungsrückstand (Wiemann 2000) hält nur 20–60 Minuten und eignet sich daher zur unmittelbaren Vorbereitung."}]}], "einstieg": {"titel": "Der verspannte Nacken", "min": 10, "situation": "Fall: Patient mit verspanntem oberen Trapezius nach Stress – welche Dehnmethode wählst du (aktiv/passiv, PNF?) und warum?", "impulse": [{"frage": "Methode?", "erwartung": "z. B. CR-Stretching (Zielmuskel anspannen → Relaxation → dehnen) oder AC (Antagonist anspannen) (App-cards)."}, {"frage": "Warum PNF?", "erwartung": "Postisometrische Relaxation nutzt neuronale Hemmung – wirksamer bei Verspannung (App-exam 6 P)."}, {"frage": "Kontraindikation?", "erwartung": "Akute Entzündung, Hypermobilität – dann passiv-statisch oder gar nicht (Std. 43)."}, {"frage": "App-Bezug?", "erwartung": "App: diagram Folie 11, cards 'AC/CR/CRAC'."}], "ueberleitung": "Es gibt nicht 'die eine' Dehnmethode – fünf Methoden mit unterschiedli
