rn: FT (schnell, glykolytisch) vs. ST (langsam, oxidativ) – genetisch verteilt, aber durch Zeitprogramme (Ansteuerungsgeschwindigkeit, Koordination) ist das Schnellkraftniveau verbesserbar.", "schritte": [{"ueberschrift": "Die Kraft-Zeit-Kurve", "text": "Diagramm Folie 24 an die Tafel: x = Zeit, y = Kraft; Startkraft (erste 250 ms) und Explosivkraft (Steigung) markieren; Folien 25–26 (trainiert vs. Anfänger) vergleichen.", "vortrag": "Nach dem Start einer Bewegung steigt die Kraft zunächst steil an – den Kraftwert bei 50 ms definiert die Startkraft, danach (ab 300 ms) die muskuläre Leistungsfähigkeit. Trainierte zeigen einen schnelleren, höheren Anstieg (Folien 25–26) – genau das wollen wir in der Spätphase der Reha erreichen."}, {"ueberschrift": "Muskelfasertypen und Zeitprogramme", "text": "Karteikarten 'FT/ST' und 'Zeitprogramme' in der App; Diskussion: Faserverteilung genetisch – was ist trotzdem trainierbar?", "vortrag": "Die Verteilung schneller (FT) und langsamer (ST) Fasern ist weitgehend genetisch festgelegt. Trotzdem lässt sich das Schnellkraftniveau verbessern – eine ST→FT-Umwandlung ist zwar ausgeschlossen, aber über Hypertrophietraining steigt der Querschnittsanteil der FT-Fasern deutlich (App-Quiz); Zeitprogramme (Ansteuerungsgeschwindigkeit) ergänzen."}, {"ueberschrift": "Schnellkraft in der Therapie", "text": "Beispiele: Sturzprophylaxe (schnelles Abstützen), Return-to-Sport nach Kreuzband-OP (Sprungkraft).", "vortrag": "Schnellkraft ist alltagsrelevant (Sturzprophylaxe im Alter) und sportrelevant (Return to Sport). Aber: Sie wird erst trainiert, wenn die Basis steht – Maximalkraft und Kraftausdauer zuerst (Prinzip der richtigen Belastungsfolge, Trainingslehre Stunde 6)."}]}, "arbeitsphase": {"titel": "Schnellkraft-Fälle", "min": 25, "sozialform": "Partnerarbeit mit App-Fällen und Diagrammen", "aufgaben": [{"titel": "Fall: 12-jähriger will Schnellkraft verbessern – welche Empfehlung (Faigenbaum)? (vgl. Stunde 21)", "text": "Fall: 12-jähriger will Schnellkraft verbessern – welche Empfehlung (Faigenbaum)? (vgl. Stunde 21)", "loesung": "Kindgerechtes, technikorientiertes Training mit Eigenkörpergewicht; keine maximalen Lasten (App-Quiz 'Krafttraining Kindes-/Jugendalter').", "hilfe": "App: quiz kraft, card 'Grundsätze Kinder/Jugend' (Thema BL2 Stunde 49)."}, {"titel": "Fall: Patient nach Schlaganfall, Armschwäche – welche Kraftfähigkeit zuerst?", "text": "Fall: Patient nach Schlaganfall, Armschwäche – welche Kraftfähigkeit zuerst?", "loesung": "Kraftausdauer/neuronale Reaktivierung (frühe Phase), Schnellkraft erst in der Spätphase (Belastungsfolge).", "hilfe": "App: diagram Folien 25–26, Prinzipien aus TL."}, {"titel": "Lies das Diagramm Folie 26: Welche Komponenten der Schnellkraft siehst du?", "text": "Lies das Diagramm Folie 26: Welche Komponenten der Schnellkraft siehst du?", "loesung": "Startkraft (früher Anstieg), Explosivkraft (maximale Steigung), Kraft-Zeit-Verlauf trainiert vs. Anfänger (App-Labels/Hotspots Folien 25–26).", "hilfe": "App: labels/hotspots 'Kraft-Zeit-Kurve: Komponenten der Schnellkraft' Folie 26."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Erläutere den Dehnungs-Verkürzungs-Zyklus am Beispiel eines Sprungs und nenne Belastungsparameter des Reaktivkrafttrainings.", "loesung": "- Ablauf: Standphase, Ausholbewegung, Absprung, Flugphase, Landung\n- Absprung: Bremsstoß (exzentrisch) geht in Beschleunigungsstoß (konzentrisch) über\n- Kräftige Sehnen speichern in der Dehnung Energie und setzen sie danach frei\n- Kurzer DVZ < 170 ms, langer DVZ < 400 ms\n- Training: exzentrisch-konzentrisch, explosiv, meist ohne Zusatzlast, maximal\n- 2–5 WH Drop Jumps, 10–30 WH Hüpfübungen, 5–10 WH Prellsprünge; Pause 5–10 min (WP 6–8 s), 3–5 Sätze", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere beschreiben das Diagramm mit den App-Labels (Folie 26); stärkere diskutieren, warum Zeitprogramme (Koordination) die Faserverteilung 'überstimmen' können und was das für die Therapieplanung bedeutet (Belastungsfolge).", "app_uebung": "App: diagrams/labels/hotspots Folien 24–26, cards 'Schnellkraft'/'Startkraft…'/'Zeitprogramme'/'FT/ST', quiz, sorts 'Testverfahren'."}, "sicherung": {"titel": "Schnellkraft-Definition", "min": 5, "form": "Schriftlich, einzeln", "text": "Definiere Schnellkraft, unterscheide Startkraft und Explosivkraft und nenne ein Alltagsbeispiel.", "aufgaben": [{"frage": "Schnellkraft?", "loesung": "Fähigkeit, in kurzer Zeit möglichst viel Kraft zu entwickeln."}, {"frage": "Start- vs. muskuläre Leistungsfähigkeit?", "loesung": "Startkraft = Kraftwert bei 50 ms; ab 300 ms muskuläre Leistungsfähigkeit (App-Quiz)."}, {"frage": "Alltagsbeispiel?", "loesung": "z. B. schnelles Abstützen beim Stolpern (Sturzprophylaxe)."}, {"frage": "Maximalkrafttraining an drei Tagen pro Woche: Am 1. Tag trainierst du maximal mit 85 kg. Welche Last nimmst du am 3. Tag (medium)?  [App-Quiz: Kraft und Krafttraining]", "loesung": " – Variation der Intensität: Tag 2 leicht (80 % von Tag 1), Tag 3 medium (90 % von Tag 1): 0,90 × 85 kg = 76,5 kg."}]}, "hausaufgabe": "Diagramme Folien 24–26 ins Heft; App-Hotspots 'Schnellkraftkomponenten' (Folien 25–26) durcharbeiten; Karteikarten 'Schnellkraft/Startkraft/Zeitprogramme/FT-ST' lernen; App-Quiz zu Schnellkraft wiederholen.", "hinweise": ["Fehler: Schnellkraft wird vor Maximalkraft trainiert – Verletzungsrisiko (Belastungsfolge beachten, TL Std. 6).", "FT/ST: genetische Basis, aber Zeitprogramme machen den Unterschied – prüfungsrelevant (App-Quiz).", "Schnellkraftindex und 250-ms-Startkraft sind typische App-Quiz-Fragen."], "quellen": ["Examenstrainer.html · DATA kraft: diagrams Folien 24–26 + labels/hotspots, cards 'Schnellkraft'/'Startkraft, Explosivkraft…'/'Zeitprogramme'/'FT/ST', quiz, sorts"]}, "kr-15": {"nr": 15, "id": "kr-15", "thema": "kraft", "titel": "Reaktivkraft und der Dehnungs-Verkürzungs-Zyklus (DVZ)", "dauer": 60, "ziele": ["Die Auszubildenden definieren Reaktivkraft und erläutern den DVZ am Beispiel Sprung (prüfungsrelevant, 6 P).", "Sie nennen Belastungsparameter des Reaktivkrafttrainings.", "Sie begründen, warum kräftige Sehnen die Reaktivkraft begünstigen."], "vorwissen": "Stunden 10–14 (Kraftfähigkeiten, Kontraktionsformen exzentrisch, Schnellkraft).", "material": ["App, Beamer", "Diagramm + Hotspot/Labels 'Dehnungs-Verkürzungs-Zyklus (DVZ) beim Sprung' (Folien 31–32)", "Kasten/Treppenstufe für Demo (gesichert)"], "physio": "Der DVZ ist alltagsrelevant: Jedes Gehen und Laufen nutzt ihn (elastische Energie der Sehnen). In der Therapie trainieren wir Reaktivkraft erst in der Spätphase (nach Maximalkraft/Kraftausdauer) – z. B. vor Return-to-Sport nach Kreuzband-OP (Sprungkraft, Richtungswechsel) oder in der Sturzprophylaxe (schnelles Abstützen).", "app": {"einsatz": ["Diagramm + Hotspot/Labels 'DVZ beim Sprung' (Folien 31–32)", "Quiz: 'Reaktivkraft – Definition', 'Warum begünstigen kräftige Sehnen die Reaktivkraft?', 'Belastungsparameter Reaktivkrafttraining' (exam 6 P)", "Karteikarte: 'Reaktivkraft – Definition'", "Fall k4 (LA_CASES): Hocht springer, Niedersprünge vom Kasten (ikx/plyometrisch)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Sprung-Vergleich (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Vom Kasten springen"}, {"phase": "Präsentation", "min": 15, "inhalt": "Der Dehnungs-Verkürzungs-Zyklus"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Reaktivkraft dosieren · Gruppenarbeit mit App-Fall k4 und Diagramm"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "DVZ-Check · Mündlich, Partnergespräch"}], "warmups": [{"titel": "Sprung-Vergleich", "art": "Bewegung", "min": 5, "anleitung": "Zwei Sprünge: (a) aus dem Stand (konzentrisch), (b) mit kurzem Gegensprung (DVZ) – welcher ist höher? Warum? (Sicherer Kasten, weiche Landung.)", "aufgaben": [{"frage": "Welcher Sprung höher?", "antwort": "Mit Gegensprung (DVZ) – elastische Energie + Dehnungsreflex."}, {"frage": "DVZ-Phasen?", "antwort": "Exzentrisch (Dehnung) → amortisation (kurz) → konzentrisch (Verkürzung)."}, {"frage": "Alltagsbezug?", "antwort": "Gehen/Laufen nutzen den DVZ ständig."}]}, {"titel": "Sehnen-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Reaktivkraft/DVZ.", "aufgaben": [{"frage": "Reaktivkraft-Definition?", "antwort": "Kraftentwicklung im DVZ (exzentrisch→konzentrisch mit kurzer Amortisation)."}, {"frage": "Warum kräftige Sehnen?", "antwort": "Mehr elastische Energie wird gespeichert und wieder abgegeben (Feder-Effekt)."}, {"frage": "Belastungsparameter?", "antwort": "z. B. Bodenkontaktzeit kurz, viele WH, moderate Höhe, ausreichende Pausen."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Maximalkrafttraining an drei Tagen pro Woche: Am 1. Tag trainierst du maximal mit 85 kg. Welche Last nimmst du am 3. Tag (medium)?", "antwort": " – Variation der Intensität: Tag 2 leicht (80 % von Tag 1), Tag 3 medium (90 % von Tag 1): 0,90 × 85 kg = 76,5 kg."}, {"frage": "Du trainierst mit 50 kg und schaffst inzwischen 2 Wiederholungen mehr als geplant. Auf wie viel Kilogramm darfst du die Last höchstens erhöhen?", "antwort": " – Sobald 2 WH mehr als geplant möglich sind, wird die Intensität um 2,5–10 % erhöht. Höchstens: 50 kg + 10 % = 55 kg (mindestens 51,25 kg)."}, {"frage": "Hypertrophietraining: 3 Sätze mit je 10 Wiederholungen und 60 kg. Wie groß ist das Trainingsvolumen (Tonnage)?", "antwort": " – Volumen (Tonnage) = Last · WH · Sätze = 60 kg · 10 · 3 = 1800 kg. Die Wiederholungssumme beträgt 10 · 3 = 30 WH."}]}], "einstieg": {"titel": "Vom Kasten springen", "min": 10, "situation": "Fall (App k4): Ein Hocht springer trainiert die intramuskuläre Koordination mit Niedersprüngen von einem Kasten – was passiert im Muskel?", "impulse": [{"frage": "DVZ?", "erwartung": "Exzentrische Landung (Dehnung) → sofort konzentrisch (Absprung) – Reaktivkraft."}, {"frage": "Warum vom Kasten?", "erwartung": "Höhere Fallenergie = stärkerer Dehnreiz, kürzere Bodenkontaktzeit trainierbar."}, {"frage": "Risiko?", "erwartung": "Zu hohe Fallhöhe → Belastung für Sehnen/Gelenke; stufenweise steigern."}, {"frage": "Therapie?", "erwartung": "Erst in der Spätphase (Belastungsfolge), z. B. Return-to-Sport."}], "ueberleitung": "Der Dehnungs-Verkürzungs-Zyklus ist der 'Turbo' des Muskels – beim Gehen, Laufen, Springen. Heute verstehen wir ihn und lernen, Reaktivkraft dosiert zu trainieren."}, "praesentation": {"titel": "Der Dehnungs-Verkürzungs-Zyklus", "min": 15, "merksatz": "DVZ: exzentrische Dehnung des Muskels → sehr kurze amortisationsphase → konzentrische Verkürzung. Dabei wird elastische Energie in Sehnen/Muskel gespeichert und wieder abgegeben + Dehnungsreflex verstärkt die Kontraktion. Reaktivkraft = Kraft im DVZ. Kräftige Sehnen speichern mehr elastische Energie. Belastungsparameter: niedrige Fallhöhen, kurze Bodenkontaktzeiten, wenige WH, lange Pausen.", "schritte": [{"ueberschrift": "Die drei Phasen des DVZ", "text": "Diagramm Folien 31–32 an die Tafel: exzentrisch (Landung/Dehnung) – Amortisation (Übergang, möglichst kurz) – konzentrisch (Absprung); Hotspot Folien 31–32 in der App.", "vortrag": "Beim Niedersprung vom Kasten wird der Muskel erst gedehnt (exzentrisch) – dabei speichern Sehne und Muskel elastische Energie. Nach einer möglichst kurzen Amortisation schnellt der Muskel konzentrisch zusammen. Diesen Ablauf nennt man Dehnungs-Verkürzungs-Zyklus – er macht den Sprung höher als ein reiner konzentrischer Sprung."}, {"ueberschrift": "Reaktivkraft und ihre Parameter", "text": "Definition Reaktivkraft an die Tafel; Belastungsparameter sammeln (Höhe, WH, Pausen, Bodenkontaktzeit).", "vortrag": "Reaktivkraft ist die Fähigkeit, im DVZ schnell Kraft zu entwickeln. Trainiert wird mit Sprüngen/Niedersprüngen: niedrige Fallhöhen, wenige Wiederholungen, lange Pausen – die Belastung für Sehnen und Gelenke ist hoch. Deshalb steht Reaktivkrafttraining am Ende der Belastungsfolge (erst Maximalkraft/Kraftausdauer)."}, {"ueberschrift": "Warum kräftige Sehnen helfen", "text": "Feder-Modell an die Tafel: steife Sehne = bessere Energieübertragung (App-Quiz).", "vortrag": "Je steifer und kräftiger die Sehne, desto mehr elastische Energie kann sie speichern und im DVZ wieder abgeben – wie eine gespannte Feder. Deshalb begünstigt Sehnenkraft die Reaktivkraft. In der Therapie bauen wir die Sehnenkraft daher früh (exzentrisches Training, Stunde 11) auf."}]}, "arbeitsphase": {"titel": "Reaktivkraft dosieren", "min": 25, "sozialform": "Gruppenarbeit mit App-Fall k4 und Diagramm", "aufgaben": [{"titel": "Fall k4: Niedersprünge vom Kasten – welche Methode, welche Dosierung?", "text": "Fall k4: Niedersprünge vom Kasten – welche Methode, welche Dosierung?", "loesung": "Plyometrisches Reaktivkrafttraining (ikx-Fall in der App): z. B. 3–5 Sätze à 5–8 Sprünge, Kasten 30–60 cm, lange Pausen (2–3 Min), nur bei ausreichender Kraftbasis (App-LA_CASES k4).", "hilfe": "App: LA_CASES k4, planner 'Schnellkrafttraining' Folie 53, diagram Folien 31–32."}, {"titel": "Lies das DVZ-Diagramm (Folien 31–32): Markiere exzentrische, Amortisations- und konzentrische Phase.", "text": "Lies das DVZ-Diagramm (Folien 31–32): Markiere exzentrische, Amortisations- und konzentrische Phase.", "loesung": "App-Labels/Hotspots 'DVZ beim Sprung' Folie 32 – die Phasen anklicken und benennen.", "hilfe": "App: labels/hotspots Folie 32."}, {"titel": "Fall: Patient 12 Wochen nach Kreuzband-OP will wieder Fußball spielen – wann Reaktivkrafttraining?", "text": "Fall: Patient 12 Wochen nach Kreuzband-OP will wieder Fußball spielen – wann Reaktivkrafttraining?", "loesung": "Erst nach Maximalkraft- und Kraftausdauerphase (Belastungsfolge), mit Return-to-Sport-Testing; dann plyometrisch dosiert (App-Fall k4 als Muster).", "hilfe": "TL-Stunde 6 (Belastungsfolge) + App-Fälle."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Nenne die Gefahren beim Krafttraining und erläutere zwei davon genauer.", "loesung": "- Mechanische Überbelastung, Arthrosebildung, Ermüdungsbrüche, Übertraining, Muskelkater, Pressatmung, muskuläre Dysbalancen\n- Z. B. Muskelkater: Mikrotraumen an bindegewebigen Begleitstrukturen und Z-Scheiben, v. a. bei nachgebenden Kontraktionen; Vorstufe von Zerrung/Riss möglich → durchblutungsfördernde Maßnahmen\n- Z. B. Pressatmung: dynamisch beim Anheben aus-, bei Ablage einatmen; isometrisch hechelnd; etwa jeder zweite 50-Jährige ist bei maximaler Belastung vital gefährdet (Arteriosklerose)\n- Z. B. Mechanische Überbelastung: durch einseitige, plötzliche Belastung oder falsche Technik (Kraft · Kraftarm = Last · Lastarm)", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere markieren die DVZ-Phasen mit der App-Vorlage; stärkere diskutieren das Risiko-Nutzen-Verhältnis (Sehnenbelastung vs. elastische Energie) und leiten daraus die stufenweise Steigerung ab.", "app_uebung": "App: diagram/hotspot/labels Folien 31–32, LA_CASES k4, planner Folie 53, card 'Reaktivkraft', exam (6 P)."}, "sicherung": {"titel": "DVZ-Check", "min": 5, "form": "Mündlich, Partnergespräch", "text": "Erkläre deinem Partner den DVZ in drei Sätzen und nenne zwei Belastungsparameter des Reaktivkrafttrainings.", "aufgaben": [{"frage": "Drei Phasen?", "loesung": "Exzentrisch (Dehnung) – Amortisation – konzentrisch (Verkürzung)."}, {"frage": "Zwei Parameter?", "loesung": "z. B. niedrige Fallhöhe, kurze Bodenkontaktzeit, wenige WH, lange Pausen."}, {"frage": "Wann in der Therapie?", "loesung": "Spätphase, nach Maximalkraft/Kraftausdauer (Belastungsfolge)."}, {"frage": "Isometrisches Maximalkrafttraining nach der „Zehner-Regel“: Wie viele Sekunden dauern 4 Wiederholungen?  [App-Quiz: Kraft und Krafttraining]", "loesung": " – Zehner-Regel: 2 s Anspannen, 6 s Halten, 2 s Entspannen = 10 s pro Wiederholung. 4 × 10 s = 40 s."}]}, "hausaufgabe": "Diagramm DVZ (Folien 31–32) ins Heft zeichnen und beschriften; App-Fall k4 (LA_CASES) lösen; exam-Aufgabe 'DVZ + Belastungsparameter' (6 P) üben; Hotspots Folie 32 durcharbeiten.", "hinweise": ["Fehler: Reaktivkrafttraining zu früh in der Reha – Sehnen/Gelenke überlasten (Belastungsfolge!).", "Amortisationsphase möglichst kurz halten – längere Bodenkontaktzeit = weniger Reaktivkraft (Diagramm Folie 32).", "Prüfungsrelevant: DVZ am Beispiel Sprung + Belastungsparameter (App-exam, 6 P)."], "quellen": ["Examenstrainer.html · DATA kraft: diagram/hotspot/labels Folien 31–32, card 'Reaktivkraft', LA_CASES k4, planner Folie 53, exam (6 P)"]}, "kr-16": {"nr": 16, "id": "kr-16", "thema": "kraft", "titel": "Kraftausdauer: Definition, Einteilung und die Last-Wiederholungs-Kurve", "dauer": 60, "ziele": ["Die Auszubildenden definieren Kraftausdauer nach Güthlich & Schmidtbleicher (prüfungsrelevant).", "Sie unterscheiden die Einteilung nach Intensität und nach Energiebereitstellung.", "Sie lesen die Last-Wiederholungs-Kurve (Folien 35, 40) und leiten Trainingsbereiche ab."], "vorwissen": "Stunden 10–15 (Kraftfähigkeiten, Schnellkraft/Reaktivkraft).", "material": ["App, Beamer", "Diagramme: 'Einteilung der Kraftausdauer und Last-WH-Kurve' (Folie 35), 'Last vs. Wiederholungen (Trainingsbereiche)' (Folie 40)", "Tabelle 'Einteilung der Kraftausdauer'"], "physio": "Kraftausdauer ist die wichtigste Kraftfähigkeit in der frühen Rehabilitation: viele Wiederholungen mit moderater Last verbessern die Durchblutung, den Stoffwechsel und die Koordination – ohne Gelenke und Sehnen zu überlasten (z. B. 3×15 Kniebeugen nach Knie-TEP).", "app": {"einsatz": ["Diagramme 'Einteilung der Kraftausdauer + Last-WH-Kurve' (Folie 35) und 'Last vs. Wiederholungen' (Folie 40)", "Quiz: 'Welche Last nennt die Definition der Kraftausdauer nach Güthlich & Schmidtbleicher?', 'Einteilung nach Intensität/Energiebereitstellung'", "Karteikarten: 'Kraftausdauer – Definition', 'Einteilung nach Intensität', 'Einteilung nach Energiebereitstellung'", "Rechenfall: 1RM Rudern 70 kg – Last bei Kraftausdauertraining (App-Quiz)", "Planer 'Kraftausdauertraining' (Folien 57, 89, 91)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "WH-Skala (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Wie oft schaffst du das?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Kraftausdauer systematisch erfassen"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Bereich bestimmen und planen · Einzelarbeit mit App-Diagrammen und Planer"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Bereichs-Check · Mündlich, Blitzlicht"}], "warmups": [{"titel": "WH-Skala", "art": "Schätzen", "min": 5, "anleitung": "Wie viele WH sind mit 50 % 1RM möglich? Schätzen (20? 40?), dann Folie 40 in der App prüfen.", "aufgaben": [{"frage": "50 % 1RM ≈ ? WH", "antwort": "ca. 30–40 WH (Last-WH-Kurve, Folie 40)."}, {"frage": "80 % 1RM ≈ ? WH", "antwort": "ca. 8–10 WH."}, {"frage": "95 % 1RM ≈ ? WH", "antwort": "ca. 2–3 WH."}, {"frage": "Wozu dient die Kurve?", "antwort": "Zuordnung Last ↔ WH für die Trainingsbereiche."}]}, {"titel": "Kreislauf-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Kraftausdauer-Definition und Einteilung.", "aufgaben": [{"frage": "Definition Kraftausdauer (Güthlich & Schmidtbleicher)?", "antwort": "Ermüdungswiderstand bei Lasten ab ca. 30 % 1RM über längere Zeit/viele WH."}, {"frage": "Einteilung nach Intensität?", "antwort": "z. B. niedrige/mittlere/hohe Kraftausdauer (nach % 1RM)."}, {"frage": "Einteilung nach Energiebereitstellung?", "antwort": "aerob vs. anaerob (laktatbildend)."}, {"frage": "Warum frühe Reha = Kraftausdauer?", "antwort": "Gelenkschonend, durchblutungsfördernd, koordinationsfördernd (Stufe 1–2 Fröböse)."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Isometrisches Maximalkrafttraining nach der „Zehner-Regel“: Wie viele Sekunden dauern 4 Wiederholungen?", "antwort": " – Zehner-Regel: 2 s Anspannen, 6 s Halten, 2 s Entspannen = 10 s pro Wiederholung. 4 × 10 s = 40 s."}, {"frage": "Wie wird das Gewicht bezeichnet, das gerade noch einmal konzentrisch bewegt werden kann?", "antwort": "Einer-Wiederholungs-Maximum – Das Gewicht, das gerade noch einmal konzentrisch bewegt werden kann, heißt Einer-Wiederholungs-Maximum (1WHM bzw. 1RM, „one repetition maximum“)."}, {"frage": "Wie wird das Kraftdefizit ermittelt?", "antwort": "Differenz zwischen isometrischer und absoluter Maximalkraft – Das Kraftdefizit ist die Differenz zwischen isometrischer und absoluter Maximalkraft; es beträgt ca. 5–40 %."}]}], "einstieg": {"titel": "Wie oft schaffst du das?", "min": 10, "situation": "Fall: Patientin nach Knie-TEP macht Kniebeugen mit 20 kg – sie schafft 25 WH. In welchem Trainingsbereich liegt sie (Folie 40)?", "impulse": [{"frage": "Bereich?", "erwartung": "Kraftausdauer (niedrige Intensität, hohe WH) – typisch frühe Reha."}, {"frage": "Wie steigern?", "erwartung": "WH-Zahl halten, Last langsam erhöhen (progressive Steigerung) oder WH reduzieren bei höherer Last."}, {"frage": "App-Bezug?", "erwartung": "Diagramm Folie 40 (Last vs. WH) in der App ablesen."}], "ueberleitung": "Wie lange hält ein Muskel eine Belastung durch? – das ist Kraftausdauer. Sie ist in der frühen Therapie die wichtigste Kraftfähigkeit. Heute: Definition, Einteilung und die Kurve, die Last und Wiederholungen verbindet."}, "praesentation": {"titel": "Kraftausdauer systematisch erfassen", "min": 15, "merksatz": "Kraftausdauer (Güthlich & Schmidtbleicher) = Ermüdungswiderstandsfähigkeit des Muskels bei wiederholter/langer Belastung, ab ca. 30 % 1RM. Einteilung nach Intensität (niedrig/mittel/hoch, % 1RM) und nach Energiebereitstellung (aerob/anaerob-laktat). Last-WH-Kurve (Folien 35, 40): je leichter die Last, desto mehr WH möglich (z. B. 50 % ≈ 30–40 WH, 80 % ≈ 8–10 WH, 95 % ≈ 2–3 WH).", "schritte": [{"ueberschrift": "Definition und Einteilung", "text": "Karteikarten in der App aufdecken; Einteilung an die Tafel: nach Intensität (30–50/50–70/70–90 % 1RM) und nach Stoffwechsel (aerob/anaerob).", "vortrag": "Kraftausdauer ist die Fähigkeit, eine Kraftleistung lange oder oft zu wiederholen, ohne dass die Leistung einbricht. Ab etwa 30 Prozent der Maximalkraft sprechen wir von Kraftausdauer. Wir unterscheiden nach Intensität – niedrig, mittel, hoch – und nach der Energiebereitstellung: aerob oder anaerob mit Laktatbildung."}, {"ueberschrift": "Die Last-Wiederholungs-Kurve", "text": "Diagramme Folien 35 und 40 projizieren; drei Punkte eintragen (50 % → 30–40 WH; 80 % → 8–10; 95 % → 2–3) und Kurve verbinden.", "vortrag": "Die Last-WH-Kurve zeigt den Zusammenhang: Je schwerer die Last, desto weniger Wiederholungen sind möglich – 95 Prozent der Maximalkraft schaffen wir nur 2- bis 3-mal, 50 Prozent dagegen 30- bis 40-mal. Daraus lesen wir die Trainingsbereiche ab: niedrige Last/viele WH = Kraftausdauer, mittlere Last = Hypertrophie, hohe Last/wenige WH = Maximalkraft."}, {"ueberschrift": "Kraftausdauer in der Therapie", "text": "Beispiel: 3×15 Kniebeugen mit 20 kg nach Knie-TEP = niedrige Kraftausdauer; Circuittraining = gemischte Belastung.", "vortrag": "In der frühen Reha arbeiten wir fast ausschließlich im Kraftausdauerbereich: moderate Lasten, viele Wiederholungen – das stärkt Muskelstoffwechsel und Durchblutung, ohne Sehnen und Gelenke zu überlasten. Erst später steigern wir in Richtung Hypertrophie und Maximalkraft (Fünf-Stufen-Modell, Stunde 20)."}]}, "arbeitsphase": {"titel": "Bereich bestimmen und planen", "min": 25, "sozialform": "Einzelarbeit mit App-Diagrammen und Planer", "aufgaben": [{"titel": "Fall: 1RM Rudern = 70 kg. Welche Last beim Kraftausdauertraining?", "text": "Fall: 1RM Rudern = 70 kg. Welche Last beim Kraftausdauertraining?", "loesung": "50–60 % 1RM → 35–42 kg, viele WH (App-Quiz).", "hilfe": "App: quiz kraft Rechenfall + Planer 'Kraftausdauertraining' (Folien 57, 89, 91)."}, {"titel": "Ordne zu: 95 % 1RM/2 WH – 75 %/10 WH – 50 %/30 WH – 30 %/50 WH.", "text": "Ordne zu: 95 % 1RM/2 WH – 75 %/10 WH – 50 %/30 WH – 30 %/50 WH.", "loesung": "Maximalkraft – Hypertrophie – Kraftausdauer mittel – Kraftausdauer niedrig (Diagramm Folie 40).", "hilfe": "App: diagram Folie 40 ablesen."}, {"titel": "Plane eine Kraftausdauer-Einheit für die Knie-TEP-Patientin (3 Übungen, je 3×15, 40–50 %).", "text": "Plane eine Kraftausdauer-Einheit für die Knie-TEP-Patientin (3 Übungen, je 3×15, 40–50 %).", "loesung": "z. B. Kniebeugen, Beinpresse, Wadenheben – 3×15 mit 40–50 % 1RM, Pause 60–90 s, 2–3×/Woche (Planer Folien 57/89/91).", "hilfe": "App: planner 'Kraftausdauertraining'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Vergleiche die Empfehlungen für Krafttraining im Kindes- und Jugendalter mit denen für Senioren und begründe deren Nutzen.", "loesung": "- Kinder (Faigenbaum 2010): 2–3x/Woche, 1(–3) Sätze, (6) 10–15 WH, 1–3 min Pause, verschiedenste Übungen; professionelle Betreuung\n- Senioren (ACSM 2009): 2–3x/Woche, 1(–3) Sätze, 50–85 % 1RM, 6–15 WH, 1–3 min Pause, 8–10 Maschinenübungen, später frei\n- Kinder: eingeschränkte Knochen-/Knorpelbelastbarkeit, offene Epiphysenfugen → Dosierung entscheidend; Maximalkraft steigt relativ wie bei Erwachsenen\n- Senioren: Rückgang MK 20–40 %, Schnellkraft ca. 40 %; Training steigert MK, Querschnitt, Schnellkraft, Koordination, Knochendichte", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lesen die Bereiche direkt aus Diagramm Folie 40 ab; stärkere berechnen Prozent-Lasten aus dem 1RM und diskutieren, wann Kraftausdauer in anaerobe Bereiche kippt (Laktat – Thema Ausdauer).", "app_uebung": "App: diagrams Folien 35/40, planner 'Kraftausdauertraining', quiz-Rechenfälle, cards 'Kraftausdauer'."}, "sicherung": {"titel": "Bereichs-Check", "min": 5, "form": "Mündlich, Blitzlicht", "text": "Nenne die Definition der Kraftausdauer und ordne 30 %/10 WH, 60 %/20 WH, 90 %/4 WH den Bereichen zu.", "aufgaben": [{"frage": "Definition?", "loesung": "Ermüdungswiderstand bei ≥ ca. 30 % 1RM über viele WH/lange Dauer (Güthlich & Schmidtbleicher)."}, {"frage": "Zuordnung?", "loesung": "30 %/viele WH = Kraftausdauer niedrig; 60 %/20 WH = Kraftausdauer mittel; 90 %/4 WH = Maximalkraft-nah."}, {"frage": "Wie groß ist das Kraftdefizit ungefähr?  [App-Quiz: Kraft und Krafttraining]", "loesung": "ca. 5–40 % – Das Kraftdefizit beträgt ca. 5–40 %."}]}, "hausaufgabe": "Diagramme Folien 35/40 ins Heft; Planer 'Kraftausdauertraining' für einen Fall ausfüllen; App-Quiz-Rechenfälle (1RM 70 kg etc.) lösen; Karteikarten 'Kraftausdauer' lernen.", "hinweise": ["Fehler: Kraftausdauer wird mit Ausdauer verwechselt – Kraftausdauer = Muskel-Ermüdungswiderstand bei Kraftarbeit (≥30 % 1RM), Ausdauer = Herz-Kreislauf (Thema Ausdauer).", "Last-WH-Kurve (Folie 40) ist die Brücke zwischen Kraft- und Ausdauerthema – prüfungsrelevant.", "Güthlich & Schmidtbleicher als Autoren der Kraftausdauer-Definition merken (App-exam)."], "quellen": ["Examenstrainer.html · DATA kraft: diagrams Folien 35/40, planner Folien 57/89/91, cards 'Kraftausdauer', quiz-Rechenfälle"]}, "kr-17": {"nr": 17, "id": "kr-17", "thema": "kraft", "titel": "Hypertrophie vs. Hyperplasie und die Zeitspanne der Trainingswirkungen (Radlinger)", "dauer": 60, "ziele": ["Die Auszubildenden unterscheiden Hypertrophie und Hyperplasie.", "Sie nennen die Zeitspanne für Trainingswirkungen im Krafttraining nach Radlinger et al. (1997).", "Sie begründen, warum Knorpel/Sehnen besonders lange Anpassungszeiten brauchen – Konsequenzen für die Reha."], "vorwissen": "Stunde 12 (IK, Kraftdefizit), Stunde 16 (Kraftausdauer).", "material": ["App, Beamer", "Tabelle/Diagramm 'Zeitspanne für Trainingswirkungen' (Folie 43)", "Tabelle 'Regenerationszeit' (Folie 59) + sequence 'Regeneration von kurz nach lang'"], "physio": "Die Zeitspanne der Trainingswirkungen erklärt den Reha-Verlauf: Neuronale Anpassungen kommen in Tagen (schneller Kraftzuwachs), muskuläre Hypertrophie braucht Wochen, Sehnen und Knorpel Monate. Deshalb planen wir nach einer Gelenk-OP lange Aufbauphasen für die passiven Strukturen – und warnen vor zu schneller Steigerung.", "app": {"einsatz": ["Tabelle + Diagramm 'Zeitspanne für Trainingswirkungen und Intensitätsstufen' (Folie 43, Radlinger et al. 1997)", "Diagramm 'Regenerationszeit' (Folie 59) + sequence 'Regeneration nach Belastungsende (Weineck) – von kurz nach lang'", "Karteikarten: 'Hypertrophie vs. Hyperplasie', 'Zeitspanne für Trainingswirkungen (Radlinger et al., 1997)', 'Regenerationszeit verschiedener Systeme', 'Muskelkater – Ursache'", "Quiz: 'Welcher Regenerationsvorgang dauert nach Belastungsende am längsten?', 'Was ist die Ursache des Muskelkaters?', 'Warum brauchen Anpassungen des Knorpels besonders lange?'", "Zuordnen: 'Immobilisationsschäden'"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Zeit-Reihenfolge (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der ungeduldige Patient"}, {"phase": "Präsentation", "min": 15, "inhalt": "Vom Nerv bis zum Knorpel – die Zeitspanne der Anpassung"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Reha-Verlauf planen · Partnerarbeit an Fallkarten"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Zeitmodell-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Zeit-Reihenfolge", "art": "Rätsel", "min": 5, "anleitung": "Ordne nach Dauer der Anpassung: Nerven (Tage), Muskel (Wochen), Sehne/Knorpel (Monate) – App-sequence 'Regeneration von kurz nach lang' bzw. Radlinger-Tabelle.", "aufgaben": [{"frage": "Schnellste Anpassung?", "antwort": "Neuronale Systeme (Tage) – Kraftdefizit-Abbau (Std. 12)."}, {"frage": "Mittlere?", "antwort": "Muskelhypertrophie (Wochen)."}, {"frage": "Langsamste?", "antwort": "Sehnen, Knorpel, Knochen (Monate) – Radlinger Folie 43."}]}, {"titel": "Regeneration-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Regenerationszeiten und Muskelkater.", "aufgaben": [{"frage": "Längster Regenerationsvorgang nach Belastung (Weineck)?", "antwort": "Beschädigte Zellorganellen (Mitochondrien) – bis zu 8 Tage (App-Quiz); App-sequence Folie 59 von kurz nach lang ordnen."}, {"frage": "Ursache Muskelkater?", "antwort": "Mikroverletzungen der Muskelfasern (Sarkomere), nicht Laktat! (App-Quiz)."}, {"frage": "Warum Knorpel so langsam?", "antwort": "Schlechte Durchblutung (bradytrophes Gewebe) – Diffusionsernährung (App-Quiz)."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Wie groß ist das Kraftdefizit ungefähr?", "antwort": "ca. 5–40 % – Das Kraftdefizit beträgt ca. 5–40 %."}, {"frage": "Welche Kontraktionsform ist nachgebend, wobei die Muskellänge zunimmt?", "antwort": "Exzentrisch – Exzentrisch = dynamisch, nachgebend, Muskellänge zunehmend, Ansatz und Ursprung entfernen sich (z. B. vom Stütz auf den Boden)."}, {"frage": "Welche drei Mechanismen bilden die intramuskuläre Koordination?", "antwort": "Rekrutierung, Frequenzierung, Synchronisation – Intramuskuläre Koordination umfasst Rekrutierung (Anzahl motorischer Einheiten), Frequenzierung (Impulsfrequenz) und Synchronisation (gleichzeitige Aktivierung)."}]}], "einstieg": {"titel": "Der ungeduldige Patient", "min": 10, "situation": "Fall: 4 Wochen nach Knie-OP fordert der Patient 'richtiges' Krafttraining – sein Muskel ist noch dünn, aber die Kraft steigt schon. Was erklärst du ihm?", "impulse": [{"frage": "Warum steigt die Kraft schon?", "erwartung": "Neuronale Anpassung zuerst (Tage), Hypertrophie erst nach Wochen (Radlinger, Folie 43)."}, {"frage": "Warum nicht sofort schwer?", "erwartung": "Sehnen/Knorpel brauchen Monate – Überlastung riskiert Rückschlag."}, {"frage": "Was ist das Ziel der aktuellen Phase?", "erwartung": "Kraftausdauer/Stufe 1–2 (Fröböse) – strukturschonend."}, {"frage": "App-Bezug?", "erwartung": "App: table Folie 43, sorts 'Immobilisationsschäden'."}], "ueberleitung": "Verschiedene Strukturen passen sich unterschiedlich schnell an – das Zeitmodell von Radlinger et al. erklärt den Reha-Verlauf und schützt vor Überlastung."}, "praesentation": {"titel": "Vom Nerv bis zum Knorpel – die Zeitspanne der Anpassung", "min": 15, "merksatz": "Radlinger et al. (1997, Folie 43): neuronale Anpassungen in Tagen, muskuläre Hypertrophie in Wochen, Sehnen/Knorpel/Knochen in Monaten. Hypertrophie = Querschnittszunahme der Muskelfaser; Hyperplasie = Zunahme der Faserzahl (beim Menschen kaum nachweisbar). Regeneration (Weineck, Folie 59): verschiedene Systeme erholen sich unterschiedlich schnell – das längste bestimmt die Pausenplanung. Muskelkater = Mikroverletzungen (Sarkomer), nicht Laktat.", "schritte": [{"ueberschrift": "Hypertrophie vs. Hyperplasie", "text": "Karteikarte in der App; Definitionen an die Tafel.", "vortrag": "Hypertrophie ist die Vergrößerung des Muskelquerschnitts durch Dickenwachstum der einzelnen Fasern – das ist der wichtigste Mechanismus beim Krafttraining. Hyperplasie, die Zunahme der Faserzahl, spielt beim Menschen praktisch keine Rolle. Merken: Muskelwachstum = Hypertrophie."}, {"ueberschrift": "Zeitspanne der Trainingswirkungen", "text": "Tabelle/Diagramm Folie 43 projizieren: Nerven (Tage) → Muskel (Wochen) → Sehne/Knorpel/Knochen (Monate); Intensitätsstufen daneben.", "vortrag": "Radlinger et al. zeigen: Die schnellste Anpassung ist neuronal – in Tagen steigt die Kraft, ohne dass der Muskel wächst (Kraftdefizit, Std. 12). Nach Wochen folgt die Hypertrophie. Sehnen, Knorpel und Knochen brauchen Monate, weil sie schlecht durchblutet sind. Deshalb steigern wir in der Reha die Belastung nur so schnell, wie die langsamsten Strukturen mitkommen."}, {"ueberschrift": "Regeneration und Muskelkater", "text": "Diagramm Folie 59 + App-sequence 'Regeneration von kurz nach lang'; Muskelkater-Quiz.", "vortrag": "Nach einer Belastung regenerieren sich die Systeme unterschiedlich schnell – Glykogenspeicher, Nerven, Muskeln, Sehnen. Das langsamste System bestimmt die nötige Pause (Prinzip der optimalen Relation, TL). Und: Muskelkater entsteht durch Mikroverletzungen der Muskelfasern, nicht durch Laktat – ein klassischer Fehlglaube."}]}, "arbeitsphase": {"titel": "Reha-Verlauf planen", "min": 25, "sozialform": "Partnerarbeit an Fallkarten", "aufgaben": [{"titel": "Fall: 2 Wochen immobilisiertes Bein – mit welcher Therapiedauer ist laut Faustregel zu rechnen?", "text": "Fall: 2 Wochen immobilisiertes Bein – mit welcher Therapiedauer ist laut Faustregel zu rechnen?", "loesung": "Faustregel Verhältnis 1:4 (1 Woche Immobilisation ≈ 4 Wochen Therapie) → 2 Wochen ≈ 8 Wochen (App-Quiz).", "hilfe": "App: quiz kraft '2 Wochen immobilisiert – Therapiedauer Faustregel'."}, {"titel": "Ordne die Immobilisationsschäden zu (App-sorts): Muskelatrophie, Gelenkkontraktur, Knochendichteminderung, Thromboserisiko.", "text": "Ordne die Immobilisationsschäden zu (App-sorts): Muskelatrophie, Gelenkkontraktur, Knochendichteminderung, Thromboserisiko.", "loesung": "App: sorts 'Immobilisationsschäden' (Thema kraft).", "hilfe": "App-sorts direkt lösen."}, {"titel": "Fall: Patient will nach 3 Wochen Knie-OP Sehnen schon 'hart' trainieren – was sagst du (Folie 43)?", "text": "Fall: Patient will nach 3 Wochen Knie-OP Sehnen schon 'hart' trainieren – was sagst du (Folie 43)?", "loesung": "Sehne braucht Monate; jetzt Kraftausdauer/Stufe 1–2, Sehnenbelastung erst später steigern – sonst Tendinopathie/Reruptur.", "hilfe": "App: table Folie 43 + sorts 'Immobilisationsschäden'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Nenne die drei Kraftfähigkeiten und definiere sie jeweils.", "loesung": "- Maximalkraft: höchstmögliche Kraft bei willkürlicher Muskelaktion (Schnabel et al., 2008)\n- Schnellkraft/Reaktivkraft: Muskelkraft schnell mobilisieren und Kraftmaximum in optimal kurzer Zeit erreichen\n- Reaktivkraft: aus abbremsender Bewegung in kürzester Zeit möglichst hohen Kraftstoß realisieren (DVZ)\n- Kraftausdauer: möglichst hohe Impulssumme in gegebener Zeit (< 2 min) gegen höhere Lasten (> 30 % der Maximalkraft)", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere ordnen mit der Radlinger-Tabelle (Folie 43) als Hilfe; stärkere begründen die Faustregel (Verhältnis 1:4) und diskutieren, warum Knorpel (bradytroph) das Tempo bestimmt.", "app_uebung": "App: table/diagram Folie 43, diagram Folie 59 + sequence, sorts 'Immobilisationsschäden', cards 'Hypertrophie'/'Zeitspanne'/'Muskelkater', quiz."}, "sicherung": {"titel": "Zeitmodell-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die drei Anpassungsebenen mit ihrer ungefähren Zeitspanne (Radlinger) und erkläre in einem Satz, warum das die Reha-Planung bestimmt.", "aufgaben": [{"frage": "Drei Ebenen?", "loesung": "Nervös: Tage; muskulär (Hypertrophie): Wochen; Sehne/Knorpel/Knochen: Monate."}, {"frage": "Reha-Konsequenz?", "loesung": "Belastung so steigern, dass die langsamste Struktur (Knorpel/Sehne) mitkommt – sonst Überlastung/Reruptur."}, {"frage": "Wie ist die Startkraft definiert?  [App-Quiz: Kraft und Krafttraining]", "loesung": "Kraftwert, der 50 ms nach Kontraktionsbeginn erreicht wird – Startkraft = Kraftwert 50 ms nach Kontraktionsbeginn; ab 300 ms ist die muskuläre Leistungsfähigkeit bestimmend."}]}, "hausaufgabe": "Tabelle Folie 43 (Radlinger) als Merkblatt ins Heft; App-sorts 'Immobilisationsschäden' und sequence 'Regeneration' lösen; Faustregel 'Verhältnis 1:4' merken (1 Woche Immobilisation ≈ 4 Wochen Therapie); Karteikarten 'Hypertrophie/Hyperplasie' lernen.", "hinweise": ["Fehler: Muskelkater = Laktat – falsch; Mikroverletzungen der Sarkomere (App-Quiz).", "Knorpel ist bradytroph (schlecht durchblutet) – daher Monate Anpassungszeit; prüfungsrelevant (App-Quiz).", "Faustregel Verhältnis 1:4 für die Therapiedauer (1 Woche Immobilisation ≈ 4 Wochen Therapie) – typische App-Quiz-Frage."], "quellen": ["Examenstrainer.html · DATA kraft: table/diagram Folie 43 (Radlinger 1997), diagram Folie 59 + sequence, sorts 'Immobilisationsschäden', cards, quiz"]}, "kr-18": {"nr": 18, "id": "kr-18", "thema": "kraft", "titel": "Krafttrainingsmethoden I: konzentrisches IK-Training, Hypertrophietraining, isometrisches Training", "dauer": 60, "ziele": ["Die Auszubildenden vergleichen konzentrisches IK-Training und Hypertrophietraining anhand der Belastungskomponenten (prüfungsrelevant, 6 P).", "Sie nennen die 'Zehner-Regel' beim isometrischen Training.", "Sie berechnen Trainingslasten aus Prozent des 1RM (ansteigende Varianten)."], "vorwissen": "Stunden 10–17 (Kraftfähigkeiten, IK, 1RM, Kraftausdauer, Zeitspanne).", "material": ["App, Beamer", "Tabelle/Diagramm 'Belastungskomponenten: IK-, Hypertrophie- und isometrisches Training' (Folie 46)", "Tabelle 'Intensität: nominale Stufen' (Folie 45)", "Rechenbeispiele"], "physio": "Die drei Methoden decken die Hauptziele der MTT ab: isometrisch und niedrigdosiertes Training in der frühen Post-OP-Phase (gelenkschonend), Hypertrophietraining zum Muskelaufbau (z. B. nach Atrophie), IK-Training erst in der späten Phase/Return-to-Sport. Die Prozentdosierung erlaubt eine individuelle, kontrollierte Steuerung.", "app": {"einsatz": ["Tabelle 'Belastungskomponenten: IK-, Hypertrophie- und isometrisches Training' (Folie 46)", "Planer: 'Konzentrisches IK-Training' (Folie 46), 'Hypertrophietraining' (Folien 48, 89, 91)", "Quiz-Rechenfälle: IK ansteigend (85–90–95–100 % von 120 kg), Hypertrophie ansteigend (60–70–80–90 % von 90 kg), isometrische 'Zehner-Regel' (4 WH = 40 s)", "Prüfungsaufgabe: IK vs. Hypertrophie vergleichen (6 P)", "Tabelle 'Intensität: nominale Stufen' (Folie 45)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Prozent-Rechnen (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Drei Ziele, drei Methoden"}, {"phase": "Präsentation", "min": 15, "inhalt": "Belastungskomponenten der drei Methoden"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Dosierungen berechnen · Einzelarbeit, Partner-Kontrolle"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Methoden-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Prozent-Rechnen", "art": "Kopfrechnen", "min": 5, "anleitung": "Schnelles Kopfrechnen: 85 % von 120 kg? 60 % von 90 kg? – als Blitzrunde im Plenum.", "aufgaben": [{"frage": "85 % von 120 kg?", "antwort": "102 kg."}, {"frage": "60 % von 90 kg?", "antwort": "54 kg."}, {"frage": "Zehner-Regel: 4 WH isometrisch = ? s", "antwort": "4 × 10 s = 40 s (App-Quiz)."}, {"frage": "Wozu Prozentdosierung?", "antwort": "Individuelle, kontrollierte Belastungssteuerung (60 % in früher Reha, 85–100 % erst spät)."}]}, {"titel": "Methoden-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu IK/Hypertrophie/isometrisch/Zehner-Regel.", "aufgaben": [{"frage": "IK-Training: Intensität?", "antwort": "85–100 % 1RM, wenige WH (1–5), 3–5 Sätze, lange Pausen."}, {"frage": "Hypertrophie: Intensität?", "antwort": "ca. 60–85 % 1RM, 8–12 WH, 3–5 Sätze, Pausen 2–3 Min."}, {"frage": "Isometrisch: Zehner-Regel?", "antwort": "10 s Anspannung pro WH (App-Quiz)."}, {"frage": "Anwendung frühe Reha?", "antwort": "Isometrisch + niedrige dynamische Lasten (gelenkschonend)."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Wie ist die Startkraft definiert?", "antwort": "Kraftwert, der 50 ms nach Kontraktionsbeginn erreicht wird – Startkraft = Kraftwert 50 ms nach Kontraktionsbeginn; ab 300 ms ist die muskuläre Leistungsfähigkeit bestimmend."}, {"frage": "Welche Last nennt die Definition der Kraftausdauer nach Güllich & Schmidtbleicher?", "antwort": "Höhere Lasten über 30 % der Maximalkraft – Kraftausdauer = möglichst hohe Impulssumme in gegebener Zeit (< 2 min) gegen höhere Lasten (> 30 % der Maximalkraft)."}, {"frage": "Was versteht man unter Hypertrophie?", "antwort": "Dickenzunahme durch Vermehrung der Muskelfibrillen bei konstanter Faseranzahl – Hypertrophie = Vermehrung der Muskelfibrillen bei gleicher Faseranzahl; Hyperplasie = Vermehrung der Muskelfasern."}]}], "einstieg": {"titel": "Drei Ziele, drei Methoden", "min": 10, "situation": "Drei Patientenfälle: (a) 2 Tage nach Knie-OP, (b) 8 Wochen nach Immobilisation mit Muskelatrophie, (c) Sportler in der Wettkampfvorbereitung. Welche Methode jeweils – und warum?", "impulse": [{"frage": "Fall a?", "erwartung": "Isometrisch (gelenkschonend, schmerzarm) – Zehner-Regel."}, {"frage": "Fall b?", "erwartung": "Hypertrophietraining (Muskelquerschnitt aufbauen), preceded by Kraftausdauer."}, {"frage": "Fall c?", "erwartung": "Konzentrisches IK-Training (85–100 %)."}, {"frage": "Gemeinsamkeit?", "erwartung": "Alle dosieren über % 1RM (Tabelle Folie 45/46)."}], "ueberleitung": "IK, Hypertrophie und isometrisches Training sind die drei zentralen Kraftmethoden – heute vergleichen wir ihre Belastungskomponenten und rechnen die Dosierung."}, "praesentation": {"titel": "Belastungskomponenten der drei Methoden", "min": 15, "merksatz": "Tabelle Folie 46: IK = 85–100 % 1RM, 1–5 WH, 3–5 Sätze, Pause 3–5 min (vollständige Resynthese). Hypertrophie = ca. 60–85 % 1RM, 8–12 WH, 3–5 Sätze, Pause 2–3 min. Isometrisch = maximale/submaximale Anspannung, Zehner-Regel (10 s pro WH), Pause ausreichend. Nominale Stufen (Folie 45) erleichtern die Dosierung. Ansteigende Varianten: z. B. IK 85–90–95–100 % über die Sätze.", "schritte": [{"ueberschrift": "IK- vs. Hypertrophietraining", "text": "Tabelle Folie 46 projizieren; die zwei Methoden zeilenweise vergleichen (Intensität, WH, Sätze, Pause, Ziel).", "vortrag": "Beide Methoden unterscheiden sich vor allem in Intensität und Wiederholungen: IK arbeitet mit 85 bis 100 Prozent der Maximalkraft und nur 1 bis 5 Wiederholungen – dafür mit langen Pausen, damit Kreatinphosphat vollständig resynthetisiert wird. Hypertrophie liegt bei etwa 60 bis 85 Prozent mit 8 bis 12 Wiederholungen. Im Examen wird genau dieser Vergleich verlangt (6 Punkte)."}, {"ueberschrift": "Isometrisches Training und die Zehner-Regel", "text": "Zehner-Regel an die Tafel: 10 Sekunden Anspannung pro Wiederholung; Beispiel: 4 WH = 40 s (App-Quiz).", "vortrag": "Beim isometrischen Training bleibt der Muskel gleich lang – das ist gelenkschonend und in der frühen Post-OP-Phase ideal. Die Zehner-Regel dosiert die Anspannungszeit: zehn Sekunden pro Wiederholung. Achtung: maximale isometrische Anspannung mit großen Muskelgruppen ist kardiovaskulär belastend (Pressatmung, Stunde 21) – in der Therapie submaximal bleiben."}, {"ueberschrift": "Prozentdosierung rechnen", "text": "Rechenbeispiele an der Tafel: IK ansteigend von 1RM 120 kg → 102/108/114/120 kg; Hypertrophie von 90 kg → 54/63/72/81 kg.", "vortrag": "Die Belastung wird immer als Prozent des 1RM angegeben – das macht den Plan individuell. Ansteigende Varianten steigern die Last über die Sätze hinweg (z. B. 85-90-95-100 Prozent). So dosieren wir in der Therapie exakt und steigern progressiv (Prinzip aus der Trainingslehre)."}]}, "arbeitsphase": {"titel": "Dosierungen berechnen", "min": 25, "sozialform": "Einzelarbeit, Partner-Kontrolle", "aufgaben": [{"titel": "IK-Training, ansteigend (85–90–95–100 %), 1RM = 120 kg – Lasten der 4 Sätze?", "text": "IK-Training, ansteigend (85–90–95–100 %), 1RM = 120 kg – Lasten der 4 Sätze?", "loesung": "102 / 108 / 114 / 120 kg (App-Quiz).", "hilfe": "App: quiz kraft Rechenfall."}, {"titel": "Hypertrophietraining, ansteigend (60–70–80–90 %), 1RM = 90 kg – Lasten?", "text": "Hypertrophietraining, ansteigend (60–70–80–90 %), 1RM = 90 kg – Lasten?", "loesung": "54 / 63 / 72 / 81 kg (App-Quiz).", "hilfe": "App: quiz kraft Rechenfall."}, {"titel": "Isometrisches Maximalkrafttraining nach der Zehner-Regel: 4 WH = ? s", "text": "Isometrisches Maximalkrafttraining nach der Zehner-Regel: 4 WH = ? s", "loesung": "40 s (App-Quiz).", "hilfe": "App: quiz 'Zehner-Regel'."}, {"titel": "Fall: 8 WH geplant, alle Sätze 10 WH geschafft – was tun?", "text": "Fall: 8 WH geplant, alle Sätze 10 WH geschafft – was tun?", "loesung": "Last erhöhen (progressive Steigerung), z. B. +2,5–5 kg (App-Quiz).", "hilfe": "App: quiz '8 WH geplant, 10 geschafft'."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Erläutere die intramuskuläre Koordination und ihre Bedeutung für die Maximalkraft.", "loesung": "- Definition: Zusammenwirken von Nerv und Muskel innerhalb eines gezielten Bewegungsablaufs\n- Rekrutierung: Anzahl der aktivierten motorischen Einheiten\n- Frequenzierung: Abstufung der Impulsfrequenz (ZNS schickt Aktionspotenziale)\n- Synchronisation: gleichzeitige Aktivierung motorischer Einheiten\n- Optimales Zusammenwirken: bis zu 30 % mehr Maximalkraft ohne Hypertrophie (Nicht-Spitzensportler)", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere rechnen mit Taschenrechner und Tabelle Folie 45/46; stärkere diskutieren, warum Pausenlänge und WH-Zahl die Methoden unterscheiden (Energiebereitstellung – Kreatinphosphat vs. Glykolyse, Thema Ausdauer).", "app_uebung": "App: table Folie 46, table Folie 45, planner Folien 46/48/89/91, quiz-Rechenfälle, exam (6 P) 'IK vs. Hypertrophie'."}, "sicherung": {"titel": "Methoden-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Vergleiche IK- und Hypertrophietraining in zwei Sätzen (Intensität, WH, Ziel) und nenne die Zehner-Regel.", "aufgaben": [{"frage": "IK vs. Hypertrophie?", "loesung": "IK: 85–100 % 1RM, 1–5 WH → Maximalkraft; Hypertrophie: 60–85 %, 8–12 WH → Muskelquerschnitt."}, {"frage": "Zehner-Regel?", "loesung": "10 s isometrische Anspannung pro WH."}, {"frage": "Welche Pausenlänge empfiehlt die Trainingsplanung für das Hypertrophietraining?  [App-Quiz: Kraft und Krafttraining]", "loesung": "30–90 s – Laut Tabelle Pausengestaltung: Hypertrophie und Kraftausdauer 30–90 s, Maximal- und Schnellkraft 2–5 min."}]}, "hausaufgabe": "Tabelle Folie 46 als Spickzettel lernen; Planer 'IK-Training' und 'Hypertrophietraining' je für einen Fall ausfüllen; App-Rechenfälle (ansteigende Varianten, Zehner-Regel) lösen; exam-Aufgabe 'IK vs. Hypertrophie' (6 P) üben.", "hinweise": ["Fehler: Isometrisch maximal mit großen Muskelgruppen bei kardiovaskulären Patienten – Pressatmung/Gefäßverschluss (Stunde 21: Gefahren).", "Pausen beim IK kurz = unvollständige Resynthese → Leistungsabfall (Halbwertszeit Kreatinphosphat – Ausdauer-Thema).", "Prüfungsrelevant: Methodenvergleich (6 P), Zehner-Regel, Prozent-Rechenfälle (App-exam/quiz)."], "quellen": ["Examenstrainer.html · DATA kraft: tables/diagram Folien 45/46, planner Folien 46/48/89/91, quiz-Rechenfälle, exam (6 P)"]}, "kr-19": {"nr": 19, "id": "kr-19", "thema": "kraft", "titel": "Krafttrainingsmethoden II: Schnellkraft-, Reaktivkraft-, Kraftausdauer-, Anfängermethode und Pyramiden", "dauer": 60, "ziele": ["Die Auszubildenden nennen die Belastungskomponenten von Schnellkraft-, Reaktivkraft- und Kraftausdauertraining.", "Sie erklären die Anfängermethode und die Pyramidenmethode (Folie 51).", "Sie lesen den Intensitätsbereich im Kraft- und Schnelligkeitstraining (Folien 53–54)."], "vorwissen": "Stunden 10–18 (alle Kraftfähigkeiten und Methoden I).", "material": ["App, Beamer", "Tabelle 'Belastungskomponenten: Schnellkraft-, Reaktivkraft-, Kraftausdauer-, Anfängermethode' (Folie 53)", "Diagramme: 'Pyramidenmethode/doppelte Pyramide' (Folie 51), 'Intensitätsbereich' (Folien 53–54, Hotspot)", "Tabelle 'Trainingsumfang nach Trainingsziel' (Folie 89)"], "physio": "Die Methoden II ergänzen das Spektrum der MTT: Die Anfängermethode (wenige WH unterhalb der Maximal-WH-Zahl) ist der sicherste Einstieg nach longer Inaktivität; Kraftausdauertraining (Circuit) ist Standard in der ambulanten Reha; Schnellkraft/Reaktivkraft erst in der Spätphase. Die Pyramide steuert die Belastung innerhalb einer Einheit.", "app": {"einsatz": ["Tabelle 'Belastungskomponenten: Schnellkraft-/Reaktivkraft-/Kraftausdauer-/Anfängermethode' (Folie 53)", "Diagramme + Hotspots: 'Intensitätsbereich im Kraft- und Schnelligkeitstraining' (Folien 53–54), 'Pyramidenmethode und doppelte Pyramide' (Folie 51)", "Planer: 'Schnellkrafttraining' (Folie 53), 'Kraftausdauertraining' (Folien 57, 89, 91), 'Anfängermethode' (Folie 58)", "Quiz-Rechenfälle: Anfängermethode (max. 24 WH möglich → wie viele?), Tonnage (3×10 mit 60 kg), +2 WH geschafft → Last erhöhen", "Tabelle 'Trainingsumfang nach Trainingsziel' (Folie 89)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Pyramiden-Bau (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der sichere Einstieg"}, {"phase": "Präsentation", "min": 15, "inhalt": "Methoden II und die Pyramide"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Methoden zuordnen und rechnen · Partnerarbeit mit App-Planern"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Methoden-Schnellzuordnung · Mündlich, Blitzlicht"}], "warmups": [{"titel": "Pyramiden-Bau", "art": "Spiel", "min": 5, "anleitung": "Karten mit % 1RM (50–100) werden in Pyramidenform gelegt – manuell die ansteigende/absteigende Variante legen.", "aufgaben": [{"frage": "Ansteigende Pyramide?", "antwort": "50→100 % (leicht zu schwer)."}, {"frage": "Doppelte Pyramide?", "antwort": "hinauf und wieder hinunter (Folie 51)."}, {"frage": "Anfängermethode – Kern?", "antwort": "WH-Zahl unterhalb des Möglichen (z. B. max. 24 WH möglich → 12–15 WH) – App-Quiz."}]}, {"titel": "Tonnage-Blitz", "art": "Kopfrechnen", "min": 5, "anleitung": "Schnellrechnen: 3 Sätze × 10 WH × 60 kg = ? Tonnage.", "aufgaben": [{"frage": "Tonnage?", "antwort": "1800 kg (Volumen = Sätze × WH × Last)."}, {"frage": "Wozu?", "antwort": "Steuerung des Belastungsumfangs (Tabelle Folie 89, App-Quiz)."}, {"frage": "+2 WH mehr geschafft als geplant (50 kg)?", "antwort": "Last um ca. 2–5 % erhöhen (App-Quiz)."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Welche Pausenlänge empfiehlt die Trainingsplanung für das Hypertrophietraining?", "antwort": "30–90 s – Laut Tabelle Pausengestaltung: Hypertrophie und Kraftausdauer 30–90 s, Maximal- und Schnellkraft 2–5 min."}, {"frage": "Wie heißt Stufe 1 im Fünf-Stufen-Modell zum Muskeltraining (Froböse)?", "antwort": "Aktivierung/Innervationsschulung – Das Modell beginnt mit der Aktivierung/Innervationsschulung (Vortraining Stufe 1, < 30 % der Maximalkraft)."}, {"frage": "Welche Trainingsintensität empfiehlt das ACSM (2009) für Krafttraining mit Senioren?", "antwort": "50–85 % 1RM – Für Senioren: 2–3x pro Woche, 1(–3) Sätze, 50–85 % 1RM, 6–15 WH, 1–3 min Pause."}]}], "einstieg": {"titel": "Der sichere Einstieg", "min": 10, "situation": "Fall: Ein Patient war 6 Wochen immobilisiert. Mit welcher Methode startest du das Krafttraining – und wie dosierst du die WH?", "impulse": [{"frage": "Methode?", "erwartung": "Anfängermethode (Folie 58): WH deutlich unterhalb des Möglichen."}, {"frage": "Beispiel?", "erwartung": "Max. 24 WH möglich → 12 WH (App-Quiz)."}, {"frage": "Warum nicht bis zum Limit?", "erwartung": "Schonung, Technik lernen, Verletzungsprophylaxe (Radlinger Folie 43)."}, {"frage": "Später?", "erwartung": "Dann Kraftausdauer-Circuit, dann Hypertrophie (Stufenmodell)."}], "ueberleitung": "Neben IK und Hypertrophie gibt es weitere Methoden – heute: Schnellkraft, Reaktivkraft, Kraftausdauer, die Anfängermethode und die Pyramide als Organisationsform."}, "praesentation": {"titel": "Methoden II und die Pyramide", "min": 15, "merksatz": "Tabelle Folie 53: Schnellkraft (30–60 % 1RM, explosiv, wenige WH), Reaktivkraft (plyometrisch, kurze Bodenkontaktzeit), Kraftausdauer (30–50 %, viele WH), Anfängermethode (WH < maximal möglich, z. B. 12 statt 24). Pyramide (Folie 51): Last steigt innerhalb der Einheit (ansteigend) oder steigt und fällt (doppelte Pyramide). Intensitätsbereiche (Folien 53–54): Kraft vs. Schnelligkeit im Diagramm.", "schritte": [{"ueberschrift": "Schnellkraft-, Reaktivkraft-, Kraftausdauer-, Anfängermethode", "text": "Tabelle Folie 53 spaltenweise durchgehen; zu jeder Methode ein Therapiebeispiel nennen.", "vortrag": "Die Tabelle fasst die Belastungskomponenten zusammen: Schnellkraft arbeitet mit ca. 30–70 % 1RM (Schnelligkeit bis 30 %, Maximalkraft ab 70 %, Folien 53–54) und explosiver Ausführung, Reaktivkraft plyometrisch mit kurzer Bodenkontaktzeit, Kraftausdauer mit 30 bis 50 Prozent und vielen Wiederholungen. Die Anfängermethode wählt bewusst weniger Wiederholungen als möglich – der sichere Einstieg nach Inaktivität."}, {"ueberschrift": "Pyramidenmethode", "text": "Diagramm Folie 51 zeigen: ansteigend (50→100 %) und doppelte Pyramide (hinauf/hinunter).", "vortrag": "Die Pyramide organisiert die Sätze innerhalb einer Einheit: Bei der ansteigenden Pyramide wird die Last von Satz zu Satz schwerer, bei der doppelten wieder leichter. So steuern wir Ermüdung und Belastung ohne Maximalversuch in jedem Satz."}, {"ueberschrift": "Intensitätsbereiche und Umfang", "text": "Diagramm Folien 53–54 (Hotspot in der App); Tabelle Folie 89 'Trainingsumfang nach Ziel' (Kraftausdauer/Hypertrophie/Maximalkraft: Sätze, WH, Pause).", "vortrag": "Das Diagramm zeigt, welcher Intensitätsbereich für Kraft und welcher für Schnelligkeit zuständig ist (Folien 53–54). Die Umfangstabelle (Folie 89) fasst Sätze, Wiederholungen und Pausen je nach Trainingsziel zusammen – im App-Planer füllen wir genau diese Felder aus."}]}, "arbeitsphase": {"titel": "Methoden zuordnen und rechnen", "min": 25, "sozialform": "Partnerarbeit mit App-Planern", "aufgaben": [{"titel": "Fall: Anfänger, gewählte Last erlaubt max. 24 WH – wie viele WH machst du (Anfängermethode)?", "text": "Fall: Anfänger, gewählte Last erlaubt max. 24 WH – wie viele WH machst du (Anfängermethode)?", "loesung": "ca. 12 WH (deutlich unter Maximum) (App-Quiz).", "hilfe": "App: quiz kraft 'Anfängermethode 24 WH'."}, {"titel": "Rechne: 3 Sätze × 10 WH × 60 kg – Trainingsvolumen (Tonnage)?", "text": "Rechne: 3 Sätze × 10 WH × 60 kg – Trainingsvolumen (Tonnage)?", "loesung": "1800 kg (App-Quiz).", "hilfe": "App: quiz 'Tonnage'."}, {"titel": "Du trainierst mit 50 kg und schaffst 2 WH mehr als geplant – Lastanpassung?", "text": "Du trainierst mit 50 kg und schaffst 2 WH mehr als geplant – Lastanpassung?", "loesung": "ca. +2–5 kg bzw. +2–5 % (App-Quiz, Tabelle Folie 18/40).", "hilfe": "App: quiz '+2 WH geschafft'."}, {"titel": "Plane mit dem App-Planer 'Kraftausdauertraining' einen 20-Min-Circuit für die ambulante Reha (6 Stationen).", "text": "Plane mit dem App-Planer 'Kraftausdauertraining' einen 20-Min-Circuit für die ambulante Reha (6 Stationen).", "loesung": "6 Stationen à 40 s Belastung/20 s Pause, 3 Runden, Last 40–50 % 1RM (Planer Folien 57/89/91).", "hilfe": "App: planner 'Kraftausdauertraining'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Beschreibe die Durchführung eines 1RM-Tests und erläutere die indirekte Methode zur Bestimmung der Maximalkraft.", "loesung": "- Erwärmung allgemein und speziell\n- Submaximale Belastung: geschätztes Gewicht für 3–5 WH\n- Serienpause ca. 2–4 min\n- Maximale Belastung: schrittweise ca. 10 % steigern, bis nur noch 1 WH möglich\n- Indirekt: WH-Zahl bei bestimmtem Gewicht ermitteln, Intensität aus Tabelle ablesen\n- Maximalkraft = geschaffte kg : Belastungsintensität in % (z. B. 2 WH = 95 %)", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit den App-Planern und vorgegebenen Stationen; stärkere begründen, warum die Anfängermethode das Verletzungsrisiko senkt (Technik vor Last) und wie die Tonnage den Umfang über Wochen steuert.", "app_uebung": "App: table Folie 53, diagrams/hotspots Folien 51/53–54, table Folie 89, planner Folien 53/57/58/89/91, quiz-Rechenfälle."}, "sicherung": {"titel": "Methoden-Schnellzuordnung", "min": 5, "form": "Mündlich, Blitzlicht", "text": "Die Lehrkraft nennt eine Methode – die Klasse nennt die Kernkomponenten.", "aufgaben": [{"frage": "Anfängermethode?", "loesung": "WH < Maximum (z. B. 12 statt 24), sichere Technik."}, {"frage": "Kraftausdauer?", "loesung": "30–50 % 1RM, viele WH (Circuit)."}, {"frage": "Schnellkraft?", "loesung": "30–60 % 1RM, explosiv, kurze Serien."}, {"frage": "Pyramide?", "loesung": "Last steigt (bzw. steigt und fällt) über die Sätze (Folie 51)."}, {"frage": "Tonnage 3×10×60 kg?", "loesung": "1800 kg."}, {"frage": "Welcher Regenerationsvorgang dauert laut Weineck nach Belastungsende am längsten?  [App-Quiz: Kraft und Krafttraining]", "loesung": "Wiederherstellung beschädigter Zellorganellen (Mitochondrien) – Die Grafik ordnet beschädigten Zellorganellen (Mitochondrien) die längste Regenerationszeit zu (bis 8 Tage)."}]}, "hausaufgabe": "Tabelle Folie 53 + Diagramme Folien 51/53–54 ins Heft; App-Planer 'Anfängermethode'/'Kraftausdauertraining' ausfüllen; Rechenfälle (Tonnage, WH-Anpassung) lösen; Hotspots Folien 53–54 durcharbeiten.", "hinweise": ["Fehler: Anfängermethode mit 'maximal möglichen WH' verwechselt – Sicherheit und Technik zuerst (App-Quiz 24 WH → 12).", "Pyramide falsch gelesen: ansteigend = leicht→schwer innerhalb der Einheit (Folie 51).", "Tonnage (Sätze×WH×Last) ist prüfungsrelevanter Umfangsbegriff (App-Quiz)."], "quellen": ["Examenstrainer.html · DATA kraft: table Folie 53, diagrams/hotspots Folien 51/53–54, table Folie 89, planner Folien 53/57/58/89/91, quiz"]}, "kr-20": {"nr": 20, "id": "kr-20", "thema": "kraft", "titel": "Fünf-Stufen-Modell zum Muskeltraining (Fröböse) und therapeutisches Krafttraining", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben das Fünf-Stufen-Modell zum Muskeltraining nach Fröböse (prüfungsrelevant, 8 P).", "Sie nennen die Grundprinzipien des therapeutischen Krafttrainings.", "Sie erläutern Immobilisationsschäden und deren Vermeidung."], "vorwissen": "Stunden 10–19 (alle Kraftgrundlagen und Methoden).", "material": ["App, Beamer", "Diagramm 'Fünf-Stufen-Modell zum Muskeltraining' (Folie 65) + Tabelle 'Fünf-Stufen-Modell (Fröböse & Langerstøm)' (Folien 66–76)", "Reihenfolge-Übung 'Fünf-Stufen-Modell'", "Planer 'Muskelaufbau in der Therapie' (Folien 71–72)"], "physio": "Das Fünf-Stufen-Modell ist das zentrale Planungsmodell der MTT: Von der Koordination/Anpassung (Stufe 1) über Kraftausdauer (Stufe 2), Muskelaufbau (Stufe 3) bis zu IK/Schnellkraft (Stufe 4–5). Es legt fest, in welcher Reihenfolge ein Patient nach OP/Immobilisation belastet wird – und schützt so vor Rerupturen und Tendinopathien.", "app": {"einsatz": ["Diagramm 'Fünf-Stufen-Modell' (Folie 65) + Tabelle (Folien 66–76) + sequence 'Fünf-Stufen-Modell (Fröböse)'", "Planer 'Muskelaufbau in der Therapie' (Folien 71–72)", "Quiz: 'Wie heißt Stufe 1 im Fünf-Stufen-Modell?' (Koordination/Anpassung), 'Welches Grundprinzip gilt bei der Belastungssteigerung im therapeutischen Krafttraining?', '2 Wochen immobilisiert → Therapiedauer (Faustregel)', 'Patientin mit belastbaren Strukturen, Ziel Muskelquerschnitt → Stufe + Dosierung'", "Zuordnen: 'Immobilisationsschäden'", "Prüfungsaufgabe: Fünf-Stufen-Modell mit Zielen und Intensitäten (8 P)", "Fallbeispiele LA_CASES: Bereich 'Krafttraining in der Therapie' (therapeutische Stufen st1–st5)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Stufen-Rap (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Nach dem Gips"}, {"phase": "Präsentation", "min": 15, "inhalt": "Fünf Stufen von der Reaktivierung bis zur Schnellkraft"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Stufenplan für Patientenfälle · Gruppenarbeit (3er), App-Fallbeispiele Bereich 'Krafttraining in der Therapie'"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Stufen-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Stufen-Rap", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zum Fünf-Stufen-Modell; die Stufen werden dabei laut mitgezählt (1–5).", "aufgaben": [{"frage": "Wie heißt Stufe 1 (Fröböse)?", "antwort": "Aktivierung/Innervationsschulung (Vortraining, < 30 % der Maximalkraft) (App-Quiz)."}, {"frage": "Stufe 3?", "antwort": "Muskelaufbau (Hypertrophie)."}, {"frage": "Stufe 5?", "antwort": "Schnellkraft/Explosivkraft (späte Phase)."}, {"frage": "Grundprinzip therapeutisches Krafttraining?", "antwort": "Von leicht zu schwer, von klein zu groß, erst Kraftausdauer dann Maximalkraft (Belastungsfolge)."}, {"frage": "2 Wochen immobilisiert – Therapiedauer Faustregel?", "antwort": "ca. 8 Wochen (Verhältnis 1:4, App-Quiz)."}]}, {"titel": "Stufen-Pantomime", "art": "Bewegung", "min": 5, "anleitung": "Fünf Bewegungen vom 'einfach/leicht' bis 'schnell/explosiv' – pantomimisch ordnen, dann Stufen zuordnen.", "aufgaben": [{"frage": "Stufe 1 (Koordination)?", "antwort": "z. B. isometrische Anspannung, leichte Bewegung ohne Last."}, {"frage": "Stufe 2 (Kraftausdauer)?", "antwort": "z. B. 3×15 mit Eigenkörpergewicht."}, {"frage": "Stufe 4/5?", "antwort": "z. B. schnelle Sprünge (erst ganz am Ende)."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Welcher Regenerationsvorgang dauert laut Weineck nach Belastungsende am längsten?", "antwort": "Wiederherstellung beschädigter Zellorganellen (Mitochondrien) – Die Grafik ordnet beschädigten Zellorganellen (Mitochondrien) die längste Regenerationszeit zu (bis 8 Tage)."}, {"frage": "Was ist der Schnellkraftindex?", "antwort": "Quotient aus Kraftmaximum und Zeit bis zum Erreichen des Kraftmaximums – Bei der isometrischen Schnellkraftmessung wird der Schnellkraftindex als Quotient aus Kraftmaximum und benötigter Zeit bestimmt."}, {"frage": "Ab wie viel Prozent der isometrischen Maximalkraft kommt es zum völligen Verschluss der Gefäße?", "antwort": "Ab ca. 50 % – Ab 20 % wird die arterielle Blutversorgung behindert, ab 50 % kommt es zum völligen Gefäßverschluss."}]}], "einstieg": {"titel": "Nach dem Gips", "min": 10, "situation": "Fall: Bein 6 Wochen im Gips – in welcher Stufe startest du die MTT und warum nicht höher?", "impulse": [{"frage": "Stufe?", "erwartung": "Stufe 1 (Koordination/Anpassung) – neuronale Reaktivierung, strukturschonend."}, {"frage": "Warum nicht Stufe 3/4 sofort?", "erwartung": "Sehnen/Knorpel brauchen Monate (Radlinger Folie 43); Reruptur-/Tendinopathie-Risiko."}, {"frage": "App-Bezug?", "erwartung": "App: sorts 'Immobilisationsschäden', quiz '2 Wochen immobilisiert'."}], "ueberleitung": "Das Fünf-Stufen-Modell nach Fröböse ist das Herzstück der MTT-Planung – es sagt uns, in welcher Reihenfolge der Patient nach Immobilisation wieder belastet wird."}, "praesentation": {"titel": "Fünf Stufen von der Reaktivierung bis zur Schnellkraft", "min": 15, "merksatz": "Fünf-Stufen-Modell (Fröböse & Langerstøm, Folien 65–76): Stufe 1 Aktivierung/Innervationsschulung (< 30 % 1RM), Stufe 2 Kraftausdauer (30–50 % 1RM, viele WH), Stufe 3 Muskelaufbau/Hypertrophie (60–80 %), Stufe 4 intramuskuläre Koordination (IK, 85–100 %), Stufe 5 Schnellkraft/Reaktivkraft (explosiv/plyometrisch). Grundprinzipien therapeutisches Krafttraining: individuell, progressiv, von proximal nach distal, große Muskelgruppen zuerst, erst Kraftausdauer dann Maximalkraft.", "schritte": [{"ueberschrift": "Die fünf Stufen im Überblick", "text": "Diagramm Folie 65 + Tabelle Folien 66–76 projizieren; sequence 'Fünf-Stufen-Modell' in der App ordnen; Stufe 1 benennen (App-Quiz).", "vortrag": "Stufe 1 ist die Aktivierung/Innervationsschulung (Vortraining unter 30 % der Maximalkraft): der Muskel wird neuronal reaktiviert, ohne ihn zu überlasten. Stufe 2 baut Kraftausdauer auf, Stufe 3 den Muskelquerschnitt (Hypertrophie), Stufe 4 die intramuskuläre Koordination (nahe-maximale Lasten), Stufe 5 Schnellkraft und Reaktivkraft. In der App ordnen wir die Stufen in die richtige Reihenfolge."}, {"ueberschrift": "Grundprinzipien des therapeutischen Krafttrainings", "text": "Prinzipien an die Tafel: individuell dosiert (% 1RM), progressiv gesteigert, erst Kraftausdauer dann IK, große vor kleinen Muskelgruppen, regelmäßige Kontrolle.", "vortrag": "Im therapeutischen Krafttraining steigern wir die Belastung individuell und progressiv – nie sprunghaft. Reihenfolge: erst Kraftausdauer, dann Muskelaufbau, dann Maximalkraft (Belastungsfolge); Grundprinzip: erst Umfang steigern, dann die Intensität (App-Quiz). Große Muskelgruppen (Rumpf, Oberschenkel) vor kleinen – das stabilisiert die Gelenke. Der App-Planer 'Muskelaufbau in der Therapie' (Folien 71–72) führt durch Stufe 3."}, {"ueberschrift": "Immobilisationsschäden", "text": "App-sorts 'Immobilisationsschäden' zuordnen: Muskelatrophie, Gelenkkontraktur, Knochendichte ↓, Thromboserisiko, Sehnenabbau.", "vortrag": "Ohne Belastung baut der Körper ab: Muskelatrophie, Gelenksteife, Knochendichteminderung, Thromboserisiko. Genau dagegen arbeiten wir in Stufe 1–2 – deshalb ist frühe Mobilisation so wichtig. Die Faustregel (App-Quiz): Verhältnis 1:4 – Therapiedauer ≈ 4× Immobilisationszeit (2 Wochen Gips ≈ 8 Wochen Therapie)."}]}, "arbeitsphase": {"titel": "Stufenplan für Patientenfälle", "min": 25, "sozialform": "Gruppenarbeit (3er), App-Fallbeispiele Bereich 'Krafttraining in der Therapie'", "aufgaben": [{"titel": "Fall: 2 Wochen immobilisiert – Therapiedauer nach Faustregel?", "text": "Fall: 2 Wochen immobilisiert – Therapiedauer nach Faustregel?", "loesung": "ca. 4 Wochen (App-Quiz).", "hilfe": "App: quiz kraft."}, {"titel": "Fall: Patientin hat belastbare Strukturen, Ziel = mehr Muskelquerschnitt – welche Stufe und Dosierung?", "text": "Fall: Patientin hat belastbare Strukturen, Ziel = mehr Muskelquerschnitt – welche Stufe und Dosierung?", "loesung": "Stufe 3 Muskelaufbau (setzt gut belastbare Strukturen voraus): 40–70 % 1RM, 8–15 WH, 2–6 Serien über 3–5 Wochen (App-Quiz + Planer Folien 71–72).", "hilfe": "App: LA_CASES Bereich 'therapie' (st3), planner 'Muskelaufbau in der Therapie'."}, {"titel": "Fall: Knie-TEP Woche 3 – Stufe? Begründung?", "text": "Fall: Knie-TEP Woche 3 – Stufe? Begründung?", "loesung": "Stufe 1–2 (Koordination → Kraftausdauer), 30–50 % 1RM, da Sehnen/Knorpel noch nicht adaptiert (Folie 43).", "hilfe": "App: diagram Folie 65, table Folie 43."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Vergleiche das konzentrische IK-Training mit dem Hypertrophietraining anhand der Belastungskomponenten.", "loesung": "- Arbeitsweise: beide konzentrisch\n- Bewegungsgeschwindigkeit: IK explosiv – Hypertrophie langsam bis zügig\n- Last: IK 85–100 % 1RM – Hypertrophie 60–90 %\n- Intensität: IK maximal – Hypertrophie submaximal\n- Dauer: IK 1–3 (–5) WH – Hypertrophie 8–12 (6–20) WH bis zur Erschöpfung\n- Pause: IK 3–5 (eher > 6) min – Hypertrophie 2–3 min\n- Umfang: IK 3–8 Sätze – Hypertrophie 3–5 Sätze je Übung bei 3–5 Übungen", "hilfe": "App: Thema 'kraft' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lösen die App-Fälle im Bereich 'Krafttraining in der Therapie' (Stufen st1–st5 mit automatischer Prüfung); stärkere begründen jede Stufenwahl mit Radlinger (Folie 43) und dem Belastungsfolge-Prinzip (TL Std. 6).", "app_uebung": "App: diagram Folie 65, table Folien 66–76, sequence 'Fünf-Stufen-Modell', planner Folien 71–72, LA_CASES bereich 'therapie', sorts 'Immobilisationsschäden', exam (8 P)."}, "sicherung": {"titel": "Stufen-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die fünf Stufen des Muskeltrainings in der richtigen Reihenfolge und das Grundprinzip der Belastungssteigerung in der Therapie.", "aufgaben": [{"frage": "Fünf Stufen?", "loesung": "1 Aktivierung/Innervationsschulung → 2 Kraftausdauer → 3 Muskelaufbau (Hypertrophie) → 4 IK/Maximalkraft → 5 Schnellkraft/Reaktivkraft."}, {"frage": "Grundprinzip?", "loesung": "Individuell, progressiv, erst Kraftausdauer dann Maximalkraft (Belastungsfolge)."}, {"frage": "Warum kann die Maximalkraft bei Nicht-Spitzensportlern um bis zu 30 % steigen, ohne dass der Muskel dicker wird?  [App-Quiz: Kraft und Krafttraining]", "loesung": "Rekrutierung, Frequenzierung und Synchronisation arbeiten besser zusammen – Optimales Zusammenspiel der intramuskulären Koordination bringt bis zu 30 % mehr Maximalkraft ohne Hypertrophie."}]}, "hausaufgabe": "Tabelle 'Fünf-Stufen-Modell' (Folien 66–76) als Merkblatt lernen; App-sequence 'Fünf-Stufen-Modell' ordnen; LA_CASES-Bereich 'therapie' (alle 5 Stufen-Fälle) lösen; exam-Aufgabe (8 P) 'Fünf-Stufen-Modell' schriftlich üben.", "hinweise": ["Fehler: Stufen werden übersprungen (z. B. direkt IK nach OP) – Reruptur-Risiko; immer sequenziell steigern.", "Stufe 1 heißt 'Aktivierung/Innervationsschulung' (App-Quiz) – nicht 'Aufwärmen'.", "Prüfungsrelevant: Fünf-Stufen-Modell mit Zielen und Intensitäten (8 P, App-exam); Autor Fröböse."], "quellen": ["Examenstrainer.html · DATA kraft: diagram Folie 65, table Folien 66–76, sequence, planner Folien 71–72, LA_CASES 'therapie', sorts, exam (8 P)", "Fröböse & Langerstøm (App-Quelle)"]}, "kr-21": {"nr": 21, "id": "kr-21", "thema": "kraft", "titel": "Krafttraining bei besonderen Gruppen: Kinder/Jugendliche, Senioren, Gefahren und Sicherheit", "dauer": 60, "ziele": ["Die Auszubildenden vergleichen die Empfehlungen für Krafttraining im Kindes-/Jugendalter mit denen für Senioren (prüfungsrelevant, 6 P).", "Sie nennen Gefahren beim Krafttraining und erläutern zwei (prüfungsrelevant, 6 P).", "Sie erklären die richtige Atmung (Vermeidung der Pressatmung) und muskuläre Dysbalancen."], "vorwissen": "Stunden 10–20 (Kraftfähigkeiten, Methoden, Fünf-Stufen-Modell), TL Stunde 8 (sensible Phasen).", "material": ["App, Beamer", "Diagramme: 'Muskuläre Dysbalancen: Rumpfkraftmessung' (Folie 102), 'Fähigkeiten im Alternsgang' (Folie 109)", "Normtabellen Liegestütz/Klimmzug (Folie 21)", "ACSM-Empfehlung (2009) für Senioren"], "physio": "In der pädiatrischen und geriatrischen Physiotherapie ist die altersgemäße Dosierung entscheidend: Kinder trainieren koordinativ-technisch (Faigenbaum), Senioren mit moderaten Lasten und höherer WH-Zahl (ACSM 2009) zur Sturzprophylaxe. Gefahren (Pressatmung, Überlastung, Dysbalancen) kennen wir, um sie zu vermeiden – das ist Patientensicherheit.", "app": {"einsatz": ["Quiz: 'ACSM (2009) Krafttraining Senioren – Intensität?', 'Faigenbaum – Dosierung 12-Jähriger?', 'Gefahren beim Krafttraining', 'Atmung dynamisch (Pressatmung vermeiden)', 'Krafttraining Kindes-/Jugendalter – richtige Aussage', 'Ab wie viel % isometrische Maximalkraft ist die Durchblutung eingeschränkt/völlig unterbrochen?'", "Diagramme: 'Rumpfkraftmessung' (Folie 102), 'Fähigkeiten im Alternsgang' (Folie 109)", "Diagramm 'Normtabellen Liegestütz/Klimmzug' (Folie 21)", "Prüfungsaufgaben: Gefahren (6 P), Kinder vs. Senioren (6 P)", "Fall: 12-Jähriger im Krafttraining (Faigenbaum-Dosierung) (App-Quiz)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Senioren-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der 12-Jährige im Kraftraum"}, {"phase": "Präsentation", "min": 15, "inhalt": "Altersgemäßes Krafttraining und Sicherheit"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Dosierungen für besondere Gruppen · Partnerarbeit mit App-Quiz und Diagrammen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Sicherheits-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Senioren-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu ACSM-Seniorenempfehlung und Altern.", "aufgaben": [{"frage": "ACSM 2009 Senioren?", "antwort": "2–3×/Woche, 1–3 Sätze, 50–85 % 1RM, 6–15 WH, 1–3 min Pause (App-Quiz)."}, {"frage": "Ziel im Alter?", "antwort": "Sturzprophylaxe, Erhalt der Alltagskraft (Folie 109)."}, {"frage": "Fähigkeiten im Alternsgang (Folie 109)?", "antwort": "Maximalkraft und Schnellkraft nehmen ab, Kraftausdauer relativ stabil."}]}, {"titel": "Atmungs-Demo", "art": "Bewegung", "min": 5, "anleitung": "5 WH Kniebeuge mit korrekter Atmung (Ausatmen bei Anstrengung) vs. angehaltener Luft (Pressatmung) – Unterschied spüren, dann besprechen.", "aufgaben": [{"frage": "Richtige Atmung dynamisch?", "antwort": "Ausatmen bei der konzentrischen (schweren) Phase – vermeidet Pressatmung (App-Quiz)."}, {"frage": "Pressatmung-Risiko?", "antwort": "Intrathorakaler Druck ↑, venöser Rückfluss ↓, Blutdruckspitzen – kardiovaskulär riskant."}, {"frage": "Ab wann Gefäßverschluss isometrisch?", "antwort": "ab 20 % Fmax Durchblutung behindert, ab 50 % völliger Gefäßverschluss (App-Quiz)."}]}, {"titel": "App-Quiz-Blitz: Kraft und Krafttraining", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Kraft und Krafttraining' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema kraft).", "aufgaben": [{"frage": "Warum kann die Maximalkraft bei Nicht-Spitzensportlern um bis zu 30 % steigen, ohne dass der Muskel dicker wird?", "antwort": "Rekrutierung, Frequenzierung und Synchronisation arbeiten besser zusammen – Optimales Zusammenspiel der intramuskulären Koordination bringt bis zu 30 % mehr Maximalkraft ohne Hypertrophie."}, {"frage": "Was zeigt der Vergleich der Kraftanstiegskurven von Boxer und Kugelstoßer?", "antwort": "Boxer: steilster Anstieg, aber niedrigeres Maximum als der Kugelstoßer – Der Boxer erreicht sein (geringeres) Maximum sehr schnell, der Kugelstoßer erzielt das höchste Maximum; Sportstudenten zeigen flachen Anstieg und niedriges Maximum."}, {"frage": "Warum begünstigen kräftige Sehnen die Reaktivkraft?", "antwort": "Sie speichern beim Dehnen mehr Energie, die danach freigesetzt wird – Je kräftiger Sehnen und Bindegewebe, desto mehr Energie kann im Dehnungsmoment des DVZ gespeichert und anschließend freigesetzt werden."}]}], "einstieg": {"titel": "Der 12-Jährige im Kraftraum", "min": 10, "situation": "Fall (App-Quiz): Du betreust einen 12-Jährigen im Krafttraining – welche Dosierung entspricht Faigenbaum?", "impulse": [{"frage": "Dosierung?", "erwartung": "1–2 Sätze, 6–15 WH, 50–70 % (technikorientiert, keine Maximalversuche) – App-Quiz."}, {"frage": "Warum keine Maximalkraft?", "erwartung": "Wachstumsfugen, sensible Phasen (TL Std. 8) – Verletzungsrisiko."}, {"frage": "Senioren dagegen?", "erwartung": "ACSM 2009: moderate Lasten, 10–15 WH, 2–3×/Woche (App-Quiz)."}, {"frage": "Gemeinsamkeit?", "erwartung": "Beide: individuell, technisch sauber, kontrolliert steigern."}], "ueberleitung": "Kinder, Jugendliche und Senioren brauchen eigene Dosierungen – heute klären wir die Evidenz (Faigenbaum, ACSM) und die Sicherheit beim Krafttraining."}, "praesentation": {"titel": "Altersgemäßes Krafttraining und Sicherheit", "min": 15, "merksatz": "Kinder/Jugendliche (Faigenbaum): 2–3×/Woche, 1–3 Sätze à 10–15 WH, 1–3 min Pause, professionelle Betreuung, keine 1RM-Tests; sensible Phasen beachten (Koordination/Differenzierung früh, Kraft ab Pubertät). Senioren (ACSM 2009): 2–3×/Woche, 1–3 Sätze, 50–85 % 1RM, 6–15 WH, Ganzkörperprogramm zur Sturzprophylaxe. Gefahren: Pressatmung (richtig atmen: ausatmen bei Anstrengung), Überlastung (Progression), Dysbalancen (Rumpfkraftmessung Folie 102), Durchblutungsbehinderung ab 20 % Fmax, völliger Gefäßverschluss ab 50 % Fmax (isometrisch), Muskelkater/Überlastung. Altern: Maximalkraft/Schnellkraft ↓, Kraftausdauer relativ stabil (Folie 109).", "schritte": [{"ueberschrift": "Kinder und Jugendliche", "text": "Faigenbaum-Dosierung an die Tafel; sensible Phasen (TL Std. 8) verknüpfen: Koordination früh, Kraft ab Pubertät.", "vortrag": "Bei Kindern und Jugendlichen steht Technik vor Last: 2–3×/Woche, 1–3 Sätze à 10–15 WH, 1–3 min Pause, verschiedene Übungen, professionelle Betreuung – keine Maximalkraft-Tests (Faigenbaum, App-Quiz). Grundlage sind die sensiblen Phasen: Koordination hat ihr Fenster im Kindesalter, Kraft erst in der Pubertät. In der pädiatrischen Physio heißt das: spielerisch, koordinativ, nie maximal."}, {"ueberschrift": "Senioren", "text": "ACSM (2009) an die Tafel: 2–3×/Woche, 1–3 Sätze, 50–85 % 1RM, 6–15 WH, 1–3 min Pause; Diagramm Folie 109 (Alternsgang) zeigen.", "vortrag": "Senioren profitieren besonders vom Krafttraining: Es ist die wirksamste Maßnahme gegen Sarkopenie und Stürze. Das ACSM empfiehlt 2–3×/Woche 1–3 Sätze mit 50–85 % 1RM und 6–15 Wiederholungen. Das Diagramm Folie 109 zeigt: Maximalkraft und Schnellkraft nehmen mit dem Alter ab – genau die Fähigkeiten, die wir trainieren müssen."}, {"ueberschrift": "Gefahren und Sicherheit", "text": "Gefahrenliste sammeln: Pressatmung, Überlastung, Dysbalancen, isometrischer Gefäßverschluss (ab ~70–80 %); Rumpfkraftmessung Folie 102 zur Dysbalancierkennung.", "vortrag": "Die größten Gefahren beim Krafttraining sind Pressatmung und Überlastung. Richtig ist: dynamisch atmen, bei der Anstrengung ausatmen. Ab ca. 20 % der isometrischen Maximalkraft ist die Durchblutung eingeschränkt, ab ca. 50 % völlig unterbrochen – bei großen Muskelgruppen drohen Blutdruckanstieg und Knorpelbelastung; deshalb isometrisch submaximal bleiben. Muskuläre Dysbalancen (z. B. Bauch/Rücken, Folie 102) erkennen wir durch die Rumpfkraftmessung und gleichen sie gezielt aus."}]}, "arbeitsphase": {"titel": "Dosierungen für besondere Gruppen", "min": 25, "sozialform": "Partnerarbeit mit App-Quiz und Diagrammen", "aufgaben": [{"titel": "Fall: 12-Jähriger, Faigenbaum-Dosierung?",
