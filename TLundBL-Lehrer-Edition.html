: "App: exam ausdauer (4 P)."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Erläutere die Begriffe aerobe Schwelle, aerob-anaerober Übergangsbereich und anaerobe Schwelle anhand der Laktatleistungskurve.", "loesung": "- Aerobe Schwelle (ca. 2 mmol/l): darunter fast ausschließlich aerobe Energiegewinnung, Laktat nahe Ruhewert\n- Übergangsbereich: Laktatbildung nimmt mit steigender Intensität zu, Bildung und Abbau stehen aber im Gleichgewicht (Laktat-Steady-State)\n- Anaerobe Schwelle (ca. 4 mmol/l, MaxLaSS): darüber starker, exponentieller Laktatanstieg\n- Kurve: Laktat (mmol/l) über Belastung (km/h); flacher Verlauf bis ANS, danach steiler Anstieg\n- Trainierte erreichen die ANS erst bei höherer Belastung bzw. O2-Aufnahme", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit den App-Labels (Folie 25) und markieren die Flächen; stärkere erklären die physiologischen 'Rückzahlungen' (Laktat, KP, Glykogen, Temperatur) und leiten daraus die Cool-down-Empfehlung ab.", "app_uebung": "App: diagram Folien 23–25 + labels/hotspots, quiz, cards 'Sauerstoffdefizit'/'Sauerstoffschuld', exam (4 P)."}, "sicherung": {"titel": "Defizit-Schuld-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Erkläre in zwei Sätzen: Was ist das Sauerstoffdefizit (wo in der Kurve?), was die Sauerstoffschuld (wo)?", "aufgaben": [{"frage": "Defizit?", "loesung": "Zu Belastungsbeginn: O2-Aufnahme steigt langsamer als der Bedarf – Lücke = Defizit (anaerob gedeckt, Folie 25)."}, {"frage": "Schuld?", "loesung": "Nach Belastung: O2-Aufnahme bleibt über Ruhe und fällt langsam ab – Mehrfläche = Schuld/EPOC."}, {"frage": "Wie verändert sich das Herzgewicht (Myokard) durch Ausdauertraining?  [App-Quiz: Ausdauer]", "loesung": "Von ca. 250 g auf ca. 500 g – Das Myokard nimmt an Dicke zu – von 250 g auf 500 g."}]}, "hausaufgabe": "Diagramm Folie 25 ins Heft zeichnen und die vier Bereiche markieren; App-Labels/Hotspots Folien 23–25 durcharbeiten; exam-Aufgabe (4 P) 'Defizit und Schuld' üben; Karteikarten lernen.", "hinweise": ["Fehler: Defizit und Schuld werden vertauscht – Defizit = Beginn (Aufnahme < Bedarf), Schuld = Ende (Aufnahme > Ruhe).", "Ruhe-O2 ca. 0,25–0,28 l/min, Steady State im Beispiel ca. 0,78 l/min (App-Diagrammbeschreibung Folie 25).", "EPOC-Begriff als Überbegriff für die Nachbelastung-O2 – klinisch relevant für Cool-down."], "quellen": ["Examenstrainer.html · DATA ausdauer: diagrams/labels/hotspots Folien 23–25, cards, quiz, exam (4 P)"]}, "au-29": {"nr": 29, "id": "au-29", "thema": "ausdauer", "titel": "Anpassungen des Organismus durch Ausdauertraining: Herz, Blut, Muskulatur, Psyche, Immunsystem", "dauer": 60, "ziele": ["Die Auszubildenden nennen je zwei Anpassungserscheinungen des Ausdauertrainings an Herz, Blut, periphere Muskulatur und Psyche (prüfungsrelevant, 8 P).", "Sie ordnen Anpassungen dem jeweiligen System zu.", "Sie begründen, warum Knorpel sich besonders langsam anpasst und welche Konsequenz das hat."], "vorwissen": "Stunden 22–27 (alle Ausdauer-Grundlagen), Stunde 17 Kraft (Zeitspanne Radlinger).", "material": ["App, Beamer", "Zuordnung 'Welche Anpassung betrifft welches System?'", "Tabelle/Diagramm 'Trainingsproportionen im Vier-Stufenmodell (Fröbose 2003)' (Folie 62)"], "physio": "Die Anpassungserscheinungen sind das 'Warum' des Ausdauertrainings in der Reha: vergrößertes Herzschlagvolumen, niedrigerer Ruhepuls, mehr Kapillaren/Mitochondrien im Muskel, psychische Stabilisierung – messbare Therapieerfolge, die wir dem Patienten als Motivation zurückmelden (Verlaufskontrolle). Das Immunsystem profitiert moderat, bei Übertraining leidet es.", "app": {"einsatz": ["Zuordnen: 'Welche Anpassung durch Ausdauertraining betrifft welches System?' (Herz, Blut, Muskulatur, Psyche, Immunsystem)", "Quiz: 'Wie verändert sich das Herzgewicht (Myokard) durch Ausdauertraining?', 'periphere Anpassung steigert den Energieumsatz im Muskel?', 'Wirkung auf das Immunsystem?', 'Warum brauchen Knorpel-Anpassungen besonders lange?'", "Karteikarten: 'Anpassungen des Herzens', 'Anpassungen des Blutes', 'Anpassungen der Psyche'", "Prüfungsaufgabe: je zwei Anpassungen an Herz, Blut, periphere Muskulatur, Psyche (8 P)", "Diagramm 'Trainingsproportionen im Vier-Stufenmodell (Fröbose 2003)' (Folie 62)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "System-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der messbare Erfolg"}, {"phase": "Präsentation", "min": 15, "inhalt": "Anpassungen systemisch betrachten"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Anpassungen zuordnen und dokumentieren · Gruppenarbeit mit App-sorts und Verlaufsbogen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Anpassungs-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "System-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Anpassungen; schnelle Zuordnung System → Anpassung.", "aufgaben": [{"frage": "Herzgewicht (Myokard)?", "antwort": "Nimmt zu: von 250 g auf bis zu 500 g; Schlagvolumen steigt, Ruhepuls sinkt (App-Quiz)."}, {"frage": "Blut?", "antwort": "Hämoglobin/Hämatokrit steigen, Plasmavolumen ↑."}, {"frage": "Muskel peripher?", "antwort": "Mehr Kapillaren und Mitochondrien → höherer Energieumsatz, bessere O2-Nutzung."}, {"frage": "Psyche?", "antwort": "Stimmungsaufhellung, Stressabbau, besserer Schlaf."}, {"frage": "Immunsystem?", "antwort": "Moderates Training stärkt, Übertraining schwächt (App-Quiz)."}]}, {"titel": "Proportionen-Rätsel", "art": "Rätsel", "min": 5, "anleitung": "Wie verschieben sich die Trainingsproportionen im Vier-Stufenmodell (Fröbose 2003, Folie 62)? – App-Diagramm lesen.", "aufgaben": [{"frage": "Stufe 1–2 (frühe Therapie)?", "antwort": "Überwiegend GA I/GA II (aerobe Grundlage)."}, {"frage": "Spätere Stufen?", "antwort": "Zunehmend anaerobe Anteile/Intervall (Folie 62, stacked bar)."}, {"frage": "Therapiekonsequenz?", "antwort": "Anfangs fast nur aerob, dann dosiert anaerob."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Wie verändert sich das Herzgewicht (Myokard) durch Ausdauertraining?", "antwort": "Von ca. 250 g auf ca. 500 g – Das Myokard nimmt an Dicke zu – von 250 g auf 500 g."}, {"frage": "Was versteht man unter der Physical Working Capacity (PWC)?", "antwort": "Die in Watt angegebene Leistung bei einer definierten Herzfrequenz – Die PWC ist die mechanische Leistung in Watt bei einer festgelegten Herzfrequenz (z. B. 130, 150, 170) und beschreibt das Dauerleistungsvermögen."}, {"frage": "Worin besteht die Aufgabe beim UKK-Walking-Test?", "antwort": "2 km ebene Strecke in möglichst kurzer Zeit gehen – Beim UKK-Test werden 2 km ebene Strecke mit forciertem Armeinsatz gegangen (nicht gelaufen); gemessen werden Gehzeit und Herzfrequenz im Ziel."}]}], "einstieg": {"titel": "Der messbare Erfolg", "min": 10, "situation": "Fall: Patient nach 8 Wochen Walking-Programm (3×/Woche, GA I): Ruhepuls von 78 auf 66 gesunken, geht 30 min ohne Atemnot. Welche Anpassungen sind das – und wie nutzt du das therapeutisch?", "impulse": [{"frage": "Herz?", "erwartung": "Schlagvolumen ↑, Ruhepuls ↓ (Herzanpassung) – messbarer Erfolg."}, {"frage": "Muskel?", "erwartung": "Kapillaren/Mitochondrien ↑ – bessere periphere O2-Nutzung."}, {"frage": "Therapeutisch?", "erwartung": "Motivation durch Verlaufskontrolle (Ruhepuls dokumentieren), nächste Stufe planen (GA II)."}, {"frage": "App-Bezug?", "erwartung": "App: sorts 'Anpassung → System', quiz 'Herzgewicht Myokard'."}], "ueberleitung": "Ausdauertraining verändert den ganzen Organismus – Herz, Blut, Muskel, Psyche. Heute: Welche Anpassungen gehören zu welchem System, und was bedeutet das für die Therapie?"}, "praesentation": {"titel": "Anpassungen systemisch betrachten", "min": 15, "merksatz": "Herz: Myokard-Hypertrophie (Sportlerherz), Schlagvolumen ↑, Ruhepuls ↓. Blut: Plasmavolumen ↑, Hämoglobin/Hämatokrit ↑. Periphere Muskulatur: Kapillardichte ↑, Mitochondrien ↑ (oxidative Enzyme) → höherer Energieumsatz, bessere Fettoxidation. Psyche: Stimmungsaufhellung, Stressresistenz, Schlaf. Immunsystem: moderat gestärkt, Übertraining schwächt. Knorpel: bradytroph → langsamste Anpassung (Monate).", "schritte": [{"ueberschrift": "Herz und Blut", "text": "App-sorts 'Anpassung → System' für Herz/Blut lösen; Werte an die Tafel (Ruhepuls ↓, Schlagvolumen ↑).", "vortrag": "Das Herz wird zum leistungsfähigeren Muskel: Das Myokard nimmt zu, das Schlagvolumen steigt, der Ruhepuls sinkt – das spürt der Patient im Alltag (weniger Atemnot). Im Blut steigt das Plasmavolumen und die Hämoglobinmenge – mehr Sauerstofftransportkapazität."}, {"ueberschrift": "Periphere Muskulatur und Psyche", "text": "App-sorts Muskulatur/Psyche; Karteikarten 'Anpassungen des Herzens/der Psyche'.", "vortrag": "Im Muskel wachsen Kapillaren und Mitochondrien – die Zelle kann mehr Sauerstoff verwerten und Fett verbrennen (periphere Anpassung). Psychisch wirkt Ausdauertraining stimmungsaufhellend und stressreduzierend – in der Reha ein wichtiger Nebeneffekt (Compliance!)."}, {"ueberschrift": "Immunsystem und Knorpel", "text": "App-Quiz: Immunsystem (moderat stärkend vs. Übertraining schwächend); Knorpel langsam (bradytroph, Diffusionsernährung).", "vortrag": "Moderates Ausdauertraining stärkt das Immunsystem, Übertraining schwächt es – deshalb die Regenerationswochen (TL). Knorpel ist bradytroph (schlecht durchblutet): Seine Anpassung braucht Monate – bei Gelenkpatienten deshalb die Belastung konservativ steigern (Radlinger, Kraft Std. 17)."}]}, "arbeitsphase": {"titel": "Anpassungen zuordnen und dokumentieren", "min": 25, "sozialform": "Gruppenarbeit mit App-sorts und Verlaufsbogen", "aufgaben": [{"titel": "Ordne zu (App-sorts): Ruhepuls ↓, Kapillaren ↑, Hämoglobin ↑, Stimmungsaufhellung, Mitochondrien ↑.", "text": "Ordne zu (App-sorts): Ruhepuls ↓, Kapillaren ↑, Hämoglobin ↑, Stimmungsaufhellung, Mitochondrien ↑.", "loesung": "Herz, Muskel, Blut, Psyche, Muskel (App-sorts 'Anpassung → System').", "hilfe": "App: sorts ausdauer 'Welche Anpassung betrifft welches System?'."}, {"titel": "Fall: 8 Wochen GA-I-Walking – Ruhepuls 78→66. Welche Systeme, wie dokumentieren?", "text": "Fall: 8 Wochen GA-I-Walking – Ruhepuls 78→66. Welche Systeme, wie dokumentieren?", "loesung": "Herz (Schlagvolumen ↑, Ruhepuls ↓) + Muskel (Kapillaren/Mitochondrien) + Psyche; dokumentieren im Verlaufsbogen (Ruhepuls, Belastungs-HF, subjektiv Borg) (App-quiz + exam 8 P).", "hilfe": "App: exam ausdauer (8 P) 'je zwei Anpassungen an Herz/Blut/Muskel/Psyche'."}, {"titel": "Fall: Patient trainiert täglich hart, wird infektanfälliger – was ist passiert?", "text": "Fall: Patient trainiert täglich hart, wird infektanfälliger – was ist passiert?", "loesung": "Übertraining → Immunsystem geschwächt (App-Quiz 'Immunsystem'); Maßnahme: Regeneration, Dosis reduzieren (Superkompensation, TL).", "hilfe": "App: quiz ausdauer 'Immunsystem'."}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Beschreibe die Entstehung von Sauerstoffdefizit und Sauerstoffschuld im Verlauf einer konstanten Belastung.", "loesung": "- Ruhe: O2-Verbrauch auf Ruheniveau (ca. 0,25 l/min in der Abbildung)\n- Belastungsbeginn: O2-Bedarf steigt sprunghaft, O2-Aufnahme läuft nur langsam an → Sauerstoffdefizit (anaerob gedeckt)\n- Arbeitsphase: O2-Aufnahme erreicht ein Plateau (Steady State)\n- Nach Belastungsende: O2-Aufnahme bleibt über dem Ruhebedarf und fällt allmählich ab → Sauerstoffschuld", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lösen die App-sorts mit Karteikarten; stärkere erstellen einen einfachen Verlaufsbogen (Ruhepuls, Borg, Gehstrecke) und begründen, warum Knorpelanpassungen das Tempo bei Gelenkpatienten begrenzen.", "app_uebung": "App: sorts 'Anpassung → System', diagram Folie 62, quiz (Myokard, Immunsystem, Knorpel), cards 'Anpassungen Herz/Blut/Psyche', exam (8 P)."}, "sicherung": {"titel": "Anpassungs-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne je zwei Anpassungen an Herz und periphere Muskulatur durch Ausdauertraining.", "aufgaben": [{"frage": "Herz?", "loesung": "Myokard ↑ (Sportlerherz), Schlagvolumen ↑, Ruhepuls ↓."}, {"frage": "Muskel?", "loesung": "Kapillaren ↑, Mitochondrien ↑, oxidative Enzyme ↑ → höherer Energieumsatz."}, {"frage": "Welches Merkmal kennzeichnet die Intervallmethode?  [App-Quiz: Ausdauer]", "loesung": "Belastung mit lohnender Pause – Dauermethode: ohne Pause; Intervallmethode: lohnende Pause; Wiederholungsmethode: erholende Pause; Wettkampfmethode: Wettkampfsituationen."}]}, "hausaufgabe": "App-sorts 'Anpassung → System' fehlerfrei lösen; Diagramm Folie 62 analysieren; exam-Aufgabe (8 P) 'Anpassungen an Herz/Blut/Muskel/Psyche' schriftlich üben; Karteikarten 'Anpassungen…' lernen.", "hinweise": ["Fehler: Alle Anpassungen werden dem Herzen zugeschrieben – Muskel (Kapillaren/Mitochondrien) und Blut (Plasmavolumen/Hb) sind eigenständige Systeme (App-sorts).", "Immunsystem: moderates Training stärkt, Übertraining schwächt – prüfungsrelevant (App-Quiz).", "Knorpel bradytroph → langsamste Anpassung; Konsequenz für Gelenkpatienten (Kraft Std. 17)."], "quellen": ["Examenstrainer.html · DATA ausdauer: sorts 'Anpassung → System', diagram Folie 62, cards 'Anpassungen…', quiz, exam (8 P)", "Fröbose 2003 (App-Quelle Folie 62)"]}, "au-30": {"nr": 30, "id": "au-30", "thema": "ausdauer", "titel": "Ausdauermethoden und Belastungsdiagnostik: Dauermethode, Intervall, PWC-Test, UKK, Karvonen", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben die Trainingsbereiche der Dauermethode (GA I/GA II) und die lohnende Pause.", "Sie unterscheiden intensive/extensive Intervallmethode und die Wiederholungsmethode.", "Sie beschreiben Durchführung und Auswertung des PWC-Tests sowie UKK-Walking-Test und Karvonen-Formel (prüfungsrelevant, 5 P)."], "vorwissen": "Stunden 22–29 (alle Ausdauer-Themen), TL Std. 4 (Methoden).", "material": ["App, Beamer", "Tabellen: 'Trainingsbereiche der Dauermethode' (Folien 53–56), 'Präventives Ausdauertraining' (Folien 78–79)", "Diagramme: 'Prinzip der lohnenden Pause' (Folie 67)", "Planer: GA I (Folie 54), GA II (Folie 55)"], "physio": "In der ambulanten und stationären Reha sind GA I/GA II (extensive/intervallartige Dauermethoden) plus submaximale Belastungsdiagnostik (PWC-150, UKK-Walking-Test) der Standard: Sie erlauben eine sichere, individuell dosierte Verordnung (HF-Zonen nach Karvonen) – z. B. für Herzinsuffizienz- oder COPD-Patienten.", "app": {"einsatz": ["Tabellen 'Trainingsbereiche der Dauermethode' (Folien 53–56) + Planer 'GA I' (Folie 54)/'GA II' (Folie 55)", "Diagramm 'Prinzip der lohnenden Pause' (Folie 67)", "Zuordnen: 'Intensive oder extensive Dauermethode?'", "Quiz: 'PWC-Test: Durchführung/Auswertung' (exam 5 P), 'PWC-150: 75 kg Mann, 225 W – Bewertung?', 'UKK-Walking-Test: Aufgabe?', 'Karvonen-Formel', '40-jähriger Ruhepuls 60, 60 % → HF?', 'Faustformel max. Belastbarkeit 50-Jähriger 70 kg?', 'intensive vs. extensive Intervall (Belastungsdauer)', 'Wiederholungsmethode vs. Intervall (Pausen)'", "Prüfungsaufgaben: Methodenvergleich Dauer/Intervall/Wiederholung (6 P), PWC-Test (5 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Bereichs-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Die Verordnung 'Ausdauer'"}, {"phase": "Präsentation", "min": 15, "inhalt": "Von der Diagnostik zur Verordnung"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Verordnung konkretisieren · Partnerarbeit mit App-Planern und Quiz-Rechenfällen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Verordnungs-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Bereichs-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu GA I/GA II, Intervallmethoden, PWC, Karvonen – schnelle Antworten.", "aufgaben": [{"frage": "GA I?", "antwort": "Extensive Dauermethode, niedrige Intensität (~60–70 % HFmax), lange Dauer, Fettstoffwechsel."}, {"frage": "GA II?", "antwort": "Intensivere Dauermethode nahe aerober Schwelle (Folie 55)."}, {"frage": "PWC-150?", "antwort": "Leistung (W) bei HF 150 – submaximaler Ausdauertest (App-Quiz)."}, {"frage": "Karvonen?", "antwort": "HF = Ruhe + % × (HFmax − Ruhe) (App-Quiz)."}, {"frage": "Lohnende Pause?", "antwort": "Pause, in der Laktat weitgehend abgebaut wird (Folie 67)."}]}, {"titel": "PWC-Rechnen", "art": "Kopfrechnen", "min": 5, "anleitung": "Faustformel: 50-jähriger Mann, 70 kg – Sollwert max. Belastbarkeit? Dann PWC-150 225 W bei 75 kg – Bewertung?", "aufgaben": [{"frage": "Faustformel 50-jähriger Mann, 70 kg?", "antwort": "3 × Gewicht × (130 − Alter)/100 = 3 × 70 × 80/100 = 168 Watt (App-Quiz)."}, {"frage": "PWC-150 225 W bei 75 kg?", "antwort": "guter Wert (App-Quiz: '225 W Bewertung')."}, {"frage": "Vorteil PWC?", "antwort": "Keine maximale Ausbelastung nötig – sicher für Patienten (App-Quiz)."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Welches Merkmal kennzeichnet die Intervallmethode?", "antwort": "Belastung mit lohnender Pause – Dauermethode: ohne Pause; Intervallmethode: lohnende Pause; Wiederholungsmethode: erholende Pause; Wettkampfmethode: Wettkampfsituationen."}, {"frage": "Mit welcher Intensität wird bei der Wettkampfmethode trainiert?", "antwort": "95–105 % – Die Wettkampfmethode arbeitet mit 95–105 %, z. B. über Under- und Overdistance-Wettkämpfe."}, {"frage": "Was empfiehlt das Bundesministerium für Gesundheit (2016) für 6- bis 18-Jährige?", "antwort": "Täglich mind. 90 Minuten Bewegung und mind. 12.000 Schritte – Für 6–18 Jahre gelten täglich 90 Minuten und mehr sowie mindestens 12.000 Schritte; 180 Minuten gelten für 4- bis 6-Jährige."}]}], "einstieg": {"titel": "Die Verordnung 'Ausdauer'", "min": 10, "situation": "Fall: Arzt verordnet 'Ausdauertraining' für einen 50-jährigen Patienten nach Herzinfarkt – wie kommst du von der vagen Verordnung zur konkreten HF-Zone?", "impulse": [{"frage": "Schritte?", "erwartung": "Belastungsdiagnostik (PWC-150/Ergometrie) → VO2max/PWC-Wert → HF-Zonen nach Karvonen/Borg."}, {"frage": "Welche Methode?", "erwartung": "GA I extensiv (Dauermethode) oder extensive Intervall – individuell."}, {"frage": "Sicherheit?", "erwartung": "Submaximal starten, Borg-Skala 11–13, Symptome beachten."}, {"frage": "App-Bezug?", "erwartung": "App: quiz PWC/Karvonen, exam 'PWC-Test durchführen/auswerten' (5 P)."}], "ueberleitung": "Jetzt wird's praktisch: Von der Belastungsdiagnostik (PWC, UKK, Karvonen) zur konkreten Trainingsverordnung – und welche Methoden (GA I/II, Intervall) wann passen."}, "praesentation": {"titel": "Von der Diagnostik zur Verordnung", "min": 15, "merksatz": "PWC-Test (z. B. PWC-150): submaximale Belastung am Ergometer, Leistung bei definierter HF (150) → extrapolation auf HFmax; sicher, da keine Maximalbelastung. UKK-Walking-Test: 2 km Walking, Zeit + HF → aerobe Fitness. Karvonen: HF-Zonen individuell. Dauermethode: GA I (Folie 54, extensiv, Fettstoffwechsel), GA II (Folie 55, intensiver). Lohnende Pause (Folie 67): Laktatabbau vor nächstem Reiz. Intervall: extensive (länger, moderat) vs. intensive (kurz, hart); Wiederholungsmethode: nahe-maximale Reize, vollständige Pausen.", "schritte": [{"ueberschrift": "Belastungsdiagnostik in der Reha", "text": "PWC-150 und UKK-Walking-Test an die Tafel; App-Quiz 'Aufgabe beim UKK-Walking-Test' klären; PWC-150-Beispiel 225 W bei 75 kg bewerten (App-Quiz).", "vortrag": "Vor Trainingsbeginn klären wir die Belastbarkeit submaximal: Beim PWC-150 messen wir die Leistung bei einer Herzfrequenz von 150 – daraus extrapolieren wir die maximale Belastbarkeit, ohne den Patienten maximal zu belasten (sicher nach Herzinfarkt!). Der UKK-Walking-Test (2 km Gehen, Zeit und HF) ist die alltagstaugliche Variante. Beispiel: 225 Watt bei HF 150 und 75 kg ist ein guter Wert."}, {"ueberschrift": "Trainingsbereiche der Dauermethode", "text": "Tabelle Folien 53–56 projizieren; Planer GA I (Folie 54) und GA II (Folie 55) in der App ausfüllen; lohnende Pause (Folie 67) zeigen.", "vortrag": "GA I ist die extensive Dauermethode mit niedriger Intensität – hier verbrennen wir hauptsächlich Fett (Folie 10). GA II arbeitet intensiver nahe der aeroben Schwelle. Die lohnende Pause (Folie 67) sorgt dafür, dass Laktat vor dem nächsten Reiz weitgehend abgebaut ist – dann ist die Pause 'lohnend'. Im App-Planer stellen wir GA I und GA II konkret zusammen."}, {"ueberschrift": "Intervall- und Wiederholungsmethode", "text": "App-sorts 'Intensive oder extensive Dauermethode?' + Quiz 'intensive vs. extensive Intervall (Belastungsdauer)', 'Wiederholungsmethode vs. Intervall (Pausen)'.", "vortrag": "Bei der Intervallmethode wechseln Belastung und Pause: extensiv mit längeren, moderateren Belastungen (herzschonend – gut für Patienten), intensiv mit kurzen, harten Reizen. Die Wiederholungsmethode arbeitet mit wenigen, (nahe-)maximalen Belastungen und vollständigen Pausen – erst in der Spätphase oder beim Sportler. Im Examen vergleichen wir alle drei Methoden (6 Punkte)."}]}, "arbeitsphase": {"titel": "Verordnung konkretisieren", "min": 25, "sozialform": "Partnerarbeit mit App-Planern und Quiz-Rechenfällen", "aufgaben": [{"titel": "Fall: 40-jähriger Patient, Ruhepuls 60, soll mit 60 % trainieren – Trainings-HF nach Karvonen?", "text": "Fall: 40-jähriger Patient, Ruhepuls 60, soll mit 60 % trainieren – Trainings-HF nach Karvonen?", "loesung": "max. HF ≈ 180 → 60 + 0,6 × 120 = 132/min (App-Quiz).", "hilfe": "App: quiz ausdauer 'Karvonen 60 %'."}, {"titel": "Fall: PWC-150 = 225 W bei 75 kg – Bewertung?", "text": "Fall: PWC-150 = 225 W bei 75 kg – Bewertung?", "loesung": "guter/überdurchschnittlicher Wert (Tabelle/Richtwerte, App-Quiz 'PWC 225 W').", "hilfe": "App: quiz 'PWC-Test Auswertung'."}, {"titel": "Plane GA I für einen COPD-Patienten (App-Planer Folie 54).", "text": "Plane GA I für einen COPD-Patienten (App-Planer Folie 54).", "loesung": "z. B. 3×/Woche 20–30 min Walking/Fahrrad, HF 60–70 % (Borg 11–13), Pausen bei Bedarf, progressive Steigerung (App-Planer GA I).", "hilfe": "App: planner 'Grundlagenausdauer 1 (GA I)' Folie 54."}, {"titel": "Prüfungsaufgabe (5 P): PWC-Test auf dem Fahrradergometer – Durchführung und Auswertung.", "text": "Prüfungsaufgabe (5 P): PWC-Test auf dem Fahrradergometer – Durchführung und Auswertung.", "loesung": "Musterlösung in der App: submaximale Stufen bis HF 150, Leistung messen, auf HFmax extrapolieren, mit Normtabellen bewerten (App-exam).", "hilfe": "App: exam ausdauer 'PWC-Test' (5 P)."}, {"titel": "Prüfungsnahe Aufgabe (8 P)", "text": "Nenne je zwei Anpassungserscheinungen des Ausdauertrainings an Herz, Blut, peripherer Muskulatur und Psyche.", "loesung": "- Herz: Myokard 250 g → 500 g; Schlagvolumen in Ruhe 70 → 105 ml; HMV 20 → 40 l/min; geringerer Ruhepuls\n- Blut: Blutmenge 5 l → 6–7 l; geringere Viskosität; bessere O2- und Pufferkapazität\n- Peripherie: Kapillarvermehrung; Mitochondrienvermehrung; Glykogen 200–300 g → 400–600 g; ST-Faser-Anteil bis ca. 90 %\n- Psyche: Sympathikustonus sinkt; höhere Stressresistenz; Endorphine → Schmerzschwelle steigt", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere rechnen mit Formel-Vorgaben und füllen den App-Planer mit Hilfen aus; stärkere begründen, warum der PWC-Test statt einer Maximalergometrie gewählt wird (Sicherheit) und wie Borg die HF bei Medikamenten (Betablocker) ersetzt.", "app_uebung": "App: tables Folien 53–56, planner GA I/GA II (Folien 54/55), diagram Folie 67, sorts, quiz (PWC/UKK/Karvonen/Faustformel), exam (5 P + 6 P)."}, "sicherung": {"titel": "Verordnungs-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die Formel für die Trainings-HF nach Karvonen, das Ziel des PWC-150 und den Unterschied extensive vs. intensive Intervallmethode.", "aufgaben": [{"frage": "Karvonen?", "loesung": "HF = Ruhepuls + % × (HFmax − Ruhepuls)."}, {"frage": "PWC-150?", "loesung": "Submaximaler Test: Leistung bei HF 150 → Extrapolation der max. Belastbarkeit (keine Maximalbelastung)."}, {"frage": "Intervall?", "loesung": "Extensiv: längere, moderate Belastungen; intensiv: kurze, harte Belastungen – Pausen entsprechend lang."}, {"frage": "Was gilt für die Fettoxidation in Abhängigkeit von der Belastungsintensität?  [App-Quiz: Ausdauer]", "loesung": "Sie steigt zunächst an und nimmt oberhalb von ca. 65 % VO2max wieder ab – Die Kurve hat ihr Maximum um ca. 62 % VO2max (ca. 0,52 g/min); ab > 65 % VO2max sinkt der Fettanteil und erreicht bei ca. 87 % VO2max null."}]}, "hausaufgabe": "App-Planer 'GA I' und 'GA II' je für einen Fall ausfüllen; Rechenfälle (Karvonen, PWC-Bewertung, Faustformel) lösen; exam-Aufgaben 'PWC-Test' (5 P) und 'Methodenvergleich' (6 P) üben; sorts 'Intensiv/extensiv' fehlerfrei.", "hinweise": ["Fehler: PWC-Test mit Maximalbelastung verwechselt – PWC ist submaximal (App-Quiz 'Warum keine maximale Ausbelastung?').", "Karvonen ohne Ruhepuls gerechnet – Ruhepuls ist essential (App-Quiz).", "Extensiv/intensiv Intervall vertauscht – App-sorts + Folien 53–56 checken."], "quellen": ["Examenstrainer.html · DATA ausdauer: tables Folien 53–56, planner Folien 54/55, diagram Folie 67, sorts, quiz (PWC/UKK/Karvonen), exam (5 P + 6 P)"]}, "au-31": {"nr": 31, "id": "au-31", "thema": "ausdauer", "titel": "Ausdauertraining in der Therapie: Stufenmodell (Fröböse), Gesundheitsprogramme, Prävention", "dauer": 60, "ziele": ["Die Auszubildenden beschreiben das Stufenmodell zum Ausdauertraining in der Therapie nach Fröböse et al. (2003).", "Sie unterscheiden Gesundheits-Minimal- und -Optimalprogramm und nennen die BMfG-Empfehlung (2016).", "Sie begründen, in welcher Stufe die Wiederholungsmethode erstmals eingesetzt wird (prüfungsrelevant)."], "vorwissen": "Stunden 22–30 (gesamtes Ausdauer-Thema), TL Std. 4–5 (Methoden, Roux).", "material": ["App, Beamer", "Tabelle 'Stufenmodell zum Ausdauertraining in der Therapie (Fröböse et al. 2003)' (Folien 57–61)", "Reihenfolge 'Stufenmodell (Fröböse)'", "Planer: 'Gesundheits-Minimalprogramm' (Folie 78), 'Gesundheits-Optimalprogramm' (Folie 79), 'Stufe 3' (Folie 60)", "Tabelle 'Präventives Ausdauertraining' (Folien 78–79)"], "physio": "Das therapeutische Stufenmodell ist die Brücke zwischen Sport und Medizin: Stufe 1–2 für bettlägerige/akute Patienten (Herz-Kreislauf-Stabilisierung), Stufe 3 für die ambulante Reha (Wiederholungsmethode erstmals hier), Stufe 4–5 für belastbare Patienten. Die Gesundheitsprogramme (Minimal/Optimal) und die BMfG-Empfehlungen (60 min/Tag für Jugendliche) sind die präventive Grundlage der Physio-Beratung.", "app": {"einsatz": ["Tabelle 'Stufenmodell zum Ausdauertraining in der Therapie (Fröböse et al. 2003)' (Folien 57–61) + sequence 'Stufenmodell (Fröböse)'", "Planer: 'Gesundheits-Minimalprogramm' (Folie 78), 'Gesundheits-Optimalprogramm' (Folie 79), 'Ausdauertraining in der Therapie, Stufe 3' (Folie 60)", "Tabelle 'Präventives Ausdauertraining' (Folien 78–79)", "Quiz: 'In welcher Stufe des therapeutischen Stufenmodells wird erstmals die Wiederholungsmethode eingesetzt?', 'BMfG (2016) für 6- bis 18-Jährige?', '50-Jähriger, VO2max <40 → Minimalprogramm: HF?', '62-jährige Frau, VO2max 26 → Minimalprogramm: HF?', '35-jähriger Mann, VO2max ~45 → Optimalprogramm?'", "Diagramm 'Trainingsproportionen im Vier-Stufenmodell (Fröbose 2003)' (Folie 62)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Stufen-Quiz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Vom Bett in den Alltag"}, {"phase": "Präsentation", "min": 15, "inhalt": "Stufenmodell und Gesundheitsprogramme"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Programm für Patienten wählen · Einzelarbeit mit App-Planern und Quiz-Fällen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Stufen-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Stufen-Quiz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zum therapeutischen Stufenmodell und zu den Gesundheitsprogrammen.", "aufgaben": [{"frage": "Wiederholungsmethode erstmals in welcher Stufe (Fröböse)?", "antwort": "Erst Stufe 4 (neben Dauermethode/Fahrtspiel auch Intervall- und Wiederholungsmethode) (App-Quiz)."}, {"frage": "BMfG (2016) für 6- bis 18-Jährige?", "antwort": "täglich 90 Minuten und mehr sowie mind. 12.000 Schritte (4–6 J.: 180 min) (App-Quiz)."}, {"frage": "Minimalprogramm (VO2max <40, 50 J)?", "antwort": "niedrige Intensität, z. B. HF ~60 % (App-Quiz 'Gesundheits-Minimalprogramm')."}, {"frage": "Optimalprogramm (VO2max ~45, 35 J)?", "antwort": "höhere Intensität/Umfang, z. B. HF ~70–80 % (App-Quiz)."}, {"frage": "Stufenmodell Autor?", "antwort": "Fröböse et al. 2003 (Folien 57–61)."}]}, {"titel": "Programm-Planung", "art": "Schätzen", "min": 5, "anleitung": "62-jährige Frau, VO2max 26 ml/kg/min → Minimalprogramm: HF-Ziel ca.? Schätzen, dann App-Quiz.", "aufgaben": [{"frage": "HF-Ziel Minimalprogramm?", "antwort": "HF = 160 − Alter = 160 − 62 = 98 Schläge/min (App-Quiz)."}, {"frage": "Warum Minimal?", "antwort": "Niedrige VO2max → niedrige Belastbarkeit, Sicherheit zuerst (Tabelle Folien 78–79)."}, {"frage": "Steigerung?", "antwort": "Langsam steigern Richtung Optimalprogramm (Folie 79)."}]}, {"titel": "App-Quiz-Blitz: Ausdauer", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Ausdauer' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema ausdauer).", "aufgaben": [{"frage": "Was gilt für die Fettoxidation in Abhängigkeit von der Belastungsintensität?", "antwort": "Sie steigt zunächst an und nimmt oberhalb von ca. 65 % VO2max wieder ab – Die Kurve hat ihr Maximum um ca. 62 % VO2max (ca. 0,52 g/min); ab > 65 % VO2max sinkt der Fettanteil und erreicht bei ca. 87 % VO2max null."}, {"frage": "Welche Aussage zur „30-min-Schallmauer“ des Fettstoffwechsels ist richtig?", "antwort": "Es gibt sie nicht; Fett wird von Beginn an genutzt, der Anteil steigt mit der Dauer – Schon nach 30 min stammen 25 % der ATP-Resynthese aus Fett, nach 120 min 62 %. Die maximale Fettverbrennung wird erst ab ca. 90–120 min angenommen."}, {"frage": "Wie unterscheiden sich Kreatinphosphat und Fett als Energielieferanten?", "antwort": "KP: sehr kleine Kapazität, sehr große Flussrate – Fett: große Kapazität, kleine Flussrate – Laut Tabelle hat KP (Lohmann-Reaktion) eine sehr kleine Kapazität bei sehr großer Flussrate; Fett (Oxidation) eine große Kapazität bei kleiner Flussrate."}]}], "einstieg": {"titel": "Vom Bett in den Alltag", "min": 10, "situation": "Fall: Patient nach 3 Wochen Intensivstation – mit welcher Stufe startest du das Ausdauertraining, und welche Methode ist dort angesagt?", "impulse": [{"frage": "Stufe?", "erwartung": "Stufe 1 (Fröböse, Folien 57–61) – Stabilisierung, sehr niedrige Intensität."}, {"frage": "Methode?", "erwartung": "Dauermethode extensiv (intervallartig), keine Wiederholungsmethode (erst Stufe 3)."}, {"frage": "Ziel?", "erwartung": "Herz-Kreislauf-Stabilisierung, Orthostase-Training."}, {"frage": "App-Bezug?", "erwartung": "App: sequence 'Stufenmodell Fröböse', quiz 'Wiederholungsmethode erstmals Stufe?'."}], "ueberleitung": "In der Therapie trainieren wir Ausdauer stufenweise – vom bettlägerigen Patienten bis zum belastbaren Rehabilitanden. Heute: das Stufenmodell nach Fröböse und die Gesundheitsprogramme."}, "praesentation": {"titel": "Stufenmodell und Gesundheitsprogramme", "min": 15, "merksatz": "Stufenmodell (Fröböse et al. 2003, Folien 57–61): Stufe 1 akut/bettlägerig (sehr niedrige Intensität, Stabilisierung), Stufe 2 frühe Reha (GA I), Stufe 3 ambulante Reha (GA II), Stufe 4 erstmals Intervall- und Wiederholungsmethode, Stufe 5 belastbar/Sport (anspruchsvolle Methoden). Gesundheits-Minimalprogramm (Folie 78): bei niedriger VO2max (<40), geringe Intensität; Gesundheits-Optimalprogramm (Folie 79): höhere Intensität/Umfang. BMfG (2016): 6–18-Jährige tägl. ≥ 90 min + ≥ 12.000 Schritte (4–6 J.: 180 min) (App-Quiz). Prävention (TL Std. 1): primär/sekundär/tertiär.", "schritte": [{"ueberschrift": "Das Stufenmodell im Überblick", "text": "Tabelle Folien 57–61 projizieren; App-sequence 'Stufenmodell (Fröböse)' ordnen; Stufe 3 markieren (erste Wiederholungsmethode, App-Quiz).", "vortrag": "Fröböse et al. teilen das Ausdauertraining in der Therapie in Stufen: In Stufe 1 (akut, bettlägerig) stabilisieren wir Herz-Kreislauf mit sehr niedriger Intensität. Stufe 2 baut GA I auf, Stufe 3 arbeitet mit GA II. Erst Stufe 4 nennt neben Dauermethode und Fahrtspiel auch die Intervall- und Wiederholungsmethode (App-Quiz). Stufen 4–5 sind dem belastbaren Patienten/Sportler vorbehalten. So wird die Belastung immer an den Zustand angepasst."}, {"ueberschrift": "Gesundheits-Minimal- vs. Optimalprogramm", "text": "Planer Folien 78/79 in der App ausfüllen; Tabelle 'Präventives Ausdauertraining' (Folien 78–79); Quiz-Fälle (VO2max 26 → Minimal, HF?; VO2max 45 → Optimal).", "vortrag": "Je nach Leistungsfähigkeit (VO2max) wählen wir das Programm: Minimalprogramm (VO2max < 40 bzw. Frauen < 32 ml/min/kg): HF = 160 − Alter (62-jährige Frau → 98/min; 50-Jähriger → 110/min). Optimalprogramm (z. B. VO2max ~45, 35-jähriger Mann): HF = 170 − Alter = 135/min (70–80 % VO2max), mehr Umfang (App-Quiz). Beide sind im App-Planer hinterlegt (Folien 78/79)."}, {"ueberschrift": "Prävention und öffentlicher Gesundheitsauftrag", "text": "BMfG (2016): 6–18-Jährige tägl. ≥ 90 min + ≥ 12.000 Schritte (App-Quiz); Präventionsformen (TL Std. 1) verknüpfen.", "vortrag": "Die Physio berät auch präventiv: Das BMfG (2016) empfiehlt 6- bis 18-Jährigen täglich 90 Minuten und mehr sowie mindestens 12.000 Schritte (4–6-Jährige: 180 Minuten) (App-Quiz). Zusammen mit den Präventionsstufen (primär/sekundär/tertiär, TL) ergibt sich der Gesundheitsauftrag der Therapie – Bewegung als Medizin."}]}, "arbeitsphase": {"titel": "Programm für Patienten wählen", "min": 25, "sozialform": "Einzelarbeit mit App-Planern und Quiz-Fällen", "aufgaben": [{"titel": "Fall: 50-Jähriger, VO2max <40 → Minimalprogramm: HF-Ziel?", "text": "Fall: 50-Jähriger, VO2max <40 → Minimalprogramm: HF-Ziel?", "loesung": "Minimalprogramm: HF = 160 − Lebensalter (50 J. → 110/min, ca. 50 % VO2max) (App-Quiz).", "hilfe": "App: planner Folie 78 + quiz."}, {"titel": "Fall: 62-jährige Frau, VO2max 26 → Minimalprogramm: HF?", "text": "Fall: 62-jährige Frau, VO2max 26 → Minimalprogramm: HF?", "loesung": "98/min (160 − 62) (App-Quiz).", "hilfe": "App: quiz '62-jährige VO2max 26 Minimalprogramm'."}, {"titel": "Fall: 35-jähriger Mann, VO2max ~45 → Optimalprogramm: Intensität/Umfang?", "text": "Fall: 35-jähriger Mann, VO2max ~45 → Optimalprogramm: Intensität/Umfang?", "loesung": "Optimalprogramm: HF = 170 − Lebensalter (35 J. → 135/min, 70–80 % VO2max) (App-Quiz).", "hilfe": "App: planner Folie 79 + quiz."}, {"titel": "Ordne die Stufen (App-sequence 'Stufenmodell Fröböse') und begründe, warum die Wiederholungsmethode erst ab Stufe 3 kommt.", "text": "Ordne die Stufen (App-sequence 'Stufenmodell Fröböse') und begründe, warum die Wiederholungsmethode erst ab Stufe 3 kommt.", "loesung": "Belastbarkeit steigt mit den Stufen; Wiederholungsmethode = hohe Intensität → erst bei belastbarem Patienten (Sicherheit) (App-sequence + quiz).", "hilfe": "App: sequence 'Stufenmodell (Fröböse)', quiz 'Wiederholungsmethode Stufe'."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Vergleiche Dauer-, Intervall- und Wiederholungsmethode hinsichtlich Pausengestaltung, Intensität und Zielen.", "loesung": "- Dauermethode: keine Pause; extensiv 60–70 % (30 min–6 h), intensiv 70–80 % (20 min–3 h); Ziel u. a. Grundlagenausdauer, Fettstoffwechsel, Ökonomisierung\n- Intervallmethode: lohnende Pause (bis HF ca. 130–120); extensiv 60–80 %, intensiv 70–90 %; Ziele: Laktatverträglichkeit, Herzvolumenvergrößerung, höhere O2-Aufnahme, Regenerationsfähigkeit\n- Wiederholungsmethode: erholende (vollständige) Pause 4–15 (30) min; 90–100 %; Ziele: Ökonomisierung, Vergrößerung der Energiereserven, Steigerungsfähigkeit zur höchsten individuellen Leistung", "hilfe": "App: Thema 'ausdauer' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere lösen die App-sequence und Planer mit Vorgaben; stärkere diskutieren, wie sie das Stufenmodell mit dem Fünf-Stufen-Modell der Kraft (Std. 20) kombinieren (kombiniertes Ausdauer-Kraft-Stufenmodell in der MTT).", "app_uebung": "App: table Folien 57–61, sequence 'Stufenmodell', planner Folien 60/78/79, table Folien 78–79, diagram Folie 62, quiz-Fälle, exam (Methodenvergleich 6 P)."}, "sicherung": {"titel": "Stufen-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die Stufen des therapeutischen Ausdauertrainings (Fröböse) in der richtigen Reihenfolge und in welcher Stufe erstmals die Wiederholungsmethode eingesetzt wird.", "aufgaben": [{"frage": "Stufen?", "loesung": "1 akut/Stabilisierung → 2 GA I → 3 GA II → 4 erstmals Intervall-/Wiederholungsmethode → 5 belastbar (App-sequence Folien 57–61, App-Quiz)."}, {"frage": "BMfG 2016?", "loesung": "6–18 J: tägl. ≥ 90 min + ≥ 12.000 Schritte; 4–6 J: 180 min (App-Quiz)."}, {"frage": "Was kennzeichnet den aerob-anaeroben Übergangsbereich?  [App-Quiz: Ausdauer]", "loesung": "Die Laktatbildung nimmt zu, steht aber im Gleichgewicht mit dem Laktatabbau – Zwischen aerober (ca. 2 mmol/l) und anaerober Schwelle (ca. 4 mmol/l) steigt die Laktatbildung, Bildung und Abbau bleiben aber im Gleichgewicht (Laktat-Steady-State)."}]}, "hausaufgabe": "Tabelle 'Stufenmodell' (Folien 57–61) als Merkblatt; App-sequence 'Stufenmodell Fröböse' ordnen; Planer 'Minimal-/Optimalprogramm' (Folien 78/79) ausfüllen; Quiz-Fälle (VO2max 26/45, BMfG) lösen; exam 'Methodenvergleich' (6 P) wiederholen.", "hinweise": ["Fehler: Wiederholungsmethode in Stufe 1–2 angeordnet – erst ab Stufe 3 (App-Quiz, prüfungsrelevant).", "Minimal vs. Optimal vertauscht – entscheidend ist die VO2max (Tabellen Folien 78–79).", "Autor Fröböse et al. 2003 und BMfG 2016 merken (App-Quellen)."], "quellen": ["Examenstrainer.html · DATA ausdauer: table Folien 57–61, planner Folien 60/78/79, table Folien 78–79, sequence, diagram Folie 62, quiz, exam (6 P)", "Fröböse et al. 2003; BMfG 2016 (App-Quellen)"]}, "b1-32": {"nr": 32, "id": "b1-32", "thema": "bewegungslehre1", "titel": "Grundlagen: Bewegung, Motorik, Sensomotorik", "dauer": 60, "ziele": ["Die Auszubildenden definieren Bewegung handlungstheoretisch (Grosser/Hermann u. a., 1987) und unterscheiden Motorik.", "Sie unterscheiden resultats- und verlaufsorientierte Betrachtung.", "Sie ordnen die Sensomotorik in den Komplex der körperlichen Leistungsfähigkeit ein (Folie 5)."], "vorwissen": "Trainingslehre (Grundbegriffe), Anatomie/Physiologie des Nervensystems grob.", "material": ["App, Beamer", "Diagramm 'Komplex der körperlichen Leistungsfähigkeit' (Folie 5)", "Bewegungsbeispiele (Tür öffnen, Gehen, Greifen)"], "physio": "In der Physio beginnt alles mit der Bewegung: Wir beobachten, analysieren und behandeln Bewegungsabläufe (Gangbild, Greifen, Aufstehen). Dafür brauchen wir präzise Begriffe – was ist eine 'Bewegung' im Unterschied zur bloßen Ortsveränderung, und was leistet die Sensomotorik?", "app": {"einsatz": ["Diagramm 'Komplex der körperlichen Leistungsfähigkeit' (Folie 5)", "Quiz bewegungslehre1 (35 Fragen): 'Wie wird Bewegung handlungstheoretisch definiert (Grosser/Hermann u. a., 1987)?'", "Karteikarten: 'Bewegung (Definition)', 'Motorik (Definition)', 'Sensomotorik', 'Resultats- vs. verlaufsorientiert', 'Bedeutung koordinativer Fähigkeiten'", "Zuordnen: 'Informationsquellen der Sensomotorik' (Vorschau Std. 37)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Bewegungs-Begriffe (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Ist das schon eine Bewegung?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Bewegung – zielgerichtet und steuerbar"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Bewegungen analysieren · Partnerarbeit an Alltagsbewegungen (Aufstehen, Greifen, Gehen)"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Begriffs-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Bewegungs-Begriffe", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Definitionen; danach eigene Beispiele aus dem Physio-Alltag (Gangbild, Aufstehen).", "aufgaben": [{"frage": "Bewegung handlungstheoretisch (Grosser/Hermann 1987)?", "antwort": "Zielgerichtete, bewusste Ortsveränderung des Körpers/einzelner Körperteile (App-Quiz)."}, {"frage": "Motorik?", "antwort": "Gesamtheit der bewegungssteuernden Prozesse (willkürlich + unwillkürlich)."}, {"frage": "Sensomotorik?", "antwort": "Zusammenspiel von Sinneswahrnehmung (Sensorik) und Bewegungssteuerung (Motorik)."}, {"frage": "Resultats- vs. verlaufsorientiert?", "antwort": "Resultat = Endprodukt (z. B. gegriffener Gegenstand); Verlauf = Bewegungsablauf/Qualität."}]}, {"titel": "Stille Post Bewegung", "art": "Spiel", "min": 5, "anleitung": "Eine einfache Bewegung (z. B. Arm heben) wird pantomimisch weitergegeben – ohne Worte. Wo geht Präzision verloren? (Verlauf vs. Resultat).", "aufgaben": [{"frage": "Was ist schwer zu übermitteln?", "antwort": "Der genaue Verlauf (Kraft, Tempo, Rhythmus) – nur das Resultat ist grob sichtbar."}, {"frage": "Physio-Relevanz?", "antwort": "Wir analysieren den Verlauf (Bewegungsqualität), nicht nur das Ziel."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Welche Quelle zählt zu den propriozeptiven Informationsquellen?", "antwort": "Sehnenrezeptoren – Propriozeptive Quellen sind Gelenk-, Muskel-, Haut- und Sehnenrezeptoren (kinästhetischer Analysator)."}, {"frage": "Welche Ebene des ZNS ist laut Schema für die Stützmotorik und Orientierung im Raum zuständig?", "antwort": "Hirnstamm – Dem Hirnstamm werden Orientierung im Raum und Stützmotorik zugeordnet; das Großhirn steht für Ziel- und Erwerbsmotorik."}, {"frage": "Welcher sensomotorische Regelkreis steuert neue, differenzierte Bewegungen und Feinmotorik der distalen Gelenke?", "antwort": "5. SMRK (pyramidal-motorisches System) – Der 5. SMRK (pyramidal) steuert neue differenzierte Bewegungen, Ziel- und Greifmotorik, Feinmotorik und distale Gelenke mit hohem Bewusstsein."}]}], "einstieg": {"titel": "Ist das schon eine Bewegung?", "min": 10, "situation": "Fall: Ein Patient im Koma bewegt reflektorisch den Arm. Eine Patientin hebt gezielt die Tasse. Ist beides 'Bewegung'?", "impulse": [{"frage": "Reflex?", "erwartung": "Nein im handlungstheoretischen Sinn – keine Zielgerichtetheit/Bewusstheit."}, {"frage": "Gezieltes Heben?", "erwartung": "Ja – zielgerichtete, bewusste Handlung = Bewegung (App-Quiz)."}, {"frage": "Warum unterscheidet die Physio das?", "erwartung": "Behandlung von Reflexen (neurologisch) vs. Training zielgerichteter Bewegungen (motorisches Lernen, Std. 39)."}, {"frage": "Resultat vs. Verlauf?", "erwartung": "Beim Gesunden zählt oft das Resultat, in der Therapie fast immer der Verlauf."}], "ueberleitung": "Bewegung ist mehr als Ortsveränderung – sie ist zielgerichtet. Heute klären wir die Grundbegriffe der Bewegungslehre, die jede Physio braucht."}, "praesentation": {"titel": "Bewegung – zielgerichtet und steuerbar", "min": 15, "merksatz": "Bewegung (handlungstheoretisch, Grosser/Hermann u. a. 1987) = zielgerichtete, bewusste Ortsveränderung des Körpers oder von Körperteilen. Motorik = alle Prozesse der Bewegungssteuerung. Sensomotorik = Kopplung von Wahrnehmung (Sensorik) und Bewegung (Motorik) – ohne Sensorik keine gezielte Bewegung. Komplex der Leistungsfähigkeit (Folie 5): Kondition (energetisch) + Koordination (informationsorientiert) – Sensomotorik gehört zur Koordination.", "schritte": [{"ueberschrift": "Definition Bewegung und Motorik", "text": "Karteikarten in der App aufdecken; Definitionen an die Tafel; Gegenbeispiele (Reflex, Zucken) sammeln.", "vortrag": "Nach Grosser und Hermann ist Bewegung eine zielgerichtete Handlung – ein Reflex ist das nicht. Die Motorik umfasst alle Steuerungsprozesse, die Bewegung möglich machen, von der bewussten Planung bis zum unwillkürlichen Reflex. In der Therapie unterscheiden wir deshalb bewusst: Trainieren wir eine zielgerichtete Bewegung (motorisches Lernen) oder bahnen wir Reflexe (neurologische Behandlung)?"}, {"ueberschrift": "Sensomotorik als Regelkreis", "text": "Einfacher Regelkreis an die Tafel: Wahrnehmung → Vergleich → Steuerung → Bewegung → neue Wahrnehmung (Details Std. 37, Folie 33).", "vortrag": "Sensomotorik beschreibt das Zusammenspiel von Sensorik und Motorik: Jede Bewegung braucht Sinnesinformationen – propriozeptiv (Gelenke/Muskeln), taktil, visuell. Ohne diese Informationen ist die Bewegung ungenau. Deshalb gehört die Sensomotorik zum Bereich Technik (koordinative Fähigkeiten + Fertigkeiten) – neben der Kondition (Kraft, Schnelligkeit, Ausdauer, Beweglichkeit) (Folie 5) – und ist in der Neuroreha zentral."}, {"ueberschrift": "Resultats- vs. verlaufsorientiert", "text": "Beispiel: Tasse greifen – Resultat = Tasse in der Hand; Verlauf = Bewegungsqualität (flüssig, ökonomisch). In der Physio bewerten wir meist den Verlauf.", "vortrag": "Wir können Bewegungen vom Resultat her betrachten – hat der Patient die Tasse gegriffen? – oder vom Verlauf her: War die Bewegung flüssig, ökonomisch, schmerzfrei? In der Physiotherapie interessiert uns fast immer der Verlauf, weil er Rückschlüsse auf die Steuerung zulässt und das Verletzungsrisiko zeigt. Das App-Quiz prüft genau diese Unterscheidung."}]}, "arbeitsphase": {"titel": "Bewegungen analysieren", "min": 25, "sozialform": "Partnerarbeit an Alltagsbewegungen (Aufstehen, Greifen, Gehen)", "aufgaben": [{"titel": "Analysiere das Aufstehen vom Stuhl: Resultat vs. Verlauf – welche Qualitäten (flüssig, ökonomisch, symmetrisch)?", "text": "Analysiere das Aufstehen vom Stuhl: Resultat vs. Verlauf – welche Qualitäten (flüssig, ökonomisch, symmetrisch)?", "loesung": "Resultat: Patient steht. Verlauf: Gewichtsverlagerung nach vorne, Armeinsatz, Symmetrie, Schmerzfreiheit – das ist die physio-relevante Ebene (App: card 'Resultats- vs. verlaufsorientiert').", "hilfe": "App: card + quiz bewegungslehre1."}, {"titel": "Ordne zu: Reflex (Patellasehnenreflex), willkürliche Bewegung (Tasse greifen), unwillkürliche Regulation (Herzschlag).", "text": "Ordne zu: Reflex (Patellasehnenreflex), willkürliche Bewegung (Tasse greifen), unwillkürliche Regulation (Herzschlag).", "loesung": "Reflex = nicht handlungstheoretische Bewegung; Herzschlag = vegetative Regulation, keine Motorik im engeren Sinn; Tasse greifen = Bewegung (App-Quiz).", "hilfe": "App: quiz 'Bewegung handlungstheoretisch'."}, {"titel": "Wo im Komplex der Leistungsfähigkeit (Folie 5) gehört die Sensomotorik hin – und warum ist sie für die Physio zentral?", "text": "Wo im Komplex der Leistungsfähigkeit (Folie 5) gehört die Sensomotorik hin – und warum ist sie für die Physio zentral?", "loesung": "Koordination/informationsorientierte Leistungsfähigkeit (neben Kondition); zentral, weil Bewegungsstörungen meist koordinativ/sensomotorisch bedingt sind (App-diagram Folie 5).", "hilfe": "App: diagram 'Komplex der körperlichen Leistungsfahigkeit' Folie 5."}, {"titel": "Prüfungsnahe Aufgabe (5 P)", "text": "Nenne die fünf Dimensionen der Fremdinformation beim Korrigieren und erläutere je einen Tipp für Therapeuten.", "loesung": "Informationsinhalt (Was?): zuerst nur wichtigstes Bewegungskriterium; keine „Nicht-Anweisungen“\nInformationsübermittlung (Wie?): Lob und Korrektur mischen; Schlüsselworte und Bilder\nZeitstruktur (Wann?): Lernenden zuerst selbst beurteilen lassen (>5 s); bis 2 min unkritisch\nInformationsumfang (Wie viel?): höchstens ein bis zwei Detailinformationen\nInformationshäufigkeit (Wie oft?): anfangs häufig (bis 50 %), später reduzieren (Fading)", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere analysieren mit der App-Karteikarte; stärkere bewerten ein Partner-Aufstehen rein vom Verlauf her (Bewegungsqualität) und begründen, warum das therapeutisch relevanter ist als das bloße Resultat.", "app_uebung": "App: diagram Folie 5, cards 'Bewegung'/'Motorik'/'Sensomotorik'/'Resultats- vs. verlaufsorientiert', quiz."}, "sicherung": {"titel": "Begriffs-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Definiere Bewegung handlungstheoretisch, unterscheide Motorik und Sensomotorik und nenne ein Beispiel für resultats- vs. verlaufsorientierte Betrachtung.", "aufgaben": [{"frage": "Bewegung?", "loesung": "Zielgerichtete, bewusste Ortsveränderung (Grosser/Hermann u. a. 1987)."}, {"frage": "Motorik/Sensomotorik?", "loesung": "Motorik = Bewegungssteuerung; Sensomotorik = Kopplung Wahrnehmung–Bewegung."}, {"frage": "Beispiel?", "loesung": "Tasse greifen: Resultat = gegriffen; Verlauf = Qualität des Griffs."}, {"frage": "Autofahren als erlernte, automatisierte Bewegung wird welchem Regelkreis zugeordnet?  [App-Quiz: Bewegungslehre I]", "loesung": "4. SMRK – Der 4. SMRK (extrapyramidal) umfasst Haltungsmotorik, Rumpf, proximale Gelenke und erlernte automatisierte Bewegungen wie Autofahren."}]}, "hausaufgabe": "Karteikarten 'Bewegung/Motorik/Sensomotorik/Resultat vs. Verlauf' lernen; Diagramm Folie 5 ins Heft; App-Quiz bewegungslehre1 (Definitionen) wiederholen.", "hinweise": ["Fehler: Reflexe werden als 'Bewegung' bezeichnet – handlungstheoretisch sind sie es nicht (App-Quiz Grosser/Hermann).", "Resultat allein reicht in der Therapie nicht – Verlauf/Qualität ist entscheidend.", "Autor Grosser/Hermann u. a. 1987 prüfungsrelevant (App-Quiz)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: diagram Folie 5, cards, quiz"]}, "b1-33": {"nr": 33, "id": "b1-33", "thema": "bewegungslehre1", "titel": "Die sieben koordinativen Fähigkeiten", "dauer": 60, "ziele": ["Die Auszubildenden nennen die sieben koordinativen Fähigkeiten und erläutern zwei davon an je einem Beispiel (prüfungsrelevant, 6 P).", "Sie begründen, warum koordinative Fähigkeiten als 'Trainings der Trainer' gelten.", "Sie unterscheiden Gleichgewichts-, Umstellungs- und Rhythmisierungsfähigkeit an Patientenbeispielen."], "vorwissen": "Stunde 32 (Bewegung/Motorik/Sensomotorik).", "material": ["App, Beamer", "Diagramm 'Koordinative Anforderungen von Bewegungsaufgaben' (Folie 17)", "Balance-Pad, Balance-Board für Demo"], "physio": "Koordinative Fähigkeiten sind die Basis jeder Bewegung – und in der Physio das tägliche Brot: Gleichgewicht (Sturzprophylaxe), Umstellung (Alltagsbewegungen), Rhythmisierung (Gangbild). Nach Verletzungen/neurologischen Erkrankungen sind sie oft stärker betroffen als die Kraft – deshalb trainieren wir sie gezielt (sensomotorisches Training, Std. 40).", "app": {"einsatz": ["Diagramm 'Koordinative Anforderungen von Bewegungsaufgaben' (Folie 17)", "Quiz: 'Nenne die sieben koordinativen Fähigkeiten' (exam 6 P: zwei erläutern)", "Karteikarten: 'Die 7 koordinativen Fähigkeiten', 'Gleichgewichtsfähigkeit', 'Umstellungsfähigkeit', 'Rhythmisierungsfähigkeit'", "Prüfungsaufgabe: 7 koordinative Fähigkeiten + 2 Beispiele (6 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Fähigkeiten-Blitz (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Der Patient kann kräftig, aber …"}, {"phase": "Präsentation", "min": 15, "inhalt": "Sieben koordinative Fähigkeiten"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Aufgaben analysieren · Gruppenarbeit mit Diagramm Folie 17"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Sieben-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Fähigkeiten-Blitz", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu den 7 koordinativen Fähigkeiten; bei Nennung pantomimisch nachmachen.", "aufgaben": [{"frage": "Nenne die sieben koordinativen Fähigkeiten.", "antwort": "Reaktions-, Umstellungs-, Rhythmisierungs-, Gleichgewichts-, Orientierungs-, Kopplungs-, Differenzierungsfähigkeit (App-card)."}, {"frage": "Gleichgewicht?", "antwort": "Körper im Gleichgewicht halten/wiederherstellen (statisch/dynamisch)."}, {"frage": "Umstellung?", "antwort": "Schnell auf veränderte Bedingungen umstellen (z. B. Bodenwechsel)."}, {"frage": "Warum 'Training der Trainierbarkeit' (Korobkov)?", "antwort": "Koordinative Fähigkeiten sind Grundlage der sensomotorischen Lernfähigkeit – App-Quiz)."}]}, {"titel": "Balance-Demo", "art": "Bewegung", "min": 5, "anleitung": "Einbeinstand mit/ohne visuelle Kontrolle, mit/ohne Balance-Pad – Unterschiede spüren und benennen (welche Fähigkeit?).", "aufgaben": [{"frage": "Welche Fähigkeit?", "antwort": "Gleichgewichtsfähigkeit (App-card)."}, {"frage": "Ohne Sehen schwieriger?", "antwort": "Ja – visuelle Information fehlt (Sensorik, Std. 37)."}, {"frage": "Physio-Bezug?", "antwort": "Sturzprophylaxe: Gleichgewicht trainieren, auch ohne visuelle Kontrolle."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Autofahren als erlernte, automatisierte Bewegung wird welchem Regelkreis zugeordnet?", "antwort": "4. SMRK – Der 4. SMRK (extrapyramidal) umfasst Haltungsmotorik, Rumpf, proximale Gelenke und erlernte automatisierte Bewegungen wie Autofahren."}, {"frage": "Was meldet die Muskelspindel?", "antwort": "Länge, Längenänderung und deren Geschwindigkeit – Muskelspindeln melden Länge, Längenänderung, Geschwindigkeit der Längenänderung und (mit dem Golgi-Sehnenorgan) den Spannungszustand."}, {"frage": "Welche Wirkung hat die Aktivierung des Golgi-Sehnenorgans?", "antwort": "Sie hemmt über Ib-Fasern und Interneurone das α-Motoneuron des eigenen Muskels – Ib-Fasern erregen hemmende Interneurone, die das α-Motoneuron des eigenen Muskels hemmen; die Aktivität sinkt."}]}], "einstieg": {"titel": "Der Patient kann kräftig, aber …", "min": 10, "situation": "Fall: Ein Patient nach Schlaganfall hat gute Kraft im Bein – kann aber nicht sicher gehen. Welche Fähigkeit fehlt vermutlich?", "impulse": [{"frage": "Gleichgewicht/Koordination?", "erwartung": "Ja – Kraft allein reicht nicht, die Bewegung muss gesteuert werden (App: Bedeutung koordinativer Fähigkeiten)."}, {"frage": "Umstellung?", "erwartung": "Auch relevant (unebener Boden)."}, {"frage": "Therapiekonsequenz?", "erwartung": "Sensomotorisches/Gleichgewichtstraining, nicht nur Kraft (Std. 40)."}, {"frage": "App-Bezug?", "erwartung": "App: card 'Bedeutung koordinativer Fähigkeiten'."}], "ueberleitung": "Koordination ist das 'Trainings der Trainer': Ohne sie bleibt Kraft ungenutzt. Heute lernen wir die sieben koordinativen Fähigkeiten kennen – die Landkarte der Bewegungsanalyse."}, "praesentation": {"titel": "Sieben koordinative Fähigkeiten", "min": 15, "merksatz": "Die sieben koordinativen Fähigkeiten (nach Hirtz/Meinel): Reaktionsfähigkeit, Umstellungsfähigkeit, Kopplungsfähigkeit, Orientierungsfähigkeit, Gleichgewichtsfähigkeit, Rhythmisierungsfähigkeit, Differenzierungsfähigkeit. Sie sind informationsorientiert (Gegensatz zu konditionellen/energetischen Fähigkeiten) und steuern, wie präzise, schnell und situationsgerecht wir uns bewegen können.", "schritte": [{"ueberschrift": "Die sieben Fähigkeiten im Überblick", "text": "Liste an die Tafel; zu jeder ein Mini-Beispiel aus dem Alltag/Therapie (App-card 'Die 7 koordinativen Fähigkeiten').", "vortrag": "Sieben koordinative Fähigkeiten steuern unsere Bewegung: Reagieren, Umstellen, Koppeln, Orientieren, Gleichgewicht, Rhythmisieren, Differenzieren (kinästhetisch: Feinabstimmung, z. B. Ballgefühl). Sie sind informationsorientiert und Grundlage der sensomotorischen Lernfähigkeit – Korobkov nennt ihr Training deshalb 'Training der Trainierbarkeit' (App-Quiz)."}, {"ueberschrift": "Gleichgewicht, Umstellung, Rhythmus – drei Beispiele vertieft", "text": "App-cards 'Gleichgewichtsfähigkeit'/'Umstellungsfähigkeit'/'Rhythmisierungsfähigkeit'; Diagramm Folie 17 (Anforderungen von Aufgaben) zeigen.", "vortrag": "Gleichgewicht: den Körper im oder ins Gleichgewicht bringen (Einbeinstand, Balancieren). Umstellung: bei wechselnden Bedingungen schnell umstellen (Bodenwechsel, Hindernis). Rhythmisierung: einen äußeren oder inneren Rhythmus in die Bewegung bringen (Gang, Tanzen). Das Diagramm Folie 17 zeigt, welche Fähigkeiten welche Aufgabe besonders fordert."}, {"ueberschrift": "Bedeutung für die Therapie", "text": "Beispiele: Sturzprophylaxe (Gleichgewicht), Gangschule nach Schlaganfall (Umstellung, Rhythmus), Feinmotorik (Differenzierung).", "vortrag": "In der Physio sind koordinative Fähigkeiten oft wichtiger als rohe Kraft: Ein Patient mit guter Kraft, aber schlechtem Gleichgewicht stürzt trotzdem. Deshalb analysieren wir Bewegungen nach ihren koordinativen Anforderungen (Folie 17) und trainieren gezielt die schwache Fähigkeit – z. B. Gleichgewichtstraining in der Geriatrie."}]}, "arbeitsphase": {"titel": "Aufgaben analysieren", "min": 25, "sozialform": "Gruppenarbeit mit Diagramm Folie 17", "aufgaben": [{"titel": "Analysiere: Treppensteigen mit Hindernis, Einbeinstand mit geschlossenen Augenés, Ball fangen – welche koordinativen Anforderungen dominieren (Folie 17)?", "text": "Analysiere: Treppensteigen mit Hindernis, Einbeinstand mit geschlossenen Augenés, Ball fangen – welche koordinativen Anforderungen dominieren (Folie 17)?", "loesung": "Treppe+Hindernis: Umstellung + Gleichgewicht; Einbeinstand ohne Sehen: Gleichgewicht + Propriozeption; Ball fangen: Reaktion + Koordination (App-diagram Folie 17).", "hilfe": "App: diagram 'Koordinative Anforderungen' Folie 17."}, {"titel": "Fall: Patientin nach Hüft-TEP – welche zwei koordinativen Fähigkeiten trainierst du zuerst und warum?", "text": "Fall: Patientin nach Hüft-TEP – welche zwei koordinativen Fähigkeiten trainierst du zuerst und warum?", "loesung": "Gleichgewicht + Umstellung (Alltagssicherheit, Sturzprophylaxe) – App-card 'Bedeutung koordinativer Fähigkeiten'.", "hilfe": "App: cards + quiz bewegungslehre1."}, {"titel": "Prüfungsaufgabe (6 P): Nenne die sieben koordinativen Fähigkeiten und erläutere zwei an je einem Beispiel.", "text": "Prüfungsaufgabe (6 P): Nenne die sieben koordinativen Fähigkeiten und erläutere zwei an je einem Beispiel.", "loesung": "Musterlösung in der App (exam) – z. B. Gleichgewicht (Einbeinstand), Reaktion (Ball fangen) (App-exam).", "hilfe": "App: exam bewegungslehre1 (6 P)."}, {"titel": "Prüfungsnahe Aufgabe (6 P)", "text": "Nenne die sieben koordinativen Fähigkeiten und erläutere zwei davon an je einem Beispiel.", "loesung": "Gleichgewichts-, Orientierungs-, Differenzierungs-, Rhythmisierungs-, Reaktions-, Umstellungs-, Kopplungsfähigkeit\nz. B. Gleichgewicht: Körper im Gleichgewicht halten/wiederherstellen; Balancieren, Einradfahren\nz. B. Differenzierung: muskuläre Feinabstimmung; Ball-, Wasser-, Schneegefühl\nz. B. Kopplung: Teilkörperbewegungen koordinieren; Dribbling, Armeinsatz Hochsprung", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere arbeiten mit dem Diagramm Folie 17 als Schablone; stärkere analysieren ein selbstgewähltes Patientenbeispiel (z. B. Aufstehen nach Schlaganfall) und begründen die Trainingsreihenfolge (Gleichgewicht vor Kraft?).", "app_uebung": "App: diagram Folie 17, cards '7 koordinative Fähigkeiten'/'Gleichgewicht'/'Umstellung'/'Rhythmisierung'/'Bedeutung', quiz, exam (6 P)."}, "sicherung": {"titel": "Sieben-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Nenne die sieben koordinativen Fähigkeiten und gib zu zwei davon je ein Patientenbeispiel aus der Physio.", "aufgaben": [{"frage": "Sieben?", "loesung": "Reaktion, Umstellung, Kopplung, Orientierung, Gleichgewicht, Rhythmisierung, Differenzierung."}, {"frage": "Beispiele?", "loesung": "z. B. Gleichgewicht: Einbeinstand in der Sturzprophylaxe; Reaktion: Auffangen eines fallenden Gegenstands."}, {"frage": "Welcher Hautrezeptor reagiert auf schnelle Vibration?  [App-Quiz: Bewegungslehre I]", "loesung": "Pacini-Körperchen – Merkel = Druck, Meissner = leichtes Antippen, Ruffini = Hautdehnung, Pacini = schnelle Vibration."}]}, "hausaufgabe": "Karteikarten 'Die 7 koordinativen Fähigkeiten' auswendig; Diagramm Folie 17 analysieren; exam-Aufgabe (6 P) 'sieben Fähigkeiten + 2 Beispiele' üben; App-Quiz bewegungslehre1 wiederholen.", "hinweise": ["Fehler: koordinative (informationsorientiert) und konditionelle (energetische) Fähigkeiten werden vermischt – App-card 'Komplex der Leistungsfähigkeit' (Std. 32).", "'Trainings der Trainer'-Metapher merken – typisch für App-Quiz/Prüfung.", "Sieben Fähigkeiten nicht mit fünf verwechseln – App-exam verlangt alle sieben (6 P)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: diagram Folie 17, cards, quiz, exam (6 P)"]}, "b1-34": {"nr": 34, "id": "b1-34", "thema": "bewegungslehre1", "titel": "Fähigkeit vs. Fertigkeit und die Anforderungen von Bewegungsaufgaben (Neumaier)", "dauer": 60, "ziele": ["Die Auszubildenden erläutern den Unterschied zwischen Fähigkeiten und Fertigkeiten und begründen, warum koordinative Fähigkeiten 'Trainings der Trainer' sind (prüfungsrelevant, 4 P).", "Sie nennen die Informationsanforderungen und Druckbedingungen nach Neumaier.", "Sie nennen methodische Maßnahmen nach Harre."], "vorwissen": "Stunden 32–33 (Bewegung, koordinative Fähigkeiten).", "material": ["App, Beamer", "Diagramm 'Koordinative Anforderungen von Bewegungsaufgaben' (Folie 17)", "Karteikarten 'Fähigkeit vs. Fertigkeit', 'Informationsanforderungen (Neumaier)', 'Druckbedingungen (Neumaier)', 'Methodische Maßnahmen nach Harre'"], "physio": "In der Therapie unterscheiden wir: Die koordinative Fähigkeit (z. B. Gleichgewicht) ist die allgemeine Voraussetzung – die Fertigkeit (z. B. sicheres Treppensteigen) ist die konkrete, gelernte Bewegung. Nach einer Verletzung ist oft die Fertigkeit gestört, obwohl die Fähigkeit erhalten ist – dann üben wir gezielt die Fertigkeit (motorisches Lernen, Std. 39).", "app": {"einsatz": ["Diagramm 'Koordinative Anforderungen von Bewegungsaufgaben' (Folie 17)", "Karteikarten: 'Fähigkeit vs. Fertigkeit', 'Informationsanforderungen (Neumaier)', 'Druckbedingungen (Neumaier)', 'Methodische Maßnahmen nach Harre', 'Exekutive Funktionen'", "Quiz: Fähigkeit vs. Fertigkeit, Informationsanforderungen, Druckbedingungen", "Prüfungsaufgabe: Fähigkeit vs. Fertigkeit + 'Trainings der Trainer' (4 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Fähig oder fertig? (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Kann er Rad fahren oder nicht?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Fähigkeit, Fertigkeit, Anforderungen, Druck"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Aufgaben klassifizieren · Gruppenarbeit mit Neumaier-Kategorien und App-cards"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Fähigkeit-Fertigkeit-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Fähig oder fertig?", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Fähigkeit/Fertigkeit; Beispiele: 'Kann Fahrrad fahren' vs. 'fährt gerade Rad' – was ist was?", "aufgaben": [{"frage": "Fähigkeit?", "antwort": "Allgemeine, relativ überdauernde Voraussetzung (z. B. Gleichgewichtsfähigkeit)."}, {"frage": "Fertigkeit?", "antwort": "Konkrete, gelernte Bewegungsausführung (z. B. Fahrrad fahren auf der Straße)."}, {"frage": "Beziehung?", "antwort": "Fähigkeiten ermöglichen Fertigkeiten; Fertigkeiten sind die sichtbare Anwendung (App-card)."}, {"frage": "'Trainings der Trainer'?", "antwort": "Korobkov: 'Training der Trainierbarkeit' – Grundlage der sensomotorischen Lernfähigkeit (App-exam 4 P)."}]}, {"titel": "Druck-Demo", "art": "Spiel", "min": 5, "anleitung": "Ball fangen normal vs. mit verbundenen Augen vs. unter Zeitdruck – welche Bedingungen ändern sich (Neumaier)?", "aufgaben": [{"frage": "Ohne Sehen?", "antwort": "Informationsanforderung: propriozeptiv/taktil statt visuell (Neumaier)."}, {"frage": "Unter Zeitdruck?", "antwort": "Zeitdruck-Bedingung steigt (Neumaier Druckbedingungen)."}, {"frage": "Physio-Bezug?", "antwort": "Wir variieren gezielt Informations- und Druckbedingungen im Training (Harre)."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Welcher Hautrezeptor reagiert auf schnelle Vibration?", "antwort": "Pacini-Körperchen – Merkel = Druck, Meissner = leichtes Antippen, Ruffini = Hautdehnung, Pacini = schnelle Vibration."}, {"frage": "Welche Fähigkeit testet der Fallstab-Test?", "antwort": "Reaktionsfähigkeit – Der Fallstab-Test misst die Strecke in cm bis zum Fangen des Stabs und testet die Reaktionsfähigkeit."}, {"frage": "Du willst die Differenzierungsfähigkeit der Armmuskulatur testen. Welcher Test passt?", "antwort": "Ballzielwurf rückwärts – Der Ballzielwurf rückwärts (nach Hirtz) erfasst die Kraftdosierung der Arme; Niedersprünge testen die Beinmuskulatur."}]}], "einstieg": {"titel": "Kann er Rad fahren oder nicht?", "min": 10, "situation": "Fall: Ein Patient 'kann' Fahrrad fahren ( seit 30 Jahren), nach Schlaganfall zittert er aber beim Aufsteigen aufs Rad. Fähigkeit oder Fertigkeit betroffen?", "impulse": [{"frage": "Fähigkeit?", "erwartung": "Gleichgewicht/Reaktion möglicherweise noch vorhanden (App: Fähigkeit vs. Fertigkeit)."}, {"frage": "Fertigkeit?", "erwartung": "Die konkrete Ausführung (Radfahren) ist gestört – Umlernen nötig (Std. 39)."}, {"frage": "Therapiekonsequenz?", "erwartung": "Fertigkeit schrittweise neu aufbauen (motorisches Lernen), nicht nur 'Kraft'."}, {"frage": "App-Bezug?", "erwartung": "App: card 'Fähigkeit vs. Fertigkeit', exam (4 P)."}], "ueberleitung": "Fähigkeit und Fertigkeit sind nicht dasselbe – in der Therapie müssen wir wissen, welche Ebene gestört ist. Heute: die Unterscheidung und die Anforderungen, die eine Aufgabe stellt (Neumaier)."}, "praesentation": {"titel": "Fähigkeit, Fertigkeit, Anforderungen, Druck", "min": 15, "merksatz": "Fähigkeit = allgemeine, überdauernde Disposition (z. B. Gleichgewicht). Fertigkeit = konkrete, gelernte Bewegungsausführung (z. B. Radfahren). Neumaier: Bewegungsaufgaben stellen Informationsanforderungen (visuell, akustisch, taktil, propriozeptiv …) und Druckbedingungen (Zeitdruck, Präzisionsdruck, Organisationsdruck, Belastungsdruck, Komplexitätsdruck). Harre: methodische Maßnahmen (variieren, erschweren,gegliedern). Exekutive Funktionen (Planen, Hemmen) steuern komplexe Handlungen.", "schritte": [{"ueberschrift": "Fähigkeit vs. Fertigkeit", "text": "App-card aufdecken; Beispiele an die Tafel: Fähigkeit = Gleichgewicht; Fertigkeit = sicheres Treppensteigen; exam (4 P) zitieren.", "vortrag": "Eine Fähigkeit ist die allgemeine Voraussetzung – etwa Gleichgewicht. Eine Fertigkeit ist die konkrete gelernte Bewegung – etwa sicher Treppensteigen. Nach einer Erkrankung kann die Fähigkeit erhalten, die Fertigkeit aber gestört sein. Dann üben wir die Fertigkeit gezielt neu (motorisches Lernen). Nach Korobkov nennt man ihr Training 'Training der Trainierbarkeit' – koordinative Fähigkeiten sind die Grundlage, um überhaupt lernen zu können (App-Quiz)."}, {"ueberschrift": "Informationsanforderungen und Druckbedingungen (Neumaier)", "text": "Diagramm Folie 17 + Neumaier-Kategorien an die Tafel; Beispiele: Ball fangen (Reaktionsdruck, Präzision), Gehen auf unebenem Boden (Umstellung).", "vortrag": "Nach Neumaier hat jede Bewegungsaufgabe Informationsanforderungen – welche Sinne brauche ich? – und Druckbedingungen – unter welchem Druck stehe ich? Zeitdruck, Präzisionsdruck, Komplexität. Je höher die Anforderungen, desto mehr koordinative Fähigkeiten sind gefragt (Folie 17). In der Therapie variieren wir diese Bedingungen gezielt, um die Aufgabe schwieriger oder leichter zu machen (methodische Maßnahmen nach Harre)."}, {"ueberschrift": "Exekutive Funktionen", "text": "App-card 'Exekutive Funktionen': Planen, Arbeitsgedächtnis, kognitive Flexibilität, Hemmung – Beispiele im Alltag.", "vortrag": "Komplexe Bewegungen brauchen exekutive Funktionen: Wir planen die Handlung, halten Zwischenschritte im Gedächtnis und hemmen störende Impulse. Das ist besonders nach Schlaganfall (Frontalhirn) beeinträchtigt – dann üben wir gezielt Doppelaufgaben (Motorik + Kognition)."}]}, "arbeitsphase": {"titel": "Aufgaben klassifizieren", "min": 25, "sozialform": "Gruppenarbeit mit Neumaier-Kategorien und App-cards", "aufgaben": [{"titel": "Klassifiziere: (a) Ball fangen, (b) Gehen auf unebenem Waldboden, (c) Tanzen nach Choreografie, (d) Aufstehen vom Stuhl. Informationsanforderungen + Druckbedingungen?", "text": "Klassifiziere: (a) Ball fangen, (b) Gehen auf unebenem Waldboden, (c) Tanzen nach Choreografie, (d) Aufstehen vom Stuhl. Informationsanforderungen + Druckbedingungen?", "loesung": "a: visuell + Zeitdruck/Präzision; b: propriozeptiv/taktil + Umstellungsdruck; c: akustisch + Rhythmus/Komplexität; d: propriozeptiv + Gleichgewicht/Organisationsdruck (Neumaier, Folie 17).", "hilfe": "App: diagram Folie 17, cards 'Informationsanforderungen (Neumaier)'/'Druckbedingungen (Neumaier)'."}, {"titel": "Fall: Patient nach Schlaganfall – Fähigkeit Gleichgewicht vorhanden, Fertigkeit 'sicher gehen' gestört. Therapieansatz?", "text": "Fall: Patient nach Schlaganfall – Fähigkeit Gleichgewicht vorhanden, Fertigkeit 'sicher gehen' gestört. Therapieansatz?", "loesung": "Fertigkeit schrittweise neu lernen: Gehen in Teilschritten, dann Alltagssituationen (motorisches Lernen, Std. 39; Umlernen).", "hilfe": "App: card 'Fähigkeit vs. Fertigkeit', exam (4 P)."}, {"titel": "Nenne methodische Maßnahmen nach Harre zur Schulung koordinativer Fähigkeiten.", "text": "Nenne methodische Maßnahmen nach Harre zur Schulung koordinativer Fähigkeiten.", "loesung": "z. B. Variation der Aufgabe, Erschweren der Bedingungen, Zerlegung in Teilbewegungen, Kontrastieren (App-card 'Methodische Maßnahmen nach Harre').", "hilfe": "App: card 'Methodische Maßnahmen nach Harre'."}, {"titel": "Prüfungsnahe Aufgabe (4 P)", "text": "Erläutere den Unterschied zwischen Fähigkeiten und Fertigkeiten und begründe, warum koordinative Fähigkeiten als „Training der Trainierbarkeit“ gelten.", "loesung": "Fähigkeiten: gelten als angeboren, Voraussetzung zum Erlernen von Fertigkeiten\nFertigkeiten: erlernte Verhaltensanteile (Gehen, Handstand, Aufschlag)\nKoordinative Fähigkeiten sind Grundlage der sensomotorischen Lernfähigkeit\nJe höher ihr Niveau, desto schneller und effektiver werden neue Bewegungen erlernt (Korobkov)", "hilfe": "App: Thema 'bewegungslehre1' → Prüfungsaufgaben (exam); Musterlösung dort einsehbar."}], "differenzierung": "Schwächere klassifizieren mit den Neumaier-Karteikarten; stärkere entwerfen für einen Patienten eine Progression (z. B. Gehen: eben → uneben → mit Doppelaufgabe) nach Harre und begründen die Reihenfolge.", "app_uebung": "App: diagram Folie 17, cards 'Fähigkeit vs. Fertigkeit'/'Neumaier'/'Harre'/'Exekutive Funktionen', quiz, exam (4 P)."}, "sicherung": {"titel": "Fähigkeit-Fertigkeit-Check", "min": 5, "form": "Schriftlich, einzeln", "text": "Erkläre den Unterschied Fähigkeit/Fertigkeit an einem Beispiel und nenne zwei Druckbedingungen nach Neumaier.", "aufgaben": [{"frage": "Unterschied?", "loesung": "Fähigkeit = allgemeine Disposition (Gleichgewicht); Fertigkeit = gelernte konkrete Bewegung (Radfahren)."}, {"frage": "Zwei Druckbedingungen?", "loesung": "z. B. Zeitdruck, Präzisionsdruck (Neumaier)."}, {"frage": "Wie lange sollte laut Froböse die Pause beim sensomotorischen Training mindestens dauern?  [App-Quiz: Bewegungslehre I]", "loesung": "Mindestens 60 Sekunden – Pausenzeit: lohnende Pause, mind. 60 Sekunden. 10 bis max. 15 Sekunden gelten für statische Übungen, 7–10 Minuten für die Erwärmung, ca. 48–72 Stunden für die Regeneration zwischen den Trainingseinheiten."}]}, "hausaufgabe": "Karteikarten 'Fähigkeit vs. Fertigkeit'/'Neumaier'/'Harre' lernen; Diagramm Folie 17 analysieren; exam-Aufgabe (4 P) üben; App-Quiz bewegungslehre1 (Fähigkeit/Fertigkeit) wiederholen.", "hinweise": ["Fehler: Fähigkeit und Fertigkeit werden synonym verwendet – prüfungsrelevant ist die klare Trennung (App-exam 4 P).", "Neumaier: Informationsanforderungen vs. Druckbedingungen nicht verwechseln.", "'Training der Trainierbarkeit' (Korobkov) = koordinative Fähigkeiten (App-exam)."], "quellen": ["Examenstrainer.html · DATA bewegungslehre1: diagram Folie 17, cards, quiz, exam (4 P)", "Neumaier; Harre (App-Quellen)"]}, "b1-35": {"nr": 35, "id": "b1-35", "thema": "bewegungslehre1", "titel": "Phasenstruktur von Bewegungen nach Meinel & Schnabel (azyklisch/zyklisch)", "dauer": 60, "ziele": ["Die Auszubildenden strukturieren azyklische und zyklische Bewegungen nach Meinel & Schnabel mit je einem Beispiel (prüfungsrelevant, 5 P).", "Sie erklären die Phasenverschmelzung bei schnellen Bewegungen.", "Sie ordnen Phasenstrukturen zu (App-sorts)."], "vorwissen": "Stunden 32–34 (Bewegung, koordinative Fähigkeiten, Fähigkeit/Fertigkeit).", "material": ["App, Beamer", "Zuordnung 'Phasenstruktur der Bewegung'", "Beispiele: Sprung (azyklisch), Laufen (zyklisch)", "Zeitlupen-Video (optional)"], "physio": "Die Phasenanalyse ist das Standardwerkzeug der Bewegungsbeobachtung in der Physio: Beim Aufstehen (azyklisch: Vorbereitungs-, Haupt-, Endphase) erkennen wir, in welcher Phase der Patient stockt (z. B. keine Gewichtsverlagerung nach vorne) – und behandeln gezielt diese Phase. Bei zyklischen Bewegungen (Gehen, Laufen) verschmelzen die Phasen bei hoher Geschwindigkeit.", "app": {"einsatz": ["Zuordnen: 'Phasenstruktur der Bewegung' (App-sorts)", "Quiz: Phasen azyklischer Bewegungen, Phasenverschmelzung", "Karteikarten: 'Phasen azyklischer Bewegungen', 'Phasenverschmelzung', 'Qualitative Bewegungsmerkmale', 'Quantitative Bewegungsmerkmale'", "Prüfungsaufgabe: Strukturierung azyklisch/zyklisch nach Meinel & Schnabel mit Beispiel (5 P)"]}, "ablauf": [{"phase": "Warm-up", "min": 5, "inhalt": "Phasen-Ruf (1 von 2 Warm-up-Optionen, frei wählbar)"}, {"phase": "Einstieg", "min": 10, "inhalt": "Wo stockt der Patient?"}, {"phase": "Präsentation", "min": 15, "inhalt": "Phasenstruktur nach Meinel & Schnabel"}, {"phase": "Arbeitsphase", "min": 25, "inhalt": "Bewegungen phasenweise analysieren · Partnerarbeit mit App-sorts und eigenen Beispielen"}, {"phase": "Ergebnissicherung", "min": 5, "inhalt": "Phasen-Check · Schriftlich, einzeln"}], "warmups": [{"titel": "Phasen-Ruf", "art": "Quiz", "min": 5, "anleitung": "App-Quiz zu Phasenstrukturen; Bewegungen werden pantomimisch in Phasen zerlegt.", "aufgaben": [{"frage": "Phasen einer azyklischen Bewegung (Meinel & Schnabel)?", "antwort": "Vorbereitungs-, Haupt-, Endphase."}, {"frage": "Zyklische Bewegung?", "antwort": "Wiederkehrende Phasen ohne klaren Anfang/Ende (z. B. Laufen, Schwimmen)."}, {"frage": "Phasenverschmelzung?", "antwort": "Bei schnellen Bewegungen fließen Vorbereitungs- und Hauptphase ineinander (App-Quiz)."}, {"frage": "Beispiel azyklisch?", "antwort": "Sprung, Wurf, Aufstehen vom Stuhl."}]}, {"titel": "Zeitlupen-Spiel", "art": "Spiel", "min": 5, "anleitung": "Partner machen eine Bewegung in Zeitlupe (z. B. Aufstehen) – die andere zählt die Phasen laut mit.", "aufgaben": [{"frage": "Welche Phase ist beim Aufstehen kritisch?", "antwort": "Übergang Vorbereitungs- → Hauptphase (Gewichtsverlagerung) – bei Patienten oft gestört."}, {"frage": "App-Bezug?", "antwort": "App-sorts 'Phasenstruktur der Bewegung'."}]}, {"titel": "App-Quiz-Blitz: Bewegungslehre I", "art": "Quiz", "min": 5, "anleitung": "Drei Fragen aus dem App-Quiz zum Thema 'Bewegungslehre I' – einzeln oder als Blitzrunde im Plenum; Lösungen direkt in der App prüfen (Thema bewegungslehre1).", "aufgaben": [{"frage": "Wie lange sollte laut Froböse die Pause beim sensomotorischen Training mindestens dauern?", "antwort": "Mindestens 60 Sekunden – Pausenzeit: lohnende Pause, mind. 60 Sekunden. 10 bis max. 15 Sekunden gelten für statische Übungen, 7–10 Minuten für die Erwärmung, ca. 48–72 Stunden für die Regeneration zwischen den Trainingseinheiten."}, {"frage": "Was kennzeichnet die Aneignungsphase des motorischen Lernens?", "antwort": "Erlernen der Grobkoordination, nur grobe Hauptfehler werden korrigiert – In der Aneignungsphase entsteht die Bewegungsvorstellung, die Grobkoordination wird erlernt und nur grobe Hauptfehler werden korrigiert."}, {"frage": "Eine Patientin fällt beim Umlernen des Gangbilds immer wieder ins gewohnte Schonmuster zurück. Wie heißt dieses Phänomen?", "antwort": "Proaktive Interferenz – Greift der Patient auf das Bekannte zurück, statt ein neues Profil auszubilden, spricht man von proaktiver Interferenz."}]}], "einstieg": {"titel": "Wo stockt der Patient?", "min": 10, "situation": "Fall: Beim Aufstehen vom Stuhl bleibt der Patient in der 'Vorbereitungsphase' hängen (kein Vorneugen des Rumpfes). In welcher Phase ist das Problem – und was trainierst du?", "impulse": [{"frage": "Phase?", "erwartung": "Übergang Vorbereitungs- → Hauptphase (App-sorts)."}, {"frage": "Training?", "erwartung": "Gezieltes Vorneugen/Gewichtsverlagerung üben (Teilbewegung), dann ganzes Aufstehen (Std. 38 Umlernen)."}, {"frage": "App-Bezug?", "erwartung": "App: sorts 'Phasenstruktur der Bewegung'."}], "ueberleitung": "Jede Bewegung hat eine Struktur – azyklische (Sprung, Aufstehen) und zyklische (Gehen, Laufen). Wer die Phasen kennt, erkennt, wo eine Bewegung stockt."}, "praesentation": {"titel": "Phasenstruktur nach Meinel & Schnabel", "min": 15, "merksatz": "Azyklische Bewegung: Vorbereitungsphase (Ausgangsposition, Ausholen) → Hauptphase (Hauptbewegung, Impuls) → Endphase (Ausschwingen, Landung). Zyklische Bewegung: wiederkehrende Phase (z. B. Schrittzyklus: Stand-/Schwungphase) ohne klares Ende. Phasenverschmelzung: bei zunehmender Schnelligkeit fließen Vorbereitungs- und Hauptphase zusammen (z. B. Sprint vs. langsames Aufstehen).", "schritte": [{"ueberschrift": "Azyklisch vs. zyklisch", "text": "App-sorts 'Phasenstruktur der Bewegung' lösen; Tafel: Sprung (azyklisch) vs. Laufschritt (zyklisch) skizzieren; exam (5 P) vorbereiten.", "vortrag": "Eine azyklische Bewegung hat einen klaren Anfang und ein klares Ende – zum Beispiel ein Sprung oder das Aufstehen vom Stuhl: Vorbereitungsphase (Ausholen, Rumpfvorneigen), Hauptphase (Impuls, Abdruck), Endphase (Landung, Stand). Eine zyklische Bewegung wiederholt sich – wie der Laufschritt mit Stand- und Schwungphase. Das ist prüfungsrelevant: Nennt die Strukturierung nach Meinel und Schnabel mit je einem Beispiel."}, {"ueberschrift": "Phasenverschmelzung", "text": "Beispiel an der Tafel: langsames Aufstehen (klare Phasen) vs. schneller Sprung (Verschmelzung); App-Quiz 'Phasenverschmelzung'.", "vortrag": "Je schneller eine Bewegung ausgeführt wird, desto mehr verschmelzen Vorbereitungs- und Hauptphase – beim Sprint ist der Übergang fließend. Für die Therapie heißt das: Langsam üben macht die Phasen sichtbar und einzeln trainierbar – deshalb beginnen wir das Umlernen immer in Zeitlupe."}, {"ueberschrift": "Anwendung in der Bewegungsbeobachtung", "text": "Beispiel Gangbild: Standphase/Schwungphase; bei Patienten mit Hüft-TEP oft verkürzte Standphase auf der betroffenen Seite.", "vortrag": "In der Physio analysieren wir alltägliche Bewegungen in Phasen: Beim Gehen unterscheiden wir Stand- und Schwungphase. Wenn ein Patient nach Hüft-OP die Sta
